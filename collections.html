<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Files | British Material Unit (BMU)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;700&display=swap" />
  <link rel="canonical" href="https://britishmaterialunit.com/files" />
  <link rel="icon" href="bmufavicon.svg" type="image/svg+xml" />

  <!-- The page is called Files now and lives at /files. This address stays
       because it has already been sent out: every reviewer invited so far
       was emailed a link to /collections, and an address in somebody's inbox
       cannot be edited after the fact. Anyone arriving here is handed
       straight on, with whatever was on the end of the address kept.

       replace(), not href: the reader should not have to press Back twice
       to get out of a redirect they never saw. -->
  <meta name="robots" content="noindex, follow" />
  <script>
    window.location.replace('/files' + window.location.search + window.location.hash);
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/files" /></noscript>

  <style>
    body{
      margin:0;
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#ffffff;
      color:#222;
      font-family:'Inter Tight', Helvetica, Arial, sans-serif;
      font-size:13px;
      letter-spacing:.08em;
    }
    a{ color:#222; }
  </style>
</head>
<body>
  <!-- seen only if the redirect cannot run -->
  <p>Taking you to <a href="/files">your files</a>.</p>
</body>
</html>
