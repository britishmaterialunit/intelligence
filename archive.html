      range.addEventListener('input', () => { val.textContent = range.value; });

      send.addEventListener('click', () => {
        const qty  = range.value;
        const addr = email.value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(addr)){
          msg.textContent = 'Enter a valid email address.';
          email.focus({ preventScroll:true });
          return;
        }

        const subject = `Archive request — ${qty} × ${name}`;
        const body =
          `Garment: ${name}\n` +
          (ref ? `Archive ref: ${ref}\n` : '') +
          `Quantity: ${qty}\n` +
          `From: ${addr}\n`;

        window.location.href =
          `mailto:${REQUEST_TO}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

        msg.textContent = `Opening your mail app — ${qty} × ${name}.`;
      });
    }

    /* ============================================================
       DOCK
       Appears only once the reader is inside an open nation tab and
       the real search bar has scrolled away. The arrow climbs out in
       two stages: first to the top of the tab you are in (closing the
       others), then to the top of the page with everything shut.
       ============================================================ */
    const dock        = document.getElementById('dock');
    const dockSearch  = document.getElementById('dockSearch');
    const dockLibrary = document.getElementById('dockLibrary');
    const dockClear   = document.getElementById('dockClear');
    const dq          = document.getElementById('dq');

    let dockForced = false;      // summoned by the explore mark

    function collapseDock(){
      dock.classList.remove('open');
      document.body.classList.remove('dock-open');
      dq.tabIndex = -1;
      dockClear.tabIndex = -1;
      dq.blur();
    }

    function openDock(){
      dock.classList.add('open');
      document.body.classList.add('dock-open');
      setFace(0, true);        // never leave the exit under a searching finger
      dq.tabIndex = 0;
      dockClear.tabIndex = 0;
      dq.value = q.value;
      dq.focus({ preventScroll:true });
    }

    /* The search bar is permanent now, so the dock is no longer tied to
       it scrolling away — it is simply what the explore mark summons. */
    function anyNationOpen(){
      return allNations.some(d => d.open && !d.hidden);
    }

    /* explore's element is declared further down, so its state is tracked
       here rather than read off the DOM — updateDock() runs before it */
    let exploreOn = false;

    /* The three boxes appear whenever there is something to navigate:
       the star was pressed, a nation tab is open, or explore is running.
       Opening a tab therefore hands the reader the dock's own search bar
       in place of the main one. */
    function updateDock(){
      /* Tabs opened by a term are not the reader reaching for the dock —
         they are the answer to what is still being typed into the main bar.
         Handing over a second search instrument at that moment puts two on
         the screen at once, so the dock waits until the bar is done with. */
      const show = dockForced || exploreOn || (anyNationOpen() && !q.value.trim());
      dock.classList.toggle('show', show);
      dock.setAttribute('aria-hidden', show ? 'false' : 'true');
      // whenever the three boxes are out, the star reads active
      navBtn.setAttribute('aria-pressed', show ? 'true' : 'false');
      if (!show) collapseDock();
    }

    /* Everything that returns the archive to rest goes through here, so
       the star can never end up a step behind the buttons it summoned. */
    function goHome(){
      soloTimers.forEach(clearTimeout);
      soloTimers = [];
      soloId = null;
      if (!explore.hidden) endExplore(false);
      dockForced = false;
      navBtn.setAttribute('aria-pressed', 'false');
      collapseDock();
      updateDock();

      nationsOpen = false;
      flagBtn.setAttribute('aria-pressed', 'false');
      dqFlag.setAttribute('aria-pressed', 'false');
      document.body.classList.remove('closing-tabs');
      allNations.forEach(d => { d.open = false; });

      q.value = '';
      dq.value = '';
      filter();
      syncGhost();
      setFace(0, true);
      showPrompt();
    }

    /* Pushing further up when already at the top folds the open tab away.
       Only downward reading opens tabs — going up never does, so scrolling
       back never surprises the reader with more to read. */
    let upAcc = 0, upLock = 0;
    window.addEventListener('wheel', e => {
      if (exploreOn || !document.body.classList.contains('browsing')) return;
      if (e.deltaY >= 0){ upAcc = 0; return; }
      if (window.scrollY > 6){ upAcc = 0; return; }

      upAcc += -e.deltaY;
      const now = Date.now();
      if (upAcc > 130 && now - upLock > 700){
        const open = allNations.filter(d => d.open && !d.hidden);
        if (open.length){
          setNationOpen(open[open.length - 1], false);
          upLock = now;
          upAcc = 0;
        }
      }
    }, { passive:true });

    /* an opening or closing tab changes what furniture belongs on screen */
    function syncChrome(){
      /* A term opens every tab that answers it, and an open tab is normally
         what sends the main bar away and hands over to the dock's. Mid-word
         that is exactly wrong: the reader is still typing into the bar it
         would be taking off the screen. While there is a term, the bar
         stays and the results arrange themselves underneath it. */
      const typing = !!q.value.trim();
      document.body.classList.toggle('tab-open', anyNationOpen() && !typing);
      updateDock();
    }
    allNations.forEach(d => d.addEventListener('toggle', syncChrome));

    /* the star is a straight toggle: anything open → home, otherwise
       straight into explore */
    navBtn.addEventListener('click', () => {
      if (exploreOn){ closeExplore(); return; }      // tabs, if any, stay
      if (dockForced){
        dockForced = false;
        collapseDock();
        updateDock();
        return;
      }
      dockForced = true;
      setFace(0, true);
      updateDock();
      openExplore();
    });

    dockSearch.addEventListener('click', () => {
      if (!dock.classList.contains('open')) openDock();
    });
    dockSearch.addEventListener('keydown', e => {
      if (!dock.classList.contains('open') && (e.key === 'Enter' || e.key === ' ')){
        e.preventDefault();
        openDock();
      }
    });

    /* The dock field is forgiving: a term that matches nothing is read
       as a typo still being corrected, so the last good result set is
       held on screen rather than the page emptying under the reader. */
    let lastScrolled = null;

    function countMatches(term){
      if (!term) return allItems.length;
      let n = 0;
      allItems.forEach(el => { if (itemMatches(el, term)) n++; });
      return n;
    }

    dq.addEventListener('input', () => {
      dghost.hidden = dq.value !== '';
      const term = dq.value.trim().toLowerCase();

      // in explore the search regroups the field rather than the page
      if (exploreOn){ clusterSearch(term); return; }

      if (term && countMatches(term) === 0) return;   // hold what's there

      q.value = dq.value;
      filter();
      syncGhost();
      updateDock();

      if (!term){ lastScrolled = null; return; }

      // matching is word-accurate now, so a real hit can move the page
      // straight away. Only a change of nation scrolls, so typing on
      // through "d ▸ dp ▸ dpm" travels once, not three times.
      const first = allNations.find(d => !d.hidden && d.open);
      if (first && first !== lastScrolled){
        lastScrolled = first;
        scrollToNation(first);
      }
    });

    // enter jumps to the first garment that matched
    dq.addEventListener('keydown', e => {
      if (e.key === 'Escape'){ e.preventDefault(); resetDock(); return; }
      if (e.key !== 'Enter') return;
      e.preventDefault();

      // in explore, enter gathers everything that answers the term and
      // settles on the group — a nation becomes that nation's cluster
      if (exploreOn){
        clusterSearch(dq.value.trim().toLowerCase());
        return;
      }

      const first = catalogue.querySelector('.item:not([hidden])');
      if (first) first.scrollIntoView({ behavior:'smooth', block:'center' });
    });

    function resetDock(){
      dq.value = '';
      q.value = '';
      filter();
      syncGhost();
      collapseDock();
    }
    dockClear.addEventListener('click', e => { e.stopPropagation(); resetDock(); });



    updateDock();

    /* ============================================================
       NATIONS — the tabs are hidden until the flag asks for them
       ============================================================ */
    const flagBtn = document.getElementById('flagBtn');

    /* ---------- the question on the bare page ----------
       Re-typed every time the archive comes back to rest, so returning
       feels like arriving rather than finding a leftover. */
    const promptEl = document.getElementById('prompt');
    const PROMPTS = [
      'What are you looking for?',
      'What have you got in mind?',
      'Which nation are you after?',
      'Looking for a particular camouflage?',
      'Smock, trousers, bergen — what do you need?'
    ];
    let promptIx = Math.floor(Math.random() * PROMPTS.length);
    let promptTimer = null;

    function showPrompt(){
      clearTimeout(promptTimer);
      promptEl.hidden = false;
      // a different line each time the archive comes back to rest
      promptIx = (promptIx + 1) % PROMPTS.length;
      // the suggestions follow the question
      SUGGESTIONS = poolForPrompt(promptIx);
      sIdx = 0; sPos = 0; sPhase = 'typing';
      const line = PROMPTS[promptIx];
      promptEl.textContent = '';
      promptEl.style.opacity = '';
      if (REDUCED){ promptEl.textContent = line; return; }
      let i = 0;
      (function tick(){
        if (i < line.length){
          promptEl.textContent += line.charAt(i++);
          promptTimer = setTimeout(tick, 55);
        }
      })();
    }

    function hidePrompt(){
      clearTimeout(promptTimer);
      promptEl.style.opacity = '0';
    }

    /* the bare page always carries its question */
    function restPrompt(){
      if (!exploreOn && !nationsOpen && !savedOnly && !soloId && !q.value.trim()){
        showPrompt();
      }
    }

    /* the tabs topple in one after another, and fold back out the same
       way rather than simply vanishing */
    function dealTabs(){
      allNations.forEach((d, i) => {
        d.style.animation = 'none';
        void d.offsetWidth;
        d.style.animation = '';
        d.style.animationDelay = (i * 65) + 'ms';
      });
    }

    let countTimer = null;

    function typeCount(){
      clearTimeout(countTimer);
      const text = `${allItems.length} garments`;
      countEl.textContent = '';
      if (REDUCED){ countEl.textContent = text; return; }
      countTyping = true;
      let i = 0;
      (function tick(){
        if (i < text.length){
          countEl.textContent += text.charAt(i++);
          countTimer = setTimeout(tick, 32);
        } else {
          countTyping = false;
        }
      })();
    }

    /* the tally unwrites itself as the tabs fold away, so both halves of
       the header leave the same way they arrived */
    function untypeCount(){
      clearTimeout(countTimer);
      countTyping = true;
      if (REDUCED){ countEl.textContent = ''; return; }
      (function tick(){
        const t = countEl.textContent;
        if (t.length){
          countEl.textContent = t.slice(0, -1);
          countTimer = setTimeout(tick, 22);
        } else {
          countTyping = false;
        }
      })();
    }

    function setBrowsing(on){
      nationsOpen = on;
      if (on){
        collapseDock();              // never two search bars at once
        document.body.classList.remove('closing-tabs');
        document.body.classList.add('browsing');
        dealTabs();
        typeCount();
      } else {
        if (!q.value.trim()){
          // fold away, then drop out of browsing entirely
          untypeCount();
          document.body.classList.add('closing-tabs');
          setTimeout(() => {
            document.body.classList.remove('closing-tabs');
            allNations.forEach(d => { d.open = false; });
            filter();          // recomputes browsing from term + nationsOpen
            restPrompt();
          }, REDUCED ? 0 : 420);
        } else {
          allNations.forEach(d => { d.open = false; });
        }
      }
      flagBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      updateDock();
    }

    flagBtn.addEventListener('click', () => {
      // inside explore the flag regroups the field by nation instead
      if (!explore.hidden){
        const next = spiralMode === 'clusters' ? 'spiral' : 'clusters';
        morphLayout(next);
        flagBtn.setAttribute('aria-pressed', next === 'clusters' ? 'true' : 'false');
        dqFlag.setAttribute('aria-pressed', next === 'clusters' ? 'true' : 'false');
        return;
      }
      const on = !nationsOpen;
      setBrowsing(on);
      if (on) window.scrollTo({ top:0, behavior:REDUCED ? 'auto' : 'smooth' });
    });

    /* ============================================================
       EXPLORE — every garment laid out on a phyllotaxis spiral.
       Same golden-angle packing a sunflower uses, so the density stays
       even from the middle out instead of bunching into arms.
       ============================================================ */
    const explore    = document.getElementById('explore');
    const spiral     = document.getElementById('spiral');
    const dockExplore = document.getElementById('dockExplore');

    const GOLDEN = Math.PI * (3 - Math.sqrt(5));
    const SPACING = 172;              // ~1.15× the 150px card, so they clear
    let spiralBuilt = false;
    let sc = 1, tx = 0, ty = 0;

    /* wraps a jump in a transition so the field travels rather than cuts */
    function glide(fn, ms){
      spiral.style.transition = `transform ${ms || 850}ms cubic-bezier(.4,0,.2,1)`;
      fn();
      setTimeout(() => { spiral.style.transition = ''; }, (ms || 850) + 60);
    }

    function applyTransform(){
      spiral.style.transform = `translate(${tx}px, ${ty}px) scale(${sc})`;
    }

    function buildSpiral(){
      if (spiralBuilt) return;
      spiralBuilt = true;

      NATIONS.forEach(nation => {
        ITEMS.filter(p => p.n === nation.key).forEach(p => {
          const fileName = p.img || slug(p.name);
          const file = `${assetDir(nation.key, p.cat, p.name)}/${fileName}`;
          const el = Object.assign(document.createElement('div'), {
            className:'sp-item',
            innerHTML:
              `<div class="sp-slot">` +
                `<img src="${esc(file)}" alt="${esc(p.name)}" loading="lazy">` +
                `<span class="sp-code" hidden></span>` +
              `</div>`
          });
          el.dataset.nation = nation.key;
          el.dataset.name   = p.name;
          el.dataset.id     = `${nation.key}/${slugBase(p.name)}`;
          el.dataset.words  = [p.name, nation.label, p.cat, p.ref]
            .filter(Boolean).join(' ').toLowerCase()
            .split(/[^a-z0-9]+/).filter(Boolean).join('|');
          el.dataset.alias  = (nation.alias || []).join('|');
          spiral.appendChild(el);
        });
      });

      [...spiral.children].forEach((el, i) => {
        el.style.animationDelay = Math.min(i * 12, 700) + 'ms';
        const img = el.querySelector('img');
        const code = el.querySelector('.sp-code');
        img.addEventListener('error', () => { img.remove(); code.hidden = false; });
      });
      layoutSpiral('spiral');
    }

    /* 'spiral'   — one phyllotaxis over the whole archive
       'clusters' — one per nation, biggest in the middle, the rest
                    scattered around it on a jittered ring          */
    let spiralMode = 'spiral';

    function place(el, x, y){
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
    }

    /* Re-laying out is a movement, not a jump: the field draws back, the
       garments glide to their new homes like a cell dividing, then the
       view settles on whatever shape resulted. */
    let morphing = false;

    function morphLayout(mode){
      if (morphing) return;
      morphing = true;

      if (REDUCED){
        layoutSpiral(mode); fitSpiral(); morphing = false; return;
      }

      const els = [...spiral.children];
      els.forEach(el => {
        el.style.transition = 'left .95s cubic-bezier(.45,.05,.2,1), top .95s cubic-bezier(.45,.05,.2,1)';
      });
      spiral.style.transition = 'transform .95s cubic-bezier(.45,.05,.2,1)';

      // pull back first so the split happens inside the frame
      sc = Math.max(0.06, sc * 0.55);
      applyTransform();

      // a forced reflow commits the pull-back as the start of the move —
      // rAF is not guaranteed to run and would leave the field unplaced
      void spiral.offsetWidth;
      layoutSpiral(mode);

      setTimeout(() => {
        if (mode === 'saved'){
          const keep = [...spiral.children].filter(e => isSaved(e.dataset.id));
          if (keep.length) fitTo(keep); else fitSpiral();
        } else fitSpiral();                // settle on the new extent
        setTimeout(() => {
          els.forEach(el => { el.style.transition = ''; });
          spiral.style.transition = '';
          morphing = false;
        }, 1000);
      }, 900);
    }

    function layoutSpiral(mode){
      spiralMode = mode;
      const els = [...spiral.children];

      if (mode === 'spiral'){
        els.forEach((el, i) => {
          const r = SPACING * Math.sqrt(i + 0.5);
          const a = i * GOLDEN;
          place(el, Math.cos(a) * r, Math.sin(a) * r);
        });
        return;
      }

      if (mode === 'saved'){
        const keep = els.filter(e => isSaved(e.dataset.id));
        const rest = els.filter(e => !isSaved(e.dataset.id));
        keep.forEach((el, i) => {
          const r = SPACING * Math.sqrt(i + 0.5);
          const a = i * GOLDEN;
          place(el, Math.cos(a) * r, Math.sin(a) * r);
        });
        // everything unkept goes to its own cluster, well off the frame
        const away = SPACING * (Math.sqrt(els.length) + 16);
        rest.forEach((el, i) => {
          const r = SPACING * Math.sqrt(i + 0.5);
          const a = i * GOLDEN;
          place(el, away + Math.cos(a) * r, Math.sin(a) * r);
        });
        return;
      }

      const groups = NATIONS
        .map(n => ({ key:n.key, els:els.filter(e => e.dataset.nation === n.key) }))
        .filter(g => g.els.length)
        .sort((a, b) => b.els.length - a.els.length);

      const radiusOf = g => SPACING * Math.sqrt(g.els.length) + SPACING * 0.6;
      const big = radiusOf(groups[0]);

      groups.forEach((g, gi) => {
        let cx = 0, cy = 0;
        if (gi > 0){
          // even spread around the centre, then knocked off true so the
          // satellites do not read as a dial
          const step = (Math.PI * 2) / (groups.length - 1);
          const ang  = step * (gi - 1) + (Math.random() - 0.5) * step * 0.55;
          const ring = big + radiusOf(g) + SPACING * (0.7 + Math.random() * 0.8);
          cx = Math.cos(ang) * ring;
          cy = Math.sin(ang) * ring;
        }
        g.els.forEach((el, i) => {
          const r = SPACING * Math.sqrt(i + 0.5);
          const a = i * GOLDEN;
          place(el, cx + Math.cos(a) * r, cy + Math.sin(a) * r);
        });
      });
    }

    /* ---------- searching inside explore ----------
       A term pulls everything that answers it into its own cluster in the
       middle and dims the rest, so "mtp" makes an MTP group, "british" a
       British one, "smock" a smock one. The same matching the catalogue
       uses, so both bars behave alike. */
    function spiralMatch(el, term){
      const tokens = term.split(/\s+/).filter(Boolean);
      if (!tokens.length) return true;
      const words   = (el.dataset.words || '').split('|');
      const aliases = (el.dataset.alias || '').split('|');
      return tokens.every(t =>
        words.some(w => w.startsWith(t)) ||
        aliases.some(a => a && a.startsWith(t))
      );
    }

    function fitTo(els){
      let reach = 1;
      els.forEach(el => {
        reach = Math.max(reach, Math.hypot(
          parseFloat(el.style.left) || 0,
          parseFloat(el.style.top)  || 0
        ));
      });
      const margin = Math.max(70, Math.min(150, window.innerWidth * 0.14));
      const fit = Math.min(window.innerWidth, window.innerHeight - 150) /
                  ((reach + margin) * 2);
      sc = Math.max(0.08, Math.min(maxScale(), fit));
      tx = 0; ty = -40;
      applyTransform();
    }

    let clusterTimer = null;
    function clusterSearch(term){
      clearTimeout(clusterTimer);
      const els = [...spiral.children];

      if (!term){
        els.forEach(el => el.classList.remove('sp-dim'));
        els.forEach(el => { el.style.transition = 'left .8s cubic-bezier(.4,0,.2,1), top .8s cubic-bezier(.4,0,.2,1)'; });
        layoutSpiral(spiralMode);
        clusterTimer = setTimeout(() => {
          glide(() => fitSpiral(), 800);
          els.forEach(el => { el.style.transition = ''; });
        }, 60);
        return;
      }

      const hit = els.filter(el => spiralMatch(el, term));
      els.forEach(el => {
        el.classList.toggle('sp-dim', !hit.includes(el));
        el.style.transition = 'left .8s cubic-bezier(.4,0,.2,1), top .8s cubic-bezier(.4,0,.2,1)';
      });
      if (!hit.length) return;

      hit.forEach((el, i) => {
        const r = SPACING * Math.sqrt(i + 0.5);
        const a = i * GOLDEN;
        place(el, Math.cos(a) * r, Math.sin(a) * r);
      });

      clusterTimer = setTimeout(() => {
        glide(() => fitTo(hit), 800);
        els.forEach(el => { el.style.transition = ''; });
      }, 60);
    }

    /* stop zooming once a single garment fills the view — past that the
       source PNGs are being upscaled and just go soft */
    function maxScale(){
      return Math.min(window.innerWidth, window.innerHeight - 150) / SPACING;
    }

    function focusItem(el, scale){
      const x = parseFloat(el.style.left) || 0;
      const y = parseFloat(el.style.top)  || 0;
      sc = Math.min(scale || maxScale() * 0.72, maxScale());
      tx = -x * sc;
      ty = -y * sc;
      atInitial = false;
      applyTransform();
      offerSave(el);
    }

    /* while one garment holds the view, the arrow's slot offers to keep it */
    let focusedItem = null;

    /* One bookmark button, two jobs: with a garment framed it keeps that
       garment; with the whole field showing it gathers what is kept. */
    function offerSave(el){
      focusedItem = el || null;
      if (!dockLibrary) return;
      dockLibrary.setAttribute('aria-label',
        focusedItem ? 'Save this garment' : 'Gather saved garments');
      dockLibrary.setAttribute('aria-pressed',
        focusedItem
          ? (isSaved(focusedItem.dataset.id) ? 'true' : 'false')
          : (spiralMode === 'saved' ? 'true' : 'false'));
    }

    /* measures the real extent so it frames clusters as well as the spiral */
    function fitSpiral(){
      let reach = 1;
      [...spiral.children].forEach(el => {
        reach = Math.max(reach, Math.hypot(
          parseFloat(el.style.left) || 0,
          parseFloat(el.style.top)  || 0
        ));
      });
      const margin = Math.max(70, Math.min(150, window.innerWidth * 0.14));
      const radius = reach + margin;
      const fit = Math.min(window.innerWidth, window.innerHeight - 150) / (radius * 2);
      sc = Math.max(0.08, Math.min(maxScale(), fit));
      tx = 0; ty = -40;
      applyTransform();
      atInitial = true;
      offerSave(null);
    }

    let exploreClosing = false;
    let lastExploreItem = null;
    let atInitial = false;      // is the field sitting at its opening view?

    function openExplore(){
      exploreClosing = false;
      explore.hidden = false;
      exploreOn = true;
      explore.setAttribute('aria-hidden', 'false');
      dockExplore.setAttribute('aria-pressed', 'true');
      document.body.classList.add('exploring');
      document.body.style.overflow = 'hidden';
      hidePrompt();
      // the dock returns to the middle of the screen for explore
      dock.classList.remove('moved');
      setFace(0, true);              // explore always opens on the circle
      buildSpiral();
      [...spiral.children].forEach(el => { el.style.transition = ''; el.style.opacity = ''; });
      fitSpiral();
    }

    function endExplore(handBack){
      explore.hidden = true;
      exploreOn = false;
      explore.setAttribute('aria-hidden', 'true');
      dockExplore.setAttribute('aria-pressed', 'false');
      document.body.classList.remove('exploring');
      document.body.style.overflow = '';
      exploreClosing = false;
      if (handBack){
        dockForced = false;
        collapseDock();
        updateDock();
        restPrompt();
        setTimeout(() => q.focus({ preventScroll:true }), 300);
      }
    }

    /* garments go out one at a time rather than as a block */
    function closeExplore(){
      if (explore.hidden || exploreClosing) return;
      exploreClosing = true;
      if (REDUCED){ endExplore(true); return; }
      [...spiral.children].forEach(el => {
        el.style.transition = 'opacity .3s ease';
        setTimeout(() => { el.style.opacity = '0'; }, Math.random() * 520);
      });
      setTimeout(() => endExplore(true), 950);
    }

    /* ---------- the middle button holds more than one tool ----------
       Scroll it on a laptop, swipe it on a phone: the faces roll round.
       Whichever is showing is what a press does. */
    const faces = [...dockExplore.querySelectorAll('.face')];
    let faceIx = 0;
    const FACE_LABEL = ['Explore the archive', 'Nation list', 'Exit explore'];

    function setFace(next, force){
      const n = (next + faces.length) % faces.length;
      if (n === faceIx && !force) return;
      faces.forEach((f, i) => {
        f.classList.toggle('is-on', i === n);
        f.classList.toggle('is-out', i !== n);
      });
      faceIx = n;
      dockExplore.setAttribute('aria-label', FACE_LABEL[faceIx]);
    }

    /* A trackpad fires a burst of small wheel events per flick, which was
       toggling the face back and forth. Accumulate the travel and step
       once per gesture, then sit out until the burst dies down. */
    /* A trackpad flick is one gesture but many events, and the tail keeps
       arriving after the finger has gone. Stepping on a timer let that
       tail carry on past the face you wanted — sandwich would run
       straight through the cross and back to the circle. So: one step per
       gesture, and the next needs a genuine pause first. */
    let faceAcc = 0, faceSpent = false, faceIdle = null;

    dockExplore.addEventListener('wheel', e => {
      e.preventDefault();
      e.stopPropagation();

      clearTimeout(faceIdle);
      faceIdle = setTimeout(() => { faceSpent = false; faceAcc = 0; }, 220);

      if (faceSpent) return;              // this gesture already moved one
      faceAcc += Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;

      if (Math.abs(faceAcc) >= 45){
        setFace(faceIx + (faceAcc > 0 ? 1 : -1));
        faceAcc = 0;
        faceSpent = true;
      }
    }, { passive:false });

    // swipe the button itself — any direction moves along the stack
    let fx = 0, fy = 0, fid = null, swiped = false;
    dockExplore.addEventListener('pointerdown', e => {
      fid = e.pointerId; fx = e.clientX; fy = e.clientY; swiped = false;
    });
    dockExplore.addEventListener('pointermove', e => {
      if (e.pointerId !== fid || swiped) return;
      const dx = e.clientX - fx, dy = e.clientY - fy;
      if (Math.hypot(dx, dy) < 22) return;
      swiped = true;
      setFace(faceIx + ((dy < 0 || dx > 0) ? 1 : -1));
    });
    ['pointerup','pointercancel'].forEach(t => dockExplore.addEventListener(t, e => {
      if (e.pointerId === fid) fid = null;
    }));

    dockExplore.addEventListener('click', e => {
      if (swiped){ swiped = false; return; }       // that was a swipe

      if (faceIx === 1){
        // the listed nations, showing everything — not whatever the field
        // happened to be filtered to
        if (!explore.hidden) endExplore(false);
        collapseDock();
        soloId = null;
        savedOnly = false;
        document.body.classList.remove('library');
        q.value = '';
        dq.value = '';
        filter();
        syncGhost();
        setBrowsing(true);      // types the tally last, so nothing overwrites it
        return;
      }

      if (faceIx === 2){
        // the cross always lands on the bare archive page
        if (exploreOn){ closeExplore(); setTimeout(goHome, 1000); }
        else goHome();
        return;
      }

      // the circle always returns explore to how it opens: the single
      // spiral, pulled back to fit — it is not a way out
      if (explore.hidden){ openExplore(); return; }
      if (spiralMode !== 'spiral'){
        morphLayout('spiral');
        flagBtn.setAttribute('aria-pressed', 'false');
        dqFlag.setAttribute('aria-pressed', 'false');
        return;
      }
      if (atInitial){
        // already home — press again and it travels to one at random
        const pool = [...spiral.children].filter(el => !el.classList.contains('sp-dim'));
        if (pool.length){
          const pick = pool[Math.floor(Math.random() * pool.length)];
          glide(() => focusItem(pick, maxScale() * 0.68));
        }
      } else {
        glide(() => fitSpiral());
      }
    });

    /* every so often the middle button blinks, so the other tools on it
       are discoverable rather than hidden */

    dockLibrary.addEventListener('click', e => {
      e.stopPropagation();

      // a framed garment turns this into its keep switch
      if (focusedItem){
        toggleSaved(focusedItem.dataset.id);
        const on = isSaved(focusedItem.dataset.id);
        dockLibrary.setAttribute('aria-pressed', on ? 'true' : 'false');
        const mark = dockLibrary.querySelector('.bm');
        mark.classList.remove('pop');
        void mark.offsetWidth;
        if (on) mark.classList.add('pop');
        return;
      }

      if (!savedIds.length){ flashNoData(); return; }   // nothing kept to gather
      const next = spiralMode === 'saved' ? 'spiral' : 'saved';
      morphLayout(next);
      dockLibrary.setAttribute('aria-pressed', next === 'saved' ? 'true' : 'false');
      if (next === 'spiral'){
        flagBtn.setAttribute('aria-pressed', 'false');
        dqFlag.setAttribute('aria-pressed', 'false');
      }
    });


    /* ---------- tools inside the dock's own search bar ---------- */
    const dqFlag    = document.getElementById('dqFlag');
    const dqExplore = document.getElementById('dqExplore');

    dqFlag.addEventListener('click', e => {
      e.stopPropagation();
      if (explore.hidden) openExplore();
      const next = spiralMode === 'clusters' ? 'spiral' : 'clusters';
      morphLayout(next);
      dqFlag.setAttribute('aria-pressed', next === 'clusters' ? 'true' : 'false');
      flagBtn.setAttribute('aria-pressed', next === 'clusters' ? 'true' : 'false');
    });

    dqExplore.addEventListener('click', e => {
      e.stopPropagation();
      if (explore.hidden) openExplore(); else closeExplore();
    });

    /* ---------- zoom + pan ---------- */
    explore.addEventListener('wheel', e => {
      e.preventDefault();
      const rect = explore.getBoundingClientRect();
      const cx = e.clientX - rect.left - rect.width / 2;
      const cy = e.clientY - rect.top - rect.height / 2;
      const factor = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016));
      const next = Math.max(0.08, Math.min(maxScale(), sc * factor));
      // keep the point under the cursor fixed while scaling
      tx = cx - (cx - tx) * (next / sc);
      ty = cy - (cy - ty) * (next / sc);
      sc = next;
      atInitial = false;
      applyTransform();
    }, { passive:false });

    let panId = null, panX = 0, panY = 0;
    explore.addEventListener('pointerdown', e => {
      if (e.target.closest('.sp-item')) return;
      panId = e.pointerId; panX = e.clientX; panY = e.clientY;
      explore.setPointerCapture(panId);
      explore.classList.add('grabbing');
    });
    explore.addEventListener('pointermove', e => {
      if (e.pointerId !== panId) return;
      tx += e.clientX - panX; ty += e.clientY - panY;
      panX = e.clientX; panY = e.clientY;
      atInitial = false;
      applyTransform();
    });
    ['pointerup','pointercancel'].forEach(t => explore.addEventListener(t, e => {
      if (e.pointerId !== panId) return;
      panId = null;
      explore.classList.remove('grabbing');
    }));

    // a garment opens on its own, centred; the tab's − brings you back
    spiral.addEventListener('click', e => {
      const item = e.target.closest('.sp-item');
      if (!item) return;

      // first press frames the garment, the way the circle's random pick
      // does; only a second press on the same one opens its record
      if (focusedItem !== item){
        glide(() => focusItem(item, maxScale() * 0.68));
        return;
      }

      lastExploreItem = item;
      endExplore(false);
      soloId = item.dataset.id;
      nationsOpen = true;
      document.body.classList.add('browsing');
      const tab = allNations.find(d => d.dataset.nation === item.dataset.nation);
      if (tab) tab.open = true;
      filter();
      syncChrome();
      window.scrollTo({ top:0, behavior:'auto' });
      beginSoloBuild();
    });

    /* Applied in the same tick as the render, so the settled two-column
       state is never painted first — that flash was the whole problem. */
    let soloTimers = [];

    function beginSoloBuild(){
      const item = catalogue.querySelector('.item:not([hidden])');
      if (!item || REDUCED) return;
      item.querySelectorAll('.solo-frame').forEach(n => n.remove());

      // snap into the build state, then let transitions run for the settle
      item.classList.remove('framed');
      item.classList.add('build', 'no-anim');
      void item.offsetWidth;
      item.classList.remove('no-anim');

      // the name is written after the frame closes, not before
      const label = item.closest('.nation')
        ? item.closest('.nation').querySelector('summary .n')
        : null;
      const full = label ? label.textContent : '';
      if (label) label.textContent = '';

      soloTimers.forEach(clearTimeout);
      soloTimers = [];

      // measure once the build state has laid out, then draw its frame
      soloTimers.push(setTimeout(() => drawSoloFrame(item), 20));

      // frame closed → the name types itself
      const NAME_MS = 26;
      soloTimers.push(setTimeout(() => {
        if (!label) return;
        let i = 0;
        (function tick(){
          if (i < full.length){
            label.textContent += full.charAt(i++);
            soloTimers.push(setTimeout(tick, NAME_MS));
          }
        })();
      }, 660));

      // named → the garment shifts aside and the record comes in
      soloTimers.push(setTimeout(
        () => item.classList.remove('build'),
        660 + full.length * NAME_MS + 200
      ));
    }

    function drawSoloFrame(item){
      const r = item.getBoundingClientRect();
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'solo-frame');
      svg.setAttribute('viewBox', `0 0 ${r.width} ${r.height}`);
      svg.setAttribute('preserveAspectRatio', 'none');
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', 0.75);
      rect.setAttribute('y', 0.75);
      rect.setAttribute('width',  Math.max(1, r.width  - 1.5));
      rect.setAttribute('height', Math.max(1, r.height - 1.5));
      svg.appendChild(rect);
      item.appendChild(svg);

      const len = 2 * (r.width + r.height);
      rect.style.strokeDasharray  = len;
      rect.style.strokeDashoffset = len;
      void rect.getBoundingClientRect();
      rect.style.transition = 'stroke-dashoffset .62s cubic-bezier(.4,0,.2,1)';
      rect.style.strokeDashoffset = 0;

      // the drawn line hands over to the card's own border, crossfading
      // so there is never two of them, nor a gap with neither
      setTimeout(() => {
        item.classList.add('framed');
        svg.style.transition = 'opacity .32s ease';
        svg.style.opacity = '0';
        setTimeout(() => svg.remove(), 360);
      }, 660);
    }

    /* back out of a single garment into the spiral, sitting on it rather
       than pulling all the way out to the wide view */
    function returnToExplore(){
      soloTimers.forEach(clearTimeout);
      soloTimers = [];
      const card = catalogue.querySelector('.item:not([hidden])');
      if (card && !REDUCED){
        card.classList.add('unbuild');
        setTimeout(() => card.classList.remove('unbuild'), 320);
      }
      const item = lastExploreItem;
      lastExploreItem = null;
      soloId = null;
      q.value = '';
      filter();
      syncGhost();
      setBrowsing(false);
      dockForced = true;
      navBtn.setAttribute('aria-pressed', 'true');
      updateDock();
      openExplore();
      if (item) focusItem(item);
    }

    window.addEventListener('resize', () => { if (!explore.hidden) fitSpiral(); });

    /* ============================================================
       DOCK DRAGGING — the three buttons can be put anywhere
       ============================================================ */
    (function makeDockDraggable(){
      let id = null, sx = 0, sy = 0, ox = 0, oy = 0, moved = false;

      /* Press and hold on any of the three buttons to pick the dock up.
         A hold is what separates moving it from pressing it, so a plain
         click still works and the middle button keeps its swipe. */
      let armed = false, holdTimer = null;

      dock.addEventListener('pointerdown', e => {
        if (e.target.closest('input')) return;      // typing, not dragging
        const r = dock.getBoundingClientRect();
        id = e.pointerId; sx = e.clientX; sy = e.clientY;
        ox = r.left; oy = r.top; moved = false; armed = false;
        clearTimeout(holdTimer);
        holdTimer = setTimeout(() => { armed = true; }, 280);
        // NB: no pointer capture here. Capturing on pointerdown retargets
        // the click to the dock, so the buttons inside stop responding.
      });

      dock.addEventListener('pointermove', e => {
        if (e.pointerId !== id) return;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        if (!armed){
          // moved off before the hold registered — that is a swipe, not a lift
          if (Math.hypot(dx, dy) > 8) clearTimeout(holdTimer);
          return;
        }
        if (!moved){
          moved = true;
          dock.classList.add('moved','dragging');
          dock.setPointerCapture(id);                   // only once dragging
        }
        const r = dock.getBoundingClientRect();
        const nx = Math.max(6, Math.min(window.innerWidth  - r.width  - 6, ox + dx));
        const ny = Math.max(6, Math.min(window.innerHeight - r.height - 6, oy + dy));
        dock.style.setProperty('--dx', nx + 'px');
        dock.style.setProperty('--dy', ny + 'px');
      });

      ['pointerup','pointercancel'].forEach(t => dock.addEventListener(t, e => {
        if (e.pointerId !== id) return;
        id = null;
        clearTimeout(holdTimer);
        armed = false;
        dock.classList.remove('dragging');
        if (moved){
          // swallow the click that would otherwise fire on release
          const kill = ev => { ev.stopPropagation(); ev.preventDefault(); };
          dock.addEventListener('click', kill, { capture:true, once:true });
        }
      }));
    })();

    /* ============================================================
       SITE HEADER — three ways off the archive
       The archive and the home page are separate documents, so every one
       of these is a page load. What differs is how much of the home page
       the reader is made to sit through on the way back in:

         mark   →  /          the front door: the mark draws, and waits
         star   →  /#home     already inside, at the top, nothing replayed
         index  →  /#footer   already inside and landed on the footer, so
                              scrolling up is what brings the page back

       The page fades before it goes. Without it the hand-over between two
       documents reads as a flash rather than a move, which is the whole
       reason body.leaving exists.
       ============================================================ */
    const siteHead = document.getElementById('siteHead');
    const hdTrace  = document.getElementById('hdTrace');
    if (siteHead && hdTrace){
      // the mark's own length drives the keyframes, so they stay honest
      // whatever the path is: measure it, hand it to CSS, then arm
      const hdLen = hdTrace.getTotalLength();
      hdTrace.style.strokeDasharray  = hdLen;
      hdTrace.style.strokeDashoffset = hdLen;
      siteHead.style.setProperty('--hd-len', hdLen);
      siteHead.classList.add('armed');
    }

    let leaving = false;
    function leaveTo(href){
      if (leaving) return;              // a second press must not re-arm it
      leaving = true;
      document.body.classList.add('leaving');
      // matches the .3s on body's opacity transition
      setTimeout(() => { window.location.href = href; }, 300);
    }

    const hdMark  = document.getElementById('hdMark');
    const hdHome  = document.getElementById('hdHome');
    const hdIndex = document.getElementById('hdIndex');
    if (hdMark)  hdMark.addEventListener('click',  e => { e.preventDefault(); leaveTo('/'); });
    if (hdHome)  hdHome.addEventListener('click',  e => { e.preventDefault(); leaveTo('/#home'); });
    if (hdIndex) hdIndex.addEventListener('click', e => { e.preventDefault(); leaveTo('/#footer'); });

    paintSaved();
    showPrompt();
    startSuggestions();
  </script>
</body>
</html>
