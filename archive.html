         back to a field that is already loaded should not put a door in
         front of it again. */
      if (!revealed && !spiralBuilt){
        spiral.classList.add('sp-waiting');
        document.body.classList.add('gated');
        revEl.hidden = false;
        revEl.classList.add('drawing');
        const len = revTrace.getTotalLength();
        revTrace.style.strokeDasharray = len;
        revEl.style.setProperty('--rev-len', len);
        // nothing to wait for — no images in the document at all
        setTimeout(() => { if (imgTotal === 0) armReveal(); }, 400);

        /* A gate that never opens is worse than one that opens early.
           `loading="lazy"` means the browser is entitled to hold back a
           photograph it considers off-screen, and in a transformed spiral
           a picture can still fail in a way that fires neither event. This
           is the last resort, set long enough that it is not reached on any
           connection that is merely slow. */
        setTimeout(armReveal, 20000);
      }
      /* The chosen garment is deliberately NOT released here. Coming back
         from a record, the field returns around the garment the reader left
         from — it stays lit while everything else fades up behind it, and
         returnToExplore lets go of it a beat later. Clearing it here undid
         that in the same frame. Entering explore fresh has nothing marked
         to clear. */
      exploreClosing = false;
      explore.hidden = false;
      exploreOn = true;
      explore.setAttribute('aria-hidden', 'false');
      if (wantSaved){
        // gathered once the spiral has been built and laid out below
        setTimeout(() => gatherSaved(), 40);
      }
      dockExplore.setAttribute('aria-pressed', 'true');
      document.body.classList.add('exploring');
      document.body.style.overflow = 'hidden';
      hidePrompt();
      // the dock returns to the middle of the screen for explore
      dock.classList.remove('moved');
      setFaceMode('explore');        // explore always opens on the circle
      setFace(0, true);
      buildSpiral();
      [...spiral.children].forEach(el => { el.style.transition = ''; el.style.opacity = ''; });
      fitSpiral();
    }

    function endExplore(handBack){
      explore.hidden = true;
      exploreOn = false;
      explore.setAttribute('aria-hidden', 'true');
      dockExplore.setAttribute('aria-pressed', 'false');
      document.body.classList.remove('exploring');
      document.body.style.overflow = '';
      exploreClosing = false;
      if (handBack){
        dockForced = false;
        collapseDock();
        updateDock();
        restPrompt();
        setTimeout(() => q.focus({ preventScroll:true }), 300);
      }
    }

    /* garments go out one at a time rather than as a block */
    function closeExplore(){
      if (explore.hidden || exploreClosing) return;
      exploreClosing = true;
      if (REDUCED){ endExplore(true); return; }
      [...spiral.children].forEach(el => {
        el.style.transition = 'opacity .3s ease';
        setTimeout(() => { el.style.opacity = '0'; }, Math.random() * 520);
      });
      setTimeout(() => endExplore(true), 950);
    }

    /* ---------- the middle button holds more than one tool ----------
       Scroll it on a laptop, swipe it on a phone: the faces roll round.
       Whichever is showing is what a press does. */
    /* The three glyphs sit in the DOM in one order; which of them is FIRST
       under the finger depends on where the reader is.

       In explore, the circle is home — it pulls the spiral back to fit — so
       it leads. In list view the circle is a way OUT of a view the reader is
       already in, so the list glyph leads and explore is one step away.

       The cross is always last. Whatever the mode, two steps from rest is
       the way out, and that never moves. */
    const faceEls = [...dockExplore.querySelectorAll('.face')];
    const FACE = { explore: faceEls[0], list: faceEls[1], exit: faceEls[2] };
    const ORDER = {
      explore: ['explore', 'list', 'exit'],
      list:    ['list', 'explore', 'exit'],
    };
    let faceMode = 'explore';
    let faces = ORDER.explore.map(k => FACE[k]);

    function setFaceMode(mode){
      if (mode === faceMode) return;
      faceMode = mode;
      faces = ORDER[mode].map(k => FACE[k]);
      setFace(0, true);            // whichever glyph now leads
    }
    let faceIx = 0;
    const FACE_LABEL = { explore:'Explore the archive', list:'Nation list', exit:'Leave' };

    function currentFace(){ return ORDER[faceMode][faceIx]; }

    function setFace(next, force){
      const n = (next + faces.length) % faces.length;
      if (n === faceIx && !force) return;
      // every glyph is addressed, not just the ones in this mode's order —
      // the third is still in the DOM and must not be left showing
      faceEls.forEach(f => {
        const on = f === faces[n];
        f.classList.toggle('is-on', on);
        f.classList.toggle('is-out', !on);
      });
      faceIx = n;
      dockExplore.setAttribute('aria-label', FACE_LABEL[currentFace()]);
    }

    /* A trackpad fires a burst of small wheel events per flick, which was
       toggling the face back and forth. Accumulate the travel and step
       once per gesture, then sit out until the burst dies down. */
    /* A trackpad flick is one gesture but many events, and the tail keeps
       arriving after the finger has gone. Stepping on a timer let that
       tail carry on past the face you wanted — sandwich would run
       straight through the cross and back to the circle. So: one step per
       gesture, and the next needs a genuine pause first. */
    let faceAcc = 0, faceSpent = false, faceIdle = null;

    dockExplore.addEventListener('wheel', e => {
      e.preventDefault();
      e.stopPropagation();

      clearTimeout(faceIdle);
      faceIdle = setTimeout(() => { faceSpent = false; faceAcc = 0; }, 220);

      if (faceSpent) return;              // this gesture already moved one
      faceAcc += Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;

      if (Math.abs(faceAcc) >= 45){
        setFace(faceIx + (faceAcc > 0 ? 1 : -1));
        faceAcc = 0;
        faceSpent = true;
      }
    }, { passive:false });

    // swipe the button itself — any direction moves along the stack
    let fx = 0, fy = 0, fid = null, swiped = false;
    dockExplore.addEventListener('pointerdown', e => {
      fid = e.pointerId; fx = e.clientX; fy = e.clientY; swiped = false;
    });
    dockExplore.addEventListener('pointermove', e => {
      if (e.pointerId !== fid || swiped) return;
      const dx = e.clientX - fx, dy = e.clientY - fy;
      if (Math.hypot(dx, dy) < 22) return;
      swiped = true;
      setFace(faceIx + ((dy < 0 || dx > 0) ? 1 : -1));
    });
    ['pointerup','pointercancel'].forEach(t => dockExplore.addEventListener(t, e => {
      if (e.pointerId === fid) fid = null;
    }));

    dockExplore.addEventListener('click', e => {
      if (swiped){ swiped = false; return; }       // that was a swipe

      // while the field is still arriving this button is the gate's key and
      // nothing else — the views it would otherwise reach are not ready
      if (gateShut()){ openGate(); return; }

      const face = currentFace();

      if (face === 'list'){
        // the listed nations, showing everything — not whatever the field
        // happened to be filtered to. The dock stays: explore is where the
        // searching happens now, and its bar is the one the reader has.
        toList({ keepDock:true });
        return;
      }

      if (face === 'exit'){
        // the cross always lands on the bare archive page
        if (exploreOn){ closeExplore(); setTimeout(goHome, 1000); }
        else goHome();
        return;
      }

      // the circle always returns explore to how it opens: the single
      // spiral, pulled back to fit — it is not a way out
      if (explore.hidden){ dockForced = true; openExplore(); return; }

      /* Standing in a cluster, the circle is the way OUT of it — back to
         every garment in the archive. It used to zoom out of the cluster
         while leaving the cluster in place, which read as the view fighting
         itself: the field pulled back but the garments it had set aside
         never came home. The term goes, the field is rebuilt whole, and
         only then is it fitted. */
      const clustered = document.querySelector('#spiral .sp-gone, #spiral .sp-dim');
      if (clustered || dq.value.trim() || spiralMode !== 'spiral'){
        dq.value = '';
        q.value = '';
        dghost.hidden = false;
        paintHint('');
        dqFlag.setAttribute('aria-pressed', 'false');
        flagBtn.setAttribute('aria-pressed', 'false');
        if (spiralMode !== 'spiral') morphLayout('spiral');
        clusterSearch('', true);          // every garment back on the field
        return;
      }
      if (atInitial){
        // already home — press again and it travels to one at random
        const pool = [...spiral.children].filter(el => !el.classList.contains('sp-dim'));
        if (pool.length){
          const pick = pool[Math.floor(Math.random() * pool.length)];
          glide(() => focusItem(pick, maxScale() * 0.68));
        }
      } else {
        glide(() => fitSpiral());
      }
    });

    /* every so often the middle button blinks, so the other tools on it
       are discoverable rather than hidden */

    dockLibrary.addEventListener('click', e => {
      e.stopPropagation();

      // a framed garment turns this into its keep switch
      if (focusedItem){
        toggleSaved(focusedItem.dataset.id);
        const on = isSaved(focusedItem.dataset.id);
        dockLibrary.setAttribute('aria-pressed', on ? 'true' : 'false');
        const mark = dockLibrary.querySelector('.bm');
        mark.classList.remove('pop');
        void mark.offsetWidth;
        if (on) mark.classList.add('pop');
        return;
      }

      if (!savedIds.length){
        // the shelf is empty, or everything on it has since left the archive
        savedOnly = false;
        document.body.classList.remove('library');
        dockLibrary.setAttribute('aria-pressed', 'false');
        flashNoData();
        return;
      }

      /* In the list the bookmark opens the Saved tab, because that is what
         "my garments" looks like in a list — a section of its own with the
         rest shut. Morphing a spiral the reader is not looking at answered
         a question nobody had asked. */
      if (explore.hidden){
        if (!savedOnly && !hasJoined()){
          openJoinGate(() => dockLibrary.click());
          return;
        }
        savedOnly = !savedOnly;
        soloId = null;
        nationsOpen = true;
        document.body.classList.add('browsing');
        document.body.classList.toggle('library', savedOnly);
        paintSaved();
        filter();
        if (savedOnly) savedTab.open = true;
        countEl.textContent = savedOnly
          ? `${savedIds.length} ${savedIds.length === 1 ? 'garment' : 'garments'} saved`
          : `${allItems.length} garments`;
        dockLibrary.setAttribute('aria-pressed', savedOnly ? 'true' : 'false');
        syncChrome();
        return;
      }

      if (spiralMode !== 'saved' && !hasJoined()){
        openJoinGate(() => dockLibrary.click());
        return;
      }
      const next = spiralMode === 'saved' ? 'spiral' : 'saved';
      morphLayout(next);
      dockLibrary.setAttribute('aria-pressed', next === 'saved' ? 'true' : 'false');
      if (next === 'spiral'){
        flagBtn.setAttribute('aria-pressed', 'false');
        dqFlag.setAttribute('aria-pressed', 'false');
      }
    });


    /* ---------- tools inside the dock's own search bar ---------- */
    const dqFlag    = document.getElementById('dqFlag');
    const dqExplore = document.getElementById('dqExplore');

    /* The union flag is not a layout switch — it is OUR shelf. Pressing it
       gathers the British garments and nothing else, which is the one
       cluster this archive is actually built around. Pressing it again puts
       the whole field back. */
    dqFlag.addEventListener('click', e => {
      e.stopPropagation();
      if (explore.hidden) openExplore();
      const on = dqFlag.getAttribute('aria-pressed') === 'true';
      dqFlag.setAttribute('aria-pressed', on ? 'false' : 'true');
      flagBtn.setAttribute('aria-pressed', on ? 'false' : 'true');
      dq.value = on ? '' : 'British';
      dghost.hidden = dq.value !== '';
      paintHint(dq.value.trim().toLowerCase());
      clusterSearch(on ? '' : 'british', true);
    });

    /* From explore this is the way into the tab list — and the dock comes
       with it. The main bar used to be handed back here, which put a second
       search bar on a page that already had one open; the dock stays and
       sits under the tabs instead. From the list it goes back to explore. */
    /* The third cluster: whatever the reader has kept. Gathered the same way
       the other two are, so all three behave alike. */
    function gatherSaved(){
      const els = [...spiral.children];
      const keep = els.filter(el => isSaved(el.dataset.id));
      if (!keep.length) return;
      els.forEach(el => {
        el.classList.toggle('sp-gone', !keep.includes(el));
        el.classList.remove('sp-dim');
        el.style.transition = 'left .8s cubic-bezier(.4,0,.2,1), top .8s cubic-bezier(.4,0,.2,1), opacity .45s ease';
      });
      layoutSpiral(spiralMode);
      keep.forEach((el, i) => {
        const r = SPACING * Math.sqrt(i + 0.5);
        const a = i * GOLDEN;
        place(el, Math.cos(a) * r, Math.sin(a) * r);
      });
      setTimeout(() => {
        glide(() => fitTo(keep), 800);
        setTimeout(() => els.forEach(el => { el.style.transition = ''; }), 880);
      }, 60);
      dockLibrary.setAttribute('aria-pressed', 'true');
    }

    /* The second of the three clusters. Everything the archive holds that is
       camouflaged, whatever nation cut it — the one grouping that crosses
       every shelf, and the reason the nation-by-nation version was noise. */
    function gatherCamouflage(){
      if (explore.hidden){
        dockForced = true;
        setFaceMode('explore');
        setFace(0, true);
        openExplore();
      }
      dq.value = 'Camouflage';
      dghost.hidden = true;
      paintHint('camouflage');
      clusterSearch('camouflage', true);
    }

    dqExplore.addEventListener('click', e => {
      e.stopPropagation();
      if (explore.hidden){ openExplore(); return; }
      toList({ keepDock:true });
    });

    /* Everything that lands on the tab list goes through here, so the dock's
       state and the face order can never disagree about which view is up. */
    function toList(opt){
      const keepDock = !!(opt && opt.keepDock);
      if (!explore.hidden) endExplore(false);
      soloId = null;
      savedOnly = false;
      document.body.classList.remove('library');
      q.value = '';
      dq.value = keepDock ? dq.value : '';
      filter();
      syncGhost();
      setBrowsing(true);
      setFaceMode('list');
      dockForced = keepDock;
      document.body.classList.toggle('dock-list', keepDock);
      if (keepDock){
        // it arrives open: a collapsed bar here would read as the search
        // having been taken away at the moment the reader changed view
        const held = dq.value;
        openDock();
        dq.value = held;
        dghost.hidden = dq.value !== '';
      } else {
        collapseDock();
      }
      updateDock();
    }

    /* ---------- zoom + pan ----------
       Neither works while the gate is up. The field behind it is grey and
       half-arrived, and zooming into a garment the reader cannot see is a
       view of nothing they can act on — and it leaves the gate's mark
       floating over a field that has moved underneath it. */
    explore.addEventListener('wheel', e => {
      e.preventDefault();
      if (gateShut()) return;
      const rect = explore.getBoundingClientRect();
      const cx = e.clientX - rect.left - rect.width / 2;
      const cy = e.clientY - rect.top - rect.height / 2;
      const factor = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016));
      const next = Math.max(0.08, Math.min(maxScale(), sc * factor));
      // keep the point under the cursor fixed while scaling
      tx = cx - (cx - tx) * (next / sc);
      ty = cy - (cy - ty) * (next / sc);
      sc = next;
      atInitial = false;
      applyTransform();
    }, { passive:false });

    let panId = null, panX = 0, panY = 0;
    explore.addEventListener('pointerdown', e => {
      if (gateShut()) return;
      if (e.target.closest('.sp-item')) return;
      /* The gate lives inside this overlay, and capturing the pointer here
         means the button inside it never receives the click — the press
         lands, the pan takes the pointer, and no click is ever delivered.
         Anything belonging to the gate is not a pan. */
      if (e.target.closest('#reveal')) return;
      panId = e.pointerId; panX = e.clientX; panY = e.clientY;
      explore.setPointerCapture(panId);
      explore.classList.add('grabbing');
    });
    explore.addEventListener('pointermove', e => {
      if (e.pointerId !== panId) return;
      tx += e.clientX - panX; ty += e.clientY - panY;
      panX = e.clientX; panY = e.clientY;
      atInitial = false;
      applyTransform();
    });
    ['pointerup','pointercancel'].forEach(t => explore.addEventListener(t, e => {
      if (e.pointerId !== panId) return;
      panId = null;
      explore.classList.remove('grabbing');
    }));

    // a garment opens on its own, centred; the tab's − brings you back
    spiral.addEventListener('click', e => {
      if (gateShut()) return;        // nothing in the field is pressable yet
      const item = e.target.closest('.sp-item');
      if (!item) return;

      // first press frames the garment, the way the circle's random pick
      // does; only a second press on the same one opens its record
      if (focusedItem !== item){
        glide(() => focusItem(item, maxScale() * 0.68));
        return;
      }

      /* ONE move. The garment is taken to exactly the size it will be in
         the record, so that when the record takes over there is nothing
         left to resize — the refocus IS the resize.

         It used to be two: the view re-framed to a fixed scale, and then the
         card's slot animated from wherever the garment happened to be to
         wherever the slot happened to be. Two shrinks in a row, the second
         one arriving after the reader had already understood the first.

         Meanwhile the rest of the field goes, so the handover is not a
         screenful of garments blinking out with the overlay. */
      item.classList.add('sp-pick');
      spiral.classList.add('sp-chosen');

      const img  = item.querySelector('img');
      const now  = (img || item).getBoundingClientRect().width;
      const want = recordSlotWidth();
      let target = now > 4 ? sc * (want / now) : maxScale() * 0.68;
      target = Math.min(target, maxScale());

      glide(() => focusItem(item, target), 620);
      setTimeout(() => openRecord(item), 660);
    });

    /* What the garment will measure once the record has it: the build-state
       card is min(80vw, 520px) and its slot fills that, less the card's own
       rule. Read from the page rather than repeated as a number here — the
       two would drift the first time the card's width changed. */
    function recordSlotWidth(){
      const probe = catalogue.querySelector('.item');
      const w = Math.min(window.innerWidth * 0.8, 520);
      return Math.max(80, w - 3);
    }

    /* ------------------------------------------------------------------
       EXPLORE → RECORD
       The garment does not move. It is the one thing on screen the reader
       is already looking at, and moving it to hand it over is the jump this
       used to have: explore vanished, the page redrew, and the garment
       reappeared somewhere else at some other size.

       So its position on the glass is measured before the handover, the
       built card's slot is put back exactly there, and only then is it
       released to settle into the card. The garment holds still, and the
       layout comes to it.
       ------------------------------------------------------------------ */
    function openRecord(item){
      document.body.classList.add('solo-from-field');
      const img = item.querySelector('img');
      const from = (img || item).getBoundingClientRect();

      lastExploreItem = item;
      endExplore(false);
      soloId = item.dataset.id;
      nationsOpen = true;
      document.body.classList.add('browsing');
      const tab = allNations.find(d => d.dataset.nation === item.dataset.nation);
      if (tab) tab.open = true;
      filter();
      syncChrome();
      /* Scrolled, not jumped. This used to snap the page to the top the
         instant explore closed, which read as the record arriving by
         teleport. Nothing at all happens if the page is already there. */
      if (window.scrollY > 0){
        window.scrollTo({ top:0, behavior:REDUCED ? 'auto' : 'smooth' });
      }
      beginSoloBuild(from);
    }

    /* Applied in the same tick as the render, so the settled two-column
       state is never painted first — that flash was the whole problem. */
    let soloTimers = [];

    function beginSoloBuild(from){
      const item = catalogue.querySelector('.item:not([hidden])');
      if (!item || REDUCED) return;
      item.querySelectorAll('.solo-frame').forEach(n => n.remove());

      // into the build state with nothing animating, then let transitions
      // run for the settle. solo-build also holds the tab back — see the
      // .solo-build rules: the garment is the first thing on screen, and
      // the furniture around it arrives once its boxes are drawn.
      item.classList.remove('framed');
      document.body.classList.add('solo-build', 'solo-snap');
      item.classList.add('build', 'no-anim');
      void item.offsetWidth;
      item.classList.remove('no-anim');
      document.body.classList.remove('solo-snap');

      /* FLIP, but only the garment. `from` is where it was sitting on the
         glass a moment ago in explore; the slot is put back there with a
         transform, and released on the next frame. For the length of the
         handover the garment has not moved by a pixel — everything else is
         what moves around it. */
      const slot = item.querySelector('.slot');
      if (from && slot){
        const to = slot.getBoundingClientRect();
        if (to.width > 4){
          const k  = from.width / to.width;
          const dx = (from.left + from.width  / 2) - (to.left + to.width  / 2);
          const dy = (from.top  + from.height / 2) - (to.top  + to.height / 2);
          slot.style.transition = 'none';
          slot.style.transformOrigin = 'center center';
          slot.style.transform = `translate(${dx}px, ${dy}px) scale(${k})`;
          slot.style.zIndex = '4';
          requestAnimationFrame(() => requestAnimationFrame(() => {
            slot.style.transition = 'transform .82s cubic-bezier(.4,0,.2,1)';
            slot.style.transform = 'none';
            soloTimers.push(setTimeout(() => {
              slot.style.transition = '';
              slot.style.transform = '';
              slot.style.zIndex = '';
            }, 900));
          }));
        }
      }

      // the name is written after the frame closes, not before
      const label = item.closest('.nation')
        ? item.closest('.nation').querySelector('summary .n')
        : null;
      const full = label ? label.textContent : '';
      if (label) label.textContent = '';

      soloTimers.forEach(clearTimeout);
      soloTimers = [];

      /* THE SEQUENCE, in the order the eye should read it:

           1. the garment, on its own, with no box
           2. one line drawn around the card that will hold it
           3. the card's own border takes that line's place, the tab arrives
              and the name types itself
           4. the garment settles left and the record expands in beside it,
              inside the box that was drawn for it

         There was briefly a second line drawn tight around the garment
         first. Two rectangles that close on almost the same pixels read as
         a doubled outline rather than two steps, so the box is drawn once. */
      const BOX_MS   = 560;   // the line around the card
      const HANDOVER =  70;   // drawn line → the card's real border
      const START    = from ? 780 : 40;
      const NAME_AT  = START + BOX_MS + HANDOVER;

      soloTimers.push(setTimeout(() => {
        const r = item.getBoundingClientRect();
        const box = drawFrame(item, { x:0, y:0, w:r.width, h:r.height }, BOX_MS);

        soloTimers.push(setTimeout(() => {
          /* The card's own border takes the drawn line's place in ONE frame.

             It used to crossfade over a third of a second, and for that
             third of a second both lines were on screen — the SVG stroke and
             the border, a pixel apart, reading as a single line that thickens
             and then thins again. That was the second stroke animation: not a
             second animation at all, two lines pretending to be one.

             Swapped instead of blended. The border is already the same
             weight and colour, so there is nothing to see. */
          item.classList.add('no-anim');       // no border-color transition
          item.classList.add('framed');
          void item.offsetWidth;
          box.remove();
          item.classList.remove('no-anim');
        }, BOX_MS + HANDOVER));
      }, from ? 780 : 40));   // with a handover running, the box waits for it

      // the box closed → the tab arrives and the name types itself into it
      const NAME_MS = 26;
      soloTimers.push(setTimeout(() => {
        /* solo-drawing runs the tab's arrival; solo-build leaving is what
           hands it the resting state to land on. Both in the same frame, so
           the rule, the border and the name are one movement rather than
           three. */
        document.body.classList.add('solo-drawing');
        document.body.classList.remove('solo-build');
        soloTimers.push(setTimeout(
          () => document.body.classList.remove('solo-drawing'), 900));
        if (!label) return;
        let i = 0;
        (function tick(){
          if (i < full.length){
            label.textContent += full.charAt(i++);
            soloTimers.push(setTimeout(tick, NAME_MS));
          }
        })();
      }, NAME_AT));

      // named → the garment shifts aside and the record expands in beside it
      soloTimers.push(setTimeout(
        () => item.classList.remove('build'),
        NAME_AT + full.length * NAME_MS + 200
      ));
    }

    /* One frame, drawn rather than switched on.

       The dash offset is set on the rect BEFORE it goes into the document
       and the run is armed a frame later, so there is no first paint in
       which the whole rectangle exists. That flash of a complete line, gone
       again before the draw started, was the flicker. */
    function drawFrame(item, box, ms){
      const NS  = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'solo-frame');
      svg.setAttribute('viewBox', `0 0 ${box.w} ${box.h}`);
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.style.left   = box.x + 'px';
      svg.style.top    = box.y + 'px';
      svg.style.width  = box.w + 'px';
      svg.style.height = box.h + 'px';

      const rect = document.createElementNS(NS, 'rect');
      rect.setAttribute('x', 0.75);
      rect.setAttribute('y', 0.75);
      rect.setAttribute('width',  Math.max(1, box.w - 1.5));
      rect.setAttribute('height', Math.max(1, box.h - 1.5));

      const len = 2 * (box.w + box.h);
      rect.style.strokeDasharray  = len;
      rect.style.strokeDashoffset = len;
      svg.appendChild(rect);
      item.appendChild(svg);

      requestAnimationFrame(() => {
        rect.style.transition = `stroke-dashoffset ${ms}ms cubic-bezier(.4,0,.2,1)`;
        rect.style.strokeDashoffset = 0;
      });
      return svg;
    }

    /* back out of a single garment into the spiral, sitting on it rather
       than pulling all the way out to the wide view */
    function returnToExplore(){
      document.body.classList.remove('solo-from-field');
      document.body.classList.remove('solo-closing', 'solo-shutting');
      document.querySelectorAll('.nation').forEach(n => n.style.removeProperty('--lid-drop'));
      document.body.classList.remove('solo-drawing');
      soloTimers.forEach(clearTimeout);
      soloTimers = [];
      document.body.classList.remove('solo-snap', 'solo-drawing');
      /* The way back is the way in, run backwards.

         The record closes the way it opened: the tab lets go, the card
         folds back to the square the garment stood in, and only then does
         the field come back — with the garment it left from still the one
         thing on screen, at the size it was. Cutting straight to the field
         threw away the thread the reader was holding.

         Reduced motion gets the destination without the journey. */
      const card = catalogue.querySelector('.item:not([hidden])');
      const item = lastExploreItem;
      lastExploreItem = null;

      const land = () => {
        /* The closing classes come off LAST, after the catalogue has been put
           away. Removing them first restored the tab to full opacity and full
           width for the frame before setBrowsing hid the shell — the tab
           flashed back into place on its way out. That was the flicker. */
        soloId = null;
        q.value = '';
        filter();
        syncGhost();
        setBrowsing(false);
        dockForced = true;
        navBtn.setAttribute('aria-pressed', 'true');
        updateDock();

        /* The view is put where it belongs BEFORE the field is shown.
           Unhiding explore and then moving it means one painted frame at the
           old transform — that frame is the flicker on the way back. */
        openExplore();
        if (item){
          spiral.style.transition = 'none';
          focusItem(item);
          void spiral.offsetWidth;          // commit it unanimated
          spiral.style.transition = '';
        }
        /* The whole field fades up together, the chosen garment among it and
           already in the middle. It used to be uncovered on its own with a
           wipe, which read as a second event after the tab had gone — and
           the blink was that wipe starting before the field had painted. */
        explore.classList.add('ex-returning');
        soloTimers.push(setTimeout(() => explore.classList.remove('ex-returning'), 560));

        // safe now: the shell is down and nothing of the tab can be seen
        document.body.classList.remove('solo-closing', 'solo-shutting');
        document.querySelectorAll('.nation').forEach(n => n.style.removeProperty('--lid-drop'));
        // and the rest of the field comes up behind it
        setTimeout(() => {
          spiral.classList.remove('sp-chosen');
          spiral.querySelectorAll('.sp-pick').forEach(el => el.classList.remove('sp-pick'));
        }, 60);
      };

      if (!card || REDUCED){ land(); return; }

      const tab = card.closest('.nation');
      if (!tab){ land(); return; }

      /* How far the lid has to travel to reach the middle of the screen.
         Measured, not guessed — the tab's height and the page's scroll both
         move it, and a fixed number would land it somewhere different on
         every viewport. */
      const r = tab.getBoundingClientRect();
      const drop = Math.round((window.innerHeight / 2) - (r.top + r.height / 2));
      tab.style.setProperty('--lid-drop', drop + 'px');

      document.body.classList.add('solo-closing');                 // 1 + 2
      soloTimers.push(setTimeout(() => {
        document.body.classList.add('solo-shutting');              // 3
      }, 680));
      // 4 — after the close has actually finished, not as it lands
      soloTimers.push(setTimeout(land, 1160));
      return;
      if (item) focusItem(item);
    }

    window.addEventListener('resize', () => { if (!explore.hidden) fitSpiral(); });

    /* ============================================================
       DOCK DRAGGING — the three buttons can be put anywhere
       ============================================================ */
    (function makeDockDraggable(){
      let id = null, sx = 0, sy = 0, ox = 0, oy = 0, moved = false;

      /* Press and hold on any of the three buttons to pick the dock up.
         A hold is what separates moving it from pressing it, so a plain
         click still works and the middle button keeps its swipe. */
      let armed = false, holdTimer = null;

      dock.addEventListener('pointerdown', e => {
        if (e.target.closest('input')) return;      // typing, not dragging
        const r = dock.getBoundingClientRect();
        id = e.pointerId; sx = e.clientX; sy = e.clientY;
        ox = r.left; oy = r.top; moved = false; armed = false;
        clearTimeout(holdTimer);
        holdTimer = setTimeout(() => { armed = true; }, 280);
        // NB: no pointer capture here. Capturing on pointerdown retargets
        // the click to the dock, so the buttons inside stop responding.
      });

      dock.addEventListener('pointermove', e => {
        if (e.pointerId !== id) return;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        if (!armed){
          // moved off before the hold registered — that is a swipe, not a lift
          if (Math.hypot(dx, dy) > 8) clearTimeout(holdTimer);
          return;
        }
        if (!moved){
          moved = true;
          dock.classList.add('moved','dragging');
          dock.setPointerCapture(id);                   // only once dragging
        }
        const r = dock.getBoundingClientRect();
        const nx = Math.max(6, Math.min(window.innerWidth  - r.width  - 6, ox + dx));
        const ny = Math.max(6, Math.min(window.innerHeight - r.height - 6, oy + dy));
        dock.style.setProperty('--dx', nx + 'px');
        dock.style.setProperty('--dy', ny + 'px');
      });

      ['pointerup','pointercancel'].forEach(t => dock.addEventListener(t, e => {
        if (e.pointerId !== id) return;
        id = null;
        clearTimeout(holdTimer);
        armed = false;
        dock.classList.remove('dragging');
        if (moved){
          // swallow the click that would otherwise fire on release
          const kill = ev => { ev.stopPropagation(); ev.preventDefault(); };
          dock.addEventListener('click', kill, { capture:true, once:true });
        }
      }));
    })();

    /* ============================================================
       SITE HEADER — three ways off the archive
       The archive and the home page are separate documents, so every one
       of these is a page load. What differs is how much of the home page
       the reader is made to sit through on the way back in:

         mark   →  /          the front door: the mark draws, and waits
         star   →  /#home     already inside, at the top, nothing replayed
         index  →  /#footer   already inside and landed on the footer, so
                              scrolling up is what brings the page back

       The page fades before it goes. Without it the hand-over between two
       documents reads as a flash rather than a move, which is the whole
       reason body.leaving exists.
       ============================================================ */

    /* ---------- the mark stands down once the page moves ----------
       It is fixed over content that scrolls underneath it; anywhere but the
       top of the page it is sitting on top of something. 24px is past the
       first flick of a trackpad and well short of a deliberate scroll. */
    (function markOnScroll(){
      let on = null;
      function sync(){
        const past = window.scrollY > 24;
        if (past === on) return;          // only touch the class when it changes
        on = past;
        document.body.classList.toggle('scrolled', past);
      }
      window.addEventListener('scroll', sync, { passive:true });
      sync();
    })();

    const siteHead = document.getElementById('siteHead');
    const hdTrace  = document.getElementById('hdTrace');
    if (siteHead && hdTrace){
      // the mark's own length drives the keyframes, so they stay honest
      // whatever the path is: measure it, hand it to CSS, then arm
      /* The corner mark does not draw any more, so nothing measures it and
         nothing dashes it — a dash offset left behind by a removed animation
         is a mark that never appears at all. */
    }

    let leaving = false;
    function leaveTo(href){
      if (leaving) return;              // a second press must not re-arm it
      leaving = true;
      document.body.classList.add('leaving');
      // matches the .3s on body's opacity transition
      setTimeout(() => { window.location.href = href; }, 300);
    }

    const hdMark  = document.getElementById('hdMark');
    const hdHome  = document.getElementById('hdHome');
    const hdIndex = document.getElementById('hdIndex');
    if (hdMark)  hdMark.addEventListener('click',  e => { e.preventDefault(); leaveTo('/'); });
    if (hdHome)  hdHome.addEventListener('click',  e => { e.preventDefault(); leaveTo('/#home'); });
    if (hdIndex) hdIndex.addEventListener('click', e => { e.preventDefault(); leaveTo('/#footer'); });

    pruneSaved();
    paintSaved();

    /* Explore IS the archive's front door now, and its own bar is where the
       searching happens. The page used to open on the bare search bar with
       everything else summoned from it; opening straight into the field
       means the first thing anyone sees is the garments. */
    dockForced = true;
    setFaceMode('explore');
    setFace(0, true);
    openExplore();
    openDock();
    updateDock();
    showPrompt();
    startSuggestions();   // the running suggestion is the bar's own prompt
  </script>
</body>
</html>
