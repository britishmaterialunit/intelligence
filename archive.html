  <script type="application/ld+json">

    "@type": "CollectionPage",

    "name": "BMU Archive",

    "isPartOf": { "@id": "https://britishmaterialunit.com/#website" }

  <style>
    /* ---------- HOW THINGS MOVE ----------
       One curve, everywhere: cubic-bezier(.4,0,.2,1). It leaves at nothing,
       runs through the middle, and arrives at nothing — slow, fast, slow.
       `ease` and `linear` are gone from this file, and so are the handful of
       curves that started fast (an expo ramp on the footer's box) or
       finished fast, along with the overshoot springs. A page where one
       thing eases and the next snaps reads as two pages.

       A few movements keep a curve of their own where the distance asks for
       it — .65,0,.35,1 for the long ones, .6,0,.3,1 for a box closing — but
       every one of them is slow at both ends. Nothing here starts or stops
       abruptly. */
    /* ---------- ONE LINE ----------
       Every border, rule and outline on this site is 1.5px. It was not: the
       buttons thinned to 1px on a phone, the rule over Relations was 1px
       against the 1.5px boxes beneath it, the footer's base rule was 1px,
       and in the archive the suggestion chip, the units field and the
       placeholder plot were all drawn a third lighter than everything
       around them. One stroke, one weight, everywhere. */
    :root{
      --ink:#222222;
      --line:#000000;
      --bg:#ffffff;
      --faint:#f0f0f0;
      --font:Helvetica, Arial, sans-serif;
    }
    *{ box-sizing:border-box; }
    /* The record is taller than the field, so a scrollbar arrives with it
       and takes 15px off the viewport — every centred thing on the page
       steps left at that moment. Reserving the gutter from the start means
       nothing moves when it appears. This is the sideways shift between the
       box closing and the tab forming. */
    html{ scrollbar-gutter:stable; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:var(--font);
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      align-items:center;
      /* top pad clears the fixed header, not just the edge of the page */
      padding:66px 16px 150px;
      -webkit-font-smoothing:antialiased;
    }
    /* auto margins centre the archive in the viewport when it is short
       (all tabs shut) and simply collapse once it outgrows the screen —
       unlike justify-content:center, this never clips the top */
    .wrap{ width:min(94vw, 880px); margin:auto 0; }

    /* ---------- fixed bottom bar ----------
       On arrival the archive is only this: a search bar and its footer
       line. Tabs, explore and the dock are all summoned from here. */
    /* the page's own line, under everything */
    #foot{
      position:fixed;
      left:0; right:0;
      bottom:10px;
      text-align:center;
      /* Above the explore overlay, which is a full-screen white ground and
         was simply painting over it — the line is the page's own signature
         and belongs under the bar in every view, not only the ones where
         nothing happens to be covering it. Still below the dock. */
      z-index:65;
      pointer-events:none;
    }

    /* the catalogue only exists once the reader asks for it */
    #shell{ display:none; }
    body.browsing #shell{ display:block; }
    body.library #catalogue{ display:none; }
    #savedTab .bm{ width:16px; height:16px; flex:none; fill:currentColor; stroke:currentColor; }


    /* ---------- search ---------- */
    .search{
      position:relative;
      margin-bottom:0;
    }
    .search input{
      width:100%;
      font-family:var(--font);
      font-size:12px;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:var(--ink);
      background:transparent;
      border:1.5px solid var(--line);
      padding:13px 68px 13px 42px;
      outline:none;
      border-radius:0;
      -webkit-appearance:none;
      position:relative;
      z-index:2;
    }
    /* the live suggestion sits behind the input, so the real placeholder
       must stay invisible — the input itself is transparent */
    .search input::placeholder{ color:transparent; }
    /* kill the browser's own clear button so only our grey ✕ remains */
    .search input::-webkit-search-cancel-button,
    .search input::-webkit-search-decoration,
    #dq::-webkit-search-cancel-button,
    #dq::-webkit-search-decoration{
      -webkit-appearance:none;
              appearance:none;
      display:none;
    }
    .search input:focus{ background:var(--faint); }

    .search .icon{
      position:absolute;
      top:50%; left:14px;
      transform:translateY(-50%);
      width:16px; height:16px;
      z-index:3;
      pointer-events:none;
      display:block;
    }

    /* typed suggestion — mirrors the input's metrics exactly so the
       text lands on the same baseline as anything the user types */
    .search .ghost{
      position:absolute;
      top:0; left:0; right:0; bottom:0;
      z-index:1;
      display:flex;
      align-items:center;
      padding:13px 68px 13px 42px;
      font-family:var(--font);
      font-size:12px;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:#aaa;
      pointer-events:none;
      white-space:nowrap;
      overflow:hidden;
    }
    .search .ghost[hidden]{ display:none; }
    /* the suggestion dissolves as it runs up on the icons rather than
       being sliced off by them */
    .search .ghost{
      transition:opacity .18s cubic-bezier(.4,0,.2,1);
      -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 86px), transparent calc(100% - 62px));
              mask-image:linear-gradient(to right, #000 calc(100% - 86px), transparent calc(100% - 62px));
    }
    .search .ghost .caret{
      display:inline-block;
      width:1px;
      height:1.05em;
      margin-left:2px;
      background:#aaa;
      vertical-align:middle;
    }
    .search .ghost .caret.blink{ animation:caret 1s steps(1,end) infinite; }
    @keyframes caret{ 0%,50%{ opacity:1; } 50.01%,100%{ opacity:0; } }
    @media (prefers-reduced-motion:reduce){
      .search .ghost .caret.blink{ animation:none; }
    }
    /* the ✕ and the navigate star share one slot and cross-fade:
       star while the field is empty, ✕ once there is a term */
    /* the flag sits immediately left of the navigate mark, greyed until
       it is doing something */
    .search .flagtoggle{
      position:absolute;
      top:50%; right:36px;
      transform:translateY(-50%);
      width:26px; height:28px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:transparent;
      border:none;
      padding:0;
      cursor:pointer;
      z-index:3;
    }
    /* contrast past the pivot turns the red and blue solid black while
       the white field stays white — no colour in the furniture */
    .search .flagtoggle img{
      display:block;
      height:12px; width:auto;
      filter:grayscale(1) contrast(1000%) opacity(.32);
      transition:filter .3s cubic-bezier(.4,0,.2,1);
    }
    .search .flagtoggle:hover img{ filter:grayscale(1) contrast(1000%); }
    .search .flagtoggle[aria-pressed="true"] img{ filter:grayscale(1) contrast(1000%); }

    .search .clear,
    .search .navtoggle{
      position:absolute;
      top:50%; right:6px;
      transform:translateY(-50%);
      width:28px; height:28px;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:3;
      font-family:var(--font); font-size:13px; line-height:1;
      color:#888;
      background:transparent;
      border:none;
      padding:0;
      cursor:pointer;
      transition:opacity .28s cubic-bezier(.4,0,.2,1), color .2s cubic-bezier(.4,0,.2,1);
    }
    .search .clear:hover,
    .search .navtoggle:hover{ color:var(--ink); }
    .search .clear{ opacity:0; pointer-events:none; }
    .search.has-term .clear{ opacity:1; pointer-events:auto; }
    .search.has-term .navtoggle{ opacity:0; pointer-events:none; }
    .search .navtoggle img{
      display:block; width:13px; height:13px;
      opacity:.3;
      transition:opacity .3s cubic-bezier(.4,0,.2,1);
    }
    .search .navtoggle:hover img{ opacity:.65; }
    .search .navtoggle[aria-pressed="true"] img{ opacity:1; }

    .count-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:26px;
    }
    /* The bookmark belongs to a garment that has been named. It was on
       screen from the first frame of the build — offering to keep something
       the reader had not been shown yet — so it waits for the tab to say
       what it is. */
    body.single-result.solo-build .count-row,
    body.single-result.solo-drawing .count-row{
      opacity:0;
      pointer-events:none;
    }
    /* A garment opened from the field is two boxes and nothing else: the tab
       and the record inside it. The tally and the shelf bookmark floating
       above them belonged to a list that is not on screen. The garment's own
       bookmark, inside the card, is untouched. */
    body.solo-from-field .count-row{ display:none; }
    body.single-result .count-row{ transition:opacity .45s cubic-bezier(.4,0,.2,1); }
    #savedBtn{
      display:flex;
      align-items:center;
      gap:7px;
      background:transparent;
      border:none;
      padding:4px 2px;
      cursor:pointer;
      color:#bbb;
      font-family:var(--font);
      font-size:10px;
      letter-spacing:.16em;
      transition:color .3s cubic-bezier(.4,0,.2,1);
    }
    #savedBtn:hover{ color:#777; }
    #savedBtn[aria-pressed="true"]{ color:var(--ink); }
    /* outline by default, filled once it holds something */
    .bm{
      display:block;
      fill:none;
      stroke:currentColor;
      stroke-width:1.6;
      stroke-linejoin:round;
      transition:fill .35s cubic-bezier(.4,0,.2,1), transform .3s cubic-bezier(.4,0,.2,1);
    }
    [aria-pressed="true"] > .bm{ fill:currentColor; }
    .bm.pop{ animation:bmPop .45s cubic-bezier(.4,0,.2,1); }
    @keyframes bmPop{
      0%  { transform:scale(1); }
      45% { transform:scale(1.35); }
      100%{ transform:scale(1); }
    }

    .count{
      font-size:10px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:#888;
      min-height:1.2em;
    }

    /* ---------- nation dropdowns ---------- */
    .nation{
      border:1.5px solid var(--line);
      margin-bottom:10px;
      transform-origin:top center;
    }
    /* tabs topple in like pages falling flat, and fold back on the way out */
    body.browsing .nation{ animation:toppleIn .46s cubic-bezier(.4,0,.2,1) backwards; }
    body.closing-tabs .nation{ animation:toppleOut .34s cubic-bezier(.4,0,.2,1) forwards; }
    @keyframes toppleIn{
      from{ opacity:0; transform:perspective(760px) rotateX(-34deg) translateY(-16px); }
      to  { opacity:1; transform:none; }
    }
    @keyframes toppleOut{
      from{ opacity:1; transform:none; }
      to  { opacity:0; transform:perspective(760px) rotateX(-26deg) translateY(-12px); }
    }
    @media (prefers-reduced-motion:reduce){
      body.browsing .nation, body.closing-tabs .nation{ animation:none; }
    }
    .nation > summary{
      list-style:none;
      cursor:pointer;
      padding:14px 16px;
      display:flex;
      align-items:center;
      gap:12px;
      font-size:11px;
      letter-spacing:.18em;
      text-transform:uppercase;
      font-weight:bold;
      transition:background-color .3s cubic-bezier(.4,0,.2,1);
    }
    .nation > summary::-webkit-details-marker{ display:none; }
    .nation > summary:hover{ background:var(--faint); }
    /* flag sits left of the nation name. Height is fixed and width is
       left to the image so each ensign keeps its true ratio — the UK's
       3:5 and the USA's 1.9:1 are not the same shape. */
    .nation > summary .flag{
      flex:none;
      height:13px;
      width:auto;
      max-width:26px;
      display:block;
    }
    /* the one nation we can't name gets an empty dashed slot */
    .nation > summary .flag.none{
      width:20px;
      height:13px;
      border:1.5px dashed rgba(0,0,0,.35);
      background:transparent;
    }
    .nation > summary .n{ flex:none; }
    .nation > summary .qty{
      flex:1;
      margin-left:-6px;          /* sits just after the name, not adrift */
      font-weight:normal;
      letter-spacing:.14em;
      color:#888;
    }
    .nation > summary .sign{
      flex:none;
      width:11px;
      text-align:right;
      color:#888;
      font-weight:bold;
    }
    .nation[open] > summary .sign::after{ content:"–"; }
    .nation:not([open]) > summary .sign::after{ content:"+"; }
    .nation[open] > summary{ border-bottom:1.5px solid var(--line); }
    .nbody{ padding:18px 16px 22px; }

    .section-label{
      margin:26px 0 14px;
      font-size:10px;
      letter-spacing:.18em;
      text-transform:uppercase;
      font-weight:bold;
      border-bottom:1.5px solid var(--line);
      padding-bottom:7px;
    }
    /* first-of-type, not first-child: the facet bar is the first thing in
       the tab body now, so the first section is no longer its parent's first
       child and this rule had quietly stopped matching — every heading,
       including the top one, was carrying its full 26px above it and sitting
       a clear 40px under the switch line. The bar and the heading under it
       are one piece of furniture and read as one. */
    .group:first-of-type > .section-label{ margin-top:0; }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
      gap:14px;
    }
    .item{
      border:1.5px solid var(--line);
      background:var(--bg);
      display:flex;
      flex-direction:column;
      transition:background-color .3s cubic-bezier(.4,0,.2,1);
    }
    .item:hover{ background:var(--faint); }
    /* .item sets display:flex, which outranks the UA rule for [hidden] —
       without this, filtered-out cards stay on screen */
    .item[hidden], .group[hidden], .nation[hidden]{ display:none !important; }
    .item .slot{
      aspect-ratio:1 / 1;
      border-bottom:1.5px solid var(--line);
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
    }
    .item .slot img{
      width:100%; height:100%;
      object-fit:cover; display:block;
    }
    .item .slot .pending{
      padding:8px;
      font-size:9.5px;
      letter-spacing:.06em;
      color:#aaa;
      text-align:center;
      word-break:break-all;
    }
    /* meta grows to fill the card so the action row can be pinned to the
       bottom — titles vary in length, the buttons must not */
    .item .meta{
      padding:10px 12px 12px;
      display:flex;
      flex-direction:column;
      flex:1;
    }
    .item .name{
      font-size:12px;
      font-weight:bold;
      line-height:1.4;
    }
    .name-row{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }
    .btn-save-inline{
      flex:none;
      background:transparent;
      border:none;
      padding:0;
      margin-top:1px;
      color:#c9c9c9;
      cursor:pointer;
      transition:color .3s cubic-bezier(.4,0,.2,1);
    }
    .btn-save-inline:hover{ color:#888; }
    .btn-save-inline[aria-pressed="true"]{ color:var(--ink); }

    .item .tag{
      display:block;
      margin-top:4px;
      font-size:10px;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:#888;
    }
    .item .ref{
      display:block;
      margin-top:6px;
      font-size:9.5px;
      letter-spacing:.14em;
      color:#aaa;
    }

    /* ---------- a single garment, on its own ----------
       The card turns on its side so the record and the request form open
       beside the garment instead of pushing down below it. */
    body.single-result .section-label{ display:none; }
    /* The switch groups a nation's garments, and a record opened on its own
       has one garment in it. Offering a way to sort one card by material was
       offering a control with nothing to act on, so it belongs to the list
       and only to the list. */
    body.single-result .facet-bar,
    body.solo-from-field .facet-bar{ display:none; }

    /* How far the record has to sit down the page for its garment to land
       exactly where the field was already holding it. Measured at the
       handover, not guessed — see beginSoloBuild. Scoped to records opened
       from the field, because it is only there that a garment is already
       somewhere on the glass when the record is built. */
    body.solo-from-field #catalogue{ padding-top:var(--solo-drop, 0px); }
    body.single-result .item .tag{ display:none; }
    body.single-result .nation > summary .qty{ display:none; }
    /* .qty was the spacer holding the sign right; without it the sign
       collapsed against the title */
    body.single-result .nation > summary .n{ flex:1; }
    body.single-result .grid{
      grid-template-columns:1fr;
      justify-items:center;
    }
    body.single-result .item{
      flex-direction:row;
      width:min(94vw, 760px);
      align-items:stretch;
      transition:width .62s cubic-bezier(.4,0,.2,1);
    }
    body.single-result .item .slot{
      flex:0 0 46%;
      aspect-ratio:auto;
      border-bottom:none;
      border-right:1.5px solid var(--line);
      transition:flex-basis .62s cubic-bezier(.4,0,.2,1),
                 border-right-color .3s cubic-bezier(.4,0,.2,1) .28s;
    }
    body.single-result .item .meta{
      flex:1 1 auto;
      padding:16px 18px 18px;
      opacity:1;
      transition:opacity .42s cubic-bezier(.4,0,.2,1) .2s,
                 flex-basis .62s cubic-bezier(.4,0,.2,1);
    }

    /* a lone garment does not fold in — it is drawn, named, then shifted */
    body.single-result .nation{ animation:none !important; }

    /* The tab a garment sits in is furniture, not the garment. It used to be
       on screen before the garment was, which put a full-width shell around
       everything before a single line had been drawn — the outer box
       arriving first, which is exactly backwards. It now waits for its own
       moment: the two boxes are drawn, and then the tab and its name arrive
       together. */
    /* The tab does not appear, it arrives: the rule draws out from the
       centre of the row, and the flag and name come up under it a beat
       later. Switching it on with an opacity fade read as a box materialising
       around a garment that was already settled. */
    body.single-result .nation{
      /* The border is the resting state — a garment reached by searching the
         list has no build sequence to wait for, and stripping it by default
         left that tab with no outline at all. Only the build takes it away,
         and only for as long as the build runs.

         It FADES back rather than being switched on at the end of a delay.
         A .01s change after half a second is a skip however it is written:
         the rule draws across the top, and then the tab simply appears
         around it in one frame. Both now run over the same half second, so
         the drawing and the arriving are one movement. */
      border-color:var(--line);
      position:relative;
      transition:border-color .5s cubic-bezier(.4,0,.2,1);
    }
    /* The rule that draws the tab in. It sits ON the tab's own top border
       and is the same weight, so at rest the two stack and read as one
       heavy line — which is the thick line above a solo garment. It exists
       only while the build is running and goes when the border takes over. */
    body.single-result .nation::before{
      content:"";
      position:absolute;
      /* sits ON the top edge, not above it — it is standing in for that
         border while it draws, not adding a second line over it */
      left:-1.5px; right:-1.5px; top:-1.5px;
      height:1.5px;
      background:var(--line);
      transform:scaleX(0);
      transform-origin:center;
      opacity:0;
      z-index:2;
    }
    body.single-result.solo-build .nation::before{
      opacity:1;
      transform:scaleX(0);
      transition:none;
    }
    body.single-result.solo-drawing .nation::before{
      opacity:1;
      transform:scaleX(1);
      transition:transform .54s cubic-bezier(.4,0,.2,1);
    }
    /* The rule hands over to the border, and for one frame between
       solo-drawing coming off and the border's own transition starting there
       was neither — the line blinked out at the top. It is held until the
       border has finished arriving, and only then goes. */
    body.single-result .nation::before{
      transition:opacity .01s cubic-bezier(.4,0,.2,1) .5s;
    }
    body.single-result .nation > summary{
      transition:opacity .5s cubic-bezier(.4,0,.2,1) .18s;
      transform:none;
    }
    body.single-result.solo-build .nation{
      border-color:transparent;
      transition:none;
    }
    /* Drawing: the three other edges fade up, but the TOP stays transparent
       for as long as the rule is crossing it. The rule and the border are
       the same line in the same place — both up at once is the thick line
       above the tab, not a heavier stroke but two of them. The top edge
       arrives only when the rule has finished and gone. */
    body.single-result.solo-drawing .nation{
      border-color:var(--line);
      border-top-color:transparent;
      transition:border-color .5s cubic-bezier(.4,0,.2,1) .12s;
    }
    body.single-result.solo-drawing .nation > summary{
      opacity:1;
      transform:none;
      transition:opacity .5s cubic-bezier(.4,0,.2,1) .2s;
    }

    body.single-result.solo-build .nation > summary{
      opacity:0;
      /* Held in place, not lifted. Moving the summary moved the row below it
         — the box the reader is watching being drawn stepped sideways and
         down at the exact moment the tab began. The tab arrives by fading;
         nothing it does changes the space it occupies. */
      transform:none;
      transition:none;
    }
    /* the tab has to be gone on the first frame, not fade out over half a
       second while the garment is trying to arrive — this is the same trick
       .no-anim plays on the card, held for one reflow */
    body.solo-snap .nation,
    body.solo-snap .nation::before,
    body.solo-snap .nation > summary{ transition:none !important; }

    /* the build state must arrive instantly, not animate into itself —
       otherwise the card visibly shrinks before it grows */
    /* Pseudo-elements are not matched by `*`, so the slot's divider line was
       the one thing in the card still animating on the way INTO the build:
       it retracted from full height to nothing every time a garment opened.
       That retracting line was the flicker. */
    body.single-result .item.no-anim,
    body.single-result .item.no-anim *,
    body.single-result .item.no-anim::before,
    body.single-result .item.no-anim::after,
    body.single-result .item.no-anim *::before,
    body.single-result .item.no-anim *::after{ transition:none !important; }

    /* First the garment stands alone in its own box, centred; only once
       the frame has drawn does it move aside and let the record in. */
    body.single-result .item.build{
      width:min(80vw, 520px);
      border-color:transparent;      /* nothing, until the line draws it */
    }
    /* once the line has closed, the card's own border takes over */
    body.single-result .item.build.framed{ border-color:var(--line); }
    /* Height as well as width. The card is a square while the garment is
       alone in it and a wide, short box once the record is beside it, and
       with only the width on a curve the garment's height collapsed in a
       single frame while its width eased. Both, on the same curve, and the
       garment changes shape as one movement. See beginSoloBuild, which is
       what puts a number on the height for the length of the move. */
    body.single-result .item{ transition:width .62s cubic-bezier(.4,0,.2,1),
                                         height .62s cubic-bezier(.4,0,.2,1),
                                         border-color .32s cubic-bezier(.4,0,.2,1); }
    body.single-result .item.build .slot{
      flex-basis:100%;
      aspect-ratio:1 / 1;
    }

    /* every edge is drawn rather than switched on */
    body.single-result .item{ border-color:var(--line); }
    body.single-result .item .slot{ position:relative; border-right:none; }
    body.single-result .item .slot::after{
      content:"";
      position:absolute;
      top:0; right:0; bottom:0;
      width:1.5px;
      background:var(--line);
      transform:scaleY(0);
      transform-origin:top center;
      transition:transform .5s cubic-bezier(.4,0,.2,1);
    }
    body.single-result .item:not(.build) .slot::after{ transform:scaleY(1); }

    body.single-result .item .actions .btn-line,
    body.single-result .item .req-send{
      clip-path:inset(0 100% 0 0);
      transition:clip-path .42s cubic-bezier(.4,0,.2,1);
    }
    body.single-result .item:not(.build) .actions .btn-line,
    body.single-result .item:not(.build) .req-send{ clip-path:inset(0 0 0 0); }
    body.single-result .item:not(.build) .actions .btn-line:nth-child(2){
      transition-delay:.1s;
    }
    body.single-result .item .name-row{
      clip-path:inset(0 100% 0 0);
      transition:clip-path .45s cubic-bezier(.4,0,.2,1) .06s;
    }
    body.single-result .item:not(.build) .name-row{ clip-path:inset(0 0 0 0); }
    body.single-result .item.build .meta{
      opacity:0;
      flex:0 0 0px;
      min-width:0;          /* content was holding a sliver open */
      padding-left:0;
      padding-right:0;
      overflow:hidden;
    }
    /* ---------- THE RECORD IS DEALT OUT, NOT HANDED OVER ----------
       The card used to arrive whole: the moment it widened, the name, the
       rule, both borders and the two buttons were all already there, and the
       tab came up behind them in the same frame. Everything the record has
       to say, said at once.

       These four holds are what let beginSoloBuild put them in an order. Each
       one re-states the closed value the build state had, at the same
       specificity as the rule that opens it and after it in the sheet, so
       dropping the class is what opens it — and the transition that was
       already on the property is what draws it. Nothing new animates; the
       existing motions are simply let go of one at a time. */
    body.single-result .item.hold-name .name-row{ clip-path:inset(0 100% 0 0); }
    body.single-result .item.hold-mark .btn-save-inline{ opacity:0; }
    body.single-result .item .btn-save-inline{ transition:opacity .3s cubic-bezier(.4,0,.2,1); }
    body.single-result .item.hold-acts .actions .btn-line,
    body.single-result .item.hold-acts .req-send{ clip-path:inset(0 100% 0 0); }
    body.single-result .item.hold-rule .slot::after{ transform:scaleY(0); }
    /* The card's own outline is the build state's job while the card is
       narrow; once it has opened out there is nothing holding it back, and
       it appeared whole a beat before the line that is supposed to draw it.
       Held transparent until that line has finished and handed over. */
    body.single-result .item.hold-edge{ border-color:transparent; }
    body.single-result .item.hold-edge.framed{ border-color:var(--line); }
    /* the tag and the reference belong to the name, and arrive with it */
    body.single-result .item.hold-name .tag,
    body.single-result .item.hold-name .ref{ opacity:0; }
    body.single-result .item .tag,
    body.single-result .item .ref{ transition:opacity .3s cubic-bezier(.4,0,.2,1); }

    body.single-result .item .name{ font-size:14px; }
    body.single-result .item:hover{ background:var(--bg); }

    @media (max-width:640px){
      body.single-result .item{ flex-direction:column; width:100%; }
      body.single-result .item .slot{
        flex:none;
        aspect-ratio:1 / 1;
        border-right:none;
        border-bottom:1.5px solid var(--line);
      }
    }

    /* ---------- opening a garment's record ----------
       The garment arrives on its own. A line is then drawn tight around it,
       a second is drawn around the card that will hold it, and only then
       does the garment settle left and let its record in beside it.
       Reversed on the way out.

       Each frame is placed over the box it is drawing rather than stretched
       across the card, because for part of the sequence there are two of
       them on screen at once. */
    .solo-frame{
      position:absolute;
      left:0; top:0;
      pointer-events:none;
      overflow:visible;
      z-index:3;
    }
    /* drawn in the room rather than on the card — see drawFrame */
    .solo-frame.is-fixed{ position:fixed; z-index:45; }
    .solo-frame rect{
      fill:none;
      stroke:var(--line);
      stroke-width:1.5;
    }
    body.single-result .item{ position:relative; }
    body.single-result .item.unbuild .meta{ animation:metaLeave .3s cubic-bezier(.4,0,.2,1) both; }
    @keyframes metaLeave{
      from{ opacity:1; transform:none; }
      to  { opacity:0; transform:translateX(14px); }
    }
    @media (prefers-reduced-motion:reduce){
      body.single-result .item.build .meta,
      body.single-result .item.build .slot,
      body.single-result .item.unbuild .meta{ animation:none; }
    }

    /* ---------- actions: always the last thing in the card ---------- */
    .actions{
      display:flex;
      gap:8px;
      margin-top:auto;          /* pins the row to the bottom of the card */
      padding-top:12px;
    }
    .btn-line{
      flex:1 1 0;
      min-width:0;
      padding:7px 0;
      font-family:var(--font);
      font-size:9.5px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--ink);
      background:var(--bg);
      border:1.5px solid var(--line);
      cursor:pointer;
      transition:background-color .3s cubic-bezier(.4,0,.2,1), color .3s cubic-bezier(.4,0,.2,1);
    }
    .btn-line:hover{ background:var(--faint); }
    .btn-save{
      flex:0 0 34px;
      padding:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--bg);
      border:1.5px solid var(--line);
      color:#c2c2c2;
      cursor:pointer;
      transition:color .3s cubic-bezier(.4,0,.2,1), background-color .3s cubic-bezier(.4,0,.2,1);
    }
    .btn-save:hover{ background:var(--faint); color:#888; }
    .btn-save[aria-pressed="true"]{ color:var(--ink); }

    .btn-line[hidden]{ display:none; }

    /* ---------- request ---------- */
    /* These used to be display:none toggled to block, which is a snap by
       definition — the panel and the card's whole height arrived in one
       frame. They slide instead: the row opens from nothing with the
       grid-rows trick (the one way to animate to a height you have not
       measured), and the content rides in from the right as it does.

       Out is the same move reversed, which is what makes it read as one
       panel going back and forth rather than two appearing and vanishing. */
    .req-panel, .info-panel{
      display:grid;
      grid-template-rows:0fr;
      margin-top:0;
      border-top:1.5px solid transparent;
      padding-top:0;
      transition:grid-template-rows .42s cubic-bezier(.4,0,.2,1),
                 margin-top .42s cubic-bezier(.4,0,.2,1),
                 padding-top .42s cubic-bezier(.4,0,.2,1),
                 border-top-color .3s cubic-bezier(.4,0,.2,1);
    }
    .req-panel > *, .info-panel > *{
      min-height:0;                 /* the grid row has to be free to be 0 */
      overflow:hidden;
      opacity:0;
      transform:translateX(18px);
      transition:opacity .3s cubic-bezier(.4,0,.2,1), transform .42s cubic-bezier(.4,0,.2,1);
    }
    .req-panel.open, .info-panel.open{
      grid-template-rows:1fr;
      margin-top:12px;
      border-top-color:var(--line);
      padding-top:12px;
    }
    .req-panel.open > *, .info-panel.open > *{
      opacity:1;
      transform:none;
      transition-delay:.12s;        /* the box opens first, then the content rides in */
    }
    @media (prefers-reduced-motion:reduce){
      .req-panel, .info-panel,
      .req-panel > *, .info-panel > *{ transition:none; }
    }

    .req-row label{
      display:block;
      margin-bottom:6px;
      font-size:9px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:#888;
    }
    /* Ten dots, thirty upwards in tens. Each fills as it is passed, so the
       row reads as a quantity rather than as ten separate switches. */
    .req-dots{
      display:flex;
      align-items:center;
      /* Laid out from the width there is rather than from a fixed gap.
         Ten circles at a fixed 7px apart came to 211px, and the panel that
         holds them clips its own overflow for the slide — in any card
         narrower than that the tenth dot was cut in half by the edge. Spread
         between the two ends instead and the row fits whatever it is given,
         closing the gaps rather than running off the side. The cap keeps a
         wide card from spacing them out into ten separate switches. */
      justify-content:space-between;
      gap:0;
      max-width:212px;
      /* the chosen dot grows 1.35x, and it grows about its own centre — the
         padding is the room the first and last have to grow into, so neither
         end is clipped at the moment it is pressed */
      margin:3px 0 9px;
      padding:3px 6px;
    }
    .req-dot{
      width:11px; height:11px;
      flex:none;
      padding:0;
      border:1.5px solid #c9c9c9;
      border-radius:50%;
      background:transparent;
      cursor:pointer;
      transition:background-color .28s cubic-bezier(.4,0,.2,1), border-color .28s cubic-bezier(.4,0,.2,1), transform .28s cubic-bezier(.4,0,.2,1);
    }
    .req-dot:hover{ border-color:var(--line); }
    .req-dot.on{
      background:var(--line);
      border-color:var(--line);
    }
    /* the one just chosen lifts, so the eye follows the press */
    .req-dot.tip{ transform:scale(1.35); }

    .req-qty{ display:flex; align-items:center; gap:10px; }
    .req-qty .qtyval{
      flex:0 0 auto;
      font-size:13px;
      font-weight:bold;
      color:var(--ink);
      font-variant-numeric:tabular-nums;
    }
    .req-any{
      flex:1 1 auto;
      min-width:0;
      font-family:var(--font);
      font-size:10.5px;
      letter-spacing:.04em;
      color:var(--ink);
      background:transparent;
      border:none;
      border-bottom:1.5px solid #d8d8d8;
      padding:3px 2px;
      outline:none;
      border-radius:0;
      -webkit-appearance:none;
    }
    .req-any:focus{ border-bottom-color:var(--line); }
    /* no heading above it — the placeholder carries it.
       The same grey field the join panel asks for an address in: the two are
       the same question asked in two places, and a black-ruled white box here
       against a grey one there read as two different kinds of field. Grey at
       rest, and the rule comes up black when it is being typed into. */
    .req-email{
      display:block;
      width:100%;
      margin-top:12px;
      font-family:var(--font);
      font-size:11px;
      letter-spacing:.04em;
      color:var(--ink);
      background:var(--faint);
      border:1.5px solid var(--faint);
      padding:9px 8px;
      outline:none;
      border-radius:0;
      -webkit-appearance:none;
      transition:border-color .3s cubic-bezier(.4,0,.2,1);
    }
    .req-email:focus{ border-color:var(--line); }
    .req-send[disabled]{ opacity:.45; cursor:default; }
    /* a field no person ever sees, and no person ever fills in — anything
       that arrives with it filled is a bot, and is dropped */
    .req-hp{
      position:absolute;
      left:-9999px;
      width:1px; height:1px;
      opacity:0;
      pointer-events:none;
    }
    .req-msg.err{ color:var(--ink); }

    .req-send{
      display:block;
      width:100%;
      margin-top:12px;
      padding:8px 0;
      font-family:var(--font);
      font-size:9.5px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--bg);
      background:var(--line);
      border:1.5px solid var(--line);
      cursor:pointer;
      transition:opacity .3s cubic-bezier(.4,0,.2,1);
    }
    .req-send:hover{ opacity:.78; }
    .req-msg{
      margin-top:8px;
      font-size:9.5px;
      letter-spacing:.08em;
      line-height:1.5;
      color:#888;
    }
    .req-msg:empty{ display:none; }

    .info-panel{
      font-size:10.5px;
      line-height:1.65;
      color:#555;
      white-space:pre-wrap;
    }

    /* Sourcing. Light grey, breathing rather than blinking — the dots are
       counted out in the script, so this is only the flash under them. The
       line is left-set, so dots arriving at its end move nothing. */
    .info-inner.sourcing{
      color:#b8b8b8;
      letter-spacing:.06em;
      animation:sourcingflash 2.1s cubic-bezier(.4,0,.2,1) infinite;
    }
    @keyframes sourcingflash{
      0%, 100%{ opacity:.4 }
      50%     { opacity:1 }
    }
    @media (prefers-reduced-motion:reduce){
      .info-inner.sourcing{ animation:none; opacity:.85; }
    }

    /* ---------- empty state ---------- */
    .empty{
      border:1.5px solid var(--line);
      padding:22px 18px;
      text-align:center;
      overflow:hidden;              /* the reel is clipped by the box */
    }
    .empty[hidden]{ display:none; }

    .empty-line{
      font-size:11px;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:#888;
      min-height:1.2em;
    }
    /* the message falls away like a slot reel turning over */
    .empty-line.drop{ animation:slotdrop .46s cubic-bezier(.4,0,.2,1) forwards; }
    @keyframes slotdrop{
      to{ transform:translateY(30px); opacity:0; }
    }

    .flag-strip{
      margin-top:-18px;             /* takes the space the message vacated */
      opacity:0;
      transform:translateY(-24px);
    }
    .flag-strip[hidden]{ display:none; }
    .flag-strip.in{ animation:slotin .42s cubic-bezier(.3,0,.2,1) forwards; }
    @keyframes slotin{
      to{ opacity:1; transform:translateY(0); }
    }

    .flag-rail{
      display:flex;
      gap:22px;
      justify-content:safe center;   /* stays centred until it overflows */
      align-items:flex-start;
      overflow-x:auto;
      overscroll-behavior-x:contain; /* hard stop at each end, no chaining */
      scroll-snap-type:x proximity;
      padding:2px;
      scrollbar-width:none;
      -ms-overflow-style:none;
    }
    .flag-rail::-webkit-scrollbar{ display:none; }
    /* only once it actually overflows do the ends dissolve round the corner */
    .flag-rail.overflowing{
      -webkit-mask-image:linear-gradient(to right, transparent 0, #000 52px, #000 calc(100% - 52px), transparent 100%);
              mask-image:linear-gradient(to right, transparent 0, #000 52px, #000 calc(100% - 52px), transparent 100%);
    }

    .flag-pick{
      flex:none;
      scroll-snap-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:7px;
      padding:6px 4px;
      background:transparent;
      border:none;
      cursor:pointer;
      font-family:var(--font);
      opacity:.75;
      transition:opacity .25s cubic-bezier(.4,0,.2,1), transform .25s cubic-bezier(.4,0,.2,1);
    }
    .flag-pick:hover{ opacity:1; transform:translateY(-2px); }
    .flag-pick img{ height:20px; width:auto; display:block; }
    .flag-pick span{
      font-size:9px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:#888;
      white-space:nowrap;
    }
    /* closest match to what they mistyped */
    .flag-pick.suggested{ opacity:1; }
    .flag-pick.suggested span{ color:var(--ink); font-weight:bold; }

    .note{
      margin-top:40px;
      border:1.5px solid var(--line);
      padding:16px 18px;
      font-size:11.5px;
      line-height:1.6;
      color:#555;
    }
    .note b{ color:var(--ink); }

    nav.back{ margin-top:36px; text-align:center; }
    /* matches index.html's .bm-button metrics so the button that flies
       across the transition is the same object at both ends */
    .bm-button{
      display:inline-block;
      width:150px; height:40px; line-height:37px;
      font-family:var(--font); font-size:13px;
      color:#000; text-decoration:none;
      border:1.5px solid var(--line);
      background:var(--bg);
      cursor:pointer; text-align:center;
      white-space:nowrap;
      transition:background-color .3s cubic-bezier(.4,0,.2,1), color .3s cubic-bezier(.4,0,.2,1);
    }
    .bm-button:hover{ background:var(--faint); color:#444; }

    footer{
      margin-top:30px;
      font-size:10.5px;
      color:#999;
      text-align:center;
      letter-spacing:.06em;
    }

    /* ============================================================
       EXPLORE — the whole archive as one spiral, pannable and zoomable
       ============================================================ */
    #explore{
      position:fixed;
      inset:0;
      z-index:40;
      background:var(--bg);
      overflow:hidden;
      cursor:grab;
      touch-action:none;
    }
    #explore[hidden]{ display:none; }
    #explore.grabbing{ cursor:grabbing; }

    /* A drag across this field is a pan, and the browser was reading it as
       a text drag as well: every garment it swept over came back covered in
       selection blue, as though the reader had highlighted a paragraph. The
       photographs are not copy, so they do not select and they do not drag
       out of the page — a press on one opens it, which is the only thing a
       press on a garment means here. */
    #explore, #explore *{
      -webkit-user-select:none;
      user-select:none;
    }
    /* every image on this page, not a list of the ones noticed so far:
       none of them is a thing to drag out or highlight */
    img{
      -webkit-user-drag:none;
      user-select:none;
      -webkit-user-select:none;
      -webkit-touch-callout:none;
    }
    #explore ::selection{ background:transparent; }

    #spiral{
      position:absolute;
      left:50%;
      top:50%;
      width:0; height:0;
      transform-origin:0 0;
    }
    /* Promoted only while it is actually moving.

       will-change:transform on this element permanently is what made a
       zoomed garment soft. A promoted layer is rasterised once, at the size
       it had when it was promoted, and every scale after that enlarges the
       pixels it already drew rather than drawing new ones. A desktop
       re-rasters on its own once things go quiet; a phone does not, which
       is why the field was blurred there and the record — a different
       element, never promoted — was sharp.

       So it is promoted for the length of a move and let go of at the end,
       and letting go is what redraws it at the size it has come to rest
       at. The pixels are there: the cards are 150px of a 1000px
       photograph. */
    #spiral.gliding{ will-change:transform; }
    /* garments sit as isolated cut-outs, no frame — the cards are built
       large so zooming in resolves real detail rather than a blur */
    .sp-item{
      position:absolute;
      width:150px;
      transform:translate(-50%, -50%);
      cursor:pointer;
      /* No entrance. Each garment used to fade up on a delay of its own —
         twelve milliseconds apart, so seventy-five of them arrived as a
         ripple running out from the middle every time the field was opened.
         The field is one thing and it is either there or it is not; nothing
         owns opacity here. */
      opacity:1;
      transition:opacity .34s cubic-bezier(.4,0,.2,1);
    }
    .sp-item .sp-slot{
      width:150px; height:150px;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:transform .2s cubic-bezier(.4,0,.2,1);
    }
    .sp-item img{
      max-width:100%; max-height:100%;
      width:auto; height:auto;
      object-fit:contain;               /* never crop a garment */
      display:block;
    }
    .sp-item:hover .sp-slot{ transform:scale(1.06); }
    /* no lettering anywhere in explore — garments only. A garment with no
       photograph yet leaves a faint empty plot rather than a caption. */
    .sp-item.sp-dim{
      opacity:.06;
      pointer-events:none;
      transition:opacity .5s cubic-bezier(.4,0,.2,1);
    }
    /* Still there, and plainly not the subject. The nation clusters gather
       their garments into the middle and leave the rest of the archive
       standing around them — greyed rather than taken away, so the reader
       can see how much of the field they have set aside. Nothing here can be
       pressed: a garment at a sixth of its strength is context, and opening
       one by accident while reading a cluster is not something to allow. */
    .sp-item.sp-grey{
      opacity:.16;
      filter:grayscale(1);
      pointer-events:none;
      transition:opacity .5s cubic-bezier(.4,0,.2,1), filter .5s cubic-bezier(.4,0,.2,1);
    }
    /* Off the field entirely, not dimmed. A cluster gathers into the middle
       of a space the rest of the archive is still standing in; at .06 they
       are faint but they are still THERE, and the cluster lands on top of
       them. Gone means gone. */
    .sp-item.sp-gone{
      opacity:0;
      pointer-events:none;
      transition:opacity .45s cubic-bezier(.4,0,.2,1);
    }
    /* Put out, with nothing animating, so the field can be laid out behind
       a blank screen and then brought back as one. !important because the
       garments carry inline transitions of their own for the move, and the
       whole point of this is to hold them at nothing while that is set up. */
    #spiral.sp-blank .sp-item{ opacity:0 !important; transition:none !important; }

    /* One garment has been chosen and the record is coming. Everything else
       leaves first, so the handover is not a field of garments blinking out
       the instant explore is torn down. */
    #spiral.sp-chosen .sp-item:not(.sp-pick){
      opacity:0;
      pointer-events:none;
      transition:opacity .34s cubic-bezier(.4,0,.2,1);
    }
    .sp-item .sp-code{
      width:100%; height:100%;
      border:1.5px dashed #f2f2f2;
      font-size:0;
    }

    #exploreHint{
      position:fixed;
      left:50%;
      top:18px;
      transform:translateX(-50%);
      z-index:41;
      font-size:9px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:#bbb;
      pointer-events:none;
    }

    /* ============================================================
       DOCK — floating navigation, only alive while the reader is
       inside an open nation tab and the real search bar has gone
       off screen. Collapsed it is two black squares; the left one
       opens out into a white search bar with the arrow beside it.
       ============================================================ */
    #dock{
      /* The archive's own measure — the same min(94vw, 880px) that .wrap
         gives the tab list. The bar and its two boxes then finish on exactly
         the same pixels as the tabs above them rather than floating inside
         their width. */
      --dock-w:min(94vw, 880px);
      position:fixed;
      left:50%;
      /* ONE height, every state. The bar used to sit at 112 / 34 / 26 / 24
         depending on what was open, so it stepped up and down as the reader
         moved between views — and the page's stamp underneath it appeared to
         come and go with it. It clears the stamp and stays put. */
      bottom:34px;
      transform:translateX(-50%) translateY(14px);
      z-index:80;
      display:flex;
      gap:10px;
      align-items:center;
      opacity:0;
      pointer-events:none;
      transition:opacity .28s cubic-bezier(.4,0,.2,1), transform .28s cubic-bezier(.4,0,.2,1);
      touch-action:none;
    }
    #dock.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
      pointer-events:auto;
    }
    /* once dragged it holds an absolute position and drops the centring */
    #dock.moved{
      left:0; top:0; bottom:auto;
      transform:translate(var(--dx), var(--dy));
    }
    #dock.moved.show{ transform:translate(var(--dx), var(--dy)); }
    #dock.dragging{ transition:none; cursor:grabbing; }

    /* with the main bar gone the dock drops to the bottom edge */
    /* and the list needs room to scroll clear of it */
    body.dock-list{ padding-bottom:110px; }

    /* ---------- tabs fade off under the bar ----------
       Open, the search bar reaches right across the page, and a tab
       scrolling behind it met a hard edge — cut in half, half of it still
       printed underneath. It fades out into the bar instead.

       Closed, the dock is three small squares with the page showing between
       and around them, and a band of fade across the whole width would be
       veiling nothing. So this belongs to the open bar, and goes with it.

       Under #foot (65), so the page's own line still prints over the top of
       it, and under the dock (80). */
    body.dock-list::after{
      content:'';
      position:fixed;
      left:0; right:0; bottom:0;
      height:156px;
      z-index:60;
      pointer-events:none;
      background:linear-gradient(to top,
                 var(--bg) 0, var(--bg) 88px, transparent 156px);
      opacity:0;
      transition:opacity .34s cubic-bezier(.4,0,.2,1);
    }
    body.dock-list.dock-open:not(.exploring)::after{ opacity:1; }
    @media (prefers-reduced-motion:reduce){
      body.dock-list::after{ transition:none; }
    }

    /* in explore the dock sits central but low, clear of the garments */
    body.exploring #dock:not(.moved){
      left:50%; top:auto; bottom:34px;
      transform:translateX(-50%);
    }

    /* the middle button carries a stack of tools */
    .face-stack{
      position:relative;
      display:block;
      width:16px; height:16px;
      overflow:hidden;
    }
    .face-stack .face{
      position:absolute;
      inset:0;
      width:16px; height:16px;
      opacity:0;
      transform:translateY(120%);
      transition:opacity .26s cubic-bezier(.4,0,.2,1), transform .3s cubic-bezier(.4,0,.2,1);
    }
    .face-stack .face.is-on{ opacity:1; transform:translateY(0); }
    .face-stack .face.is-out{ opacity:0; transform:translateY(-120%); }
    /* the periodic reminder that this button carries more than one tool */
    #dockExplore.hinting .face.is-on{ animation:faceHint .9s cubic-bezier(.4,0,.2,1); }
    @keyframes faceHint{
      0%,100%{ opacity:1; transform:translateY(0); }
      30%    { opacity:.25; transform:translateY(-22%); }
      60%    { opacity:1;   transform:translateY(0); }
    }

    /* tools living inside the dock's own search bar */
    .dq-tool{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:26px; height:28px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:transparent;
      border:none;
      padding:0;
      cursor:pointer;
      opacity:0;
      pointer-events:none;
      transition:opacity .26s cubic-bezier(.4,0,.2,1);
      z-index:4;
    }
    .dghost{
      position:absolute;
      inset:0;
      z-index:1;
      display:flex;
      align-items:center;
      padding:0 96px 0 42px;
      font-family:var(--font);
      font-size:12px;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:#bbb;
      pointer-events:none;
      white-space:nowrap;
      overflow:hidden;
      opacity:0;
      transition:opacity .2s cubic-bezier(.4,0,.2,1);
      -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 112px), transparent calc(100% - 92px));
              mask-image:linear-gradient(to right, #000 calc(100% - 112px), transparent calc(100% - 92px));
    }
    #dock.open .dghost{ opacity:1; }
    .dghost[hidden]{ display:none; }

    #dqFlag{ right:64px; }
    #dqExplore{ right:36px; }
    #dock.open .dq-tool{ opacity:1; pointer-events:auto; }
    #dqFlag img{ display:block; height:12px; width:auto; filter:grayscale(1) contrast(1000%) opacity(.35); transition:filter .3s cubic-bezier(.4,0,.2,1); }
    #dqFlag[aria-pressed="true"] img{ filter:grayscale(1) contrast(1000%); }
    /* Grey while the list holds the page, black while the field does — the
       same reading the flag beside it already gets. It was black in both,
       so in list view the glyph for the other view was the brightest thing
       in the bar. */
    #dqExplore img{
      display:block; width:13px; height:13px;
      filter:grayscale(1) contrast(1000%) opacity(.35);
      transition:filter .3s cubic-bezier(.4,0,.2,1);
    }
    body.exploring #dqExplore img{ filter:grayscale(1) contrast(1000%); }

    /* ---------- CLOSING A RECORD ----------
       Four beats, in this order:

         1. the record and the garment contract and slide up UNDER the tab's
            own header — the header is a lid, and they go beneath it
         2. at the same time the header, now holding nothing, travels down to
            the middle of the screen
         3. it closes from both ends into nothing
         4. and the field comes back around the garment that was chosen

       What was here before ran the opening backwards, which read as a cut to
       a half-shut tab, a header scrolling away, and the garment blinking in.
       Nothing is reversed now; this is its own movement. */

    /* The open state, declared FIRST so the closing state below it wins on
       source order — the two have the same specificity, and with this one
       last the body simply never collapsed. */
    body.single-result .nation > .nbody{
      max-height:2000px;
      transition:max-height .46s cubic-bezier(.4,0,.2,1),
                 opacity .3s cubic-bezier(.4,0,.2,1),
                 transform .46s cubic-bezier(.4,0,.2,1);
    }

    /* 1. the body goes under the lid, and it is ALL the way under before
       anything else happens. The travel used to begin at .18s, with a third
       of a second of the collapse still to run — so what crossed the screen
       was the header rule and the tab's bottom border with a closing gap
       between them, which reads as two rectangles rather than as one tab
       shutting. */
    body.solo-closing .nation > .nbody{
      overflow:hidden;
      max-height:0;
      /* The padding has to go as well. max-height clips what is INSIDE the
         box; the box's own 18 and 22 pixels are not content and survive it,
         so the body shut to forty empty pixels rather than to nothing and
         the tab kept an empty strip under its header rule. That strip, with
         the tab's bottom border under it, is the second rectangle. */
      padding-top:0;
      padding-bottom:0;
      opacity:0;
      transform:translateY(-14px) scale(.96);
      transform-origin:top center;
      transition:max-height .3s cubic-bezier(.4,0,.2,1),
                 padding-top .3s cubic-bezier(.4,0,.2,1),
                 padding-bottom .3s cubic-bezier(.4,0,.2,1),
                 opacity .2s cubic-bezier(.4,0,.2,1),
                 transform .3s cubic-bezier(.4,0,.2,1);
    }
    /* And the header's own rule goes with it. Once the body has gone that
       rule and the tab's bottom border are a pixel and a half apart — the
       same two-lines-pretending-to-be-one that the top edge already has to
       be protected from. One box, one outline, one name inside it. */
    body.solo-closing .nation[open] > summary{
      border-bottom-color:transparent;
      transition:border-bottom-color .2s cubic-bezier(.4,0,.2,1) .12s;
    }

    /* 2. the lid — by now a single closed box with the name in it —
       travels to the middle of the screen */
    /* the one step that is placed rather than travelled — see setLidDrop */
    body.solo-closing .nation.lid-snap{ transition:none !important; }
    body.solo-closing .nation{
      transform:translateY(var(--lid-drop, 0px));
      /* No delay. The travel used to be held back by .32s of CSS so the fold
         could finish first; now that the distance is measured at the end of
         the fold, setting it is what starts the travel — and a delay on top
         of that simply restarted the clock and ate the pause at the other
         end. One owner of the timing, and it is the script. */
      transition:transform .42s cubic-bezier(.4,0,.2,1);
      will-change:transform;
    }

    /* 3. and closes from both ends */
    body.solo-shutting .nation{
      transform:translateY(var(--lid-drop, 0px)) scaleX(0);
      opacity:0;
      transition:transform .42s cubic-bezier(.6,0,.3,1),
                 opacity .3s cubic-bezier(.4,0,.2,1) .16s;
    }
    body.solo-shutting .nation > summary{ opacity:0; transition:opacity .22s cubic-bezier(.4,0,.2,1); }

    /* The field fades up OVER the page, so for the length of that fade
       whatever is underneath shows through it. On the way out of a record
       that is the whole list: the filter() that clears the record rebuilds
       every card, and setBrowsing's fold-away runs on its own timer after.
       A screenful of garments appeared behind the fade and was then folded
       up — the flash on the way out, and the flicker chasing it. Nothing
       behind the fade is meant to be read, so nothing behind it is shown. */
    body.field-returning #catalogue{ visibility:hidden; }

    /* 4. the field returns, and the garment it returns to is already lit */
    #explore.ex-returning{ animation:ex-return .5s cubic-bezier(.4,0,.2,1) both; }
    @keyframes ex-return{ from{ opacity:0; } to{ opacity:1; } }

    @media (prefers-reduced-motion:reduce){
      body.solo-closing .nation,
      body.solo-closing .nation > .nbody,
      body.solo-shutting .nation{ transition:none; }
      #explore.ex-returning{ animation:none; }
    }

    /* ---------- THE FIELD, ARRIVING ----------
       Held back rather than assembled in public: every garment greyed and
       softened until the last photograph has landed, so what the reader
       sees is one field appearing at once rather than seventy of them
       arriving in whatever order the network chose. */
    #spiral.sp-waiting .sp-item{
      filter:grayscale(1) blur(9px) opacity(.22);
      transition:filter .9s cubic-bezier(.4,0,.2,1);
      pointer-events:none;
    }
    /* Blur alone still shows the shapes, and shapes resolving one by one is
       the thing being hidden. A halftone laid over the field breaks what is
       left into dots — the garments read as a printed ground rather than as
       photographs part-way in. It is drawn, not loaded: a repeating radial
       gradient costs nothing and scales to any screen. */
    /* Over the whole viewport, not over the spiral. The spiral is scaled and
       panned, so a screen laid inside it is scaled with it — at the zoom the
       field opens on, its edges fell inside the screen and the garments
       nearest the rim stayed sharp. This one is fixed to the glass and
       covers it whatever the field is doing underneath. */
    body.gated #explore::after{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background-image:radial-gradient(circle at center, var(--bg) 0 38%, transparent 40%);
      /* The screen this is printed at. 6px was a coarse halftone and the
         garments read through it as shapes; 3.75 was finer and still read as
         a pattern in its own right. At 2.25 the cell is under two device
         pixels on a retina screen, which is the point at which the eye stops
         counting dots and sees a ground — seventy-five photographs behind a
         printed veil rather than seventy-five photographs behind a grid. */
      background-size:2.25px 2.25px;
      opacity:.95;
      z-index:3;
    }
    #spiral .sp-item{ transition:opacity .34s cubic-bezier(.4,0,.2,1), filter .9s cubic-bezier(.4,0,.2,1); }

    /* display:flex beats the [hidden] attribute — the element selector wins
       over the browser's own [hidden]{display:none}. Without this, setting
       .hidden did nothing: the sheet stayed over the page, and once it took
       pointer events it swallowed every press meant for a garment. */
    #reveal[hidden]{ display:none !important; }
    #reveal{
      position:fixed;
      inset:0;
      z-index:60;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:14px;
      pointer-events:none;
    }
    #revealBtn{
      border:0;
      background:none;
      padding:10px;
      line-height:0;
      cursor:default;
      pointer-events:none;
      -webkit-tap-highlight-color:transparent;
    }
    /* header and footer scale — it is a mark, not a splash screen */
    #revealBtn svg{ height:17px; width:auto; display:block; overflow:visible; }
    .rev-trace{
      fill:none;
      /* the page's black, not the softer ink — this mark is the one thing
         on screen while the field arrives, and it should read as solidly
         as it will when it fills */
      stroke:var(--line);
      /* Stroke width is in user units, so the box scales it. The wordmark
         drew .35 in a 32-unit box at this height; 2.7 in the compass's
         104-unit box is the same hairline on screen. Mitred, so the star's
         eight points stay sharp while the line is still being drawn. */
      stroke-width:2.7;
      stroke-linejoin:miter;
      stroke-miterlimit:10;
    }
    .rev-fill{
      fill:var(--line);
      stroke:none;
      opacity:0;
      transition:opacity .5s cubic-bezier(.4,0,.2,1);
    }
    /* the mark draws itself for as long as the photographs are landing */
    #reveal.drawing .rev-trace{ animation:rev-draw 2.2s ease-in-out infinite; }
    /* It draws and holds. The old last frame faded it to a quarter, which
       is what made the mark look grey until something was hovered over. */
    @keyframes rev-draw{
      0%   { stroke-dashoffset:var(--rev-len); opacity:1; }
      55%  { stroke-dashoffset:0; opacity:1; }
      100% { stroke-dashoffset:0; opacity:1; }
    }
    /* Landed: it fills, in the page's own black rather than the softer ink
       the outline is drawn in. Grey said "still working"; this says "press
       me", which is the only thing left to do. */
    #reveal.ready .rev-trace{ animation:none; opacity:0; transition:opacity .4s cubic-bezier(.4,0,.2,1); }
    #reveal.ready .rev-fill{ opacity:1; }
    /* The whole sheet takes the press once the field is in, not just the
       mark. The mark is what SAYS press me; making it the only thing that
       can be pressed left the click landing on the overlay behind it — the
       press and the release resolved to different elements and the browser
       handed the click to their common ancestor, which was the explore
       overlay. A target that spans the screen cannot be missed. */
    #reveal.ready{ pointer-events:auto; cursor:pointer; }
    #reveal.ready #revealBtn{ cursor:pointer; pointer-events:none; }
    /* There was a hover dim here, and it was why the filled mark read grey.
       The sheet that takes the press spans the whole screen, so the pointer
       is inside it from the moment the field lands — :hover was on
       permanently, and the mark only went black when the cursor left the
       page altogether. The mark is black once it is filled and stays that
       way; the sheet being pressable is said by the cursor, not by fading
       the one thing the reader is looking at. */
    #reveal.going{ opacity:0; transition:opacity .5s cubic-bezier(.4,0,.2,1); }

    /* The bar is not usable while the field is still coming: typing into a
       search that cannot show you what it finds is a dead end. It greys out
       with the garments and comes back with them. The circle in the middle
       is the exception — it is the other key to the gate, so it stays live. */
    body.gated #dockSearch,
    body.gated #dockLibrary{
      opacity:.32;
      pointer-events:none;
    }
    body.gated #dock{ transition:opacity .4s cubic-bezier(.4,0,.2,1); }
    @media (prefers-reduced-motion:reduce){
      #reveal.drawing .rev-trace{ animation:none; }
      #spiral.sp-waiting .sp-item{ filter:grayscale(1) opacity(.3); }
    }

    /* ---------- LABEL SUGGESTION ----------
       The archive answers to four things and four only: nation, division,
       date and garment type. Rather than leave anyone guessing at that, the
       bar offers the label it thinks is being reached for — in grey, off to
       the side of the tools — and fills it in if it is taken. */
    .dq-hint{
      position:absolute;
      right:96px; top:50%;
      transform:translateY(-50%);
      max-width:180px;
      display:flex;
      align-items:baseline;
      gap:6px;
      padding:4px 9px;
      background:var(--faint);
      border:1.5px solid #dcdcdc;
      color:#9a9a9a;
      font-family:var(--font);
      font-size:10px;
      letter-spacing:.09em;
      text-transform:uppercase;
      white-space:nowrap;
      overflow:hidden;
      cursor:pointer;
      opacity:0;
      pointer-events:none;
      transition:opacity .26s cubic-bezier(.4,0,.2,1), color .22s cubic-bezier(.4,0,.2,1), border-color .22s cubic-bezier(.4,0,.2,1);
      z-index:5;
    }
    #dock.open .dq-hint.on{ opacity:1; pointer-events:auto; }

    /* ---------- EVERY CLUSTER THE TYPING ANSWERS ----------
       Stacked above the bar and hung off its right-hand end, under the chip
       that names the first of them. Pressing one is the choosing — the same
       act the chip performs, so nothing here asks to be agreed with twice. */
    .dq-picks{
      position:absolute;
      /* the two dock squares and their gaps, so the stack's right-hand edge
         lands on the search bar's own */
      right:112px; bottom:calc(100% + 10px);
      display:flex;
      flex-direction:column;
      align-items:stretch;
      gap:6px;
      opacity:0;
      pointer-events:none;
      transition:opacity .26s cubic-bezier(.4,0,.2,1);
      z-index:6;
    }
    #dock.open .dq-picks.on{ opacity:1; pointer-events:auto; }
    .dq-pick{
      display:flex;
      align-items:baseline;
      gap:8px;
      padding:5px 10px;
      background:var(--bg);
      border:1.5px solid var(--line);
      color:var(--ink);
      font-family:var(--font);
      font-size:10px;
      letter-spacing:.09em;
      text-transform:uppercase;
      white-space:nowrap;
      cursor:pointer;
      text-align:left;
      transition:background-color .22s cubic-bezier(.4,0,.2,1), color .22s cubic-bezier(.4,0,.2,1);
    }
    .dq-pick:hover{ background:var(--ink); color:var(--bg); }
    .dq-pick .dp-kind{ font-size:9px; color:#b0b0b0; flex:none; }
    .dq-pick:hover .dp-kind{ color:#9a9a9a; }
    .dq-pick .dp-n{ margin-left:auto; font-size:9px; color:#b0b0b0; flex:none; }
    .dq-pick:hover .dp-n{ color:#9a9a9a; }
    @media (max-width:640px){
      .dq-picks{ gap:4px; }
      .dq-pick{ font-size:9px; padding:4px 8px; }
    }
    @media (prefers-reduced-motion:reduce){ .dq-picks{ transition:none; } }
    .dq-hint:hover{ color:var(--ink); border-color:var(--line); }
    .dq-hint .dh-kind{ font-size:9px; color:#c4c4c4; flex:none; }
    .dq-hint .dh-text{ overflow:hidden; text-overflow:ellipsis; }
    /* the input gives up the room rather than running underneath the chip */
    #dockSearch.has-hint #dq{ padding-right:290px; }

    .dock-sq{
      flex:none;
      width:46px;
      height:46px;
      background:var(--line);
      border:1.5px solid var(--line);
      border-radius:0;              /* sharp edges */
      padding:0;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    #dockSearch{
      position:relative;
      overflow:hidden;
      justify-content:flex-start;
      transition:width .42s cubic-bezier(.65,0,.35,1),
                 background-color .34s cubic-bezier(.4,0,.2,1),
                 opacity .5s cubic-bezier(.4,0,.2,1);
    }
    /* the two tools come out from behind the bar's right edge as it opens */
    #dockExplore, #dockLibrary{
      transition:opacity .34s cubic-bezier(.4,0,.2,1) .2s,
                 transform .44s cubic-bezier(.65,0,.35,1) .2s;
    }

    /* opened: fills the bar width less the arrow square and its gap */
    #dock.open #dockSearch{
      width:calc(var(--dock-w) - 112px);   /* two 46px buttons + two 10px gaps */
      background:var(--bg);
      cursor:text;
    }

    #dockSearch .ico{
      position:absolute;
      left:14px;
      width:16px; height:16px;
      display:block;
      transition:opacity .3s cubic-bezier(.4,0,.2,1);
    }
    #dockSearch .ico-b{ opacity:0; }
    #dock.open #dockSearch .ico-w{ opacity:0; }
    #dock.open #dockSearch .ico-b{ opacity:1; }

    #dq{
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      font-family:var(--font);
      font-size:12px;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:var(--ink);
      padding:0 96px 0 42px;   /* room for flag, explore and the ✕ */
      border-radius:0;
      -webkit-appearance:none;
      opacity:0;
      pointer-events:none;
      transition:opacity .26s cubic-bezier(.4,0,.2,1);
    }
    #dq::placeholder{ color:#aaa; }
    #dock.open #dq{ opacity:1; pointer-events:auto; }

    #dockClear{
      position:absolute;
      right:8px; top:50%;
      transform:translateY(-50%);
      width:28px; height:28px;
      border:none;
      background:transparent;
      color:#c4c4c4;               /* deliberately faded */
      font-size:13px;
      line-height:1;
      cursor:pointer;
      opacity:0;
      pointer-events:none;
      transition:opacity .26s cubic-bezier(.4,0,.2,1), color .2s cubic-bezier(.4,0,.2,1);
    }
    #dock.open #dockClear{ opacity:1; pointer-events:auto; }
    #dockClear:hover{ color:var(--ink); }

    #dockLibrary{ color:#fff; }
    #dockLibrary .bm{ width:16px; height:16px; }
    #dockLibrary[aria-pressed="true"] .bm{ fill:#fff; }

    @media (max-width:640px){
      /* 34, not 16. The stamp under the bar is fixed at bottom:10 and the
         bar was sitting on top of it on a phone — the one line that says
         what this page is, printed underneath the bar and then covered by
         it. One height on every screen, and the line is clear. */
      #dock{ bottom:34px; --dock-w:min(94vw, 880px); }
      /* the narrow bar cannot spare 180px, so the chip shrinks with it */
      .dq-hint{ max-width:104px; font-size:9px; padding:3px 7px; gap:4px; }
      #dockSearch.has-hint #dq{ padding-right:212px; }

      /* the suggestion is long and the phone is narrow: shrink it and
         fade it out before it reaches the flag and the star */
      .search input, .search .ghost{
        font-size:10px;
        letter-spacing:.04em;
        padding-right:78px;
      }
    }

    /* The shelf arriving in the list. It used to rise from underneath, which
       read as something being pushed up into the page. It draws DOWN out of
       the tab above it instead — the Operations box's own move, where the
       box unfolds from its top edge and the contents arrive in the room it
       has made. The whole page has one gesture for a box opening; this is
       now part of it. */
    #savedTab.rising{
      animation:saved-rise .52s cubic-bezier(.4,0,.2,1) both;
    }
    /* And nothing else. The shelf is a .nation like any other, so body.browsing
       was dealing it in with toppleIn as well — and because .rising is taken
       off after half a second, the animation name changed at that moment from
       saved-rise to toppleIn and the tab arrived a second time. It has its own
       way in; it does not also get the tabs'. */
    body.browsing #savedTab:not(.rising){ animation:none; }
    @keyframes saved-rise{
      from { opacity:0; transform:scaleY(.34) translateY(-10px); }
      to   { opacity:1; transform:none; }
    }
    #savedTab.rising{ transform-origin:top center; }
    @media (prefers-reduced-motion:reduce){
      #savedTab.rising{ animation:none; }
    }

    /* Arriving in the list on one garment. Not a highlight colour — the
       archive has no colour to spend — but the card's own rule brought up to
       full strength and let go again, which is the same gesture the tabs use
       to say "this one". Long enough to find it, short enough not to sit
       there asking to be dismissed. */
    .item.landed{ animation:landed 1.6s cubic-bezier(.4,0,.2,1) both; }
    @keyframes landed{
      0%   { background:var(--faint); }
      45%  { background:var(--faint); }
      100% { background:var(--bg); }
    }
    @media (prefers-reduced-motion:reduce){
      .item.landed{ animation:none; }
    }

    /* ---------- GROUPING A NATION'S GARMENTS ----------
       Opens on all of them in one run, with a plus offering the three ways
       they can be split. The plus slides aside and becomes a minus while
       the choices are out, so the control reads as a thing that has opened
       rather than a thing that has changed. */
    /* One line of type, all of it sitting on one baseline: the word, the
       choices and the sign are the same row of writing rather than a label
       with a control parked next to it. align-items:baseline is what does
       it — centring boxes of three different heights left the sign riding
       above the word it belongs to.

       Nothing is positioned by transform any more. The choices live between
       the word and the sign in the document itself, and they open by taking
       up room: the sign is pushed along by the row growing under it rather
       than being flown to a measured coordinate. The gap before it is the
       row's own gap whether the choices are out or not. */
    .facet-bar{
      display:flex;
      align-items:baseline;
      gap:0;
      padding:2px 2px 8px;
    }
    .facet-title{
      font-size:9.5px;
      letter-spacing:.2em;
      text-transform:uppercase;
      color:#9a9a9a;
      margin-right:var(--facet-gap);
      transition:color .3s cubic-bezier(.4,0,.2,1);
    }
    .facet-bar.on .facet-title{ color:var(--ink); }

    .facet-toggle{
      display:inline-flex;
      align-items:baseline;
      padding:0;
      border:none;
      background:none;
      cursor:pointer;
      color:#c4c4c4;
      font-family:var(--font);
      font-size:13px;
      line-height:1;
      transition:color .3s cubic-bezier(.4,0,.2,1);
    }
    .facet-toggle:hover{ color:var(--ink); }
    .facet-bar.on .facet-toggle{ color:var(--ink); }

    /* The well the choices come out of. Its width carries the trailing gap
       as well as the choices, so closed it is nothing at all and the sign
       sits one gap from the word; open it is the choices plus one gap and
       the sign sits one gap from the last of them. One number, measured
       once, and the spacing is right at both ends of the run. */
    .facet-opts{
      display:flex;
      align-items:baseline;
      gap:14px;
      width:0;
      overflow:hidden;
      opacity:0;
      transition:width .44s cubic-bezier(.4,0,.2,1), opacity .3s cubic-bezier(.4,0,.2,1);
    }
    .facet-opts[hidden]{ display:none; }
    .facet-bar.on .facet-opts{ width:var(--facet-w, 0px); opacity:1; }

    .facet-opt{
      padding:0;
      border:none;
      background:none;
      cursor:pointer;
      flex:none;                 /* never squeezed while the well is narrow */
      white-space:nowrap;
      font-family:var(--font);
      font-size:9.5px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:#9a9a9a;
      transition:color .25s cubic-bezier(.4,0,.2,1);
    }
    .facet-opt:hover{ color:var(--ink); }
    .facet-opt[aria-pressed="true"]{ color:var(--ink); text-decoration:underline; text-underline-offset:3px; }
    .facet-reset{ color:#c4c4c4; }

    @media (prefers-reduced-motion:reduce){
      .facet-toggle, .facet-opts{ transition:none; }
    }
    /* the one gap the row is spaced on, named once */
    .facet-bar{ --facet-gap:12px; }

    /* ---------- THE COLLECTION'S DOOR ---------- */
    #joinGate{
      position:fixed;
      inset:0;
      z-index:140;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.55);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      opacity:0;
      transition:opacity .4s cubic-bezier(.4,0,.2,1);
    }
    #joinGate[hidden]{ display:none !important; }
    #joinGate.on{ opacity:1; }

    .jg-panel{
      position:relative;
      width:min(88vw, 420px);
      background:var(--bg);
      border:1.5px solid var(--line);
      padding:34px 30px 26px;
      text-align:center;
      transform:translateY(8px);
      transition:transform .45s cubic-bezier(.4,0,.2,1);
    }
    #joinGate.on .jg-panel{ transform:none; }

    .jg-lede{
      font-size:12.5px;
      letter-spacing:.02em;
      min-height:1.4em;
      margin-bottom:16px;
    }
    /* the grey field the address slides out of, as on the home page */
    .jg-slide{
      display:block;
      width:100%;
      background:var(--faint);
      border:1.5px solid var(--faint);
      transition:border-color .3s cubic-bezier(.4,0,.2,1);
    }
    .jg-slide:focus-within{ border-color:var(--line); }
    #jgInput{
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      font-family:var(--font);
      font-size:11.5px;
      letter-spacing:.04em;
      color:var(--ink);
      text-align:center;
      padding:9px 8px;
      border-radius:0;
      -webkit-appearance:none;
    }
    .jg-send{
      display:block;
      width:100%;
      margin-top:12px;
      padding:9px 0;
      font-family:var(--font);
      font-size:9.5px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--bg);
      background:var(--line);
      border:1.5px solid var(--line);
      cursor:pointer;
      transition:opacity .3s cubic-bezier(.4,0,.2,1);
    }
    .jg-send:hover{ opacity:.78; }
    .jg-send[disabled]{ opacity:.45; cursor:default; }
    .jg-msg{
      margin-top:10px;
      font-size:9.5px;
      letter-spacing:.08em;
      line-height:1.5;
      color:#888;
      min-height:1.3em;
    }
    .jg-close{
      position:absolute;
      top:8px; right:10px;
      border:none;
      background:none;
      font-size:13px;
      line-height:1;
      color:#c4c4c4;
      cursor:pointer;
      padding:6px;
    }
    .jg-close:hover{ color:var(--ink); }
    @media (prefers-reduced-motion:reduce){
      #joinGate, .jg-panel{ transition:none; }
    }

    /* ---------- NO DATA SAVED ----------
       A white plate on a black rule that lifts into the middle of the page,
       holds long enough to be read, and takes itself away. It never takes
       the pointer: whatever the reader was doing carries on underneath. */
    #noData{
      position:fixed;
      left:50%; top:50%;
      transform:translate(-50%, calc(-50% + 10px));
      z-index:130;
      /* a note, not an announcement — it was carrying the weight of a
         dialogue for a sentence that says there is nothing to show */
      padding:13px 20px;
      background:var(--bg);
      border:1.5px solid var(--line);
      font-size:10px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--ink);
      white-space:nowrap;
      pointer-events:none;
      opacity:0;
      transition:opacity .3s cubic-bezier(.4,0,.2,1), transform .42s cubic-bezier(.4,0,.2,1);
    }
    #noData.show{
      opacity:1;
      transform:translate(-50%, -50%);
    }
    @media (prefers-reduced-motion:reduce){
      #noData{ transition:opacity .2s cubic-bezier(.4,0,.2,1); }
      #noData, #noData.show{ transform:translate(-50%, -50%); }
    }
