  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "@id": "https://britishmaterialunit.com/archive#catalogue",
    "name": "BMU Archive",
    "url": "https://britishmaterialunit.com/archive",
    "description": "Archive of British military surplus.",
    "isPartOf": { "@id": "https://britishmaterialunit.com/#website" }
  }
  </script>

  <style>
    :root{
      --ink:#222222;
      --line:#000000;
      --bg:#ffffff;
      --faint:#f0f0f0;
      --font:Helvetica, Arial, sans-serif;
    }
    *{ box-sizing:border-box; }
    /* The record is taller than the field, so a scrollbar arrives with it
       and takes 15px off the viewport — every centred thing on the page
       steps left at that moment. Reserving the gutter from the start means
       nothing moves when it appears. This is the sideways shift between the
       box closing and the tab forming. */
    html{ scrollbar-gutter:stable; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:var(--font);
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      align-items:center;
      /* top pad clears the fixed header, not just the edge of the page */
      padding:66px 16px 150px;
      -webkit-font-smoothing:antialiased;
    }
    /* auto margins centre the archive in the viewport when it is short
       (all tabs shut) and simply collapse once it outgrows the screen —
       unlike justify-content:center, this never clips the top */
    .wrap{ width:min(94vw, 880px); margin:auto 0; }

    /* ---------- fixed bottom bar ----------
       On arrival the archive is only this: a search bar and its footer
       line. Tabs, explore and the dock are all summoned from here. */
    /* the page's own line, under everything */
    #foot{
      position:fixed;
      left:0; right:0;
      bottom:10px;
      text-align:center;
      /* Above the explore overlay, which is a full-screen white ground and
         was simply painting over it — the line is the page's own signature
         and belongs under the bar in every view, not only the ones where
         nothing happens to be covering it. Still below the dock. */
      z-index:65;
      pointer-events:none;
    }

    /* the catalogue only exists once the reader asks for it */
    #shell{ display:none; }
    body.browsing #shell{ display:block; }
    body.library #catalogue{ display:none; }
    #savedTab .bm{ width:16px; height:16px; flex:none; fill:currentColor; stroke:currentColor; }

    /* the empty page asks a question rather than sitting blank */
    #prompt{
      position:fixed;
      left:50%; top:46%;
      transform:translate(-50%, -50%);
      z-index:20;
      font-size:15px;
      letter-spacing:.04em;
      color:#999;
      white-space:nowrap;
      pointer-events:none;
      transition:opacity .4s ease;
    }
    body.browsing #prompt, body.exploring #prompt{ opacity:0; }
    /* the plate answers the same question the prompt is asking, in the
       same place — the prompt stands down rather than showing through it */
    body.no-data #prompt{ opacity:0; }

    /* ---------- search ---------- */
    .search{
      position:relative;
      margin-bottom:0;
    }
    .search input{
      width:100%;
      font-family:var(--font);
      font-size:12px;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:var(--ink);
      background:transparent;
      border:1.5px solid var(--line);
      padding:13px 68px 13px 42px;
      outline:none;
      border-radius:0;
      -webkit-appearance:none;
      position:relative;
      z-index:2;
    }
    /* the live suggestion sits behind the input, so the real placeholder
       must stay invisible — the input itself is transparent */
    .search input::placeholder{ color:transparent; }
    /* kill the browser's own clear button so only our grey ✕ remains */
    .search input::-webkit-search-cancel-button,
    .search input::-webkit-search-decoration,
    #dq::-webkit-search-cancel-button,
    #dq::-webkit-search-decoration{
      -webkit-appearance:none;
              appearance:none;
      display:none;
    }
    .search input:focus{ background:var(--faint); }

    .search .icon{
      position:absolute;
      top:50%; left:14px;
      transform:translateY(-50%);
      width:16px; height:16px;
      z-index:3;
      pointer-events:none;
      display:block;
    }

    /* typed suggestion — mirrors the input's metrics exactly so the
       text lands on the same baseline as anything the user types */
    .search .ghost{
      position:absolute;
      top:0; left:0; right:0; bottom:0;
      z-index:1;
      display:flex;
      align-items:center;
      padding:13px 68px 13px 42px;
      font-family:var(--font);
      font-size:12px;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:#aaa;
      pointer-events:none;
      white-space:nowrap;
      overflow:hidden;
    }
    .search .ghost[hidden]{ display:none; }
    /* the suggestion dissolves as it runs up on the icons rather than
       being sliced off by them */
    .search .ghost{
      transition:opacity .18s linear;
      -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 86px), transparent calc(100% - 62px));
              mask-image:linear-gradient(to right, #000 calc(100% - 86px), transparent calc(100% - 62px));
    }
    .search .ghost .caret{
      display:inline-block;
      width:1px;
      height:1.05em;
      margin-left:2px;
      background:#aaa;
      vertical-align:middle;
    }
    .search .ghost .caret.blink{ animation:caret 1s steps(1,end) infinite; }
    @keyframes caret{ 0%,50%{ opacity:1; } 50.01%,100%{ opacity:0; } }
    @media (prefers-reduced-motion:reduce){
      .search .ghost .caret.blink{ animation:none; }
    }
    /* the ✕ and the navigate star share one slot and cross-fade:
       star while the field is empty, ✕ once there is a term */
    /* the flag sits immediately left of the navigate mark, greyed until
       it is doing something */
    .search .flagtoggle{
      position:absolute;
      top:50%; right:36px;
      transform:translateY(-50%);
      width:26px; height:28px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:transparent;
      border:none;
      padding:0;
      cursor:pointer;
      z-index:3;
    }
    /* contrast past the pivot turns the red and blue solid black while
       the white field stays white — no colour in the furniture */
    .search .flagtoggle img{
      display:block;
      height:12px; width:auto;
      filter:grayscale(1) contrast(1000%) opacity(.32);
      transition:filter .3s ease;
    }
    .search .flagtoggle:hover img{ filter:grayscale(1) contrast(1000%); }
    .search .flagtoggle[aria-pressed="true"] img{ filter:grayscale(1) contrast(1000%); }

    .search .clear,
    .search .navtoggle{
      position:absolute;
      top:50%; right:6px;
      transform:translateY(-50%);
      width:28px; height:28px;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:3;
      font-family:var(--font); font-size:13px; line-height:1;
      color:#888;
      background:transparent;
      border:none;
      padding:0;
      cursor:pointer;
      transition:opacity .28s ease, color .2s ease;
    }
    .search .clear:hover,
    .search .navtoggle:hover{ color:var(--ink); }
    .search .clear{ opacity:0; pointer-events:none; }
    .search.has-term .clear{ opacity:1; pointer-events:auto; }
    .search.has-term .navtoggle{ opacity:0; pointer-events:none; }
    .search .navtoggle img{
      display:block; width:13px; height:13px;
      opacity:.3;
      transition:opacity .3s ease;
    }
    .search .navtoggle:hover img{ opacity:.65; }
    .search .navtoggle[aria-pressed="true"] img{ opacity:1; }

    .count-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:26px;
    }
    /* The bookmark belongs to a garment that has been named. It was on
       screen from the first frame of the build — offering to keep something
       the reader had not been shown yet — so it waits for the tab to say
       what it is. */
    body.single-result.solo-build .count-row,
    body.single-result.solo-drawing .count-row{
      opacity:0;
      pointer-events:none;
    }
    /* A garment opened from the field is two boxes and nothing else: the tab
       and the record inside it. The tally and the shelf bookmark floating
       above them belonged to a list that is not on screen. The garment's own
       bookmark, inside the card, is untouched. */
    body.solo-from-field .count-row{ display:none; }
    body.single-result .count-row{ transition:opacity .45s ease; }
    #savedBtn{
      display:flex;
      align-items:center;
      gap:7px;
      background:transparent;
      border:none;
      padding:4px 2px;
      cursor:pointer;
      color:#bbb;
      font-family:var(--font);
      font-size:10px;
      letter-spacing:.16em;
      transition:color .3s ease;
    }
    #savedBtn:hover{ color:#777; }
    #savedBtn[aria-pressed="true"]{ color:var(--ink); }
    /* outline by default, filled once it holds something */
    .bm{
      display:block;
      fill:none;
      stroke:currentColor;
      stroke-width:1.4;
      stroke-linejoin:round;
      transition:fill .35s ease, transform .3s cubic-bezier(.3,1.6,.5,1);
    }
    [aria-pressed="true"] > .bm{ fill:currentColor; }
    .bm.pop{ animation:bmPop .45s cubic-bezier(.3,1.5,.5,1); }
    @keyframes bmPop{
      0%  { transform:scale(1); }
      45% { transform:scale(1.35); }
      100%{ transform:scale(1); }
    }

    .count{
      font-size:10px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:#888;
      min-height:1.2em;
    }

    /* ---------- nation dropdowns ---------- */
    .nation{
      border:1.5px solid var(--line);
      margin-bottom:10px;
      transform-origin:top center;
    }
    /* tabs topple in like pages falling flat, and fold back on the way out */
    body.browsing .nation{ animation:toppleIn .46s cubic-bezier(.2,.75,.3,1) backwards; }
    body.closing-tabs .nation{ animation:toppleOut .34s cubic-bezier(.5,0,.75,.4) forwards; }
    @keyframes toppleIn{
      from{ opacity:0; transform:perspective(760px) rotateX(-34deg) translateY(-16px); }
      to  { opacity:1; transform:none; }
    }
    @keyframes toppleOut{
      from{ opacity:1; transform:none; }
      to  { opacity:0; transform:perspective(760px) rotateX(-26deg) translateY(-12px); }
    }
    @media (prefers-reduced-motion:reduce){
      body.browsing .nation, body.closing-tabs .nation{ animation:none; }
    }
    .nation > summary{
      list-style:none;
      cursor:pointer;
      padding:14px 16px;
      display:flex;
      align-items:center;
      gap:12px;
      font-size:11px;
      letter-spacing:.18em;
      text-transform:uppercase;
      font-weight:bold;
      transition:background-color .3s ease;
    }
    .nation > summary::-webkit-details-marker{ display:none; }
    .nation > summary:hover{ background:var(--faint); }
    /* flag sits left of the nation name. Height is fixed and width is
       left to the image so each ensign keeps its true ratio — the UK's
       3:5 and the USA's 1.9:1 are not the same shape. */
    .nation > summary .flag{
      flex:none;
      height:13px;
      width:auto;
      max-width:26px;
      display:block;
    }
    /* the one nation we can't name gets an empty dashed slot */
    .nation > summary .flag.none{
      width:20px;
      height:13px;
      border:1px dashed rgba(0,0,0,.35);
      background:transparent;
    }
    .nation > summary .n{ flex:none; }
    .nation > summary .qty{
      flex:1;
      margin-left:-6px;          /* sits just after the name, not adrift */
      font-weight:normal;
      letter-spacing:.14em;
      color:#888;
    }
    .nation > summary .sign{
      flex:none;
      width:11px;
      text-align:right;
      color:#888;
      font-weight:bold;
    }
    .nation[open] > summary .sign::after{ content:"–"; }
    .nation:not([open]) > summary .sign::after{ content:"+"; }
    .nation[open] > summary{ border-bottom:1.5px solid var(--line); }
    .nbody{ padding:18px 16px 22px; }

    .section-label{
      margin:26px 0 14px;
      font-size:10px;
      letter-spacing:.18em;
      text-transform:uppercase;
      font-weight:bold;
      border-bottom:1.5px solid var(--line);
      padding-bottom:7px;
    }
    .group:first-child > .section-label{ margin-top:0; }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
      gap:14px;
    }
    .item{
      border:1.5px solid var(--line);
      background:var(--bg);
      display:flex;
      flex-direction:column;
      transition:background-color .3s ease;
    }
    .item:hover{ background:var(--faint); }
    /* .item sets display:flex, which outranks the UA rule for [hidden] —
       without this, filtered-out cards stay on screen */
    .item[hidden], .group[hidden], .nation[hidden]{ display:none !important; }
    .item .slot{
      aspect-ratio:1 / 1;
      border-bottom:1.5px solid var(--line);
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
    }
    .item .slot img{
      width:100%; height:100%;
      object-fit:cover; display:block;
    }
    .item .slot .pending{
      padding:8px;
      font-size:9.5px;
      letter-spacing:.06em;
      color:#aaa;
      text-align:center;
      word-break:break-all;
    }
    /* meta grows to fill the card so the action row can be pinned to the
       bottom — titles vary in length, the buttons must not */
    .item .meta{
      padding:10px 12px 12px;
      display:flex;
      flex-direction:column;
      flex:1;
    }
    .item .name{
      font-size:12px;
      font-weight:bold;
      line-height:1.4;
    }
    .name-row{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }
    .btn-save-inline{
      flex:none;
      background:transparent;
      border:none;
      padding:0;
      margin-top:1px;
      color:#c9c9c9;
      cursor:pointer;
      transition:color .3s ease;
    }
    .btn-save-inline:hover{ color:#888; }
    .btn-save-inline[aria-pressed="true"]{ color:var(--ink); }

    .item .tag{
      display:block;
      margin-top:4px;
      font-size:10px;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:#888;
    }
    .item .ref{
      display:block;
      margin-top:6px;
      font-size:9.5px;
      letter-spacing:.14em;
      color:#aaa;
    }

    /* ---------- a single garment, on its own ----------
       The card turns on its side so the record and the request form open
       beside the garment instead of pushing down below it. */
    body.single-result .section-label{ display:none; }
    body.single-result .item .tag{ display:none; }
    body.single-result .nation > summary .qty{ display:none; }
    /* .qty was the spacer holding the sign right; without it the sign
       collapsed against the title */
    body.single-result .nation > summary .n{ flex:1; }
    body.single-result .grid{
      grid-template-columns:1fr;
      justify-items:center;
    }
    body.single-result .item{
      flex-direction:row;
      width:min(94vw, 760px);
      align-items:stretch;
      transition:width .62s cubic-bezier(.4,0,.2,1);
    }
    body.single-result .item .slot{
      flex:0 0 46%;
      aspect-ratio:auto;
      border-bottom:none;
      border-right:1.5px solid var(--line);
      transition:flex-basis .62s cubic-bezier(.4,0,.2,1),
                 border-right-color .3s ease .28s;
    }
    body.single-result .item .meta{
      flex:1 1 auto;
      padding:16px 18px 18px;
      opacity:1;
      transition:opacity .42s ease .2s,
                 flex-basis .62s cubic-bezier(.4,0,.2,1);
    }

    /* a lone garment does not fold in — it is drawn, named, then shifted */
    body.single-result .nation{ animation:none !important; }

    /* The tab a garment sits in is furniture, not the garment. It used to be
       on screen before the garment was, which put a full-width shell around
       everything before a single line had been drawn — the outer box
       arriving first, which is exactly backwards. It now waits for its own
       moment: the two boxes are drawn, and then the tab and its name arrive
       together. */
    /* The tab does not appear, it arrives: the rule draws out from the
       centre of the row, and the flag and name come up under it a beat
       later. Switching it on with an opacity fade read as a box materialising
       around a garment that was already settled. */
    body.single-result .nation{
      /* The border is the resting state — a garment reached by searching the
         list has no build sequence to wait for, and stripping it by default
         left that tab with no outline at all. Only the build takes it away,
         and only for as long as the build runs.

         It FADES back rather than being switched on at the end of a delay.
         A .01s change after half a second is a skip however it is written:
         the rule draws across the top, and then the tab simply appears
         around it in one frame. Both now run over the same half second, so
         the drawing and the arriving are one movement. */
      border-color:var(--line);
      position:relative;
      transition:border-color .5s ease;
    }
    /* The rule that draws the tab in. It sits ON the tab's own top border
       and is the same weight, so at rest the two stack and read as one
       heavy line — which is the thick line above a solo garment. It exists
       only while the build is running and goes when the border takes over. */
    body.single-result .nation::before{
      content:"";
      position:absolute;
      /* sits ON the top edge, not above it — it is standing in for that
         border while it draws, not adding a second line over it */
      left:-1px; right:-1px; top:-1px;
      height:1px;
      background:var(--line);
      transform:scaleX(0);
      transform-origin:center;
      opacity:0;
      z-index:2;
    }
    body.single-result.solo-build .nation::before{
      opacity:1;
      transform:scaleX(0);
      transition:none;
    }
    body.single-result.solo-drawing .nation::before{
      opacity:1;
      transform:scaleX(1);
      transition:transform .54s cubic-bezier(.4,0,.2,1);
    }
    /* The rule hands over to the border, and for one frame between
       solo-drawing coming off and the border's own transition starting there
       was neither — the line blinked out at the top. It is held until the
       border has finished arriving, and only then goes. */
    body.single-result .nation::before{
      transition:opacity .01s linear .5s;
    }
    body.single-result .nation > summary{
      transition:opacity .5s ease .18s;
      transform:none;
    }
    body.single-result.solo-build .nation{
      border-color:transparent;
      transition:none;
    }
    /* Drawing: the three other edges fade up, but the TOP stays transparent
       for as long as the rule is crossing it. The rule and the border are
       the same line in the same place — both up at once is the thick line
       above the tab, not a heavier stroke but two of them. The top edge
       arrives only when the rule has finished and gone. */
    body.single-result.solo-drawing .nation{
      border-color:var(--line);
      border-top-color:transparent;
      transition:border-color .5s ease .12s;
    }
    body.single-result.solo-drawing .nation > summary{
      opacity:1;
      transform:none;
      transition:opacity .5s ease .2s;
    }

    body.single-result.solo-build .nation > summary{
      opacity:0;
      /* Held in place, not lifted. Moving the summary moved the row below it
         — the box the reader is watching being drawn stepped sideways and
         down at the exact moment the tab began. The tab arrives by fading;
         nothing it does changes the space it occupies. */
      transform:none;
      transition:none;
    }
    /* the tab has to be gone on the first frame, not fade out over half a
       second while the garment is trying to arrive — this is the same trick
       .no-anim plays on the card, held for one reflow */
    body.solo-snap .nation,
    body.solo-snap .nation::before,
    body.solo-snap .nation > summary{ transition:none !important; }

    /* the build state must arrive instantly, not animate into itself —
       otherwise the card visibly shrinks before it grows */
    /* Pseudo-elements are not matched by `*`, so the slot's divider line was
       the one thing in the card still animating on the way INTO the build:
       it retracted from full height to nothing every time a garment opened.
       That retracting line was the flicker. */
    body.single-result .item.no-anim,
    body.single-result .item.no-anim *,
    body.single-result .item.no-anim::before,
    body.single-result .item.no-anim::after,
    body.single-result .item.no-anim *::before,
    body.single-result .item.no-anim *::after{ transition:none !important; }

    /* First the garment stands alone in its own box, centred; only once
       the frame has drawn does it move aside and let the record in. */
    body.single-result .item.build{
      width:min(80vw, 520px);
      border-color:transparent;      /* nothing, until the line draws it */
    }
    /* once the line has closed, the card's own border takes over */
    body.single-result .item.build.framed{ border-color:var(--line); }
    body.single-result .item{ transition:width .62s cubic-bezier(.4,0,.2,1),
                                         border-color .32s ease; }
    body.single-result .item.build .slot{
      flex-basis:100%;
      aspect-ratio:1 / 1;
    }

    /* every edge is drawn rather than switched on */
    body.single-result .item{ border-color:var(--line); }
    body.single-result .item .slot{ position:relative; border-right:none; }
    body.single-result .item .slot::after{
      content:"";
      position:absolute;
      top:0; right:0; bottom:0;
      width:1.5px;
      background:var(--line);
      transform:scaleY(0);
      transform-origin:top center;
      transition:transform .5s cubic-bezier(.4,0,.2,1);
    }
    body.single-result .item:not(.build) .slot::after{ transform:scaleY(1); }

    body.single-result .item .actions .btn-line,
    body.single-result .item .req-send{
      clip-path:inset(0 100% 0 0);
      transition:clip-path .42s cubic-bezier(.4,0,.2,1);
    }
    body.single-result .item:not(.build) .actions .btn-line,
    body.single-result .item:not(.build) .req-send{ clip-path:inset(0 0 0 0); }
    body.single-result .item:not(.build) .actions .btn-line:nth-child(2){
      transition-delay:.1s;
    }
    body.single-result .item .name-row{
      clip-path:inset(0 100% 0 0);
      transition:clip-path .45s cubic-bezier(.4,0,.2,1) .06s;
    }
    body.single-result .item:not(.build) .name-row{ clip-path:inset(0 0 0 0); }
    body.single-result .item.build .meta{
      opacity:0;
      flex:0 0 0px;
      min-width:0;          /* content was holding a sliver open */
      padding-left:0;
      padding-right:0;
      overflow:hidden;
    }
    body.single-result .item .name{ font-size:14px; }
    body.single-result .item:hover{ background:var(--bg); }

    @media (max-width:640px){
      body.single-result .item{ flex-direction:column; width:100%; }
      body.single-result .item .slot{
        flex:none;
        aspect-ratio:1 / 1;
        border-right:none;
        border-bottom:1.5px solid var(--line);
      }
    }

    /* ---------- opening a garment's record ----------
       The garment arrives on its own. A line is then drawn tight around it,
       a second is drawn around the card that will hold it, and only then
       does the garment settle left and let its record in beside it.
       Reversed on the way out.

       Each frame is placed over the box it is drawing rather than stretched
       across the card, because for part of the sequence there are two of
       them on screen at once. */
    .solo-frame{
      position:absolute;
      left:0; top:0;
      pointer-events:none;
      overflow:visible;
      z-index:3;
    }
    .solo-frame rect{
      fill:none;
      stroke:var(--line);
      stroke-width:1.5;
    }
    body.single-result .item{ position:relative; }
    body.single-result .item.unbuild .meta{ animation:metaLeave .3s ease both; }
    @keyframes metaLeave{
      from{ opacity:1; transform:none; }
      to  { opacity:0; transform:translateX(14px); }
    }
    @media (prefers-reduced-motion:reduce){
      body.single-result .item.build .meta,
      body.single-result .item.build .slot,
      body.single-result .item.unbuild .meta{ animation:none; }
    }

    /* ---------- actions: always the last thing in the card ---------- */
    .actions{
      display:flex;
      gap:8px;
      margin-top:auto;          /* pins the row to the bottom of the card */
      padding-top:12px;
    }
    .btn-line{
      flex:1 1 0;
      min-width:0;
      padding:7px 0;
      font-family:var(--font);
      font-size:9.5px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--ink);
      background:var(--bg);
      border:1.5px solid var(--line);
      cursor:pointer;
      transition:background-color .3s ease, color .3s ease;
    }
    .btn-line:hover{ background:var(--faint); }
    .btn-save{
      flex:0 0 34px;
      padding:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--bg);
      border:1.5px solid var(--line);
      color:#c2c2c2;
      cursor:pointer;
      transition:color .3s ease, background-color .3s ease;
    }
    .btn-save:hover{ background:var(--faint); color:#888; }
    .btn-save[aria-pressed="true"]{ color:var(--ink); }

    .btn-line[hidden]{ display:none; }

    /* ---------- request ---------- */
    /* These used to be display:none toggled to block, which is a snap by
       definition — the panel and the card's whole height arrived in one
       frame. They slide instead: the row opens from nothing with the
       grid-rows trick (the one way to animate to a height you have not
       measured), and the content rides in from the right as it does.

       Out is the same move reversed, which is what makes it read as one
       panel going back and forth rather than two appearing and vanishing. */
    .req-panel, .info-panel{
      display:grid;
      grid-template-rows:0fr;
      margin-top:0;
      border-top:1.5px solid transparent;
      padding-top:0;
      transition:grid-template-rows .42s cubic-bezier(.4,0,.2,1),
                 margin-top .42s cubic-bezier(.4,0,.2,1),
                 padding-top .42s cubic-bezier(.4,0,.2,1),
                 border-top-color .3s ease;
    }
    .req-panel > *, .info-panel > *{
      min-height:0;                 /* the grid row has to be free to be 0 */
      overflow:hidden;
      opacity:0;
      transform:translateX(18px);
      transition:opacity .3s ease, transform .42s cubic-bezier(.4,0,.2,1);
    }
    .req-panel.open, .info-panel.open{
      grid-template-rows:1fr;
      margin-top:12px;
      border-top-color:var(--line);
      padding-top:12px;
    }
    .req-panel.open > *, .info-panel.open > *{
      opacity:1;
      transform:none;
      transition-delay:.12s;        /* the box opens first, then the content rides in */
    }
    @media (prefers-reduced-motion:reduce){
      .req-panel, .info-panel,
      .req-panel > *, .info-panel > *{ transition:none; }
    }

    .req-row label{
      display:block;
      margin-bottom:6px;
      font-size:9px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:#888;
    }
    /* Ten dots, thirty upwards in tens. Each fills as it is passed, so the
       row reads as a quantity rather than as ten separate switches. */
    .req-dots{
      display:flex;
      align-items:center;
      gap:7px;
      /* the chosen dot grows, and the panel it sits in clips its own
         overflow for the slide — the row is given the room to grow into
         rather than losing a third of the first circle to the edge */
      margin:3px 0 9px;
      padding:3px 4px;
    }
    .req-dot{
      width:11px; height:11px;
      flex:none;
      padding:0;
      border:1.5px solid #c9c9c9;
      border-radius:50%;
      background:transparent;
      cursor:pointer;
      transition:background-color .28s ease, border-color .28s ease, transform .28s cubic-bezier(.3,1.4,.5,1);
    }
    .req-dot:hover{ border-color:var(--line); }
    .req-dot.on{
      background:var(--line);
      border-color:var(--line);
    }
    /* the one just chosen lifts, so the eye follows the press */
    .req-dot.tip{ transform:scale(1.35); }

    .req-qty{ display:flex; align-items:center; gap:10px; }
    .req-qty .qtyval{
      flex:0 0 auto;
      font-size:13px;
      font-weight:bold;
      color:var(--ink);
      font-variant-numeric:tabular-nums;
    }
    .req-any{
      flex:1 1 auto;
      min-width:0;
      font-family:var(--font);
      font-size:10.5px;
      letter-spacing:.04em;
      color:var(--ink);
      background:transparent;
      border:none;
      border-bottom:1px solid #d8d8d8;
      padding:3px 2px;
      outline:none;
      border-radius:0;
      -webkit-appearance:none;
    }
    .req-any:focus{ border-bottom-color:var(--line); }
    /* no heading above it — the placeholder carries it */
    .req-email{
      display:block;
      width:100%;
      margin-top:12px;
      font-family:var(--font);
      font-size:11px;
      color:var(--ink);
      background:var(--bg);
      border:1.5px solid var(--line);
      padding:7px 8px;
      outline:none;
      border-radius:0;
      -webkit-appearance:none;
    }
    .req-email:focus{ background:var(--faint); }
    .req-send[disabled]{ opacity:.45; cursor:default; }
    /* a field no person ever sees, and no person ever fills in — anything
       that arrives with it filled is a bot, and is dropped */
    .req-hp{
      position:absolute;
      left:-9999px;
      width:1px; height:1px;
      opacity:0;
      pointer-events:none;
    }
    .req-msg.err{ color:var(--ink); }

    .req-send{
      display:block;
      width:100%;
      margin-top:12px;
      padding:8px 0;
      font-family:var(--font);
      font-size:9.5px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--bg);
      background:var(--line);
      border:1.5px solid var(--line);
      cursor:pointer;
      transition:opacity .3s ease;
    }
    .req-send:hover{ opacity:.78; }
    .req-msg{
      margin-top:8px;
      font-size:9.5px;
      letter-spacing:.08em;
      line-height:1.5;
      color:#888;
    }
    .req-msg:empty{ display:none; }

    .info-panel{
      font-size:10.5px;
      line-height:1.65;
      color:#555;
      white-space:pre-wrap;
    }

    /* ---------- empty state ---------- */
    .empty{
      border:1.5px solid var(--line);
      padding:22px 18px;
      text-align:center;
      overflow:hidden;              /* the reel is clipped by the box */
    }
    .empty[hidden]{ display:none; }

    .empty-line{
      font-size:11px;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:#888;
      min-height:1.2em;
    }
    /* the message falls away like a slot reel turning over */
    .empty-line.drop{ animation:slotdrop .46s cubic-bezier(.4,0,.2,1) forwards; }
    @keyframes slotdrop{
      to{ transform:translateY(30px); opacity:0; }
    }

    .flag-strip{
      margin-top:-18px;             /* takes the space the message vacated */
      opacity:0;
      transform:translateY(-24px);
    }
    .flag-strip[hidden]{ display:none; }
    .flag-strip.in{ animation:slotin .42s cubic-bezier(.3,0,.2,1) forwards; }
    @keyframes slotin{
      to{ opacity:1; transform:translateY(0); }
    }

    .flag-rail{
      display:flex;
      gap:22px;
      justify-content:safe center;   /* stays centred until it overflows */
      align-items:flex-start;
      overflow-x:auto;
      overscroll-behavior-x:contain; /* hard stop at each end, no chaining */
      scroll-snap-type:x proximity;
      padding:2px;
      scrollbar-width:none;
      -ms-overflow-style:none;
    }
    .flag-rail::-webkit-scrollbar{ display:none; }
    /* only once it actually overflows do the ends dissolve round the corner */
    .flag-rail.overflowing{
      -webkit-mask-image:linear-gradient(to right, transparent 0, #000 52px, #000 calc(100% - 52px), transparent 100%);
              mask-image:linear-gradient(to right, transparent 0, #000 52px, #000 calc(100% - 52px), transparent 100%);
    }

    .flag-pick{
      flex:none;
      scroll-snap-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:7px;
      padding:6px 4px;
      background:transparent;
      border:none;
      cursor:pointer;
      font-family:var(--font);
      opacity:.75;
      transition:opacity .25s ease, transform .25s ease;
    }
    .flag-pick:hover{ opacity:1; transform:translateY(-2px); }
    .flag-pick img{ height:20px; width:auto; display:block; }
    .flag-pick span{
      font-size:9px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:#888;
      white-space:nowrap;
    }
    /* closest match to what they mistyped */
    .flag-pick.suggested{ opacity:1; }
    .flag-pick.suggested span{ color:var(--ink); font-weight:bold; }

    .note{
      margin-top:40px;
      border:1.5px solid var(--line);
      padding:16px 18px;
      font-size:11.5px;
      line-height:1.6;
      color:#555;
    }
    .note b{ color:var(--ink); }

    nav.back{ margin-top:36px; text-align:center; }
    /* matches index.html's .bm-button metrics so the button that flies
       across the transition is the same object at both ends */
    .bm-button{
      display:inline-block;
      width:150px; height:40px; line-height:37px;
      font-family:var(--font); font-size:13px;
      color:#000; text-decoration:none;
      border:1.5px solid var(--line);
      background:var(--bg);
      cursor:pointer; text-align:center;
      white-space:nowrap;
      transition:background-color .3s ease, color .3s ease;
    }
    .bm-button:hover{ background:var(--faint); color:#444; }

    footer{
      margin-top:30px;
      font-size:10.5px;
      color:#999;
      text-align:center;
      letter-spacing:.06em;
    }

    /* ============================================================
       EXPLORE — the whole archive as one spiral, pannable and zoomable
       ============================================================ */
    #explore{
      position:fixed;
      inset:0;
      z-index:40;
      background:var(--bg);
      overflow:hidden;
      cursor:grab;
      touch-action:none;
    }
    #explore[hidden]{ display:none; }
    #explore.grabbing{ cursor:grabbing; }

    #spiral{
      position:absolute;
      left:50%;
      top:50%;
      width:0; height:0;
      transform-origin:0 0;
      will-change:transform;
    }
    /* garments sit as isolated cut-outs, no frame — the cards are built
       large so zooming in resolves real detail rather than a blur */
    .sp-item{
      position:absolute;
      width:150px;
      transform:translate(-50%, -50%);
      cursor:pointer;
      /* Rest is opaque and the entrance animates UP TO it, rather than rest
         being transparent with a `forwards` animation left holding the
         element at 1. A finished animation with a fill still owns the
         property: every later attempt to fade one of these out was either
         ignored, or — once the animation was called off — snapped straight
         to the base value with nothing to transition from. Nothing owns
         opacity here once the entrance is over. */
      opacity:1;
      animation:spIn .5s ease;
      transition:opacity .34s ease;
    }
    @keyframes spIn{ from{ opacity:0; } }
    .sp-item .sp-slot{
      width:150px; height:150px;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:transform .2s ease;
    }
    .sp-item img{
      max-width:100%; max-height:100%;
      width:auto; height:auto;
      object-fit:contain;               /* never crop a garment */
      display:block;
    }
    .sp-item:hover .sp-slot{ transform:scale(1.06); }
    /* no lettering anywhere in explore — garments only. A garment with no
       photograph yet leaves a faint empty plot rather than a caption. */
    .sp-item.sp-dim{
      opacity:.06;
      pointer-events:none;
      transition:opacity .5s ease;
    }
    /* Off the field entirely, not dimmed. A cluster gathers into the middle
       of a space the rest of the archive is still standing in; at .06 they
       are faint but they are still THERE, and the cluster lands on top of
       them. Gone means gone. */
    .sp-item.sp-gone{
      opacity:0;
      pointer-events:none;
      transition:opacity .45s ease;
    }
    /* One garment has been chosen and the record is coming. Everything else
       leaves first, so the handover is not a field of garments blinking out
       the instant explore is torn down. */
    #spiral.sp-chosen .sp-item:not(.sp-pick){
      opacity:0;
      pointer-events:none;
      transition:opacity .34s ease;
    }
    .sp-item .sp-code{
      width:100%; height:100%;
      border:1px dashed #f2f2f2;
      font-size:0;
    }

    #exploreHint{
      position:fixed;
      left:50%;
      top:18px;
      transform:translateX(-50%);
      z-index:41;
      font-size:9px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:#bbb;
      pointer-events:none;
    }

    /* ============================================================
       DOCK — floating navigation, only alive while the reader is
       inside an open nation tab and the real search bar has gone
       off screen. Collapsed it is two black squares; the left one
       opens out into a white search bar with the arrow beside it.
       ============================================================ */
    #dock{
      /* The archive's own measure — the same min(94vw, 880px) that .wrap
         gives the tab list. The bar and its two boxes then finish on exactly
         the same pixels as the tabs above them rather than floating inside
         their width. */
      --dock-w:min(94vw, 880px);
      position:fixed;
      left:50%;
      /* ONE height, every state. The bar used to sit at 112 / 34 / 26 / 24
         depending on what was open, so it stepped up and down as the reader
         moved between views — and the page's stamp underneath it appeared to
         come and go with it. It clears the stamp and stays put. */
      bottom:34px;
      transform:translateX(-50%) translateY(14px);
      z-index:80;
      display:flex;
      gap:10px;
      align-items:center;
      opacity:0;
      pointer-events:none;
      transition:opacity .28s ease, transform .28s ease;
      touch-action:none;
    }
    #dock.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
      pointer-events:auto;
    }
    /* once dragged it holds an absolute position and drops the centring */
    #dock.moved{
      left:0; top:0; bottom:auto;
      transform:translate(var(--dx), var(--dy));
    }
    #dock.moved.show{ transform:translate(var(--dx), var(--dy)); }
    #dock.dragging{ transition:none; cursor:grabbing; }

    /* with the main bar gone the dock drops to the bottom edge */
    /* and the list needs room to scroll clear of it */
    body.dock-list{ padding-bottom:110px; }

    /* in explore the dock sits central but low, clear of the garments */
    body.exploring #dock:not(.moved){
      left:50%; top:auto; bottom:34px;
      transform:translateX(-50%);
    }

    /* the middle button carries a stack of tools */
    .face-stack{
      position:relative;
      display:block;
      width:16px; height:16px;
      overflow:hidden;
    }
    .face-stack .face{
      position:absolute;
      inset:0;
      width:16px; height:16px;
      opacity:0;
      transform:translateY(120%);
      transition:opacity .26s ease, transform .3s cubic-bezier(.4,0,.2,1);
    }
    .face-stack .face.is-on{ opacity:1; transform:translateY(0); }
    .face-stack .face.is-out{ opacity:0; transform:translateY(-120%); }
    /* the periodic reminder that this button carries more than one tool */
    #dockExplore.hinting .face.is-on{ animation:faceHint .9s ease; }
    @keyframes faceHint{
      0%,100%{ opacity:1; transform:translateY(0); }
      30%    { opacity:.25; transform:translateY(-22%); }
      60%    { opacity:1;   transform:translateY(0); }
    }

    /* tools living inside the dock's own search bar */
    .dq-tool{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:26px; height:28px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:transparent;
      border:none;
      padding:0;
      cursor:pointer;
      opacity:0;
      pointer-events:none;
      transition:opacity .26s ease;
      z-index:4;
    }
    .dghost{
      position:absolute;
      inset:0;
      z-index:1;
      display:flex;
      align-items:center;
      padding:0 96px 0 42px;
      font-family:var(--font);
      font-size:12px;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:#bbb;
      pointer-events:none;
      white-space:nowrap;
      overflow:hidden;
      opacity:0;
      transition:opacity .2s linear;
      -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 112px), transparent calc(100% - 92px));
              mask-image:linear-gradient(to right, #000 calc(100% - 112px), transparent calc(100% - 92px));
    }
    #dock.open .dghost{ opacity:1; }
    .dghost[hidden]{ display:none; }

    #dqFlag{ right:64px; }
    #dqExplore{ right:36px; }
    #dock.open .dq-tool{ opacity:1; pointer-events:auto; }
    #dqFlag img{ display:block; height:12px; width:auto; filter:grayscale(1) contrast(1000%) opacity(.35); transition:filter .3s ease; }
    #dqFlag[aria-pressed="true"] img{ filter:grayscale(1) contrast(1000%); }
    #dqExplore img{ display:block; width:13px; height:13px; }

    /* ---------- CLOSING A RECORD ----------
       Four beats, in this order:

         1. the record and the garment contract and slide up UNDER the tab's
            own header — the header is a lid, and they go beneath it
         2. at the same time the header, now holding nothing, travels down to
            the middle of the screen
         3. it closes from both ends into nothing
         4. and the field comes back around the garment that was chosen

       What was here before ran the opening backwards, which read as a cut to
       a half-shut tab, a header scrolling away, and the garment blinking in.
       Nothing is reversed now; this is its own movement. */

    /* The open state, declared FIRST so the closing state below it wins on
       source order — the two have the same specificity, and with this one
       last the body simply never collapsed. */
    body.single-result .nation > .nbody{
      max-height:2000px;
      transition:max-height .46s cubic-bezier(.4,0,.2,1),
                 opacity .3s ease,
                 transform .46s cubic-bezier(.4,0,.2,1);
    }

    /* 1. the body goes under the lid */
    body.solo-closing .nation > .nbody{
      overflow:hidden;
      max-height:0;
      opacity:0;
      transform:translateY(-14px) scale(.96);
      transform-origin:top center;
      transition:max-height .46s cubic-bezier(.4,0,.2,1),
                 opacity .3s ease,
                 transform .46s cubic-bezier(.4,0,.2,1);
    }


    /* 2. the lid travels to the middle of the screen */
    body.solo-closing .nation{
      transform:translateY(var(--lid-drop, 0px));
      transition:transform .5s cubic-bezier(.4,0,.2,1) .18s;
      will-change:transform;
    }

    /* 3. and closes from both ends */
    body.solo-shutting .nation{
      transform:translateY(var(--lid-drop, 0px)) scaleX(0);
      opacity:0;
      transition:transform .42s cubic-bezier(.6,0,.3,1),
                 opacity .3s ease .16s;
    }
    body.solo-shutting .nation > summary{ opacity:0; transition:opacity .22s ease; }

    /* 4. the field returns, and the garment it returns to is already lit */
    #explore.ex-returning{ animation:ex-return .5s ease both; }
    @keyframes ex-return{ from{ opacity:0; } to{ opacity:1; } }

    @media (prefers-reduced-motion:reduce){
      body.solo-closing .nation,
      body.solo-closing .nation > .nbody,
      body.solo-shutting .nation{ transition:none; }
      #explore.ex-returning{ animation:none; }
    }

    /* ---------- THE FIELD, ARRIVING ----------
       Held back rather than assembled in public: every garment greyed and
       softened until the last photograph has landed, so what the reader
       sees is one field appearing at once rather than seventy of them
       arriving in whatever order the network chose. */
    #spiral.sp-waiting .sp-item{
      filter:grayscale(1) blur(9px) opacity(.22);
      transition:filter .9s ease;
      pointer-events:none;
    }
    /* Blur alone still shows the shapes, and shapes resolving one by one is
       the thing being hidden. A halftone laid over the field breaks what is
       left into dots — the garments read as a printed ground rather than as
       photographs part-way in. It is drawn, not loaded: a repeating radial
       gradient costs nothing and scales to any screen. */
    /* Over the whole viewport, not over the spiral. The spiral is scaled and
       panned, so a screen laid inside it is scaled with it — at the zoom the
       field opens on, its edges fell inside the screen and the garments
       nearest the rim stayed sharp. This one is fixed to the glass and
       covers it whatever the field is doing underneath. */
    body.gated #explore::after{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background-image:radial-gradient(circle at center, var(--bg) 0 38%, transparent 40%);
      background-size:6px 6px;
      opacity:.95;
      z-index:3;
    }
    #spiral .sp-item{ transition:opacity .34s ease, filter .9s ease; }

    /* display:flex beats the [hidden] attribute — the element selector wins
       over the browser's own [hidden]{display:none}. Without this, setting
       .hidden did nothing: the sheet stayed over the page, and once it took
       pointer events it swallowed every press meant for a garment. */
    #reveal[hidden]{ display:none !important; }
    #reveal{
      position:fixed;
      inset:0;
      z-index:60;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:14px;
      pointer-events:none;
    }
    #revealBtn{
      border:0;
      background:none;
      padding:10px;
      line-height:0;
      cursor:default;
      pointer-events:none;
      -webkit-tap-highlight-color:transparent;
    }
    /* header and footer scale — it is a mark, not a splash screen */
    #revealBtn svg{ height:17px; width:auto; display:block; overflow:visible; }
    .rev-trace{
      fill:none;
      /* the page's black, not the softer ink — this mark is the one thing
         on screen while the field arrives, and it should read as solidly
         as it will when it fills */
      stroke:var(--line);
      stroke-width:.5;
    }
    .rev-fill{
      fill:var(--line);
      stroke:none;
      opacity:0;
      transition:opacity .5s ease;
    }
    /* the mark draws itself for as long as the photographs are landing */
    #reveal.drawing .rev-trace{ animation:rev-draw 2.2s ease-in-out infinite; }
    /* It draws and holds. The old last frame faded it to a quarter, which
       is what made the mark look grey until something was hovered over. */
    @keyframes rev-draw{
      0%   { stroke-dashoffset:var(--rev-len); opacity:1; }
      55%  { stroke-dashoffset:0; opacity:1; }
      100% { stroke-dashoffset:0; opacity:1; }
    }
    /* Landed: it fills, in the page's own black rather than the softer ink
       the outline is drawn in. Grey said "still working"; this says "press
       me", which is the only thing left to do. */
    #reveal.ready .rev-trace{ animation:none; opacity:0; transition:opacity .4s ease; }
    #reveal.ready .rev-fill{ opacity:1; }
    /* The whole sheet takes the press once the field is in, not just the
       mark. The mark is what SAYS press me; making it the only thing that
       can be pressed left the click landing on the overlay behind it — the
       press and the release resolved to different elements and the browser
       handed the click to their common ancestor, which was the explore
       overlay. A target that spans the screen cannot be missed. */
    #reveal.ready{ pointer-events:auto; cursor:pointer; }
    #reveal.ready #revealBtn{ cursor:pointer; pointer-events:none; }
    #reveal.ready:hover .rev-fill{ opacity:.55; }
    #reveal.going{ opacity:0; transition:opacity .5s ease; }

    /* The bar is not usable while the field is still coming: typing into a
       search that cannot show you what it finds is a dead end. It greys out
       with the garments and comes back with them. The circle in the middle
       is the exception — it is the other key to the gate, so it stays live. */
    body.gated #dockSearch,
    body.gated #dockLibrary{
      opacity:.32;
      pointer-events:none;
    }
    body.gated #dock{ transition:opacity .4s ease; }
    @media (prefers-reduced-motion:reduce){
      #reveal.drawing .rev-trace{ animation:none; }
      #spiral.sp-waiting .sp-item{ filter:grayscale(1) opacity(.3); }
    }

    /* ---------- LABEL SUGGESTION ----------
       The archive answers to four things and four only: nation, division,
       date and garment type. Rather than leave anyone guessing at that, the
       bar offers the label it thinks is being reached for — in grey, off to
       the side of the tools — and fills it in if it is taken. */
    .dq-hint{
      position:absolute;
      right:96px; top:50%;
      transform:translateY(-50%);
      max-width:180px;
      display:flex;
      align-items:baseline;
      gap:6px;
      padding:4px 9px;
      background:var(--faint);
      border:1px solid #dcdcdc;
      color:#9a9a9a;
      font-family:var(--font);
      font-size:10px;
      letter-spacing:.09em;
      text-transform:uppercase;
      white-space:nowrap;
      overflow:hidden;
      cursor:pointer;
      opacity:0;
      pointer-events:none;
      transition:opacity .26s ease, color .22s ease, border-color .22s ease;
      z-index:5;
    }
    #dock.open .dq-hint.on{ opacity:1; pointer-events:auto; }
    .dq-hint:hover{ color:var(--ink); border-color:var(--line); }
    .dq-hint .dh-kind{ font-size:9px; color:#c4c4c4; flex:none; }
    .dq-hint .dh-text{ overflow:hidden; text-overflow:ellipsis; }
    /* the input gives up the room rather than running underneath the chip */
    #dockSearch.has-hint #dq{ padding-right:290px; }

    .dock-sq{
      flex:none;
      width:46px;
      height:46px;
      background:var(--line);
      border:1.5px solid var(--line);
      border-radius:0;              /* sharp edges */
      padding:0;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    #dockSearch{
      position:relative;
      overflow:hidden;
      justify-content:flex-start;
      transition:width .42s cubic-bezier(.65,0,.35,1),
                 background-color .34s ease;
    }
    /* opened: fills the bar width less the arrow square and its gap */
    #dock.open #dockSearch{
      width:calc(var(--dock-w) - 112px);   /* two 46px buttons + two 10px gaps */
      background:var(--bg);
      cursor:text;
    }

    #dockSearch .ico{
      position:absolute;
      left:14px;
      width:16px; height:16px;
      display:block;
      transition:opacity .3s ease;
    }
    #dockSearch .ico-b{ opacity:0; }
    #dock.open #dockSearch .ico-w{ opacity:0; }
    #dock.open #dockSearch .ico-b{ opacity:1; }

    #dq{
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      font-family:var(--font);
      font-size:12px;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:var(--ink);
      padding:0 96px 0 42px;   /* room for flag, explore and the ✕ */
      border-radius:0;
      -webkit-appearance:none;
      opacity:0;
      pointer-events:none;
      transition:opacity .26s ease;
    }
    #dq::placeholder{ color:#aaa; }
    #dock.open #dq{ opacity:1; pointer-events:auto; }

    #dockClear{
      position:absolute;
      right:8px; top:50%;
      transform:translateY(-50%);
      width:28px; height:28px;
      border:none;
      background:transparent;
      color:#c4c4c4;               /* deliberately faded */
      font-size:13px;
      line-height:1;
      cursor:pointer;
      opacity:0;
      pointer-events:none;
      transition:opacity .26s ease, color .2s ease;
    }
    #dock.open #dockClear{ opacity:1; pointer-events:auto; }
    #dockClear:hover{ color:var(--ink); }

    #dockLibrary{ color:#fff; }
    #dockLibrary .bm{ width:16px; height:16px; }
    #dockLibrary[aria-pressed="true"] .bm{ fill:#fff; }

    @media (max-width:640px){
      #dock{ bottom:16px; --dock-w:min(94vw, 880px); }
      /* the narrow bar cannot spare 180px, so the chip shrinks with it */
      .dq-hint{ max-width:104px; font-size:9px; padding:3px 7px; gap:4px; }
      #dockSearch.has-hint #dq{ padding-right:212px; }

      /* the suggestion is long and the phone is narrow: shrink it and
         fade it out before it reaches the flag and the star */
      .search input, .search .ghost{
        font-size:10px;
        letter-spacing:.04em;
        padding-right:78px;
      }
      #prompt{ font-size:13px; }
    }

    /* The shelf arriving in the list: it rises from under the tab above it
       rather than appearing at the top of the page, so it reads as being
       pulled out of the archive rather than dropped on top of it. */
    #savedTab.rising{
      animation:saved-rise .52s cubic-bezier(.4,0,.2,1) both;
    }
    @keyframes saved-rise{
      from { opacity:0; transform:translateY(22px) scaleY(.92); transform-origin:top center; }
      to   { opacity:1; transform:none; }
    }
    @media (prefers-reduced-motion:reduce){
      #savedTab.rising{ animation:none; }
    }

    /* ---------- GROUPING A NATION'S GARMENTS ----------
       Opens on all of them in one run, with a plus offering the three ways
       they can be split. The plus slides aside and becomes a minus while
       the choices are out, so the control reads as a thing that has opened
       rather than a thing that has changed. */
    .facet-bar{
      display:flex;
      align-items:center;
      gap:10px;
      padding:2px 2px 14px;
    }
    .facet-title{
      font-size:9.5px;
      letter-spacing:.2em;
      text-transform:uppercase;
      color:#9a9a9a;
      transition:color .3s ease;
    }
    .facet-bar.on .facet-title{ color:var(--ink); }

    .facet-toggle{
      width:16px; height:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0;
      border:none;
      background:none;
      cursor:pointer;
      color:#c4c4c4;
      font-family:var(--font);
      font-size:13px;
      line-height:1;
      transition:color .3s ease, transform .42s cubic-bezier(.4,0,.2,1);
    }
    .facet-toggle:hover{ color:var(--ink); }
    /* it travels to the far side of the row as it opens */
    .facet-bar.on .facet-toggle{
      color:var(--ink);
      transform:translateX(var(--facet-shift, 190px));
    }

    .facet-opts{
      display:inline-flex;
      align-items:center;
      gap:14px;
      opacity:0;
      transform:translateX(-8px);
      transition:opacity .34s ease, transform .42s cubic-bezier(.4,0,.2,1);
    }
    .facet-opts[hidden]{ display:none; }
    .facet-bar.on .facet-opts{ opacity:1; transform:none; }

    .facet-opt{
      padding:0;
      border:none;
      background:none;
      cursor:pointer;
      font-family:var(--font);
      font-size:9.5px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:#9a9a9a;
      transition:color .25s ease;
    }
    .facet-opt:hover{ color:var(--ink); }
    .facet-opt[aria-pressed="true"]{ color:var(--ink); text-decoration:underline; text-underline-offset:3px; }
    .facet-reset{ color:#c4c4c4; }

    @media (prefers-reduced-motion:reduce){
      .facet-toggle, .facet-opts{ transition:none; }
    }

    /* ---------- THE COLLECTION'S DOOR ---------- */
    #joinGate{
      position:fixed;
      inset:0;
      z-index:140;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.55);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      opacity:0;
      transition:opacity .4s ease;
    }
    #joinGate[hidden]{ display:none !important; }
    #joinGate.on{ opacity:1; }

    .jg-panel{
      position:relative;
      width:min(88vw, 420px);
      background:var(--bg);
      border:1.5px solid var(--line);
      padding:34px 30px 26px;
      text-align:center;
      transform:translateY(8px);
      transition:transform .45s cubic-bezier(.4,0,.2,1);
    }
    #joinGate.on .jg-panel{ transform:none; }

    .jg-lede{
      font-size:12.5px;
      letter-spacing:.02em;
      min-height:1.4em;
      margin-bottom:16px;
    }
    /* the grey field the address slides out of, as on the home page */
    .jg-slide{
      display:block;
      width:100%;
      background:var(--faint);
      border:1.5px solid var(--faint);
      transition:border-color .3s ease;
    }
    .jg-slide:focus-within{ border-color:var(--line); }
    #jgInput{
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      font-family:var(--font);
      font-size:11.5px;
      letter-spacing:.04em;
      color:var(--ink);
      text-align:center;
      padding:9px 8px;
      border-radius:0;
      -webkit-appearance:none;
    }
    .jg-send{
      display:block;
      width:100%;
      margin-top:12px;
      padding:9px 0;
      font-family:var(--font);
      font-size:9.5px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--bg);
      background:var(--line);
      border:1.5px solid var(--line);
      cursor:pointer;
      transition:opacity .3s ease;
    }
    .jg-send:hover{ opacity:.78; }
    .jg-send[disabled]{ opacity:.45; cursor:default; }
    .jg-msg{
      margin-top:10px;
      font-size:9.5px;
      letter-spacing:.08em;
      line-height:1.5;
      color:#888;
      min-height:1.3em;
    }
    .jg-close{
      position:absolute;
      top:8px; right:10px;
      border:none;
      background:none;
      font-size:13px;
      line-height:1;
      color:#c4c4c4;
      cursor:pointer;
      padding:6px;
    }
    .jg-close:hover{ color:var(--ink); }
    @media (prefers-reduced-motion:reduce){
      #joinGate, .jg-panel{ transition:none; }
    }

    /* ---------- NO DATA SAVED ----------
       A white plate on a black rule that lifts into the middle of the page,
       holds long enough to be read, and takes itself away. It never takes
       the pointer: whatever the reader was doing carries on underneath. */
    #noData{
      position:fixed;
      left:50%; top:50%;
      transform:translate(-50%, calc(-50% + 10px));
      z-index:130;
      /* a note, not an announcement — it was carrying the weight of a
         dialogue for a sentence that says there is nothing to show */
      padding:13px 20px;
      background:var(--bg);
      border:1.5px solid var(--line);
      font-size:10px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--ink);
      white-space:nowrap;
      pointer-events:none;
      opacity:0;
      transition:opacity .3s ease, transform .42s cubic-bezier(.2,.75,.3,1);
    }
    #noData.show{
      opacity:1;
      transform:translate(-50%, -50%);
    }
    @media (prefers-reduced-motion:reduce){
      #noData{ transition:opacity .2s linear; }
      #noData, #noData.show{ transform:translate(-50%, -50%); }
    }

    /* ---------- SITE HEADER ----------
       The same header the home page wears, so the archive reads as a room
       in the building rather than a separate site. See-through over the
       white page, near-black on hover, which is why the mark and the two
       tools are each built to read on either ground.

       Three ways out, differing only in how much of the home page the
       reader has to sit through again — see the handlers at the foot of
       the script. */
    #siteHead{
      position:fixed;
      top:0; left:0; right:0;
      z-index:75;
      height:54px;
      display:flex;
      align-items:center;
      background:transparent;
      transition:background-color .35s ease;
    }
    #siteHead:hover{ background:#262626; }

    /* the HOME page's measure, not the archive's: the mark and the two
       tools have to land on exactly the same pixels on both pages, or
       moving between them slides the furniture about. 92vw/1100px is what
       index.html's header uses — change it in both places or neither. */
    #siteHead .hd-inner{
      width:min(92vw, 1100px);
      height:100%;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .hd-mark{
      display:block;
      line-height:0;
      text-decoration:none;
      transition:opacity .45s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .hd-mark svg{ height:17px; width:auto; display:block; overflow:visible; }
    /* Grey, to sit with the two tools on the right rather than shout over
       them, and stroke only — the filled version was a second state the mark
       did not need. */
    .hd-trace{
      fill:none;
      stroke:#999;
      stroke-width:.5;
      transition:stroke .35s ease, opacity .3s ease;
    }
    /* The corner mark no longer draws itself — see index.html. On this page
       especially: the gate's mark is already drawing in the middle of the
       screen, and a second one doing the same thing in the corner competes
       with it. This one is simply there. */
    .hd-fill{
      fill:var(--ink);
      stroke:none;
      opacity:0;
      transition:opacity .35s ease, fill .35s ease;
    }
    /* Activated, the header goes near-black and the mark fills solid white
       — not a white outline. Both halves switch in ONE frame, before the
       ground has begun to move: transition:none on the way in, the normal
       one on the way back out. A crossfade here is the change you can see. */
    #siteHead:hover .hd-trace{
      opacity:0;
      transition:none;
    }
    #siteHead:hover .hd-fill{
      opacity:1;
      fill:#fff;
      transition:none;
    }


    /* The mark is fixed over a page that scrolls underneath it, so the
       moment the reader moves it is sitting on top of their content. It
       stands down as soon as the page leaves the top and comes back when
       they return — or on a hover, which darkens the header behind it and
       gives it a ground of its own to read against. */
    body.scrolled #siteHead .hd-mark{
      opacity:0;
      pointer-events:none;
    }
    body.scrolled #siteHead:hover .hd-mark{
      opacity:1;
      pointer-events:auto;
    }
    body.scrolled #siteHead:hover .hd-trace{ opacity:0; transition:none; }
    body.scrolled #siteHead:hover .hd-fill{ opacity:1; fill:#fff; transition:none; }


    .hd-tools{ display:flex; align-items:center; gap:18px; }
    .hd-ico{
      display:block;
      line-height:0;
      padding:8px;
      margin:-8px;
      border:0;
      background:none;
      cursor:pointer;
      color:#999;
      transition:color .3s ease, transform .3s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .hd-ico svg{ display:block; width:15px; height:15px; }
    .hd-ico .ico-fill{ fill:currentColor; }
    .hd-ico .ico-stroke{
      fill:none;
      stroke:currentColor;
      stroke-width:1.6;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    #hdHome svg{ width:13px; height:13px; }
    #siteHead:hover .hd-ico{ color:#fff; }
    .hd-ico:hover{ color:#fff; transform:scale(1.1); }

    @media (max-width:640px){
      #siteHead{
        height:calc(46px + env(safe-area-inset-top));
        padding-top:env(safe-area-inset-top);
      }
    }
    @media (prefers-reduced-motion:reduce){
    }

    /* ---------- OPERATIONS DEPARTURE ----------
       Straight fade of the whole page, then hand over to index.html. */
    body{ transition:opacity .3s ease; }
    body.leaving{ opacity:0; pointer-events:none; }
    @media (prefers-reduced-motion:reduce){
      body{ transition:none; }
    }
  </style>
</head>
<body>
  <!-- SITE HEADER — the archive's way back to the site. The mark is the
       front door and resets the home page; the star returns to it already
       entered; the index drops the reader straight onto its footer, so
       scrolling up is what brings the home page itself back. -->
  <header id="siteHead">
   <div class="hd-inner">
    <a class="hd-mark" id="hdMark" href="/" aria-label="British Material Unit — home">
      <svg viewBox="0 9.1 32 13.6" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <path id="hdTrace" class="hd-trace" d="M32,15h-11s8-5.9,8-5.9h-3.5l-3.5,2.5h0c-.1.1-.4.3-.6.4l.6-.4h0l-3.3,2.4v-4.9h-2v4.9h0l-5.2-3.8c-1.4-1-2.9-1.1-2.9-1.1H0v2h8.8l1.6.9H0v2h13.3l1.3.9H0v2h14.6l-1.3.9H0v2h10.4l-1.6.9H0v2h8.7s1.5-.1,2.9-1.1l5.2-3.8h0v4.9h2v-4.9h0l5.2,3.8c1.4,1,2.9,1.1,2.9,1.1h5.1v-2h-4.5c-.7,0-2-.5-2.8-1.1l-3.7-2.7h11v-2h0Z"/>
        <path id="hdFill" class="hd-fill" d="M32,15h-11s8-5.9,8-5.9h-3.5l-3.5,2.5h0c-.1.1-.4.3-.6.4l.6-.4h0l-3.3,2.4v-4.9h-2v4.9h0l-5.2-3.8c-1.4-1-2.9-1.1-2.9-1.1H0v2h8.8l1.6.9H0v2h13.3l1.3.9H0v2h14.6l-1.3.9H0v2h10.4l-1.6.9H0v2h8.7s1.5-.1,2.9-1.1l5.2-3.8h0v4.9h2v-4.9h0l5.2,3.8c1.4,1,2.9,1.1,2.9,1.1h5.1v-2h-4.5c-.7,0-2-.5-2.8-1.1l-3.7-2.7h11v-2h0Z"/>
      </svg>
    </a>

    <nav class="hd-tools" aria-label="Leave the archive">
      <a class="hd-ico" id="hdHome" href="/" aria-label="Back to the site">
        <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <path class="ico-fill" d="M50 0 L59.3 41 L100 50 L59.3 59 L50 100 L40.7 59 L0 50 L40.7 41 Z"/>
        </svg>
      </a>
      <button class="hd-ico" id="hdIndex" type="button" aria-label="Go to the site index">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <g class="ico-stroke">
            <path d="M2.6 4.6 H13.4"/>
            <path d="M2.6 8 H13.4"/>
            <path d="M2.6 11.4 H13.4"/>
          </g>
        </svg>
      </button>
    </nav>
   </div>
  </header>

  <div class="wrap">
    <div id="shell">
      <div class="count-row">
        <div class="count" id="count"></div>
        <button type="button" id="savedBtn" aria-pressed="false" aria-label="Show saved garments">
          <svg class="bm" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 2.2 h8 v11.6 l-4 -3.1 -4 3.1 Z"/></svg>
          <span id="savedCount"></span>
        </button>
      </div>

      <details class="nation" id="savedTab" data-nation="saved" hidden>
        <summary>
          <svg class="bm" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path d="M4 2.2 h8 v11.6 l-4 -3.1 -4 3.1 Z"/>
          </svg>
          <span class="n">Saved</span>
          <span class="qty" id="savedTabQty">0</span>
          <span class="sign" aria-hidden="true"></span>
        </summary>
        <div class="nbody"><div class="grid" id="savedGrid"></div></div>
      </details>

      <main id="catalogue" aria-label="Military surplus archive"></main>
      <div class="empty" id="empty" hidden>
        <div class="empty-line" id="emptyLine"></div>
        <div class="flag-strip" id="flagStrip" hidden>
          <div class="flag-rail" id="flagRail"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="prompt" aria-hidden="true"></div>

  <!-- THE COLLECTION'S DOOR
       Keeping garments is free and needs nobody's name. Opening the shelf
       asks for one — it is the point at which a pile of bookmarks becomes
       a collection worth writing to someone about. Copied from the home
       page's Join: the address types itself out, the field slides from it.
       Shown over a blurred archive so what is behind it is plainly still
       there and still theirs. -->
  <div id="joinGate" hidden aria-hidden="true">
    <div class="jg-panel" role="dialog" aria-modal="true" aria-label="Join to open your collection">
      <div class="jg-lede" id="jgLede"></div>
      <div class="jg-slide" id="jgSlide">
        <input id="jgInput" type="email" autocomplete="email" spellcheck="false"
               placeholder="you@example.com" aria-label="Your email address" />
      </div>
      <button type="button" class="jg-send" id="jgSend">Join</button>
      <div class="jg-msg" id="jgMsg" role="status" aria-live="polite"></div>
      <button type="button" class="jg-close" id="jgClose" aria-label="Close">✕</button>
    </div>

  <!-- The bookmark with nothing behind it. Says so on a plate of its own

      { n:"swiss", name:"Swiss Army 1980s TAZ83 Alpenflage Camouflage Field Shirt", cat:"Shirts",
        img:"CHA1980TAZ83ACFS.png", ref:"CHA1980TAZ83ACFS", mat:"Cotton" },
      /* ---------------- UNITED STATES ---------------- */
      { n:"united-states", name:"United States Air Force 1990s Tri Colour Desert Coffee Stain Camouflage Ripstop Combat Jacket", cat:"Jackets",
        img:"USAF1990TCDCSCRCJ.png", ref:"USAF1990TCDCSCRCJ", mat:"Cotton" },
      { n:"united-states", name:"United States Air Force 2000s Digital Tiger Stripe Camouflage BDU Combat Jacket", cat:"Jackets",
        img:"USAF2000DTSCBCJ.png", ref:"USAF2000DTSCBCJ", mat:"Cotton" },
      { n:"united-states", name:"United States Air Force 2010s Multicam Camouflage Combat Jacket", cat:"Jackets",
        img:"USAF2010MCCJ.png", ref:"USAF2010MCCJ", mat:"Cotton" },
      { n:"united-states", name:"United States Marine Corps 1980s M81 Woodland Camouflage BDU Combat Jacket", cat:"Jackets",
        img:"USMC1980M81WCBCJ.png", ref:"USMC1980M81WCBCJ", mat:"Cotton" },
      { n:"united-states", name:"United States Army 2000s UCP Camouflage UBACS Mandarin Collar Shirt", cat:"Shirts",
        img:"USA2000UCUMCS.png", ref:"USA2000UCUMCS", mat:"Cotton" },
      { n:"united-states", name:"United States Army 1980s M81 Woodland Camouflage MVP Parka", cat:"Parkas",
        img:"USA1980M81WCMP.png", ref:"USA1980M81WCMP", mat:"Nylon" },
      { n:"united-states", name:"United States Army 1980s M81 Woodland Camouflage M65 Cold Weather Field Coat", cat:"Coats",
        img:"USA1980M81WCM65CWFC.png", ref:"USA1980M81WCM65CWFC", mat:"Cotton" },
      /* ---------------- WEST GERMAN ---------------- */
      { n:"west-german", name:"West German Army 1960s Tracksuit Jacket", cat:"Jackets",
        img:"WGA1960TJ.png", ref:"WGA1960TJ", mat:"Cotton" },
      { n:"west-german", name:"West German Army 1970s Khaki Thermal Liner Coat", cat:"Liners",
        img:"WGA1970KTLC.png", ref:"WGA1970KTLC", mat:"Polyester" },
      /* ---------------- YUGOSLAV ---------------- */
      { n:"yugoslav", name:"Yugoslav Army 1980s JNA M87 Oak Leaf Camouflage Shirt", cat:"Shirts",
        img:"YA1980JM87OLCS.png", ref:"YA1980JM87OLCS", mat:"Cotton" }
    ];

    /* ---------- category order within each nation ----------
       One noun per shelf. "Jackets / Shirts" was one shelf holding a dress
       jacket, a pyjama shirt, a greatcoat and a thermal liner — a slash is
       two categories nobody separated, not one with a wide name. */
    const CATS = ["Jackets", "Shirts", "Smocks", "Parkas", "Coats", "Greatcoats",
                  "Fleeces", "Pullovers", "Polos", "Liners", "Vests", "Coveralls",
                  "Trousers", "Armour Covers", "Webbing", "Bags", "Pouches",
                  "Headwear", "Footwear", "Hardware", "Unclassified"];

    function slugBase(name){
      return name.toLowerCase()
        .replace(/[’']/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }
    function slug(name){ return slugBase(name) + '.png'; }

    /* every garment owns a folder:
       /archive/<nation>/<garment-type>/<garment>/<file>.png + .txt   */
    function assetDir(nationKey, cat, name){
      return `/archive/${nationKey}/${slugBase(cat)}/${slugBase(name)}`;
    }
    function esc(s){
      return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    /* ---------- render: nation dropdown > category group > grid ---------- */
    const catalogue = document.getElementById('catalogue');
    const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* a little air above a tab when we scroll to it */
    const TOP_GAP = 30;

    function scrollToNation(d){
      const y = d.getBoundingClientRect().top + window.scrollY - TOP_GAP;
      window.scrollTo({ top:Math.max(0, y), behavior:REDUCED ? 'auto' : 'smooth' });
    }

    /* <details> can't animate on its own — drive the body's height by
       hand so tabs slide shut instead of snapping */
    function setNationOpen(d, open){
      if (open === d.open) return;
      const body = d.querySelector('.nbody');

      if (REDUCED || !body){ d.open = open; return; }

      body.style.overflow = 'hidden';
      const finish = () => {
        body.style.transition = '';
        body.style.height = '';
        body.style.overflow = '';
      };

      if (open){
        d.open = true;
        const h = body.scrollHeight;
        body.style.height = '0px';
        requestAnimationFrame(() => {
          body.style.transition = 'height .34s cubic-bezier(.4,0,.2,1)';
          body.style.height = h + 'px';
        });
        setTimeout(finish, 380);
      } else {
        body.style.height = body.scrollHeight + 'px';
        requestAnimationFrame(() => {
          body.style.transition = 'height .3s cubic-bezier(.4,0,.2,1)';
          body.style.height = '0px';
        });
        setTimeout(() => { d.open = false; finish(); }, 320);
      }
    }

    /* The fabric each garment is cut from, read off its own record when the
       page was built — the record's opening sentence names it, which the
       title usually does not. Unlisted where the record does not say;
       nothing is inferred. */
    function MATERIAL_OF(p){ return p.mat || 'Unlisted'; }

    NATIONS.forEach(nation => {
      const mine = ITEMS.filter(p => p.n === nation.key);
      if (!mine.length) return;

      const cats = CATS.filter(c => mine.some(p => p.cat === c));
      const showLabels = cats.length > 1;

      const details = document.createElement('details');
      details.className = 'nation';
      details.dataset.nation = nation.key;
      details.dataset.label  = nation.label;
      details.open = nation.open;
      const flag = nation.flag
        ? `<img class="flag" src="/flags/${esc(nation.flag)}" alt="" aria-hidden="true" loading="lazy">`
        : `<span class="flag none" aria-hidden="true"></span>`;

      details.innerHTML =
        `<summary>${flag}` +
        `<span class="n">${esc(nation.label)}</span>` +
        `<span class="qty">${mine.length}</span>` +
        `<span class="sign" aria-hidden="true"></span></summary>` +
        `<div class="nbody"></div>`;
      const body = details.querySelector('.nbody');

      /* How this nation's garments are grouped. It opens on ALL of them in
         one run — the sectioned version stacks a shelf of one on a shelf of
         one on a shelf of one, which is a lot of headings for very little
         archive. The switch offers the three facets the records actually
         carry, and Reset puts them back in one run. */
      const bar = document.createElement('div');
      bar.className = 'facet-bar';
      bar.innerHTML =
        `<span class="facet-title">Garments</span>` +
        `<button type="button" class="facet-toggle" aria-expanded="false" aria-label="Group these garments">` +
          `<span class="facet-sign" aria-hidden="true">+</span>` +
        `</button>` +
        `<span class="facet-opts" hidden>` +
          `<button type="button" class="facet-opt" data-facet="type">Type</button>` +
          `<button type="button" class="facet-opt" data-facet="material">Material</button>` +
          `<button type="button" class="facet-opt" data-facet="date">Date</button>` +
          `<button type="button" class="facet-opt facet-reset" data-facet="">Reset</button>` +
        `</span>`;
      body.appendChild(bar);

      /* Built as one section holding everything, in the shelf order the
         archive keeps them in. Grouping is something the reader asks for,
         not the state the tab arrives in. */
      cats.forEach(section => {
        const group = document.createElement('section');
        group.className = 'group';
        /* No heading on arrival. The tab opens on every garment in one run
           and the switch above adds the headings when one is asked for —
           a shelf of one stacked on a shelf of one is more headings than
           archive. */

        const grid = document.createElement('div');
        grid.className = 'grid';

        mine.filter(p => p.cat === section).forEach(p => {
          const fileName = p.img || slug(p.name);
          const dir      = assetDir(nation.key, p.cat, p.name);
          const file     = `${dir}/${fileName}`;
          const txt      = `${dir}/${fileName.replace(/\.png$/, '.txt')}`;
          const el = document.createElement('article');
          el.className = 'item';
          const blob = [p.name, nation.label, p.cat, p.ref, p.src].filter(Boolean).join(' ').toLowerCase();
          /* What this garment can be sorted under, read off the record
             rather than guessed at the moment of sorting. Date comes from
             the name, material from the record's first line — the one the
             prose opens with — and type is the shelf it already sits on. */
          el.dataset.type = p.cat;
          el.dataset.date = (p.name.match(/\b(?:1[89]|20)\d0s\b/) || ['Undated'])[0];
          el.dataset.material = MATERIAL_OF(p);
          el.dataset.search = blob;
          el.dataset.words  = blob.split(/[^a-z0-9]+/).filter(Boolean).join('|');
          el.dataset.alias  = (nation.alias || []).join('|');
          el.innerHTML = `
            <div class="slot">
              <img src="${esc(file)}" alt="${esc(p.name)} — ${esc(nation.label)} military surplus" loading="lazy">
              <span class="pending" hidden>${esc(fileName)}</span>
            </div>
            <div class="meta">
              <div class="name-row">
                <div class="name">${esc(p.name)}</div>
                <button type="button" class="btn-save-inline" aria-pressed="false" aria-label="Save to library">
                  <svg class="bm" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                    <path d="M4 2.2 h8 v11.6 l-4 -3.1 -4 3.1 Z"/>
                  </svg>
                </button>
              </div>
              <span class="tag">${esc(p.cat)}</span>
              ${p.ref ? `<span class="ref">${esc(p.ref)}${p.src ? ` — ${esc(p.src)}` : ''}</span>` : ''}
              <div class="req-panel"><div class="req-inner">
                <div class="req-row">
                  <label>Quantity</label>
                  <!-- Ten steps, thirty upwards. A slider invited 137, which
                       is not a number anyone orders in; the dots say what the
