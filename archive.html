      paintHint('');
      updateDock();
    }

    /* Pushing further up when already at the top folds the open tab away.
       Only downward reading opens tabs — going up never does, so scrolling
       back never surprises the reader with more to read. */
    let upAcc = 0, upLock = 0;
    window.addEventListener('wheel', e => {
      if (exploreOn || !document.body.classList.contains('browsing')) return;
      if (e.deltaY >= 0){ upAcc = 0; return; }
      if (window.scrollY > 6){ upAcc = 0; return; }

      upAcc += -e.deltaY;
      const now = Date.now();
      if (upAcc > 130 && now - upLock > 700){
        const open = allNations.filter(d => d.open && !d.hidden);
        if (open.length){
          setNationOpen(open[open.length - 1], false);
          upLock = now;
          upAcc = 0;
        }
      }
    }, { passive:true });

    /* an opening or closing tab changes what furniture belongs on screen */
    function syncChrome(){
      /* A term opens every tab that answers it, and an open tab is normally
         what sends the main bar away and hands over to the dock's. Mid-word
         that is exactly wrong: the reader is still typing into the bar it
         would be taking off the screen. While there is a term, the bar
         stays and the results arrange themselves underneath it. */
      const typing = !!q.value.trim();
      document.body.classList.toggle('tab-open', anyNationOpen() && !typing);
      updateDock();
    }
    allNations.forEach(d => d.addEventListener('toggle', syncChrome));

    /* the star is a straight toggle: anything open → home, otherwise
       straight into explore */
    navBtn.addEventListener('click', () => {
      if (exploreOn){ closeExplore(); return; }      // tabs, if any, stay
      if (dockForced){
        dockForced = false;
        collapseDock();
        updateDock();
        return;
      }
      dockForced = true;
      setFace(0, true);
      updateDock();
      openExplore();
    });

    dockSearch.addEventListener('click', () => {
      if (!dock.classList.contains('open')) openDock();
    });
    dockSearch.addEventListener('keydown', e => {
      if (!dock.classList.contains('open') && (e.key === 'Enter' || e.key === ' ')){
        e.preventDefault();
        openDock();
      }
    });

    /* The dock field is forgiving: a term that matches nothing is read
       as a typo still being corrected, so the last good result set is
       held on screen rather than the page emptying under the reader. */
    let lastScrolled = null;

    function countMatches(term){
      if (!term) return allItems.length;
      let n = 0;
      allItems.forEach(el => { if (itemMatches(el, term)) n++; });
      return n;
    }

    /* ============================================================
       SEARCH LABELS
       The archive answers to four things: nation, division, date and
       garment type. Everything else in a garment's name is description.
       The vocabulary is built from the catalogue itself rather than kept
       as a second list to maintain, so a label can never be offered that
       has no garments standing behind it.
       ============================================================ */
    const DIVISION_WORDS = ['army','navy','marines','aircrew','airborne','cadet','raf','commando'];

    const LABELS = (() => {
      const out = [];
      const cap = w => w.replace(/\b[a-z]/g, c => c.toUpperCase());

      NATIONS.forEach(n => {
        const count = ITEMS.filter(i => i.n === n.key).length;
        if (!count) return;
        out.push({ kind:'Nation', label:n.label, fill:n.label, count,
                   keys:[n.label.toLowerCase(), ...(n.alias || [])] });
      });

      DIVISION_WORDS.forEach(w => {
        const re = new RegExp('\\b' + w + '\\b', 'i');
        const count = ITEMS.filter(i => re.test(i.name)).length;
        if (!count) return;
        out.push({ kind:'Division', label:cap(w), fill:cap(w), count, keys:[w] });
      });

      const decades = {};
      ITEMS.forEach(i => (i.name.match(/\b(?:1[89]|20)\d0s\b/g) || [])
        .forEach(d => { decades[d] = (decades[d] || 0) + 1; }));
      Object.keys(decades).sort().forEach(d => {
        out.push({ kind:'Date', label:d, fill:d, count:decades[d], keys:[d, d.slice(0, -1)] });
      });

      CATS.forEach(cat => {
        const count = ITEMS.filter(i => i.cat === cat).length;
        if (!count) return;
        /* "Jackets / Shirts" is searched as two plain words: the slash is
           not something itemMatches can place */
        const words = cat.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
        out.push({ kind:'Garment', label:cat, fill:words.join(' '), count,
                   keys:[cat.toLowerCase(), ...words] });
      });

      return out;
    })();

    /* Words that plainly belong to one of the four kinds but that this
       archive does not hold. Typing one earns a recommendation rather than
       silence — silence is kept for words with no bearing at all, where a
       guess would be worse than nothing. */
    const ABSENT = {
      Nation: ['french','france','german','germany','swedish','sweden','polish','poland',
               'dutch','netherlands','holland','spanish','spain','canadian','canada',
               'australian','australia','norwegian','norway','finnish','finland','czech',
               'belgian','belgium','swiss','switzerland','austrian','austria','chinese',
               'china','japanese','japan','korean','korea','israeli','israel','portuguese',
               'portugal','greek','greece','turkish','turkey','indian','india','nato'],
      Garment: ['umbrella','flipflop','flip-flop','sandal','sandals','tie','suit','dress',
                'skirt','shorts','sock','socks','glove','gloves','scarf','belt','watch',
                'sunglasses','hat','beret','helmet','parka','anorak','coat','boot','boots',
                'shoe','shoes','backpack','rucksack','poncho','smock','tunic','gaiter']
    };

    /* Where an absent word points when the archive holds the answer under
       another name. Checked against what is actually in the catalogue, so a
       mapping onto an empty shelf falls through to the fallback instead of
       recommending a dead end. */
    const ABSENT_TO = {
      hat:'Headwear', beret:'Headwear', helmet:'Headwear',
      boot:'Footwear', boots:'Footwear', shoe:'Footwear', shoes:'Footwear',
      backpack:'Bags / Webbing', rucksack:'Bags / Webbing',
      parka:'Jackets / Shirts', anorak:'Jackets / Shirts', coat:'Jackets / Shirts',
      smock:'Jackets / Shirts', tunic:'Jackets / Shirts', poncho:'Jackets / Shirts',
      gaiter:'Trousers / Coveralls'
    };

    /* Catch-alls, not answers. "Unattributed" is where a garment goes when
       its nation is unknown — recommending it to someone who asked for
       France is not a recommendation, it is a shrug. They stay reachable by
       typing their own name; they are simply never suggested. */
    const BUCKETS = ['Unattributed', 'Unclassified'];

    function biggestOfKind(kind){
      return LABELS.filter(l => l.kind === kind && !BUCKETS.includes(l.label))
                   .sort((a, b) => b.count - a.count)[0] || null;
    }

    /* What the bar believes is being typed. The label itself when the term
       is the start of one, a recommendation when the term is plainly of the
       right sort but absent, and nothing at all otherwise. */
    function suggestLabel(term){
      if (term.length < 2) return null;

      /* Nothing left to offer once the label itself has been typed out.
         Measured against the canonical name only: "ru" and "1990" are
         aliases, and resolving them to "Russian" and "1990s" is exactly the
         confirmation the chip exists to give. */
      if (LABELS.some(l => l.label.toLowerCase() === term || l.fill.toLowerCase() === term)) return null;

      const hit = LABELS.filter(l => l.keys.some(k => k.startsWith(term)))
                        .sort((a, b) => b.count - a.count)[0];
      if (hit) return { kind:hit.kind, text:hit.label, fill:hit.fill, found:true };

      for (const kind of ['Nation', 'Garment']){
        const word = ABSENT[kind].find(w => w.startsWith(term));
        if (!word) continue;
        const named  = ABSENT_TO[word];
        const target = (named && LABELS.find(l => l.label === named)) || biggestOfKind(kind);
        if (target) return { kind:target.kind, text:target.label, fill:target.fill, found:false };
      }
      return null;
    }

    /* The chip names the first answer; this is all of them. Same matching,
       same order — the biggest cluster first, because that is the one most
       likely meant. */
    function suggestAll(term){
      if (!term || term.length < 2) return [];
      return LABELS.filter(l => l.keys.some(k => k.startsWith(term)))
                   .sort((a, b) => b.count - a.count)
                   .slice(0, 6);
    }

    const dqPicks    = document.getElementById('dqPicks');
    const dqHint     = document.getElementById('dqHint');
    const dqHintKind = document.getElementById('dqHintKind');
    const dqHintText = document.getElementById('dqHintText');
    let   dqHintFill = '';

    function paintPicks(term){
      if (!dqPicks) return;
      const all = suggestAll(term);
      /* One answer is already named by the chip inside the bar; a stack of
         one under it would be the same word twice. */
      if (all.length < 2){
        dqPicks.classList.remove('on');
        dqPicks.innerHTML = '';
        return;
      }
      dqPicks.innerHTML = all.map(l =>
        `<button type="button" class="dq-pick" data-fill="${esc(l.fill)}">` +
          `<span class="dp-kind">${esc(l.kind)}</span>` +
          `<span class="dp-text">${esc(l.label)}</span>` +
          `<span class="dp-n">${l.count}</span>` +
        `</button>`).join('');
      dqPicks.classList.add('on');
    }

    function paintHint(term){
      paintPicks(term);
      const s = suggestLabel(term);
      dqHintFill = s ? s.fill : '';
      if (!s){
        dqHint.classList.remove('on');
        dqHint.setAttribute('aria-hidden', 'true');
        dockSearch.classList.remove('has-hint');
        return;
      }
      // "Try" rather than the kind when the archive is offering an
      // alternative: the reader should know it is not what they asked for
      dqHintKind.textContent = s.found ? s.kind : 'Try';
      dqHintText.textContent = s.text;
      dqHint.setAttribute('aria-label', (s.found ? 'Search ' : 'Try ') + s.kind + ' ' + s.text);
      dqHint.setAttribute('aria-hidden', 'false');
      dqHint.classList.add('on');
      dockSearch.classList.add('has-hint');
    }

    /* Taking the suggestion IS the choosing. It used to fill the box and
       wait for a return key, which asked the reader to agree twice with
       something they had just pressed — the chip is a destination, so it
       travels. */
    function takeHint(){
      if (!dqHintFill) return false;
      return takeTerm(dqHintFill);
    }

    function takeTerm(term){
      if (!term) return false;
      dq.value = term;
      dghost.hidden = true;
      paintHint(term.toLowerCase());
      if (!exploreOn){
        dockForced = true;
        setFaceMode('explore');
        setFace(0, true);
        openExplore();
      }
      clusterSearch(term.toLowerCase(), true);   // gather, do not merely dim
      dq.focus({ preventScroll:true });
      return true;
    }
    dqHint.addEventListener('click', e => { e.stopPropagation(); takeHint(); });
    if (dqPicks) dqPicks.addEventListener('click', e => {
      const b = e.target.closest('.dq-pick');
      if (!b) return;
      e.stopPropagation();
      takeTerm(b.dataset.fill);
    });

    dq.addEventListener('input', () => {
      dghost.hidden = dq.value !== '';
      const term = dq.value.trim().toLowerCase();
      paintHint(term);

      // in explore the search regroups the field rather than the page
      /* The answer appears where the reader is standing. Typing in the field
         moves the field; typing in the list narrows the list. Dragging them
         between the two — which is what forcing explore open did — takes the
         view away from someone who chose it. */
      if (exploreOn){ clusterSearch(term, false); return; }   // typing

      if (term && countMatches(term) === 0) return;   // hold what's there

      /* Typing on the bare page — the state the cross lands on, with the
         question in the middle and nothing else — brings up the LIST. That
         screen is a question being asked, and a list is the shape of an
         answer to it; opening the field instead would put the reader
         somewhere they would then have to leave to read anything. */
      if (term.length >= 2 && !nationsOpen && !savedOnly && !soloId){
        nationsOpen = true;
        setBrowsing(true);
      }

      q.value = dq.value;
      filter();
      syncGhost();
      updateDock();

      if (!term){ lastScrolled = null; return; }
      /* One letter is not a search: half the archive answers to it, and
         travelling on that is the page moving under someone who has barely
         started. The list narrows as they type either way — it is only the
         journey that waits for a term worth making it for. */
      if (term.length < 2){ lastScrolled = null; return; }

      // matching is word-accurate now, so a real hit can move the page
      // straight away. Only a change of nation scrolls, so typing on
      // through "d ▸ dp ▸ dpm" travels once, not three times.
      const first = allNations.find(d => !d.hidden && d.open);
      if (first && first !== lastScrolled){
        lastScrolled = first;
        scrollToNation(first);
      }
    });

    // enter jumps to the first garment that matched
    dq.addEventListener('keydown', e => {
      if (e.key === 'Escape'){ e.preventDefault(); resetDock(); return; }
      // tab is the keyboard's version of pressing the grey chip
      if (e.key === 'Tab' && dqHintFill){ e.preventDefault(); takeHint(); return; }
      if (e.key !== 'Enter') return;
      e.preventDefault();

      // in explore, enter gathers everything that answers the term and
      // settles on the group — a nation becomes that nation's cluster
      if (exploreOn){
        clusterSearch(dq.value.trim().toLowerCase(), true);   // choosing
        return;
      }

      const first = catalogue.querySelector('.item:not([hidden])');
      if (first) first.scrollIntoView({ behavior:'smooth', block:'center' });
    });

    function resetDock(){
      dq.value = '';
      paintHint('');
      q.value = '';
      filter();
      syncGhost();
      collapseDock();
    }
    dockClear.addEventListener('click', e => { e.stopPropagation(); resetDock(); });



    updateDock();

    /* ============================================================
       NATIONS — the tabs are hidden until the flag asks for them
       ============================================================ */

    /* the tabs topple in one after another, and fold back out the same
       way rather than simply vanishing */
    function dealTabs(){
      allNations.forEach((d, i) => {
        d.style.animation = 'none';
        void d.offsetWidth;
        d.style.animation = '';
        d.style.animationDelay = (i * 65) + 'ms';
      });
    }

    let countTimer = null;

    function typeCount(){
      clearTimeout(countTimer);
      countTyping = true;
      // the text is built from the archive, never read back off the screen —
      // a line caught mid-write would otherwise shorten itself every time
      bmuWrite(countEl, `${allItems.length} garments`, 32, () => { countTyping = false; });
    }

    /* the tally unwrites itself as the tabs fold away, so both halves of
       the header leave the same way they arrived */
    function untypeCount(){
      clearTimeout(countTimer);
      countTyping = true;
      bmuErase(countEl, 22, () => { countTyping = false; });
    }

    function setBrowsing(on){
      nationsOpen = on;
      if (on){
        collapseDock();              // never two search bars at once
        document.body.classList.remove('closing-tabs');
        document.body.classList.add('browsing');
        dealTabs();
        typeCount();
      } else {
        if (!q.value.trim()){
          // fold away, then drop out of browsing entirely
          untypeCount();
          document.body.classList.add('closing-tabs');
          setTimeout(() => {
            document.body.classList.remove('closing-tabs');
            allNations.forEach(d => { d.open = false; });
            filter();          // recomputes browsing from term + nationsOpen
          }, REDUCED ? 0 : 420);
        } else {
          allNations.forEach(d => { d.open = false; });
        }
      }
      flagBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      updateDock();
    }

    flagBtn.addEventListener('click', () => {
      /* One nation cluster per flag was thirty-one groups nobody asked for.
         There are three clusters in this archive and only three: OUR shelf,
         everything camouflaged, and whatever the reader has kept. The flag
         is the first of them. */
      if (!explore.hidden){
        const on = dqFlag.getAttribute('aria-pressed') === 'true';
        dqFlag.setAttribute('aria-pressed', on ? 'false' : 'true');
        flagBtn.setAttribute('aria-pressed', on ? 'false' : 'true');
        dq.value = on ? '' : 'British';
        dghost.hidden = dq.value !== '';
        paintHint(dq.value.trim().toLowerCase());
        // the rest of the archive stays, in grey, around the British cluster
        clusterSearch(on ? '' : 'british', true);
        return;
      }
      const on = !nationsOpen;
      setBrowsing(on);
      if (on) window.scrollTo({ top:0, behavior:REDUCED ? 'auto' : 'smooth' });
    });

    /* ============================================================
       EXPLORE — every garment laid out on a phyllotaxis spiral.
       Same golden-angle packing a sunflower uses, so the density stays
       even from the middle out instead of bunching into arms.
       ============================================================ */
    const explore    = document.getElementById('explore');
    const spiral     = document.getElementById('spiral');
    const dockExplore = document.getElementById('dockExplore');

    const GOLDEN = Math.PI * (3 - Math.sqrt(5));
    const SPACING = 172;              // ~1.15× the 150px card, so they clear
    let spiralBuilt = false;
    let sc = 1, tx = 0, ty = 0;

    /* wraps a jump in a transition so the field travels rather than cuts */
    /* The field is a composited layer for as long as it is moving and a
       plain one the moment it stops — see #spiral.gliding. Dropping the
       promotion is what makes the browser redraw the garments at the scale
       they have actually arrived at, so a zoomed field is sharp instead of
       being an enlargement of the pixels it had before the zoom. */
    let rasterTimer = null;
    function promote(ms){
      clearTimeout(rasterTimer);
      spiral.classList.add('gliding');
      rasterTimer = setTimeout(() => spiral.classList.remove('gliding'), ms);
    }

    function glide(fn, ms){
      const d = ms || 850;
      spiral.style.transition = `transform ${d}ms cubic-bezier(.4,0,.2,1)`;
      fn();
      promote(d + 160);                 // held for the whole move, then redrawn
      setTimeout(() => { spiral.style.transition = ''; }, d + 60);
    }

    function applyTransform(){
      spiral.style.transform = `translate(${tx}px, ${ty}px) scale(${sc})`;
      // a pinch or a drag moves it without a glide; it still has to settle
      promote(280);
    }

    /* ============================================================
       THE FIELD ARRIVING
       Seventy-odd photographs, each a megabyte, do not land together. Left
       alone they pop in one at a time and the reader watches the archive
       assemble itself. So the field is held grey and soft until the last
       one is in, with the mark drawing over it; then the mark fills and is
       the way in.

       A garment that fails to load counts as landed. One broken image must
       not leave the whole field behind a gate that never opens.
       ============================================================ */
    const revEl   = document.getElementById('reveal');
    const revBtn  = document.getElementById('revealBtn');
    const revTrace = document.getElementById('revTrace');
    let imgTotal = 0, imgDone = 0, revealed = false, revArmed = false;

    /* `load` fires when the bytes have arrived, not when the picture can be
       drawn — the browser still has to decode a megabyte of PNG, and on a
       slower machine that is where the delay actually is. Waiting on
       decode() instead is the difference between "downloaded" and "will
       paint this frame", and it is why the gate used to open onto a field
       that was still resolving.

       `loading="lazy"` also lets the browser decline to fetch a picture it
       considers off-screen, so every image is told to load eagerly first —
       otherwise the count could never complete. */
    function watchLoad(img){
      if (!img) return;
      imgTotal++;
      img.loading = 'eager';
      const done = () => {
        imgDone++;
        if (imgDone >= imgTotal) armReveal();
      };
      const settle = () => {
        if (typeof img.decode === 'function'){
          img.decode().then(done, done);     // a failed decode still counts
        } else {
          done();
        }
      };
      if (img.complete && img.naturalWidth > 0){ settle(); return; }
      img.addEventListener('load',  settle, { once:true });
      img.addEventListener('error', done,   { once:true });   // broken counts as landed
    }

    /* The garments have landed. The mark is in the middle of a stroke when
       that happens, and it used to be cut off wherever it had got to — the
       outline vanished mid-letter and the filled mark appeared in its place.

       It finishes instead. The loop is stopped where it stands, the stroke
       is run on to its end from exactly there, and only then does the mark
       fill. The run is timed from how much of the outline is left, so a
       mark caught almost finished does not sit there drawing nothing for
       half a second. */
    function armReveal(){
      if (revArmed || revealed) return;
      revArmed = true;

      const len = revTrace.getTotalLength ? revTrace.getTotalLength() : 0;
      const now = parseFloat(getComputedStyle(revTrace).strokeDashoffset);
      const left = (len && !isNaN(now)) ? Math.min(Math.max(now, 0), len) : 0;

      if (!left){                          // nothing left to draw
        revEl.classList.remove('drawing');
        revEl.classList.add('ready');
        return;
      }

      const ms = Math.round(140 + 520 * (left / len));

      // held where the loop had got to, with nothing animating
      revEl.classList.remove('drawing');
      revTrace.style.animation = 'none';
      revTrace.style.strokeDashoffset = left + 'px';
      void revTrace.offsetWidth;

      // and run on to the end of the stroke
      revTrace.style.transition = 'stroke-dashoffset ' + ms + 'ms cubic-bezier(.33,0,.2,1)';
      revTrace.style.strokeDashoffset = '0';

      setTimeout(() => {
        if (revealed) return;
        /* The outline hands over to the fill. The transition is named here
           rather than left to the stylesheet, because the inline one set
           above would otherwise still be the only thing on the element and
           the outline would snap out. */
        revTrace.style.transition = 'opacity .4s cubic-bezier(.4,0,.2,1)';
        revEl.classList.add('ready');      // the mark fills: that is the invitation
      }, ms + 60);
    }

    /* Two keys, one gate. The mark is the one the reader is looking at; the
       circle is the one their hand is already on. Neither opens it before
       the field is in — pressing early does nothing rather than letting the
       reader into a half-drawn archive. */
    function openGate(){
      if (revealed || !revArmed) return;
      revealed = true;
      document.body.classList.remove('gated');
      spiral.classList.remove('sp-waiting');
      // stop taking presses immediately — the field underneath is live from
      // this moment, and the fade out must not stand in front of it
      revEl.classList.remove('ready');
      revEl.style.pointerEvents = 'none';
      revEl.classList.add('going');
      setTimeout(() => { revEl.hidden = true; }, 520);
    }
    function gateShut(){ return !revealed && revEl && !revEl.hidden; }

    // pointerup rather than click: it fires on the element under the pointer
    // and does not care where the press began
    if (revEl) revEl.addEventListener('pointerup', openGate);

    function buildSpiral(){
      if (spiralBuilt) return;
      spiralBuilt = true;

      NATIONS.forEach(nation => {
        ITEMS.filter(p => p.n === nation.key).forEach(p => {
          const fileName = p.img || slug(p.name);
          const file = `${assetDir(nation.key, p.cat, p.name)}/${fileName}`;
          const el = Object.assign(document.createElement('div'), {
            className:'sp-item',
            innerHTML:
              `<div class="sp-slot">` +
                `<img src="${esc(file)}" alt="${esc(p.name)}" loading="lazy">` +
                `<span class="sp-code" hidden></span>` +
              `</div>`
          });
          el.dataset.nation = nation.key;
          el.dataset.name   = p.name;
          el.dataset.id     = `${nation.key}/${slugBase(p.name)}`;
          el.dataset.words  = [p.name, nation.label, p.cat, p.ref]
            .filter(Boolean).join(' ').toLowerCase()
            .split(/[^a-z0-9]+/).filter(Boolean).join('|');
          el.dataset.alias  = (nation.alias || []).join('|');
          spiral.appendChild(el);
          watchLoad(el.querySelector('img'));
        });
      });

      [...spiral.children].forEach(el => {
        const img = el.querySelector('img');
        const code = el.querySelector('.sp-code');
        img.addEventListener('error', () => { img.remove(); code.hidden = false; });
      });
      layoutSpiral('spiral');
    }

    /* 'spiral'   — one phyllotaxis over the whole archive
       'clusters' — one per nation, biggest in the middle, the rest
                    scattered around it on a jittered ring          */
    let spiralMode = 'spiral';

    function place(el, x, y){
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
    }

    /* Re-laying out is a movement, not a jump: the field draws back, the
       garments glide to their new homes like a cell dividing, then the
       view settles on whatever shape resulted. */
    let morphing = false;

    function morphLayout(mode){
      if (morphing) return;
      morphing = true;
      unframe();

      if (REDUCED){
        layoutSpiral(mode); fitSpiral(); morphing = false; return;
      }

      const els = [...spiral.children];
      /* Whatever was set aside by a cluster comes back. gatherSaved hides
         the unkept rather than moving them, so without this a move out of
         the collection laid every garment back out and then showed only the
         ones that were already showing. */
      els.forEach(el => {
        el.classList.remove('sp-gone', 'sp-dim', 'sp-grey');
        el.style.transition = 'left .95s cubic-bezier(.45,.05,.2,1), top .95s cubic-bezier(.45,.05,.2,1)';
      });
      spiral.style.transition = 'transform .95s cubic-bezier(.45,.05,.2,1)';

      // pull back first so the split happens inside the frame
      sc = Math.max(0.06, sc * 0.55);
      applyTransform();

      // a forced reflow commits the pull-back as the start of the move —
      // rAF is not guaranteed to run and would leave the field unplaced
      void spiral.offsetWidth;
      layoutSpiral(mode);

      setTimeout(() => {
        if (mode === 'saved'){
          const keep = [...spiral.children].filter(e => isSaved(e.dataset.id));
          if (keep.length) fitTo(keep); else fitSpiral();
        } else fitSpiral();                // settle on the new extent
        setTimeout(() => {
          els.forEach(el => { el.style.transition = ''; });
          spiral.style.transition = '';
          morphing = false;
        }, 1000);
      }, 900);
    }

    /* ---------- HOW A CLUSTER SITS ----------
       Every cluster is the natural spiral, whatever its size — no hand-drawn
       shapes. Three garments in a triangle, two side by side: those were
       diagrams, and the archive is not drawn as a diagram anywhere else.

       The spiral's first point is not its middle but √0.5 of a spacing out
       along the axis, so a cluster of one does not sit on the origin. That
       is answered by the framing, not the layout: fitTo() centres the view
       on the cluster itself, so one garment still lands in the middle of
       the screen.

       Every cluster in the field goes through this, so a nation, a search,
       a collection and the whole archive are arranged by the same rule. */
    function packOffsets(n){
      if (n <= 0) return [];
      const out = [];
      for (let i = 0; i < n; i++){
        const r = SPACING * Math.sqrt(i + 0.5);
        const a = i * GOLDEN;
        out.push([Math.cos(a) * r, Math.sin(a) * r]);
      }
      return out;
    }

    // how far a packed cluster reaches from its own middle
    function packExtent(n){
      return packOffsets(n).reduce((m, pt) => Math.max(m, Math.hypot(pt[0], pt[1])), 0);
    }

    function layoutSpiral(mode){
      spiralMode = mode;
      const els = [...spiral.children];

      if (mode === 'spiral'){
        const pts = packOffsets(els.length);
        els.forEach((el, i) => place(el, pts[i][0], pts[i][1]));
        return;
      }

      if (mode === 'saved'){
        const keep = els.filter(e => isSaved(e.dataset.id));
        const rest = els.filter(e => !isSaved(e.dataset.id));
        const kept = packOffsets(keep.length);
        keep.forEach((el, i) => place(el, kept[i][0], kept[i][1]));
        // everything unkept goes to its own cluster, well off the frame
        const away = SPACING * (Math.sqrt(els.length) + 16);
        const out  = packOffsets(rest.length);
        rest.forEach((el, i) => place(el, away + out[i][0], out[i][1]));
        return;
      }

      const groups = NATIONS
        .map(n => ({ key:n.key, els:els.filter(e => e.dataset.nation === n.key) }))
        .filter(g => g.els.length)
        .sort((a, b) => b.els.length - a.els.length);

      // measured off the shape the group will actually take, not guessed
      // from its count — a triad and a spiral of three do not reach as far
      const radiusOf = g => packExtent(g.els.length) + SPACING * 0.6;
      const big = radiusOf(groups[0]);

      groups.forEach((g, gi) => {
        let cx = 0, cy = 0;
        if (gi > 0){
          // even spread around the centre, then knocked off true so the
          // satellites do not read as a dial
          const step = (Math.PI * 2) / (groups.length - 1);
          const ang  = step * (gi - 1) + (Math.random() - 0.5) * step * 0.55;
          const ring = big + radiusOf(g) + SPACING * (0.7 + Math.random() * 0.8);
          cx = Math.cos(ang) * ring;
          cy = Math.sin(ang) * ring;
        }
        const pts = packOffsets(g.els.length);
        g.els.forEach((el, i) => place(el, cx + pts[i][0], cy + pts[i][1]));
      });
    }

    /* ---------- searching inside explore ----------
       A term pulls everything that answers it into its own cluster in the
       middle and dims the rest, so "mtp" makes an MTP group, "british" a
       British one, "smock" a smock one. The same matching the catalogue
       uses, so both bars behave alike. */
    function spiralMatch(el, term){
      const tokens = term.split(/\s+/).filter(Boolean);
      if (!tokens.length) return true;
      const words   = (el.dataset.words || '').split('|');
      const aliases = (el.dataset.alias || '').split('|');
      return tokens.every(t =>
        words.some(w => w.startsWith(t)) ||
        aliases.some(a => a && a.startsWith(t))
      );
    }

    /* Framed on the cluster's own middle rather than the field's origin —
       a natural spiral of one, two or three does not sit on the origin, and
       framing the origin is what would push a lone garment off to one side. */
    function fitTo(els){
      const at = els.map(el => [parseFloat(el.style.left) || 0, parseFloat(el.style.top) || 0]);
      const xs = at.map(p => p[0]), ys = at.map(p => p[1]);
      const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
      const cy = (Math.min(...ys) + Math.max(...ys)) / 2;
      let reach = 1;
      at.forEach(p => { reach = Math.max(reach, Math.hypot(p[0] - cx, p[1] - cy)); });
      const margin = Math.max(70, Math.min(150, window.innerWidth * 0.14));
      const fit = Math.min(window.innerWidth, window.innerHeight - 150) /
                  ((reach + margin) * 2);
      sc = Math.max(0.08, Math.min(maxScale(), fit));
      tx = -cx * sc; ty = -cy * sc - 40;
      applyTransform();
    }

    /* ---------- A CLUSTER TAKES THE CENTRE ----------
       The chosen garments go to the middle of the field, and whatever was
       sitting there moves out to the places the chosen ones have just left.
       It is a swap, one for one: dropping the cluster onto the middle while
       the garments already there stayed put is what had them lying on top
       of one another. Nothing else in the field moves.

       "The middle" is the positions nearest the origin once the field is in
       its own shape — in the plain spiral those are simply its first points,
       so the cluster comes out as the spiral's own centre. */
    function takeCentre(hit){
      const els = [...spiral.children];
      const at  = new Map(els.map(el => [el,
        [parseFloat(el.style.left) || 0, parseFloat(el.style.top) || 0]]));
      const byNear = [...els].sort((a, b) =>
        Math.hypot(...at.get(a)) - Math.hypot(...at.get(b)));
      const centre  = new Set(byNear.slice(0, hit.length));
      const wanted  = new Set(hit);
      const evicted = byNear.filter(el => centre.has(el) && !wanted.has(el));
      const arrive  = hit.filter(el => !centre.has(el));
      // pair them nearest first, so the swap reads as a trade, not a shuffle
      arrive.sort((a, b) => Math.hypot(...at.get(a)) - Math.hypot(...at.get(b)));
      arrive.forEach((el, i) => {
        const out = evicted[i];
        const [ix, iy] = at.get(out);
        const [ox, oy] = at.get(el);
        place(el,  ix, iy);
        place(out, ox, oy);
      });
    }

    let clusterTimer = null;
    /* Typing is not the same act as choosing.

       While the reader is still typing, the field holds its shape and the
       view simply travels to the first garment that answers — one move, to
       one garment. Regathering the whole spiral on every keystroke threw
       everything about under someone who had not finished their word.

       Pressing enter is the choosing. THAT regathers: the matches come into
       a spiral of their own and everything else goes. */
    function clusterSearch(term, gather){
      clearTimeout(clusterTimer);
      unframe();
      const els = [...spiral.children];

      /* The move is 800ms. Clearing the transition at 60ms — which is what
         this used to do, alongside the glide — took the property's
         transition away mid-flight, and a property whose transition is
         removed jumps straight to its final value. That was the cluster
         appearing rather than gathering. The tidy-up now waits for the move
         it is tidying up after. */
      const MOVE_MS = 800;
      const slide = () => els.forEach(el => {
        el.style.transition = `left ${MOVE_MS}ms cubic-bezier(.4,0,.2,1), top ${MOVE_MS}ms cubic-bezier(.4,0,.2,1), opacity .45s cubic-bezier(.4,0,.2,1)`;
      });
      const settle = () => setTimeout(
        () => els.forEach(el => { el.style.transition = ''; }), MOVE_MS + 80);

      if (!term){
        els.forEach(el => el.classList.remove('sp-dim', 'sp-gone', 'sp-grey'));
        slide();
        layoutSpiral(spiralMode);
        clusterTimer = setTimeout(() => {
          glide(() => fitSpiral(), 800);
          settle();
        }, 60);
        return;
      }

      if (term.length < 2) return;          // one letter is not a search yet

      const hit = els.filter(el => spiralMatch(el, term));

      /* Nothing answers this — "banana", or a nation the archive has never
         held. Dimming the whole field to say so is a worse answer than
         leaving it alone; the grey chip in the bar is where a suggestion
         belongs, not out here. */
      if (!hit.length) return;

      if (!gather){
        /* Still typing. The rest of the archive greys around what is being
           matched and nothing moves: the field used to travel to the first
           hit on every keystroke, which threw the whole view about under
           somebody who had not finished their word — and picked a garment
           for them. Choosing is a separate act, and the chip on the right of
           the bar is where it is made. */
        els.forEach(el => {
          el.classList.toggle('sp-grey', !hit.includes(el));
          el.classList.remove('sp-dim', 'sp-gone');
        });
        return;
      }

      /* Gathering. Every garment is laid back on its own spiral position
         first, then the matches take the centre and the garments that held
         it move out to where the matches were (takeCentre). The rest of the
         archive stays where it is in grey: how much there is, and how much
         of it is not this. */
      slide();
      layoutSpiral(spiralMode);
      els.forEach(el => {
        el.classList.toggle('sp-grey', !hit.includes(el));
        el.classList.remove('sp-dim', 'sp-gone');
      });
      takeCentre(hit);

      clusterTimer = setTimeout(() => {
        glide(() => fitTo(hit), 800);
        settle();
      }, 60);
    }

    /* stop zooming once a single garment fills the view — past that the
       source PNGs are being upscaled and just go soft */
    function maxScale(){
      return Math.min(window.innerWidth, window.innerHeight - 150) / SPACING;
    }

    function focusItem(el, scale){
      const x = parseFloat(el.style.left) || 0;
      const y = parseFloat(el.style.top)  || 0;
      sc = Math.min(scale || maxScale() * 0.72, maxScale());
      tx = -x * sc;
      ty = -y * sc;
      atInitial = false;
      applyTransform();
      offerSave(el);
    }

    /* while one garment holds the view, the arrow's slot offers to keep it */
    let focusedItem = null;

    /* From the second press until the record has it, the field answers to
       nothing. The garment is on its way and every other thing the field
       listens for — a wheel, a drag, a press, the framing being let go of —
       would interrupt a move already under way. Moving the pointer off the
       garment mid-flight was enough to start the field undoing itself. */
    let soloLock = false;

    /* One bookmark button, two jobs: with a garment framed it keeps that
       garment; with the whole field showing it gathers what is kept. */
    function offerSave(el){
      focusedItem = el || null;
      syncLibraryMark();
    }

    /* The reader has moved the field off the garment it was framed on — a
       pan, a wheel, a cluster. The button is no longer that garment's keep
       switch, and leaving it looking like one is what let a press fill the
       mark without changing the view. */
    function unframe(){
      if (focusedItem) offerSave(null);
    }

    /* The mark is never set by hand at a call site. It is read off the view,
       every time the view changes, so the two cannot disagree: with a
       garment framed it shows whether that garment is kept; with the whole
       field showing it shows whether the reader is standing in their own
       collection. Filled means the collection — on either view. */
    function syncLibraryMark(){
      if (!dockLibrary) return;
      const framed = !!(focusedItem && focusedItem.isConnected);
      dockLibrary.setAttribute('aria-label',
        framed ? 'Save this garment' : 'Gather saved garments');
      const on = framed
        ? isSaved(focusedItem.dataset.id)
        : savedOnly;
      dockLibrary.setAttribute('aria-pressed', on ? 'true' : 'false');
    }

    /* measures the real extent so it frames clusters as well as the spiral */
    function fitSpiral(){
      let reach = 1;
      [...spiral.children].forEach(el => {
        reach = Math.max(reach, Math.hypot(
          parseFloat(el.style.left) || 0,
          parseFloat(el.style.top)  || 0
        ));
      });
      const margin = Math.max(70, Math.min(150, window.innerWidth * 0.14));
      const radius = reach + margin;
      const fit = Math.min(window.innerWidth, window.innerHeight - 150) / (radius * 2);
      sc = Math.max(0.08, Math.min(maxScale(), fit));
      tx = 0; ty = -40;
      applyTransform();
      atInitial = true;
      offerSave(null);
    }

    let exploreClosing = false;
    /* Raised only by the record's own return, and spent on the next arrival
       in the field. It is what tells openExplore to leave the chosen
       garment lit instead of clearing it with everything else. */
    let holdChosen = false;
    let lastExploreItem = null;
    let atInitial = false;      // is the field sitting at its opening view?

    function openExplore(){
      /* Whatever was on its way is there or gone; the field is the reader's
         again and listens for them again. Set at the top, before any of the
         paths below can return early. */
      soloLock = false;
      // the list's dressing does not belong to the field
      document.body.classList.remove('dock-list');

      /* A reader who was looking at their own shelf should find it again.
         Coming back to the field from the saved list used to drop them into
         all seventy-five, which is not where they were — the collection is a
         place, and leaving a garment in it should not leave the place. */
      const wantSaved = savedOnly && savedIds.length;

      /* The gate is shown once, on the first visit to the field. Coming
         back to a field that is already loaded should not put a door in
         front of it again. */
      if (!revealed && !spiralBuilt){
        spiral.classList.add('sp-waiting');
        document.body.classList.add('gated');
        revEl.hidden = false;
        revEl.classList.add('drawing');
        const len = revTrace.getTotalLength();
        revTrace.style.strokeDasharray = len;
        revEl.style.setProperty('--rev-len', len);
        // nothing to wait for — no images in the document at all
        setTimeout(() => { if (imgTotal === 0) armReveal(); }, 400);

        /* A gate that never opens is worse than one that opens early.
           `loading="lazy"` means the browser is entitled to hold back a
           photograph it considers off-screen, and in a transformed spiral
           a picture can still fail in a way that fires neither event. This
           is the last resort, set long enough that it is not reached on any
           connection that is merely slow. */
        setTimeout(armReveal, 20000);
      }
      /* Coming back from a record, the garment the reader left from stays
         lit while the rest fade up behind it — returnToExplore asks for
         that by setting holdChosen, and lets go of the mark a beat later.

         Every OTHER way in is a fresh arrival at the archive and has to
         look like one. A reader who opened a garment, left explore by the
         glyph in the bar and browsed the list came back to a field still
         wearing the record's picture: that one garment lit and the other
         seventy-five at nothing, because the marks were only ever cleared
         on the record's own return. Whatever the field was holding — a
         chosen garment, a cluster, a term, a nation grouping — goes, and
         the whole archive comes back. */
      let reset = false;
      if (holdChosen){
        holdChosen = false;                 // spent on this one arrival
      } else if (spiralBuilt && !wantSaved){
        const dirty = spiralMode !== 'spiral'
          || !!dq.value.trim()
          || !!spiral.querySelector('.sp-pick, .sp-dim, .sp-gone, .sp-grey');
        spiral.classList.remove('sp-chosen');
        if (dirty){
          reset = true;
          dq.value = '';
          q.value  = '';
          if (dghost) dghost.hidden = false;
          paintHint('');
          dqFlag.setAttribute('aria-pressed', 'false');
          flagBtn.setAttribute('aria-pressed', 'false');
          savedOnly = false;
          document.body.classList.remove('library');
          spiral.querySelectorAll('.sp-item').forEach(el =>
            el.classList.remove('sp-pick', 'sp-dim', 'sp-gone', 'sp-grey'));
          if (spiralMode !== 'spiral') layoutSpiral('spiral');
          syncLibraryMark();
        }
      }

      /* Whatever the reader is standing in, the class says so. openRecord
         takes it off to build the record; this is where it comes back. */
      document.body.classList.toggle('library', savedOnly);

      // the field is the reader's again, and listens for them again
      soloLock = false;

      exploreClosing = false;
      explore.hidden = false;
      exploreOn = true;
      explore.setAttribute('aria-hidden', 'false');
      if (wantSaved){
        // gathered once the spiral has been built and laid out below
        setTimeout(() => gatherSaved(), 40);
      }
      dockExplore.setAttribute('aria-pressed', 'true');
      document.body.classList.add('exploring');
      document.body.style.overflow = 'hidden';
      // the dock returns to the middle of the screen for explore
      dock.classList.remove('moved');
      setFaceMode('explore');        // explore always opens on the circle
      setFace(0, true);
      buildSpiral();
      [...spiral.children].forEach(el => { el.style.transition = ''; el.style.opacity = ''; });
      fitSpiral();
      // a field that had to be put back is put back by fading in, not by
      // appearing — the same return the circle's reset makes
      if (reset) lightFieldUp(480);
    }

    /* The whole field up from nothing, together. fieldBackIn is for a move
       that lays the garments out somewhere new and needs its own left/top
       transitions left alone; this is for a field that is already where it
       belongs and only has to be seen again. */
    function lightFieldUp(ms){
      const els = [...spiral.children];
      if (!els.length) return;
      spiral.classList.add('sp-blank');
      void spiral.offsetWidth;                 // committed at nothing
      requestAnimationFrame(() => requestAnimationFrame(() => {
        els.forEach(el => { el.style.transition = 'opacity ' + ms + 'ms ease'; });
        spiral.classList.remove('sp-blank');
        setTimeout(() => els.forEach(el => { el.style.transition = ''; }), ms + 80);
      }));
    }

    function endExplore(handBack){
      explore.hidden = true;
      exploreOn = false;
      explore.setAttribute('aria-hidden', 'true');
      dockExplore.setAttribute('aria-pressed', 'false');
      document.body.classList.remove('exploring');
      document.body.style.overflow = '';
      exploreClosing = false;
      if (handBack){
        dockForced = false;
        collapseDock();
        updateDock();
        setTimeout(() => q.focus({ preventScroll:true }), 300);
      }
    }

    /* garments go out one at a time rather than as a block */
    function closeExplore(){
      if (explore.hidden || exploreClosing) return;
      exploreClosing = true;
      if (REDUCED){ endExplore(true); return; }
      [...spiral.children].forEach(el => {
        el.style.transition = 'opacity .3s cubic-bezier(.4,0,.2,1)';
        setTimeout(() => { el.style.opacity = '0'; }, Math.random() * 520);
      });
      setTimeout(() => endExplore(true), 950);
    }

    /* ---------- the middle button holds more than one tool ----------
       Scroll it on a laptop, swipe it on a phone: the faces roll round.
       Whichever is showing is what a press does. */
    /* The three glyphs sit in the DOM in one order; which of them is FIRST
       under the finger depends on where the reader is.

       In explore, the circle is home — it pulls the spiral back to fit — so
       it leads. In list view the circle is a way OUT of a view the reader is
       already in, so the list glyph leads and explore is one step away.

       The cross is always last. Whatever the mode, two steps from rest is
       the way out, and that never moves. */
    const faceEls = [...dockExplore.querySelectorAll('.face')];
    /* Two faces, not three. The cross was a third state that led to a bare
       page with a question typed on it — a view with nothing in it, reached
       by a glyph the reader had to swipe past to get between the two views
       that do hold the archive. There is the field and there is the list. */
    const FACE = { explore: faceEls[0], list: faceEls[1] };
    const ORDER = {
      explore: ['explore', 'list'],
      list:    ['list', 'explore'],
    };
    let faceMode = 'explore';
    let faces = ORDER.explore.map(k => FACE[k]);

    function setFaceMode(mode){
      if (mode === faceMode) return;
      faceMode = mode;
      faces = ORDER[mode].map(k => FACE[k]);
      setFace(0, true);            // whichever glyph now leads
    }
    let faceIx = 0;
    const FACE_LABEL = { explore:'Explore the archive', list:'Nation list' };

    function currentFace(){ return ORDER[faceMode][faceIx]; }

    function setFace(next, force){
      const n = (next + faces.length) % faces.length;
      if (n === faceIx && !force) return;
      // every glyph is addressed, not just the ones in this mode's order —
      // the third is still in the DOM and must not be left showing
      faceEls.forEach(f => {
        const on = f === faces[n];
        f.classList.toggle('is-on', on);
        f.classList.toggle('is-out', !on);
      });
      faceIx = n;
      dockExplore.setAttribute('aria-label', FACE_LABEL[currentFace()]);
    }

    /* A trackpad fires a burst of small wheel events per flick, which was
       toggling the face back and forth. Accumulate the travel and step
       once per gesture, then sit out until the burst dies down. */
    /* A trackpad flick is one gesture but many events, and the tail keeps
       arriving after the finger has gone. Stepping on a timer let that
       tail carry on past the face you wanted — sandwich would run
       straight through the cross and back to the circle. So: one step per
       gesture, and the next needs a genuine pause first. */
    let faceAcc = 0, faceSpent = false, faceIdle = null;

    dockExplore.addEventListener('wheel', e => {
      e.preventDefault();
      e.stopPropagation();

      clearTimeout(faceIdle);
      faceIdle = setTimeout(() => { faceSpent = false; faceAcc = 0; }, 220);

      if (faceSpent) return;              // this gesture already moved one
      faceAcc += Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;

      if (Math.abs(faceAcc) >= 45){
        setFace(faceIx + (faceAcc > 0 ? 1 : -1));
        faceAcc = 0;
        faceSpent = true;
      }
    }, { passive:false });

    // swipe the button itself — any direction moves along the stack
    let fx = 0, fy = 0, fid = null, swiped = false;
    dockExplore.addEventListener('pointerdown', e => {
      fid = e.pointerId; fx = e.clientX; fy = e.clientY; swiped = false;
    });
    dockExplore.addEventListener('pointermove', e => {
      if (e.pointerId !== fid || swiped) return;
      const dx = e.clientX - fx, dy = e.clientY - fy;
      if (Math.hypot(dx, dy) < 22) return;
      swiped = true;
      setFace(faceIx + ((dy < 0 || dx > 0) ? 1 : -1));
    });
    ['pointerup','pointercancel'].forEach(t => dockExplore.addEventListener(t, e => {
      if (e.pointerId === fid) fid = null;
    }));

    dockExplore.addEventListener('click', e => {
      if (swiped){ swiped = false; return; }       // that was a swipe

      // while the field is still arriving this button is the gate's key and
      // nothing else — the views it would otherwise reach are not ready
      if (gateShut()){ openGate(); return; }

      const face = currentFace();

      if (face === 'list'){
        // the listed nations, showing everything — not whatever the field
        // happened to be filtered to. The dock stays: explore is where the
        // searching happens now, and its bar is the one the reader has.
        toList({ keepDock:true });
        return;
      }

      /* Standing on one garment, the circle means all of them. It used to
         fall through to openExplore below, which returns the field around
         the garment the record was opened from — the same one garment, on a
         field that had been asked to show every garment. Whatever else the
         circle does elsewhere, here it is the way back to the archive. */
      if (soloId || document.body.classList.contains('single-result')){
        dockForced = true;
        returnToExplore(true);
        return;
      }

      // the circle always returns explore to how it opens: the single
      // spiral, pulled back to fit — it is not a way out
      if (explore.hidden){ dockForced = true; openExplore(); return; }

      /* Standing in a cluster, the circle is the way OUT of it — back to
         every garment in the archive.

         The same move as rubbing the word out of the bar, or letting the
         flag go: the greys come back up and every garment travels home to
         its own place on the spiral. It used to fade the whole field away
         and bring it back, which is a bigger gesture than was being asked
         for — the reader has not left the field, they have only stopped
         asking it a question. */
      const clustered = document.querySelector('#spiral .sp-gone, #spiral .sp-dim, #spiral .sp-grey');
      if (clustered || dq.value.trim() || spiralMode !== 'spiral'){
        dq.value = '';
        q.value = '';
        dghost.hidden = false;
        paintHint('');
        dqFlag.setAttribute('aria-pressed', 'false');
        flagBtn.setAttribute('aria-pressed', 'false');
        savedOnly = false;
        document.body.classList.remove('library');
        if (spiralMode !== 'spiral') morphLayout('spiral');
        clusterSearch('', true);          // every garment back on the field
        syncLibraryMark();
        return;
      }
      if (atInitial){
        // already home — press again and it travels to one it has not shown
        const pool = [...spiral.children].filter(
          el => !el.classList.contains('sp-dim') && !el.classList.contains('sp-grey'));
        const pick = nextTravel(pool);
        if (pick) glide(() => focusItem(pick, maxScale() * 0.68));
      } else {
        glide(() => fitSpiral());
      }
    });

    /* Resetting to the whole archive. The field used to slide back to its
       opening shape with whatever was already on screen staying on screen,
       so what the reader saw was a shuffle rather than a return — the
       garments that had been set aside faded in and the ones that had not
       simply slid. Everything goes out first and comes back together.

       Together, not one at a time: a stagger here is the ripple that was
       taken out of the list-to-explore move, and it is the same mistake. */
    function fieldBackIn(lay){
      const els = [...spiral.children];
      spiral.classList.add('sp-blank');
      void spiral.offsetWidth;          // committed at nothing
      lay();                            // lays the field out and sets its own transitions
      // opacity is on the transition `lay` just set; letting the class go is
      // what runs it
      requestAnimationFrame(() => requestAnimationFrame(() => {
        spiral.classList.remove('sp-blank');
      }));
      return els;
    }

    /* ---------- where the circle travels to ----------
       Not a fresh coin toss each press. A coin toss on seventy-odd garments
       still hands back the one just shown often enough to read as the
       button being broken — and twice running it plainly is. The field is
       shuffled into a bag instead and dealt from, so every garment is shown
       once before any is shown twice, and a refilled bag never opens on the
       one the last bag closed with. */
    let travelBag  = [];
    let lastTravel = null;

    function nextTravel(pool){
      if (!pool.length) return null;
      if (pool.length === 1) return (lastTravel = pool[0]);

      // garments the field has since set aside are no longer dealable
      const live = new Set(pool);
      travelBag = travelBag.filter(el => live.has(el));

      if (!travelBag.length){
        travelBag = pool.slice();
        for (let i = travelBag.length - 1; i > 0; i--){
          const j = Math.floor(Math.random() * (i + 1));
          [travelBag[i], travelBag[j]] = [travelBag[j], travelBag[i]];
        }
        // the seam between two bags is the one place a repeat can happen
        if (travelBag[0] === lastTravel) travelBag.push(travelBag.shift());
      }

      lastTravel = travelBag.shift();
      return lastTravel;
    }

    /* every so often the middle button blinks, so the other tools on it
       are discoverable rather than hidden */

    dockLibrary.addEventListener('click', e => {
      e.stopPropagation();

      // a framed garment turns this into its keep switch
      if (focusedItem && focusedItem.isConnected){
        toggleSaved(focusedItem.dataset.id);
        syncLibraryMark();
        const mark = dockLibrary.querySelector('.bm');
        mark.classList.remove('pop');
        void mark.offsetWidth;
        if (isSaved(focusedItem.dataset.id)) mark.classList.add('pop');
        return;
      }

      if (!savedIds.length){
        // the shelf is empty, or everything on it has since left the archive
        savedOnly = false;
        document.body.classList.remove('library');
        syncLibraryMark();
        flashNoData();
        return;
      }

      /* In the list the bookmark opens the Saved tab, because that is what
         "my garments" looks like in a list — a section of its own with the
         rest shut. Morphing a spiral the reader is not looking at answered
         a question nobody had asked. */
      if (explore.hidden){
        if (!savedOnly && !hasJoined()){
          openJoinGate(() => dockLibrary.click());
          return;
        }
        savedOnly = !savedOnly;
        soloId = null;
        nationsOpen = true;
        document.body.classList.add('browsing');
        document.body.classList.toggle('library', savedOnly);
        paintSaved();
        filter();
        if (savedOnly){
          savedTab.open = true;
          /* Both ways in get the same arrival. This one used to open the
             shelf outright while the list's own save icon drew it down, so
             the same shelf behaved differently depending on which button had
             asked for it. */
          savedTab.classList.remove('rising');
          void savedTab.offsetWidth;
          savedTab.classList.add('rising');
          setTimeout(() => savedTab.classList.remove('rising'), 560);
        }
        /* The shelf is open and titled Saved a line below; the count does
           not need to say so as well. */
        countEl.textContent = savedOnly
          ? `${savedIds.length} ${savedIds.length === 1 ? 'garment' : 'garments'}`
          : `${allItems.length} garments`;
        if (savedOnly) reportShelf();
        syncLibraryMark();
        syncChrome();
        return;
      }

      /* On the field the button is one switch with two positions, and the
         mark says which one it is in: filled is the collection, hollow is
         the whole archive. It used to flip the mark and then ask
         morphLayout to move the field — and morphLayout refuses while a
         move is already running, so pressing twice quickly filled the mark
         over a field that had not gone anywhere. Nothing is marked until
         the move has actually been taken. */
      if (morphing) return;                 // the field is already moving
      const entering = !savedOnly;
      if (entering && !hasJoined()){
        openJoinGate(() => dockLibrary.click());
        return;
      }
      if (entering){
        gatherSaved();                      // gathers, greys the rest, sets the state
      } else {
        savedOnly = false;
        document.body.classList.remove('library');
        clusterSearch('', true);            // every garment back on the field
      }
      syncLibraryMark();
      if (!entering){
        flagBtn.setAttribute('aria-pressed', 'false');
        dqFlag.setAttribute('aria-pressed', 'false');
      }
    });


    /* ---------- tools inside the dock's own search bar ---------- */
    const dqFlag    = document.getElementById('dqFlag');
    const dqExplore = document.getElementById('dqExplore');

    /* The union flag is not a layout switch — it is OUR shelf. Pressing it
       gathers the British garments and nothing else, which is the one
       cluster this archive is actually built around. Pressing it again puts
       the whole field back. */
    dqFlag.addEventListener('click', e => {
      e.stopPropagation();
      if (explore.hidden) openExplore();
      const on = dqFlag.getAttribute('aria-pressed') === 'true';
      dqFlag.setAttribute('aria-pressed', on ? 'false' : 'true');
      flagBtn.setAttribute('aria-pressed', on ? 'false' : 'true');
      dq.value = on ? '' : 'British';
      dghost.hidden = dq.value !== '';
      paintHint(dq.value.trim().toLowerCase());
      // the rest of the archive stays, in grey, around the British cluster
      clusterSearch(on ? '' : 'british', true);
    });

    /* From explore this is the way into the tab list — and the dock comes
       with it. The main bar used to be handed back here, which put a second
       search bar on a page that already had one open; the dock stays and
       sits under the tabs instead. From the list it goes back to explore. */
    /* The third cluster: whatever the reader has kept. Gathered the same way
       the other two are, so all three behave alike. */
    function gatherSaved(){
      const els = [...spiral.children];
      const keep = els.filter(el => isSaved(el.dataset.id));
      if (!keep.length) return;
      // back at the collection: tell us if it has moved since last time
      reportShelf();
      /* The field is now standing in the collection, and everything that
         asks "am I in the collection?" — the mark on the button, the state
         the list inherits — has to be told so.

         It is NOT a layout mode. It used to be one, which sent everything
         unkept to a cluster of its own sixteen spacings off the frame; the
         collection is a cluster like any other now, so the rest of the
         archive stays exactly where it is, in grey. */
      savedOnly = true;
      document.body.classList.add('library');
      els.forEach(el => {
        el.classList.toggle('sp-grey', !keep.includes(el));
        el.classList.remove('sp-dim', 'sp-gone');
        el.style.transition = 'left .8s cubic-bezier(.4,0,.2,1), top .8s cubic-bezier(.4,0,.2,1), opacity .45s cubic-bezier(.4,0,.2,1)';
      });
      layoutSpiral('spiral');
      takeCentre(keep);
      setTimeout(() => {
        glide(() => fitTo(keep), 800);
        setTimeout(() => els.forEach(el => { el.style.transition = ''; }), 880);
      }, 60);
      syncLibraryMark();
    }

    /* The second of the three clusters. Everything the archive holds that is
       camouflaged, whatever nation cut it — the one grouping that crosses
       every shelf, and the reason the nation-by-nation version was noise. */
    function gatherCamouflage(){
      if (explore.hidden){
        dockForced = true;
        setFaceMode('explore');
        setFace(0, true);
        openExplore();
      }
      dq.value = 'Camouflage';
      dghost.hidden = true;
      paintHint('camouflage');
      clusterSearch('camouflage', true);
    }

    dqExplore.addEventListener('click', e => {
      e.stopPropagation();
      /* A record opened from the field has explore torn down behind it, but
         as far as the reader is concerned they are still in the field —
         the glyph is lit and it says "leave explore". Asking the overlay
         whether it is up therefore gave the wrong answer here: the press
         re-entered the field instead of leaving it, and it took two to
         reach the list. A record counts as being in the field. */
      const inField = !explore.hidden
        || !!soloId
        || document.body.classList.contains('single-result');
      if (inField){ toList({ keepDock:true }); return; }
      openExplore();
    });

    /* Everything that lands on the tab list goes through here, so the dock's
       state and the face order can never disagree about which view is up. */
    function toList(opt){
      const keepDock = !!(opt && opt.keepDock);
      /* Which garment the reader was standing on, before that is cleared.
         Arriving in the list at the top of a list of seventy-five, having
         just been looking at one of them, loses the thread — the list opens
         where they already were. */
      const landOn = soloId || (focusedItem && focusedItem.dataset.id) || null;
      markUrl(null);                      // the list is not one garment's address
      if (!explore.hidden) endExplore(false);
      soloId = null;
      savedOnly = false;
      document.body.classList.remove('library');
      /* The record's own dressing goes with the record. solo-from-field
         hides the tally, the bookmark and the filter bar while one garment
         is standing on its own, and it was only ever taken off on the way
         back to the field — so a reader who left a record for the LIST
         arrived at a list with no filter on it. */
      document.body.classList.remove('solo-from-field', 'solo-build',
                                     'solo-drawing', 'solo-closing', 'solo-shutting');
      document.body.style.removeProperty('--solo-drop');
      clearHolds();
      q.value = '';
      dq.value = keepDock ? dq.value : '';
      filter();
      syncGhost();
      setBrowsing(true);
      setFaceMode('list');
      dockForced = keepDock;
      document.body.classList.toggle('dock-list', keepDock);
      if (keepDock){
        // it arrives open: a collapsed bar here would read as the search
        // having been taken away at the moment the reader changed view
        const held = dq.value;
        openDock();
        dq.value = held;
        dghost.hidden = dq.value !== '';
      } else {
        collapseDock();
      }
      updateDock();
      if (landOn) landInList(landOn);
    }

    /* The list, opened at one garment. The tab it lives in is opened and the
       card brought to the middle of the screen, so the garment the reader
       was holding is the garment they are handed — the same one, in its
       place among the others rather than on its own.

       After a frame, not immediately: setBrowsing has just dealt the tabs in
       and the card has no position worth scrolling to until that has been
       laid out. */
    function landInList(id){
      const card = allItems.find(el => el.dataset.id === id);
      if (!card) return;
      const tab = card.closest('.nation');
      /* setNationOpen, not `tab.open = true` followed by filter(): filter
         resets every tab to the state its nation was configured with, so
         opening one and then running it simply shut it again. This opens
         the tab and nothing else. */
      const opening = tab && !tab.open;
      if (opening) setNationOpen(tab, true);
      /* The tab unfolds over a third of a second, and the card has no final
         position until it has — the scroll waits for the fold rather than
         for a frame. */
      setTimeout(() => {
        card.scrollIntoView({ block:'center', behavior:REDUCED ? 'auto' : 'smooth' });
        /* named for a moment, so it is findable among its neighbours rather
           than merely somewhere on the screen */
        card.classList.add('landed');
        setTimeout(() => card.classList.remove('landed'), 1600);
      }, opening && !REDUCED ? 380 : 40);
    }

    /* ---------- zoom + pan ----------
       Neither works while the gate is up. The field behind it is grey and
       half-arrived, and zooming into a garment the reader cannot see is a
       view of nothing they can act on — and it leaves the gate's mark
       floating over a field that has moved underneath it. */
    explore.addEventListener('wheel', e => {
      e.preventDefault();
      if (gateShut() || soloLock) return;
      const rect = explore.getBoundingClientRect();
      const cx = e.clientX - rect.left - rect.width / 2;
      const cy = e.clientY - rect.top - rect.height / 2;
      const factor = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016));
      const next = Math.max(0.08, Math.min(maxScale(), sc * factor));
      // keep the point under the cursor fixed while scaling
      tx = cx - (cx - tx) * (next / sc);
      ty = cy - (cy - ty) * (next / sc);
      sc = next;
      atInitial = false;
      unframe();
      applyTransform();
    }, { passive:false });

    let panId = null, panX = 0, panY = 0;
    explore.addEventListener('pointerdown', e => {
      if (gateShut() || soloLock) return;
      if (e.target.closest('.sp-item')) return;
      /* The gate lives inside this overlay, and capturing the pointer here
         means the button inside it never receives the click — the press
         lands, the pan takes the pointer, and no click is ever delivered.
         Anything belonging to the gate is not a pan. */
      if (e.target.closest('#reveal')) return;
      panId = e.pointerId; panX = e.clientX; panY = e.clientY;
      explore.setPointerCapture(panId);
      explore.classList.add('grabbing');
    });
    explore.addEventListener('pointermove', e => {
      if (e.pointerId !== panId) return;
      tx += e.clientX - panX; ty += e.clientY - panY;
      panX = e.clientX; panY = e.clientY;
      atInitial = false;
      unframe();
      applyTransform();
    });
    ['pointerup','pointercancel'].forEach(t => explore.addEventListener(t, e => {
      if (e.pointerId !== panId) return;
      panId = null;
      explore.classList.remove('grabbing');
    }));

    // a garment opens on its own, centred; the tab's − brings you back
    spiral.addEventListener('click', e => {
      if (gateShut()) return;        // nothing in the field is pressable yet
      if (soloLock) return;          // one is already on its way
      const item = e.target.closest('.sp-item');
      if (!item) return;

      // first press frames the garment, the way the circle's random pick
      // does; only a second press on the same one opens its record
      if (focusedItem !== item){
        glide(() => focusItem(item, maxScale() * 0.68));
        return;
      }

      /* ONE move. The garment is taken to exactly the size it will be in
         the record, so that when the record takes over there is nothing
         left to resize — the refocus IS the resize.

         It used to be two: the view re-framed to a fixed scale, and then the
         card's slot animated from wherever the garment happened to be to
         wherever the slot happened to be. Two shrinks in a row, the second
         one arriving after the reader had already understood the first.

         Meanwhile the rest of the field goes, so the handover is not a
         screenful of garments blinking out with the overlay. */
      soloLock = true;                 // the field stops listening
      item.classList.add('sp-pick');
      spiral.classList.add('sp-chosen');

      const img  = item.querySelector('img');
      const now  = (img || item).getBoundingClientRect().width;
      const want = recordSlotWidth();
      let target = now > 4 ? sc * (want / now) : maxScale() * 0.68;
      target = Math.min(target, maxScale());

      /* On a phone the garment holds its place on the glass and only its
         size changes — the screen is small enough that the garment is
         already the whole of it, and travelling it to the exact middle first
         is a movement with nothing to gain. The scale is taken about the
         point it already occupies rather than about the centre.

         On a pointer screen it is still brought to the middle: there is room
         either side of it there, and the record opens in the middle. */
      if (window.matchMedia('(max-width: 760px)').matches){
        const gx = parseFloat(item.style.left) || 0;
        const gy = parseFloat(item.style.top)  || 0;
        const sx = gx * sc + tx;          // where it sits on the glass now
        const sy = gy * sc + ty;
        glide(() => {
          sc = Math.min(target, maxScale());
          tx = sx - gx * sc;              // and where it stays
          ty = sy - gy * sc;
          atInitial = false;
          applyTransform();
          offerSave(item);
        }, 620);
      } else {
        glide(() => focusItem(item, target), 620);
      }
      setTimeout(() => openRecord(item), 660);
    });

    /* What the garment will measure once the record has it: the build-state
       card is min(80vw, 520px) and its slot fills that, less the card's own
       rule. Read from the page rather than repeated as a number here — the
       two would drift the first time the card's width changed. */
    function recordSlotWidth(){
      const probe = catalogue.querySelector('.item');
      const w = Math.min(window.innerWidth * 0.8, 520);
      return Math.max(80, w - 3);
    }

    /* ------------------------------------------------------------------
       EXPLORE → RECORD
       The garment does not move. It is the one thing on screen the reader
       is already looking at, and moving it to hand it over is the jump this
       used to have: explore vanished, the page redrew, and the garment
       reappeared somewhere else at some other size.

       So its position on the glass is measured before the handover, the
       built card's slot is put back exactly there, and only then is it
       released to settle into the card. The garment holds still, and the
       layout comes to it.
       ------------------------------------------------------------------ */
    function openRecord(item){
      document.body.style.removeProperty('--solo-drop');
      document.body.classList.add('solo-from-field');
      const img = item.querySelector('img');
      const from = (img || item).getBoundingClientRect();

      lastExploreItem = item;
      endExplore(false);
      /* The record is built inside #catalogue, and library mode hides the
         catalogue outright (body.library #catalogue{display:none}) because
         the shelf is a tab of its own outside it. Opening a garment from the
         saved cluster therefore built the record somewhere nothing could be
         seen, and left the reader looking at the shelf's list instead.

         The class goes for as long as the record is open. savedOnly is NOT
         touched: it is what brings the reader back to their own shelf rather
         than to all of them, and showField puts the class back from it. */
      document.body.classList.remove('library');
      soloId = item.dataset.id;
      markUrl(soloId);                  // /archive/<n> — the garment's own address
      nationsOpen = true;
      document.body.classList.add('browsing');
      const tab = allNations.find(d => d.dataset.nation === item.dataset.nation);
      if (tab) tab.open = true;
      filter();
      syncChrome();
      /* Instant, and BEFORE the handover is measured.

         This was a smooth scroll, and it was the reason the garment drifted
         upwards on opening. beginSoloBuild measures where the card's slot
         is; with a smooth scroll still in flight that measurement is of a
         position the page is in the middle of leaving, so the transform was
         anchored to a destination that then slid out from under it. The
         garment had already been brought to the centre at the record's own
         size by the press before this — there is nothing left for it to do
         but stay where it is.

         Nothing is lost by jumping: explore is a fixed sheet over the page,
         so wherever the document was scrolled to was never on screen. */
      window.scrollTo(0, 0);
      beginSoloBuild(from);
    }

    /* Applied in the same tick as the render, so the settled two-column
       state is never painted first — that flash was the whole problem. */
    let soloTimers = [];

    /* The record is dealt out one hold at a time, and a reader who shuts it
       half way through leaves whichever holds had not been let go of still
       on the card. They only bite under body.single-result, so nothing shows
       — but a card carrying them is a card in a state nothing set. */
    const SOLO_HOLDS = ['hold-name', 'hold-mark', 'hold-acts', 'hold-rule', 'hold-edge'];
    function clearHolds(){
      catalogue.querySelectorAll('.item').forEach(el => {
        el.classList.remove(...SOLO_HOLDS);
        el.style.height = '';
        /* the room held open for the writing goes with them — it is the
           height that writing had at one particular card width, and the
           next time the record opens that may not be the width it has */
        el.querySelectorAll('.name, .ref').forEach(w => { w.style.minHeight = ''; });
        const sl = el.querySelector('.slot');
        if (sl) sl.style.transition = '';
      });
    }

    function beginSoloBuild(from){
      const item = catalogue.querySelector('.item:not([hidden])');
      if (!item || REDUCED) return;
      item.querySelectorAll('.solo-frame').forEach(n => n.remove());
      clearHolds();                     // nothing left over from a half-run open

      // into the build state with nothing animating, then let transitions
      // run for the settle. solo-build also holds the tab back — see the
      // .solo-build rules: the garment is the first thing on screen, and
      // the furniture around it arrives once its boxes are drawn.
      item.classList.remove('framed');
      document.body.classList.add('solo-build', 'solo-snap');
      item.classList.add('build', 'no-anim');
      void item.offsetWidth;
      item.classList.remove('no-anim');
      document.body.classList.remove('solo-snap');

      /* FLIP, but only the garment. `from` is where it was sitting on the
         glass a moment ago in explore; the slot is put back there with a
         transform, and released on the next frame. For the length of the
         handover the garment has not moved by a pixel — everything else is
         what moves around it. */
      const slot = item.querySelector('.slot');
      if (from && slot){
        /* Hold the garment exactly where the field left it, from this frame
           onwards — nothing is allowed to be painted with it anywhere else. */
        const pin = (rect) => {
          const k  = from.width / rect.width;
          const dx = (from.left + from.width  / 2) - (rect.left + rect.width  / 2);
          const dy = (from.top  + from.height / 2) - (rect.top  + rect.height / 2);
          slot.style.transition = 'none';
          slot.style.transformOrigin = 'center center';
