          slot.style.transform = `translate(${dx}px, ${dy}px) scale(${k})`;
          slot.style.zIndex = '4';
        };

        const first = slot.getBoundingClientRect();
        if (first.width > 4){
          pin(first);

          requestAnimationFrame(() => requestAnimationFrame(() => {
            /* Now, and only now, is the build layout settled.

               The card's width transition and the slot's own flex-basis were
               still running when the first measurement was taken, so the
               resting position it reported was some way off where the slot
               actually came to rest — a drop measured from it corrected less
               than half the gap, and the garment still crawled the rest of
               the way up. Measured again here it is the real one.

               Cleared, measured and re-pinned inside a single task: the
               browser paints between tasks, never in the middle of one, so
               the garment is never on screen untransformed.

               The drop is what puts the record where the garment is instead
               of moving the garment to the record. The press that opened this
               has already brought it to the middle of the screen at the size
               the record shows it, so there is nothing left for it to do but
               stay there — and what travels is the page, once, before any of
               this is visible. */
            slot.style.transform = 'none';

            /* Closed in on rather than solved in one go. The shell this sits
               in is centred while the page is short, so half of any padding
               added to it is taken straight back by the centring — a drop of
               exactly the gap moved the record exactly half the gap, and the
               garment still crawled the rest. Rather than encode that ratio
               here, where it would be wrong the moment the page grew past a
               screen, the gap is measured, closed, and measured again until
               there is none. It settles in a handful of passes and every one
               of them is inside this same task, so none of it is painted. */
            const want = from.top + from.height / 2;
            let applied = 0;
            for (let pass = 0; pass < 8; pass++){
              const r = slot.getBoundingClientRect();
              const gap = want - (r.top + r.height / 2);
              if (Math.abs(gap) < 0.5) break;
              applied += gap;
              if (applied <= 0){       // the slot already rests below the garment
                applied = 0;
                document.body.style.removeProperty('--solo-drop');
                break;
              }
              document.body.style.setProperty('--solo-drop', Math.round(applied) + 'px');
            }

            const rest = slot.getBoundingClientRect();
            if (rest.width > 4) pin(rest);
            void slot.offsetWidth;            // commit it with no transition

            /* Whatever is left after the drop — nothing, on a garment that
               was centred, and the real distance on one that was not. */
            requestAnimationFrame(() => {
              /* flex-basis rides along with the transform. An inline
                 transition replaces the stylesheet's outright, and the
                 stylesheet is where the slot's own .62s width change lives —
                 so for as long as this was the only thing on the element,
                 the garment's width had no transition at all and snapped to
                 46% of the card the instant the record opened. That snap was
                 the garment appearing to vanish. */
              slot.style.transition = 'transform .82s cubic-bezier(.4,0,.2,1), ' +
                                      'flex-basis .62s cubic-bezier(.4,0,.2,1)';
              slot.style.transform = 'none';
              soloTimers.push(setTimeout(() => {
                /* The transition is deliberately NOT cleared here. The card
                   opens at 780ms and this runs at 900, in the middle of the
                   widening — clearing a transition mid-flight sends the
                   property straight to its end value, which is the same
                   snap by another route. The sequence lets go of it. */
                slot.style.transform = '';
                slot.style.zIndex = '';
              }, 900));
            });
          }));
        }
      }

      /* The tab's own title is not typed any more — the garment's name is,
         and two things typing one after the other in the same opening is
         the page saying the same trick twice. The tab arrives whole, last,
         with its flag, its title and its minimise. */
      const nameEl = item.querySelector('.name');
      const refEl  = item.querySelector('.ref');
      /* Stashed the first time the card is seen, and read from the stash
         ever after. Taking the text off the element means taking whatever
         is on the element — and a record left half way through has a
         half-written name on it, so the next open would write that, and
         the one after would write half of THAT. The name got shorter every
         time. */
      if (nameEl && nameEl.dataset.full === undefined) nameEl.dataset.full = nameEl.textContent;
      if (refEl  && refEl.dataset.full  === undefined) refEl.dataset.full  = refEl.textContent;
      const nameTx = nameEl ? nameEl.dataset.full : '';
      const refTx  = refEl  ? refEl.dataset.full  : '';
      /* Not emptied yet. The card is measured with its writing in it — see
         the sequence — because a card with an empty name is shorter than the
         one the reader ends up with, and a height taken from it would have
         the card growing under the text as it is typed. */

      soloTimers.forEach(clearTimeout);
      soloTimers = [];

      /* THE SEQUENCE.

         Three beats, in the order the reader asks for the record:

           1. the field goes — done before this runs, by the press itself
           2. the garment slides left as the card opens out around it, into
              an empty right-hand half
           3. that half is written into and drawn around AT THE SAME TIME:
              the name types, the mark that keeps it comes in, and the two
              containers are drawn around them — the card's outline and the
              rule between the garment and its record. The Request and Info
              boxes wipe in as that outline closes.
           4. and last, the tab: its box drawn, its flag and title up, and
              the minimise that shuts the whole thing again

         The writing used to finish before the drawing began, which made two
         events out of one arrival and put the reader through both.

         Everything is held back by a class and let go of on a clock, so the
         order is legible in one place instead of being distributed across
         the stylesheet as delays. */
      const BOX_MS   = 500;   // the two containers drawing
      const HANDOVER =  70;   // drawn line → the card's real border
      /* The garment has already been brought to the middle at the record's
         own size by the press that opened this, so there is nothing for it
         to wait for. It used to sit there for the better part of a second
         while the handover settled — a stop between two movements that are
         meant to be one. */
      const START    = from ? 150 : 40;
      const OPEN_MS  = 620;   // the card's own .62s widening
      /* A long name should not take three times as long to write as a short
         one: the rate is set from the length so the writing lasts about the
         same beat whatever is being written. */
      const NAME_MS  = Math.max(8, Math.min(18, Math.round(560 / Math.max(1, nameTx.length))));

      // typed one after the other, the reference following the name
      const writeOut = (el, text, ms, done) => bmuWrite(el, text, ms, done);

      soloTimers.push(setTimeout(() => {
        /* 2 — the card opens out, and the garment travels rather than
           jumping. Three things have to be known before it can: where the
           card is going, how tall its writing will be, and how tall it is
           now. All three are read in a window the reader never sees — the
           build state cleared, measured, and put straight back inside one
           task, because the browser paints between tasks and never inside
           one. */
        item.classList.add('no-anim');
        item.classList.remove('build');
        const to    = item.getBoundingClientRect();
        const nameH = nameEl ? nameEl.getBoundingClientRect().height : 0;
        const refH  = refEl  ? refEl.getBoundingClientRect().height  : 0;
        item.classList.add('build');
        void item.offsetWidth;
        item.classList.remove('no-anim');

        /* The writing's height is held open before the writing is taken
           away, so the card does not grow line by line under the typing. */
        if (nameEl && nameH) nameEl.style.minHeight = Math.round(nameH) + 'px';
        if (refEl  && refH)  refEl.style.minHeight  = Math.round(refH)  + 'px';
        if (nameEl) nameEl.textContent = '';
        if (refEl)  refEl.textContent  = '';

        /* Height is auto at both ends and auto cannot be interpolated, so
           the card is given the number it is on, that is committed as the
           start, and then it is given the number it is going to. */
        const fromH = item.getBoundingClientRect().height;
        item.style.height = Math.round(fromH) + 'px';
        void item.offsetHeight;

        /* Everything the card will hold is held back: the writing, the
           mark, the two buttons, the rule and both borders. What moves is
           the card — wider and shorter — and the garment inside it, which
           slides left and shrinks with it. Nothing else. */
        item.classList.add('hold-name', 'hold-mark', 'hold-acts', 'hold-rule', 'hold-edge');
        item.classList.remove('build');
        item.style.height = Math.round(to.height) + 'px';

        /* Let go once it has arrived, not before: the height goes back to
           auto, which is the same number, and the slot goes back to the
           stylesheet's own transition. */
        soloTimers.push(setTimeout(() => {
          item.style.height = '';
          if (slot) slot.style.transition = '';
        }, OPEN_MS + 60));

        /* 3 — written into and drawn around, in the same breath. The card
           has just finished opening, so the outline can be measured; it is
           drawn in the room's coordinates rather than the card's, so it
           stands still while everything inside it arrives. */
        soloTimers.push(setTimeout(() => {
          const box = (() => {
            const r = item.getBoundingClientRect();
            return r.width > 4
              ? drawFrame(item, {
                  x: Math.round(r.left),
                  y: Math.round(r.top),
                  w: Math.round(r.width),
                  h: Math.round(r.height)
                }, BOX_MS, true)
              : null;
          })();
          item.classList.remove('hold-rule');     // the rule between the two
          item.classList.remove('hold-name');     // and the writing starts

          writeOut(nameEl, nameTx, NAME_MS, () => writeOut(refEl, refTx, NAME_MS));

          // the mark that keeps it, in while the line is still going round
          soloTimers.push(setTimeout(
            () => item.classList.remove('hold-mark'), Math.round(BOX_MS * 0.45)));

          // the request and info boxes, as the outline closes
          soloTimers.push(setTimeout(
            () => item.classList.remove('hold-acts'), Math.round(BOX_MS * 0.62)));

          // the drawn line hands over to the card's own border
          soloTimers.push(setTimeout(() => {
            item.classList.add('no-anim');        // no border-color transition
            item.classList.add('framed');
            item.classList.remove('hold-edge');
            void item.offsetWidth;
            if (box) box.remove();
            item.classList.remove('no-anim');

            /* 4 — and last the tab: its box drawn, the rule across the top,
               the flag and title up, and the minimise. */
            soloTimers.push(setTimeout(() => {
              document.body.classList.add('solo-drawing');
              document.body.classList.remove('solo-build');
              soloTimers.push(setTimeout(() => {
                document.body.classList.remove('solo-drawing');
                /* The record is built and nothing is left in flight, so
                   whatever the reader does next is theirs again. Released
                   here rather than only on the way back to the field,
                   because the way back is not always through the field. */
                soloLock = false;
              }, 900));
            }, 90));
          }, BOX_MS + HANDOVER));
        }, OPEN_MS + 20));
      }, START));
    }

    /* One frame, drawn rather than switched on.

       The dash offset is set on the rect BEFORE it goes into the document
       and the run is armed a frame later, so there is no first paint in
       which the whole rectangle exists. That flash of a complete line, gone
       again before the draw started, was the flicker. */
    function drawFrame(item, box, ms, fixed){
      const NS  = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', fixed ? 'solo-frame is-fixed' : 'solo-frame');
      svg.setAttribute('viewBox', `0 0 ${box.w} ${box.h}`);
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.style.left   = box.x + 'px';
      svg.style.top    = box.y + 'px';
      svg.style.width  = box.w + 'px';
      svg.style.height = box.h + 'px';

      const rect = document.createElementNS(NS, 'rect');
      rect.setAttribute('x', 0.75);
      rect.setAttribute('y', 0.75);
      rect.setAttribute('width',  Math.max(1, box.w - 1.5));
      rect.setAttribute('height', Math.max(1, box.h - 1.5));

      const len = 2 * (box.w + box.h);
      rect.style.strokeDasharray  = len;
      rect.style.strokeDashoffset = len;
      svg.appendChild(rect);
      /* Fixed frames hang off the page, not off the card. The card is
         changing size underneath this line, and a child of the card is
         carried around by every pixel of that change — the box has to hold
         still in the room while the card opens into it. */
      (fixed ? document.body : item).appendChild(svg);

      requestAnimationFrame(() => {
        rect.style.transition = `stroke-dashoffset ${ms}ms cubic-bezier(.4,0,.2,1)`;
        rect.style.strokeDashoffset = 0;
      });
      return svg;
    }

    /* back out of a single garment into the spiral, sitting on it rather
       than pulling all the way out to the wide view */
    function returnToExplore(toAll){
      soloLock = false;                 // the record has it; the field is free
      markUrl(null);                    // the record is being left: /archive
      /* solo-from-field is NOT dropped here. It is what hides the tally and
         the bookmark on a record opened from the field, and taking it off at
         the top of the close meant they faded back in and rode the card all
         the way out — a save button appearing on a card that is leaving.
         It comes off in land(), once the shell is down. */
      document.body.classList.remove('solo-closing', 'solo-shutting');
      document.querySelectorAll('.nation').forEach(n => n.style.removeProperty('--lid-drop'));
      document.body.classList.remove('solo-drawing');
      soloTimers.forEach(clearTimeout);
      soloTimers = [];
      clearHolds();
      document.body.classList.remove('solo-snap', 'solo-drawing');
      /* The way back is the way in, run backwards.

         The record closes the way it opened: the tab lets go, the card
         folds back to the square the garment stood in, and only then does
         the field come back — with the garment it left from still the one
         thing on screen, at the size it was. Cutting straight to the field
         threw away the thread the reader was holding.

         Reduced motion gets the destination without the journey. */
      const card = catalogue.querySelector('.item:not([hidden])');
      const item = lastExploreItem;
      lastExploreItem = null;

      /* Phase one: the field comes back while the record is still folding.

         It used to wait for the fold to finish, and for about a third of a
         second in between there was nothing on screen at all — the record
         gone, the field not yet arrived. Starting the field's fade over the
         tail of the fold means one view is always covering the other.

         The garment is in the same place in both of them — the record's slot
         was put where the field was holding it, and focusItem puts the field
         back around it — so what crosses over is only the furniture. */
      const showField = () => {
        holdChosen = true;          // the garment just left stays lit
        openExplore();
        if (toAll){
          /* Asked for all of them rather than for the one just left. Any
             cluster or term the field was holding goes with the record, so
             what comes back is the archive at rest and not a filtered view
             of it wearing the whole field's clothes. */
          if (dq) dq.value = '';
          q.value = '';
          if (spiralMode !== 'spiral') morphLayout('spiral');
          clusterSearch('', true);
          spiral.style.transition = 'none';
          fitSpiral();
          void spiral.offsetWidth;
          spiral.style.transition = '';
        } else if (item){
          spiral.style.transition = 'none';
          focusItem(item);
          void spiral.offsetWidth;          // commit it unanimated
          spiral.style.transition = '';
        }
        /* The whole field, in one go. The chosen garment used to be uncovered
           on its own and the other seventy-four let back in a beat later,
           which read as the archive being rendered twice. */
        spiral.classList.remove('sp-chosen');
        spiral.querySelectorAll('.sp-pick').forEach(el => el.classList.remove('sp-pick'));
        explore.classList.add('ex-returning');
        soloTimers.push(setTimeout(() => explore.classList.remove('ex-returning'), 560));
      };

      /* Phase two: the list is put away behind a field that is already
         opaque, so none of it is seen. */
      const land = () => {
        /* The closing classes come off LAST, after the catalogue has been put
           away. Removing them first restored the tab to full opacity and full
           width for the frame before setBrowsing hid the shell — the tab
           flashed back into place on its way out. That was the flicker. */
        document.body.classList.add('field-returning');
        document.body.classList.remove('solo-from-field');
        document.body.style.removeProperty('--solo-drop');
        soloId = null;
        q.value = '';
        filter();
        syncGhost();
        setBrowsing(false);
        dockForced = true;
        navBtn.setAttribute('aria-pressed', 'true');
        updateDock();

        /* Held until setBrowsing's own 420ms fold has run, so the list is
           already closed by the time it could be seen again. Deliberately not
           in soloTimers: those are cleared wholesale on the next state
           change, and a cleared timer here would leave the catalogue hidden
           for good. */
        setTimeout(() => document.body.classList.remove('field-returning'), 680);

        // safe now: the field is opaque and nothing of the tab can be seen
        document.body.classList.remove('solo-closing', 'solo-shutting');
        document.querySelectorAll('.nation').forEach(n => n.style.removeProperty('--lid-drop'));
      };

      if (!card || REDUCED){ showField(); land(); return; }

      const tab = card.closest('.nation');
      if (!tab){ showField(); land(); return; }

      /* How far the lid has to travel to reach the middle of the screen.

         Measured from the SUMMARY, because by the time the travel begins the
         body has closed and the header row is all there is.

         And measured AFTER that close, not before it. The shell this sits in
         is centred, so as the record's body folds away the page gets shorter
         and everything left in it drifts down — nearly three hundred pixels
         of drift, all of it after the reading was taken. The box was then
         carried that much too far and came to rest well below the middle.
         Taken at the end of the fold and a frame before the travel starts,
         the number is the distance that is actually left. */
      const sum = tab.querySelector('summary');
      /* Placed, not travelled. The header used to be driven down to the
         middle on its own transition after the fold — a box sliding down an
         empty page, which is a second journey on top of the one the fold has
         already made. The fold itself carries it most of the way, because
         the page shortens around it; whatever is left over is applied with
         nothing animating, so the header simply IS in the middle when the
         fold ends. It holds there, and then it closes. */
      const setLidDrop = () => {
        const r = (sum || tab).getBoundingClientRect();
        tab.classList.add('lid-snap');           // no transition for this step
        tab.style.setProperty('--lid-drop',
          Math.round((window.innerHeight / 2) - (r.top + r.height / 2)) + 'px');
        void tab.offsetWidth;                    // committed unanimated
        tab.classList.remove('lid-snap');
      };
      tab.style.setProperty('--lid-drop', '0px');
      // the fold runs 0–300ms; the remainder is placed the moment it ends
      soloTimers.push(setTimeout(setLidDrop, 310));

      document.body.classList.add('solo-closing');                 // 1 + 2

      /* One movement, not two with a wait between them. The header used to
         arrive in the middle and hold there for six tenths of a second
         before closing, which put a full stop in the middle of a gesture
         that reads better as a single fall. It closes as it lands instead:
         ninety milliseconds is long enough for the placement to commit in
         its own frame and short enough that nothing reads as having
         stopped. */
      const ARRIVED = 310;          // the fold ends and the header is in place
      const HOLD    =  90;          // and closes on arrival, without standing still

      // 3 — shut, once it has actually stood still
      soloTimers.push(setTimeout(() => {
        document.body.classList.add('solo-shutting');
      }, ARRIVED + HOLD));
      // 4 — the field starts returning over the tail of the shut, never after it
      soloTimers.push(setTimeout(showField, ARRIVED + HOLD + 200));
      // 5 — and the list is dismantled once the field is opaque over it
      soloTimers.push(setTimeout(land, ARRIVED + HOLD + 760));
      return;
      if (item) focusItem(item);
    }

    /* ============================================================
       THE ONE INVARIANT
       There is always something on screen.

       This page has two views and a dozen ways between them, and every one
       of those ways hides one view before showing the other. Each time a
       blank frame has been found and closed, it has come back somewhere else
       — a timer cleared by an interruption, a class left on by a press that
       arrived mid-transition, a reader pressing the way out of a record
       while it is still opening. Fixing the orders one at a time is chasing
       it; there will always be another order.

       So the rule is stated once, and enforced rather than trusted. A few
       times a second: if the field is not showing, and the list has nothing
       showing either, put one of them back. Nothing else in this file has to
       remember to — and when something new is added, it cannot reintroduce
       the blank screen, because the blank screen is repaired underneath it.

       Cheap: two class reads and a querySelector on a page that is otherwise
       idle, and it does nothing at all unless the page is actually empty.
       ============================================================ */
    function listShowing(){
      /* The shelf is a tab of its own and it lives OUTSIDE the catalogue —
         and library mode hides the catalogue outright (body.library
         #catalogue{display:none}). So asking the catalogue alone whether the
         list was showing answered "no" at exactly the moment the reader
         opened their own collection, and the watchdog below, finding
         nothing on screen, took them to the field. The shelf is part of the
         list; it counts. */
      const up = el => el
        && !el.hidden
        && el.offsetParent !== null
        && getComputedStyle(el).visibility !== 'hidden';

      if (up(savedTab)) return true;
      if (!up(catalogue)) return false;
      return !!catalogue.querySelector('.item:not([hidden]), .nation:not([hidden]) > summary');
    }

    function guardBlank(){
      // a transition is a legitimate reason for one view to be down; a
      // record being folded away is still something on screen
      if (!explore.hidden) return;
      if (listShowing()) return;
      if (document.body.classList.contains('solo-closing')) return;

      /* Nothing. Whatever was meant to happen did not. The catalogue is put
         back first because it is the cheaper repair and the likelier fault —
         field-returning is the only thing that hides it, and it is only ever
         meant to be on for half a second. */
      document.body.classList.remove('field-returning');
      if (listShowing()) return;

      // still nothing: the field is the archive's resting state, so it wins
      dockForced = true;
      openExplore();
    }

    setInterval(guardBlank, 300);

    window.addEventListener('resize', () => { if (!explore.hidden) fitSpiral(); });

    /* ============================================================
       DOCK DRAGGING — the three buttons can be put anywhere
       ============================================================ */
    (function makeDockDraggable(){
      let id = null, sx = 0, sy = 0, ox = 0, oy = 0, moved = false;

      /* Press and hold on any of the three buttons to pick the dock up.
         A hold is what separates moving it from pressing it, so a plain
         click still works and the middle button keeps its swipe. */
      let armed = false, holdTimer = null;

      dock.addEventListener('pointerdown', e => {
        if (e.target.closest('input')) return;      // typing, not dragging
        const r = dock.getBoundingClientRect();
        id = e.pointerId; sx = e.clientX; sy = e.clientY;
        ox = r.left; oy = r.top; moved = false; armed = false;
        clearTimeout(holdTimer);
        holdTimer = setTimeout(() => { armed = true; }, 280);
        // NB: no pointer capture here. Capturing on pointerdown retargets
        // the click to the dock, so the buttons inside stop responding.
      });

      dock.addEventListener('pointermove', e => {
        if (e.pointerId !== id) return;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        if (!armed){
          // moved off before the hold registered — that is a swipe, not a lift
          if (Math.hypot(dx, dy) > 8) clearTimeout(holdTimer);
          return;
        }
        if (!moved){
          moved = true;
          dock.classList.add('moved','dragging');
          dock.setPointerCapture(id);                   // only once dragging
        }
        const r = dock.getBoundingClientRect();
        const nx = Math.max(6, Math.min(window.innerWidth  - r.width  - 6, ox + dx));
        const ny = Math.max(6, Math.min(window.innerHeight - r.height - 6, oy + dy));
        dock.style.setProperty('--dx', nx + 'px');
        dock.style.setProperty('--dy', ny + 'px');
      });

      ['pointerup','pointercancel'].forEach(t => dock.addEventListener(t, e => {
        if (e.pointerId !== id) return;
        id = null;
        clearTimeout(holdTimer);
        armed = false;
        dock.classList.remove('dragging');
        if (moved){
          // swallow the click that would otherwise fire on release
          const kill = ev => { ev.stopPropagation(); ev.preventDefault(); };
          dock.addEventListener('click', kill, { capture:true, once:true });
        }
      }));
    })();

    /* ============================================================
       SITE HEADER — three ways off the archive
       The archive and the home page are separate documents, so every one
       of these is a page load. What differs is how much of the home page
       the reader is made to sit through on the way back in:

         mark   →  /          the front door: the mark draws, and waits
         star   →  /#home     already inside, at the top, nothing replayed
         index  →  /#footer   already inside and landed on the footer, so
                              scrolling up is what brings the page back

       The page fades before it goes. Without it the hand-over between two
       documents reads as a flash rather than a move, which is the whole
       reason body.leaving exists.
       ============================================================ */

    /* ---------- the mark stands down once the page moves ----------
       It is fixed over content that scrolls underneath it; anywhere but the
       top of the page it is sitting on top of something. 24px is past the
       first flick of a trackpad and well short of a deliberate scroll. */
    (function markOnScroll(){
      let on = null;
      function sync(){
        const past = window.scrollY > 24;
        if (past === on) return;          // only touch the class when it changes
        on = past;
        document.body.classList.toggle('scrolled', past);
      }
      window.addEventListener('scroll', sync, { passive:true });
      sync();
    })();

    const siteHead = document.getElementById('siteHead');
    const hdTrace  = document.getElementById('hdTrace');
    if (siteHead && hdTrace){
      /* The corner mark does not draw any more, so nothing measures it and
         nothing dashes it — a dash offset left behind by a removed animation
         is a mark that never appears at all. */

      /* ---------- THE CURSOR LEAVES ----------
         With the pointer off the page there is nobody to hover the header,
         and it sits pale over whatever is underneath it. It fills instead:
         the same near-black it takes under the cursor, so the mark and the
         two tools read at full strength for anyone glancing at the tab, a
         screenshot, or a second monitor.

         mouseleave on the document fires when the pointer crosses the
         viewport edge and nowhere else — moving between elements inside the
         page does not reach it. A touch device never fires either of these,
         so it simply never lights, which is right: there is no cursor to
         have left. */
      const litOff = () => siteHead.classList.remove('head-lit');
      document.addEventListener('mouseleave', () => siteHead.classList.add('head-lit'));
      document.addEventListener('mouseenter', litOff);
      // a press anywhere is a pointer that is plainly back
      document.addEventListener('pointerdown', litOff);
      window.addEventListener('blur', () => siteHead.classList.add('head-lit'));
      window.addEventListener('focus', litOff);
    }

    let leaving = false;
    function leaveTo(href){
      if (leaving) return;              // a second press must not re-arm it
      leaving = true;
      document.body.classList.add('leaving');
      // matches the .3s on body's opacity transition
      setTimeout(() => { window.location.href = href; }, 300);
    }

    const hdMark  = document.getElementById('hdMark');
    const hdHome  = document.getElementById('hdHome');
    const hdIndex = document.getElementById('hdIndex');
    if (hdMark)  hdMark.addEventListener('click',  e => { e.preventDefault(); leaveTo('/#home'); });
    if (hdHome)  hdHome.addEventListener('click',  e => { e.preventDefault(); leaveTo('/#home'); });
    if (hdIndex) hdIndex.addEventListener('click', e => { e.preventDefault(); leaveTo('/#footer'); });
    const hdColl = document.getElementById('hdColl');
    if (hdColl)  hdColl.addEventListener('click',  e => { e.preventDefault(); leaveTo('/collections'); });

    pruneSaved();
    paintSaved();

    /* ---------- WHICH DOOR THE ARCHIVE OPENS ON ----------

       On a desktop, the field. Explore IS the archive's front door and its
       own bar is where the searching happens; opening straight into it
       means the first thing anyone sees is the garments.

       On a phone, the list. The field asks a phone to decode seventy-seven
       photographs before it can show anything at all, and it was taking so
       long that the archive read as broken. The list asks for none of them
       — every nation arrives shut — and the garments are fetched a tab at a
       time, by the reader, in the order they actually want them. The field
       is one press away on the middle button, which opens on the circle so
       that press is obvious.

       The dock is left CLOSED here. Opening it puts the caret in the search
       field, and a caret on a phone is a keyboard over half the screen
       before the reader has asked for one. */
    /* Narrow AND touched. Width alone is the wrong question: a desktop
       window dragged narrow, or a page that happens to lay out before the
       window has settled, would be sent to the list when it has all the
       memory in the world for the field. A coarse pointer is the stable
       half of the answer and does not change under the page's feet. */
    const SMALL = window.matchMedia('(max-width: 760px)').matches
               && window.matchMedia('(pointer: coarse)').matches;

    dockForced = true;
    setFaceMode('explore');
    setFace(0, true);

    if (SMALL){
      nationsOpen = true;
      setBrowsing(true);
      document.body.classList.add('dock-list');
      filter();
      syncGhost();
      collapseDock();
      updateDock();
    } else {
      openExplore();
      openDock();
      updateDock();
    }
    startSuggestions();   // the running suggestion is the bar's own prompt

    /* ---------- ARRIVING AT ONE GARMENT ----------
       /archive/<n> is a real file that hands over to #g=<n>; either way the
       garment is opened on its own, in the tab view, without the field
       having to be built and torn down first. Back and forward move between
       the garment and the archive the way they would between two pages. */
    function openNumber(n){
      const id = NO_GARMENT.get(Number(n));
      if (!id) return false;
      if (!explore.hidden) endExplore(false);
      soloId = id;
      lastExploreItem = null;
      nationsOpen = true;
      document.body.classList.add('browsing');
      const nation = id.split('/')[0];
      const tab = allNations.find(d => d.dataset.nation === nation);
      if (tab) tab.open = true;
      q.value = '';
      filter();
      syncChrome();
      setFaceMode('list');
      setFace(0, true);
      document.body.classList.add('dock-list');
      collapseDock();
      updateDock();
      markUrl(id);
      return true;
    }

    function wantedNumber(){
      const m = location.pathname.match(/^\/archive\/(\d+)\/?$/)
             || location.hash.match(/^#g=(\d+)$/);
      return m ? Number(m[1]) : 0;
    }

    (function arriveAtGarment(){
      const n = wantedNumber();
      if (n) setTimeout(() => openNumber(n), 60);
    })();

    window.addEventListener('popstate', () => {
      const n = wantedNumber();
      if (n){ openNumber(n); return; }
      // back to the archive itself
      if (soloId || document.body.classList.contains('single-result')){
        dockForced = true;
        returnToExplore(true);
      }
    });

    /* The page signs itself, under the bar, in the same hand everything
       else on the site is written in. It was printed there; the archive
       types out its tally and its record and its empty line, and this is
       the one piece of writing on the page that simply appeared. */
    setTimeout(() => {
      bmuWrite(document.getElementById('foot'),
               'British Material Unit (BMU) — Archive', 26);
    }, SMALL ? 420 : 900);
  </script>
</body>
</html>
