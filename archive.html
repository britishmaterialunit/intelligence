<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Archive— an open archive of military surplus." />
  <meta name="keywords" content="British army surplus, military surplus, archive, military archive, army archive, clothing, DPM smock, MTP smock, PLCE bergen, British surplus trousers, surplus webbing, upcycled military clothing, genuine issue, BMU archive, surplus catalogue" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="canonical" href="https://britishmaterialunit.com/archive" />
  <link rel="icon" href="bmufavicon.svg" type="image/svg+xml" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://britishmaterialunit.com/archive" />
  <meta property="og:site_name" content="British Material Unit (BMU)" />
  <meta property="og:title" content="BMU Archive" />
  <meta property="og:description" content="An open archive of genuine-issue British military surplus." />
  <meta property="og:locale" content="en_GB" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="BMU Archive" />
  <meta name="twitter:description" content="DPM, MTP and OG stock — smocks, trousers, bergens, webbing and equipment catalogued by British Material Unit." />

  <title>Archive | BMU</title>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "@id": "https://britishmaterialunit.com/archive#catalogue",
    "name": "BMU Archive",
    "url": "https://britishmaterialunit.com/archive",
    "description": "Archive of British military surplus.",
    "isPartOf": { "@id": "https://britishmaterialunit.com/#website" }
  }
  </script>

  <style>
    :root{
      --ink:#222222;
      --line:#000000;
      --bg:#ffffff;
      --faint:#f0f0f0;
      --font:Helvetica, Arial, sans-serif;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:var(--font);
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      align-items:center;
      /* top pad clears the fixed header, not just the edge of the page */
      padding:66px 16px 150px;
      -webkit-font-smoothing:antialiased;
    }
    /* auto margins centre the archive in the viewport when it is short
       (all tabs shut) and simply collapse once it outgrows the screen —
       unlike justify-content:center, this never clips the top */
    .wrap{ width:min(94vw, 880px); margin:auto 0; }

    /* ---------- fixed bottom bar ----------
       On arrival the archive is only this: a search bar and its footer
       line. Tabs, explore and the dock are all summoned from here. */
    #bottomBar{
      position:fixed;
      left:50%;
      bottom:0;
      transform:translateX(-50%);
      width:min(90vw, 880px);
      z-index:70;
      padding:12px 0 14px;
      background:var(--bg);
    }
    #bottomBar #foot{ margin-top:10px; }
    #bottomBar{
      transition:transform .72s cubic-bezier(.35,0,.2,1), opacity .55s ease;
    }
    /* explore takes the screen: the main bar drops away and the dock's
       own bar becomes the only instrument */
    body.exploring #bottomBar,
    body.dock-open #bottomBar,
    body.tab-open #bottomBar{
      transform:translateX(-50%) translateY(130%);
      opacity:0;
      pointer-events:none;
    }

    /* the catalogue only exists once the reader asks for it */
    #shell{ display:none; }
    body.browsing #shell{ display:block; }
    body.library #catalogue{ display:none; }
    #savedTab .bm{ width:16px; height:16px; flex:none; fill:currentColor; stroke:currentColor; }

    /* the empty page asks a question rather than sitting blank */
    #prompt{
      position:fixed;
      left:50%; top:46%;
      transform:translate(-50%, -50%);
      z-index:20;
      font-size:15px;
      letter-spacing:.04em;
      color:#999;
      white-space:nowrap;
      pointer-events:none;
      transition:opacity .4s ease;
    }
    body.browsing #prompt, body.exploring #prompt{ opacity:0; }
    /* the plate answers the same question the prompt is asking, in the
       same place — the prompt stands down rather than showing through it */
    body.no-data #prompt{ opacity:0; }

    /* ---------- search ---------- */
    .search{
      position:relative;
      margin-bottom:0;
    }
    .search input{
      width:100%;
      font-family:var(--font);
      font-size:12px;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:var(--ink);
      background:transparent;
      border:1.5px solid var(--line);
      padding:13px 68px 13px 42px;
      outline:none;
      border-radius:0;
      -webkit-appearance:none;
      position:relative;
      z-index:2;
    }
    /* the live suggestion sits behind the input, so the real placeholder
       must stay invisible — the input itself is transparent */
    .search input::placeholder{ color:transparent; }
    /* kill the browser's own clear button so only our grey ✕ remains */
    .search input::-webkit-search-cancel-button,
    .search input::-webkit-search-decoration,
    #dq::-webkit-search-cancel-button,
    #dq::-webkit-search-decoration{
      -webkit-appearance:none;
              appearance:none;
      display:none;
    }
    .search input:focus{ background:var(--faint); }

    .search .icon{
      position:absolute;
      top:50%; left:14px;
      transform:translateY(-50%);
      width:16px; height:16px;
      z-index:3;
      pointer-events:none;
      display:block;
    }

    /* typed suggestion — mirrors the input's metrics exactly so the
       text lands on the same baseline as anything the user types */
    .search .ghost{
      position:absolute;
      top:0; left:0; right:0; bottom:0;
      z-index:1;
      display:flex;
      align-items:center;
      padding:13px 68px 13px 42px;
      font-family:var(--font);
      font-size:12px;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:#aaa;
      pointer-events:none;
      white-space:nowrap;
      overflow:hidden;
    }
    .search .ghost[hidden]{ display:none; }
    /* the suggestion dissolves as it runs up on the icons rather than
       being sliced off by them */
    .search .ghost{
      transition:opacity .18s linear;
      -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 86px), transparent calc(100% - 62px));
              mask-image:linear-gradient(to right, #000 calc(100% - 86px), transparent calc(100% - 62px));
    }
    .search .ghost .caret{
      display:inline-block;
      width:1px;
      height:1.05em;
      margin-left:2px;
      background:#aaa;
      vertical-align:middle;
    }
    .search .ghost .caret.blink{ animation:caret 1s steps(1,end) infinite; }
    @keyframes caret{ 0%,50%{ opacity:1; } 50.01%,100%{ opacity:0; } }
    @media (prefers-reduced-motion:reduce){
      .search .ghost .caret.blink{ animation:none; }
    }
    /* the ✕ and the navigate star share one slot and cross-fade:
       star while the field is empty, ✕ once there is a term */
    /* the flag sits immediately left of the navigate mark, greyed until
       it is doing something */
    .search .flagtoggle{
      position:absolute;
      top:50%; right:36px;
      transform:translateY(-50%);
      width:26px; height:28px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:transparent;
      border:none;
      padding:0;
      cursor:pointer;
      z-index:3;
    }
    /* contrast past the pivot turns the red and blue solid black while
       the white field stays white — no colour in the furniture */
    .search .flagtoggle img{
      display:block;
      height:12px; width:auto;
      filter:grayscale(1) contrast(1000%) opacity(.32);
      transition:filter .3s ease;
    }
    .search .flagtoggle:hover img{ filter:grayscale(1) contrast(1000%); }
    .search .flagtoggle[aria-pressed="true"] img{ filter:grayscale(1) contrast(1000%); }

    .search .clear,
    .search .navtoggle{
      position:absolute;
      top:50%; right:6px;
      transform:translateY(-50%);
      width:28px; height:28px;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:3;
      font-family:var(--font); font-size:13px; line-height:1;
      color:#888;
      background:transparent;
      border:none;
      padding:0;
      cursor:pointer;
      transition:opacity .28s ease, color .2s ease;
    }
    .search .clear:hover,
    .search .navtoggle:hover{ color:var(--ink); }
    .search .clear{ opacity:0; pointer-events:none; }
    .search.has-term .clear{ opacity:1; pointer-events:auto; }
    .search.has-term .navtoggle{ opacity:0; pointer-events:none; }
    .search .navtoggle img{
      display:block; width:13px; height:13px;
      opacity:.3;
      transition:opacity .3s ease;
    }
    .search .navtoggle:hover img{ opacity:.65; }
    .search .navtoggle[aria-pressed="true"] img{ opacity:1; }

    .count-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:26px;
    }
    #savedBtn{
      display:flex;
      align-items:center;
      gap:7px;
      background:transparent;
      border:none;
      padding:4px 2px;
      cursor:pointer;
      color:#bbb;
      font-family:var(--font);
      font-size:10px;
      letter-spacing:.16em;
      transition:color .3s ease;
    }
    #savedBtn:hover{ color:#777; }
    #savedBtn[aria-pressed="true"]{ color:var(--ink); }
    /* outline by default, filled once it holds something */
    .bm{
      display:block;
      fill:none;
      stroke:currentColor;
      stroke-width:1.4;
      stroke-linejoin:round;
      transition:fill .35s ease, transform .3s cubic-bezier(.3,1.6,.5,1);
    }
    [aria-pressed="true"] > .bm{ fill:currentColor; }
    .bm.pop{ animation:bmPop .45s cubic-bezier(.3,1.5,.5,1); }
    @keyframes bmPop{
      0%  { transform:scale(1); }
      45% { transform:scale(1.35); }
      100%{ transform:scale(1); }
    }

    .count{
      font-size:10px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:#888;
      min-height:1.2em;
    }

    /* ---------- nation dropdowns ---------- */
    .nation{
      border:1.5px solid var(--line);
      margin-bottom:10px;
      transform-origin:top center;
    }
    /* tabs topple in like pages falling flat, and fold back on the way out */
    body.browsing .nation{ animation:toppleIn .46s cubic-bezier(.2,.75,.3,1) backwards; }
    body.closing-tabs .nation{ animation:toppleOut .34s cubic-bezier(.5,0,.75,.4) forwards; }
    @keyframes toppleIn{
      from{ opacity:0; transform:perspective(760px) rotateX(-34deg) translateY(-16px); }
      to  { opacity:1; transform:none; }
    }
    @keyframes toppleOut{
      from{ opacity:1; transform:none; }
      to  { opacity:0; transform:perspective(760px) rotateX(-26deg) translateY(-12px); }
    }
    @media (prefers-reduced-motion:reduce){
      body.browsing .nation, body.closing-tabs .nation{ animation:none; }
    }
    .nation > summary{
      list-style:none;
      cursor:pointer;
      padding:14px 16px;
      display:flex;
      align-items:center;
      gap:12px;
      font-size:11px;
      letter-spacing:.18em;
      text-transform:uppercase;
      font-weight:bold;
      transition:background-color .3s ease;
    }
    .nation > summary::-webkit-details-marker{ display:none; }
    .nation > summary:hover{ background:var(--faint); }
    /* flag sits left of the nation name. Height is fixed and width is
       left to the image so each ensign keeps its true ratio — the UK's
       3:5 and the USA's 1.9:1 are not the same shape. */
    .nation > summary .flag{
      flex:none;
      height:13px;
      width:auto;
      max-width:26px;
      display:block;
    }
    /* the one nation we can't name gets an empty dashed slot */
    .nation > summary .flag.none{
      width:20px;
      height:13px;
      border:1px dashed rgba(0,0,0,.35);
      background:transparent;
    }
    .nation > summary .n{ flex:none; }
    .nation > summary .qty{
      flex:1;
      margin-left:-6px;          /* sits just after the name, not adrift */
      font-weight:normal;
      letter-spacing:.14em;
      color:#888;
    }
    .nation > summary .sign{
      flex:none;
      width:11px;
      text-align:right;
      color:#888;
      font-weight:bold;
    }
    .nation[open] > summary .sign::after{ content:"–"; }
    .nation:not([open]) > summary .sign::after{ content:"+"; }
    .nation[open] > summary{ border-bottom:1.5px solid var(--line); }
    .nbody{ padding:18px 16px 22px; }

    .section-label{
      margin:26px 0 14px;
      font-size:10px;
      letter-spacing:.18em;
      text-transform:uppercase;
      font-weight:bold;
      border-bottom:1.5px solid var(--line);
      padding-bottom:7px;
    }
    .group:first-child > .section-label{ margin-top:0; }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
      gap:14px;
    }
    .item{
      border:1.5px solid var(--line);
      background:var(--bg);
      display:flex;
      flex-direction:column;
      transition:background-color .3s ease;
    }
    .item:hover{ background:var(--faint); }
    /* .item sets display:flex, which outranks the UA rule for [hidden] —
       without this, filtered-out cards stay on screen */
    .item[hidden], .group[hidden], .nation[hidden]{ display:none !important; }
    .item .slot{
      aspect-ratio:1 / 1;
      border-bottom:1.5px solid var(--line);
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
    }
    .item .slot img{
      width:100%; height:100%;
      object-fit:cover; display:block;
    }
    .item .slot .pending{
      padding:8px;
      font-size:9.5px;
      letter-spacing:.06em;
      color:#aaa;
      text-align:center;
      word-break:break-all;
    }
    /* meta grows to fill the card so the action row can be pinned to the
       bottom — titles vary in length, the buttons must not */
    .item .meta{
      padding:10px 12px 12px;
      display:flex;
      flex-direction:column;
      flex:1;
    }
    .item .name{
      font-size:12px;
      font-weight:bold;
      line-height:1.4;
    }
    .name-row{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }
    .btn-save-inline{
      flex:none;
      background:transparent;
      border:none;
      padding:0;
      margin-top:1px;
      color:#c9c9c9;
      cursor:pointer;
      transition:color .3s ease;
    }
    .btn-save-inline:hover{ color:#888; }
    .btn-save-inline[aria-pressed="true"]{ color:var(--ink); }

    .item .tag{
      display:block;
      margin-top:4px;
      font-size:10px;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:#888;
    }
    .item .ref{
      display:block;
      margin-top:6px;
      font-size:9.5px;
      letter-spacing:.14em;
      color:#aaa;
    }

    /* ---------- a single garment, on its own ----------
       The card turns on its side so the record and the request form open
       beside the garment instead of pushing down below it. */
    body.single-result .section-label{ display:none; }
    body.single-result .item .tag{ display:none; }
    body.single-result .nation > summary .qty{ display:none; }
    /* .qty was the spacer holding the sign right; without it the sign
       collapsed against the title */
    body.single-result .nation > summary .n{ flex:1; }
    body.single-result .grid{
      grid-template-columns:1fr;
      justify-items:center;
    }
    body.single-result .item{
      flex-direction:row;
      width:min(94vw, 760px);
      align-items:stretch;
      transition:width .62s cubic-bezier(.4,0,.2,1);
    }
    body.single-result .item .slot{
      flex:0 0 46%;
      aspect-ratio:auto;
      border-bottom:none;
      border-right:1.5px solid var(--line);
      transition:flex-basis .62s cubic-bezier(.4,0,.2,1),
                 border-right-color .3s ease .28s;
    }
    body.single-result .item .meta{
      flex:1 1 auto;
      padding:16px 18px 18px;
      opacity:1;
      transition:opacity .42s ease .2s,
                 flex-basis .62s cubic-bezier(.4,0,.2,1);
    }

    /* a lone garment does not fold in — it is drawn, named, then shifted */
    body.single-result .nation{ animation:none !important; }

    /* the build state must arrive instantly, not animate into itself —
       otherwise the card visibly shrinks before it grows */
    body.single-result .item.no-anim,
    body.single-result .item.no-anim *{ transition:none !important; }

    /* First the garment stands alone in its own box, centred; only once
       the frame has drawn does it move aside and let the record in. */
    body.single-result .item.build{
      width:min(80vw, 520px);
      border-color:transparent;      /* nothing, until the line draws it */
    }
    /* once the line has closed, the card's own border takes over */
    body.single-result .item.build.framed{ border-color:var(--line); }
    body.single-result .item{ transition:width .62s cubic-bezier(.4,0,.2,1),
                                         border-color .32s ease; }
    body.single-result .item.build .slot{
      flex-basis:100%;
      aspect-ratio:1 / 1;
    }

    /* every edge is drawn rather than switched on */
    body.single-result .item{ border-color:var(--line); }
    body.single-result .item .slot{ position:relative; border-right:none; }
    body.single-result .item .slot::after{
      content:"";
      position:absolute;
      top:0; right:0; bottom:0;
      width:1.5px;
      background:var(--line);
      transform:scaleY(0);
      transform-origin:top center;
      transition:transform .5s cubic-bezier(.4,0,.2,1);
    }
    body.single-result .item:not(.build) .slot::after{ transform:scaleY(1); }

    body.single-result .item .actions .btn-line,
    body.single-result .item .req-send{
      clip-path:inset(0 100% 0 0);
      transition:clip-path .42s cubic-bezier(.4,0,.2,1);
    }
    body.single-result .item:not(.build) .actions .btn-line,
    body.single-result .item:not(.build) .req-send{ clip-path:inset(0 0 0 0); }
    body.single-result .item:not(.build) .actions .btn-line:nth-child(2){
      transition-delay:.1s;
    }
    body.single-result .item .name-row{
      clip-path:inset(0 100% 0 0);
      transition:clip-path .45s cubic-bezier(.4,0,.2,1) .06s;
    }
    body.single-result .item:not(.build) .name-row{ clip-path:inset(0 0 0 0); }
    body.single-result .item.build .meta{
      opacity:0;
      flex:0 0 0px;
      min-width:0;          /* content was holding a sliver open */
      padding-left:0;
      padding-right:0;
      overflow:hidden;
    }
    body.single-result .item .name{ font-size:14px; }
    body.single-result .item:hover{ background:var(--bg); }

    @media (max-width:640px){
      body.single-result .item{ flex-direction:column; width:100%; }
      body.single-result .item .slot{
        flex:none;
        aspect-ratio:1 / 1;
        border-right:none;
        border-bottom:1.5px solid var(--line);
      }
    }

    /* ---------- opening a garment's record ----------
       The frame draws itself around the garment, then the garment settles
       left and its record arrives beside it. Reversed on the way out. */
    .solo-frame{
      position:absolute;
      inset:0;
      width:100%; height:100%;
      pointer-events:none;
      overflow:visible;
      z-index:3;
    }
    .solo-frame rect{
      fill:none;
      stroke:var(--line);
      stroke-width:1.5;
    }
    body.single-result .item{ position:relative; }
    body.single-result .item.unbuild .meta{ animation:metaLeave .3s ease both; }
    @keyframes metaLeave{
      from{ opacity:1; transform:none; }
      to  { opacity:0; transform:translateX(14px); }
    }
    @media (prefers-reduced-motion:reduce){
      body.single-result .item.build .meta,
      body.single-result .item.build .slot,
      body.single-result .item.unbuild .meta{ animation:none; }
    }

    /* ---------- actions: always the last thing in the card ---------- */
    .actions{
      display:flex;
      gap:8px;
      margin-top:auto;          /* pins the row to the bottom of the card */
      padding-top:12px;
    }
    .btn-line{
      flex:1 1 0;
      min-width:0;
      padding:7px 0;
      font-family:var(--font);
      font-size:9.5px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--ink);
      background:var(--bg);
      border:1.5px solid var(--line);
      cursor:pointer;
      transition:background-color .3s ease, color .3s ease;
    }
    .btn-line:hover{ background:var(--faint); }
    .btn-save{
      flex:0 0 34px;
      padding:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--bg);
      border:1.5px solid var(--line);
      color:#c2c2c2;
      cursor:pointer;
      transition:color .3s ease, background-color .3s ease;
    }
    .btn-save:hover{ background:var(--faint); color:#888; }
    .btn-save[aria-pressed="true"]{ color:var(--ink); }

    .btn-line[hidden]{ display:none; }

    /* ---------- request ---------- */
    .req-panel, .info-panel{
      display:none;
      margin-top:12px;
      border-top:1.5px solid var(--line);
      padding-top:12px;
    }
    .req-panel.open, .info-panel.open{ display:block; }

    .req-row label{
      display:block;
      margin-bottom:6px;
      font-size:9px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:#888;
    }
    .req-qty{ display:flex; align-items:center; }
    .req-qty input[type=range]{
      flex:1;
      min-width:0;
      height:16px;
      accent-color:var(--line);
      cursor:pointer;
    }
    /* the value is plain text centred in the space between the end of
       the slider and the right edge of the card — no input chrome */
    .req-qty .qtyval{
      flex:0 0 54px;
      text-align:center;
      font-size:12px;
      font-weight:bold;
      color:var(--ink);
      font-variant-numeric:tabular-nums;
    }
    /* no heading above this one — the placeholder carries it */
    .req-email{
      display:block;
      width:100%;
      margin-top:12px;
      font-family:var(--font);
      font-size:11px;
      color:var(--ink);
      background:var(--bg);
      border:1.5px solid var(--line);
      padding:7px 8px;
      outline:none;
      border-radius:0;
      -webkit-appearance:none;
    }
    .req-email:focus{ background:var(--faint); }

    .req-send{
      display:block;
      width:100%;
      margin-top:12px;
      padding:8px 0;
      font-family:var(--font);
      font-size:9.5px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--bg);
      background:var(--line);
      border:1.5px solid var(--line);
      cursor:pointer;
      transition:opacity .3s ease;
    }
    .req-send:hover{ opacity:.78; }
    .req-msg{
      margin-top:8px;
      font-size:9.5px;
      letter-spacing:.08em;
      line-height:1.5;
      color:#888;
    }
    .req-msg:empty{ display:none; }

    .info-panel{
      font-size:10.5px;
      line-height:1.65;
      color:#555;
      white-space:pre-wrap;
    }

    /* ---------- empty state ---------- */
    .empty{
      border:1.5px solid var(--line);
      padding:22px 18px;
      text-align:center;
      overflow:hidden;              /* the reel is clipped by the box */
    }
    .empty[hidden]{ display:none; }

    .empty-line{
      font-size:11px;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:#888;
      min-height:1.2em;
    }
    /* the message falls away like a slot reel turning over */
    .empty-line.drop{ animation:slotdrop .46s cubic-bezier(.4,0,.2,1) forwards; }
    @keyframes slotdrop{
      to{ transform:translateY(30px); opacity:0; }
    }

    .flag-strip{
      margin-top:-18px;             /* takes the space the message vacated */
      opacity:0;
      transform:translateY(-24px);
    }
    .flag-strip[hidden]{ display:none; }
    .flag-strip.in{ animation:slotin .42s cubic-bezier(.3,0,.2,1) forwards; }
    @keyframes slotin{
      to{ opacity:1; transform:translateY(0); }
    }

    .flag-rail{
      display:flex;
      gap:22px;
      justify-content:safe center;   /* stays centred until it overflows */
      align-items:flex-start;
      overflow-x:auto;
      overscroll-behavior-x:contain; /* hard stop at each end, no chaining */
      scroll-snap-type:x proximity;
      padding:2px;
      scrollbar-width:none;
      -ms-overflow-style:none;
    }
    .flag-rail::-webkit-scrollbar{ display:none; }
    /* only once it actually overflows do the ends dissolve round the corner */
    .flag-rail.overflowing{
      -webkit-mask-image:linear-gradient(to right, transparent 0, #000 52px, #000 calc(100% - 52px), transparent 100%);
              mask-image:linear-gradient(to right, transparent 0, #000 52px, #000 calc(100% - 52px), transparent 100%);
    }

    .flag-pick{
      flex:none;
      scroll-snap-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:7px;
      padding:6px 4px;
      background:transparent;
      border:none;
      cursor:pointer;
      font-family:var(--font);
      opacity:.75;
      transition:opacity .25s ease, transform .25s ease;
    }
    .flag-pick:hover{ opacity:1; transform:translateY(-2px); }
    .flag-pick img{ height:20px; width:auto; display:block; }
    .flag-pick span{
      font-size:9px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:#888;
      white-space:nowrap;
    }
    /* closest match to what they mistyped */
    .flag-pick.suggested{ opacity:1; }
    .flag-pick.suggested span{ color:var(--ink); font-weight:bold; }

    .note{
      margin-top:40px;
      border:1.5px solid var(--line);
      padding:16px 18px;
      font-size:11.5px;
      line-height:1.6;
      color:#555;
    }
    .note b{ color:var(--ink); }

    nav.back{ margin-top:36px; text-align:center; }
    /* matches index.html's .bm-button metrics so the button that flies
       across the transition is the same object at both ends */
    .bm-button{
      display:inline-block;
      width:150px; height:40px; line-height:37px;
      font-family:var(--font); font-size:13px;
      color:#000; text-decoration:none;
      border:1.5px solid var(--line);
      background:var(--bg);
      cursor:pointer; text-align:center;
      white-space:nowrap;
      transition:background-color .3s ease, color .3s ease;
    }
    .bm-button:hover{ background:var(--faint); color:#444; }

    footer{
      margin-top:30px;
      font-size:10.5px;
      color:#999;
      text-align:center;
      letter-spacing:.06em;
    }

    /* ============================================================
       EXPLORE — the whole archive as one spiral, pannable and zoomable
       ============================================================ */
    #explore{
      position:fixed;
      inset:0;
      z-index:40;
      background:var(--bg);
      overflow:hidden;
      cursor:grab;
      touch-action:none;
    }
    #explore[hidden]{ display:none; }
    #explore.grabbing{ cursor:grabbing; }

    #spiral{
      position:absolute;
      left:50%;
      top:50%;
      width:0; height:0;
      transform-origin:0 0;
      will-change:transform;
    }
    /* garments sit as isolated cut-outs, no frame — the cards are built
       large so zooming in resolves real detail rather than a blur */
    .sp-item{
      position:absolute;
      width:150px;
      transform:translate(-50%, -50%);
      cursor:pointer;
      opacity:0;
      animation:spIn .5s ease forwards;
    }
    @keyframes spIn{ to{ opacity:1; } }
    .sp-item .sp-slot{
      width:150px; height:150px;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:transform .2s ease;
    }
    .sp-item img{
      max-width:100%; max-height:100%;
      width:auto; height:auto;
      object-fit:contain;               /* never crop a garment */
      display:block;
    }
    .sp-item:hover .sp-slot{ transform:scale(1.06); }
    /* no lettering anywhere in explore — garments only. A garment with no
       photograph yet leaves a faint empty plot rather than a caption. */
    .sp-item.sp-dim{
      opacity:.06;
      pointer-events:none;
      transition:opacity .5s ease;
    }
    .sp-item .sp-code{
      width:100%; height:100%;
      border:1px dashed #f2f2f2;
      font-size:0;
    }

    #exploreHint{
      position:fixed;
      left:50%;
      top:18px;
      transform:translateX(-50%);
      z-index:41;
      font-size:9px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:#bbb;
      pointer-events:none;
    }

    /* ============================================================
       DOCK — floating navigation, only alive while the reader is
       inside an open nation tab and the real search bar has gone
       off screen. Collapsed it is two black squares; the left one
       opens out into a white search bar with the arrow beside it.
       ============================================================ */
    #dock{
      /* opened width sits between the nation tab's inner edge and the
         garment boxes' inner edge, so the arrow never touches the tab */
      --dock-w:calc(min(90vw, 880px) - 18px);
      position:fixed;
      left:50%;
      bottom:112px;                 /* clears the fixed search bar */
      transform:translateX(-50%) translateY(14px);
      z-index:80;
      display:flex;
      gap:10px;
      align-items:center;
      opacity:0;
      pointer-events:none;
      transition:opacity .28s ease, transform .28s ease;
      touch-action:none;
    }
    #dock.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
      pointer-events:auto;
    }
    /* once dragged it holds an absolute position and drops the centring */
    #dock.moved{
      left:0; top:0; bottom:auto;
      transform:translate(var(--dx), var(--dy));
    }
    #dock.moved.show{ transform:translate(var(--dx), var(--dy)); }
    #dock.dragging{ transition:none; cursor:grabbing; }

    /* with the main bar gone the dock drops to the bottom edge */
    body.tab-open #dock:not(.moved){ bottom:26px; }

    /* in explore the dock sits central but low, clear of the garments */
    body.exploring #dock:not(.moved){
      left:50%; top:auto; bottom:34px;
      transform:translateX(-50%);
    }

    /* the middle button carries a stack of tools */
    .face-stack{
      position:relative;
      display:block;
      width:16px; height:16px;
      overflow:hidden;
    }
    .face-stack .face{
      position:absolute;
      inset:0;
      width:16px; height:16px;
      opacity:0;
      transform:translateY(120%);
      transition:opacity .26s ease, transform .3s cubic-bezier(.4,0,.2,1);
    }
    .face-stack .face.is-on{ opacity:1; transform:translateY(0); }
    .face-stack .face.is-out{ opacity:0; transform:translateY(-120%); }
    /* the periodic reminder that this button carries more than one tool */
    #dockExplore.hinting .face.is-on{ animation:faceHint .9s ease; }
    @keyframes faceHint{
      0%,100%{ opacity:1; transform:translateY(0); }
      30%    { opacity:.25; transform:translateY(-22%); }
      60%    { opacity:1;   transform:translateY(0); }
    }

    /* tools living inside the dock's own search bar */
    .dq-tool{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:26px; height:28px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:transparent;
      border:none;
      padding:0;
      cursor:pointer;
      opacity:0;
      pointer-events:none;
      transition:opacity .26s ease;
      z-index:4;
    }
    .dghost{
      position:absolute;
      inset:0;
      z-index:1;
      display:flex;
      align-items:center;
      padding:0 96px 0 42px;
      font-family:var(--font);
      font-size:12px;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:#bbb;
      pointer-events:none;
      white-space:nowrap;
      overflow:hidden;
      opacity:0;
      transition:opacity .2s linear;
      -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 112px), transparent calc(100% - 92px));
              mask-image:linear-gradient(to right, #000 calc(100% - 112px), transparent calc(100% - 92px));
    }
    #dock.open .dghost{ opacity:1; }
    .dghost[hidden]{ display:none; }

    #dqFlag{ right:64px; }
    #dqExplore{ right:36px; }
    #dock.open .dq-tool{ opacity:1; pointer-events:auto; }
    #dqFlag img{ display:block; height:12px; width:auto; filter:grayscale(1) contrast(1000%) opacity(.35); transition:filter .3s ease; }
    #dqFlag[aria-pressed="true"] img{ filter:grayscale(1) contrast(1000%); }
    #dqExplore img{ display:block; width:13px; height:13px; }

    .dock-sq{
      flex:none;
      width:46px;
      height:46px;
      background:var(--line);
      border:1.5px solid var(--line);
      border-radius:0;              /* sharp edges */
      padding:0;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    #dockSearch{
      position:relative;
      overflow:hidden;
      justify-content:flex-start;
      transition:width .42s cubic-bezier(.65,0,.35,1),
                 background-color .34s ease;
    }
    /* opened: fills the bar width less the arrow square and its gap */
    #dock.open #dockSearch{
      width:calc(var(--dock-w) - 112px);   /* two 46px buttons + two 10px gaps */
      background:var(--bg);
      cursor:text;
    }

    #dockSearch .ico{
      position:absolute;
      left:14px;
      width:16px; height:16px;
      display:block;
      transition:opacity .3s ease;
    }
    #dockSearch .ico-b{ opacity:0; }
    #dock.open #dockSearch .ico-w{ opacity:0; }
    #dock.open #dockSearch .ico-b{ opacity:1; }

    #dq{
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      font-family:var(--font);
      font-size:12px;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:var(--ink);
      padding:0 96px 0 42px;   /* room for flag, explore and the ✕ */
      border-radius:0;
      -webkit-appearance:none;
      opacity:0;
      pointer-events:none;
      transition:opacity .26s ease;
    }
    #dq::placeholder{ color:#aaa; }
    #dock.open #dq{ opacity:1; pointer-events:auto; }

    #dockClear{
      position:absolute;
      right:8px; top:50%;
      transform:translateY(-50%);
      width:28px; height:28px;
      border:none;
      background:transparent;
      color:#c4c4c4;               /* deliberately faded */
      font-size:13px;
      line-height:1;
      cursor:pointer;
      opacity:0;
      pointer-events:none;
      transition:opacity .26s ease, color .2s ease;
    }
    #dock.open #dockClear{ opacity:1; pointer-events:auto; }
    #dockClear:hover{ color:var(--ink); }

    #dockLibrary{ color:#fff; }
    #dockLibrary .bm{ width:16px; height:16px; }
    #dockLibrary[aria-pressed="true"] .bm{ fill:#fff; }

    @media (max-width:640px){
      #dock{ bottom:16px; --dock-w:calc(88vw - 18px); }

      /* the suggestion is long and the phone is narrow: shrink it and
         fade it out before it reaches the flag and the star */
      .search input, .search .ghost{
        font-size:10px;
        letter-spacing:.04em;
        padding-right:78px;
      }
      #prompt{ font-size:13px; }
    }

    /* ---------- NO DATA SAVED ----------
       A white plate on a black rule that lifts into the middle of the page,
       holds long enough to be read, and takes itself away. It never takes
       the pointer: whatever the reader was doing carries on underneath. */
    #noData{
      position:fixed;
      left:50%; top:50%;
      transform:translate(-50%, calc(-50% + 10px));
      z-index:130;
      padding:22px 34px;
      background:var(--bg);
      border:1.5px solid var(--line);
      font-size:13px;
      letter-spacing:.09em;
      text-transform:uppercase;
      color:var(--ink);
      white-space:nowrap;
      pointer-events:none;
      opacity:0;
      transition:opacity .3s ease, transform .42s cubic-bezier(.2,.75,.3,1);
    }
    #noData.show{
      opacity:1;
      transform:translate(-50%, -50%);
    }
    @media (prefers-reduced-motion:reduce){
      #noData{ transition:opacity .2s linear; }
      #noData, #noData.show{ transform:translate(-50%, -50%); }
    }

    /* ---------- SITE HEADER ----------
       The same header the home page wears, so the archive reads as a room
       in the building rather than a separate site. See-through over the
       white page, near-black on hover, which is why the mark and the two
       tools are each built to read on either ground.

       Three ways out, differing only in how much of the home page the
       reader has to sit through again — see the handlers at the foot of
       the script. */
    #siteHead{
      position:fixed;
      top:0; left:0; right:0;
      z-index:75;
      height:54px;
      display:flex;
      align-items:center;
      background:transparent;
      transition:background-color .35s ease;
    }
    #siteHead:hover{ background:#262626; }

    /* the archive's own measure, so the corner mark sits on the same left
       edge as the catalogue and the tools on its right edge */
    #siteHead .hd-inner{
      width:min(94vw, 880px);
      height:100%;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .hd-mark{
      display:block;
      line-height:0;
      text-decoration:none;
      transition:opacity .45s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .hd-mark svg{ height:17px; width:auto; display:block; overflow:visible; }
    .hd-trace{
      fill:none;
      stroke:var(--ink);
      stroke-width:.4;
      transition:stroke .35s ease, opacity .3s ease;
    }
    /* draws ONCE, on arrival, and holds the outline after — forwards is
       what keeps it there; a loop makes the corner restless */
    #siteHead.armed .hd-trace{ animation:hd-draw 2.6s ease-in-out forwards; }
    @keyframes hd-draw{
      from { stroke-dashoffset:var(--hd-len); }
      to   { stroke-dashoffset:0; }
    }
    .hd-fill{
      fill:var(--ink);
      stroke:none;
      opacity:0;
      transition:opacity .35s ease, fill .35s ease;
    }
    #siteHead:hover .hd-trace{ animation-play-state:paused; opacity:0; }
    #siteHead:hover .hd-fill{ opacity:1; fill:#fff; }

    .hd-tools{ display:flex; align-items:center; gap:18px; }
    .hd-ico{
      display:block;
      line-height:0;
      padding:8px;
      margin:-8px;
      border:0;
      background:none;
      cursor:pointer;
      color:#999;
      transition:color .3s ease, transform .3s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .hd-ico svg{ display:block; width:15px; height:15px; }
    .hd-ico .ico-fill{ fill:currentColor; }
    .hd-ico .ico-stroke{
      fill:none;
      stroke:currentColor;
      stroke-width:1.6;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    #hdHome svg{ width:13px; height:13px; }
    #siteHead:hover .hd-ico{ color:#fff; }
    .hd-ico:hover{ color:#fff; transform:scale(1.1); }

    @media (max-width:640px){
      #siteHead{
        height:calc(46px + env(safe-area-inset-top));
        padding-top:env(safe-area-inset-top);
      }
    }
    @media (prefers-reduced-motion:reduce){
      #siteHead.armed .hd-trace{ animation:none; stroke-dashoffset:0; }
    }

    /* ---------- OPERATIONS DEPARTURE ----------
       Straight fade of the whole page, then hand over to index.html. */
    body{ transition:opacity .3s ease; }
    body.leaving{ opacity:0; pointer-events:none; }
    @media (prefers-reduced-motion:reduce){
      body{ transition:none; }
    }
  </style>
</head>
<body>
  <!-- SITE HEADER — the archive's way back to the site. The mark is the
       front door and resets the home page; the star returns to it already
       entered; the index drops the reader straight onto its footer, so
       scrolling up is what brings the home page itself back. -->
  <header id="siteHead">
   <div class="hd-inner">
    <a class="hd-mark" id="hdMark" href="/" aria-label="British Material Unit — home">
      <svg viewBox="0 9.1 32 13.6" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <path id="hdTrace" class="hd-trace" d="M32,15h-11s8-5.9,8-5.9h-3.5l-3.5,2.5h0c-.1.1-.4.3-.6.4l.6-.4h0l-3.3,2.4v-4.9h-2v4.9h0l-5.2-3.8c-1.4-1-2.9-1.1-2.9-1.1H0v2h8.8l1.6.9H0v2h13.3l1.3.9H0v2h14.6l-1.3.9H0v2h10.4l-1.6.9H0v2h8.7s1.5-.1,2.9-1.1l5.2-3.8h0v4.9h2v-4.9h0l5.2,3.8c1.4,1,2.9,1.1,2.9,1.1h5.1v-2h-4.5c-.7,0-2-.5-2.8-1.1l-3.7-2.7h11v-2h0Z"/>
        <path id="hdFill" class="hd-fill" d="M32,15h-11s8-5.9,8-5.9h-3.5l-3.5,2.5h0c-.1.1-.4.3-.6.4l.6-.4h0l-3.3,2.4v-4.9h-2v4.9h0l-5.2-3.8c-1.4-1-2.9-1.1-2.9-1.1H0v2h8.8l1.6.9H0v2h13.3l1.3.9H0v2h14.6l-1.3.9H0v2h10.4l-1.6.9H0v2h8.7s1.5-.1,2.9-1.1l5.2-3.8h0v4.9h2v-4.9h0l5.2,3.8c1.4,1,2.9,1.1,2.9,1.1h5.1v-2h-4.5c-.7,0-2-.5-2.8-1.1l-3.7-2.7h11v-2h0Z"/>
      </svg>
    </a>

    <nav class="hd-tools" aria-label="Leave the archive">
      <a class="hd-ico" id="hdHome" href="/" aria-label="Back to the site">
        <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <path class="ico-fill" d="M50 0 L59.3 41 L100 50 L59.3 59 L50 100 L40.7 59 L0 50 L40.7 41 Z"/>
        </svg>
      </a>
      <button class="hd-ico" id="hdIndex" type="button" aria-label="Go to the site index">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <g class="ico-stroke">
            <path d="M2.6 4.6 H13.4"/>
            <path d="M2.6 8 H13.4"/>
            <path d="M2.6 11.4 H13.4"/>
          </g>
        </svg>
      </button>
    </nav>
   </div>
  </header>

  <div class="wrap">
    <div id="shell">
      <div class="count-row">
        <div class="count" id="count"></div>
        <button type="button" id="savedBtn" aria-pressed="false" aria-label="Show saved garments">
          <svg class="bm" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 2.2 h8 v11.6 l-4 -3.1 -4 3.1 Z"/></svg>
          <span id="savedCount"></span>
        </button>
      </div>

      <details class="nation" id="savedTab" data-nation="saved" hidden>
        <summary>
          <svg class="bm" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path d="M4 2.2 h8 v11.6 l-4 -3.1 -4 3.1 Z"/>
          </svg>
          <span class="n">Saved</span>
          <span class="qty" id="savedTabQty">0</span>
          <span class="sign" aria-hidden="true"></span>
        </summary>
        <div class="nbody"><div class="grid" id="savedGrid"></div></div>
      </details>

      <main id="catalogue" aria-label="Military surplus archive"></main>
      <div class="empty" id="empty" hidden>
        <div class="empty-line" id="emptyLine"></div>
        <div class="flag-strip" id="flagStrip" hidden>
          <div class="flag-rail" id="flagRail"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="prompt" aria-hidden="true"></div>

  <!-- The bookmark with nothing behind it. Says so on a plate of its own
       rather than opening an empty section or changing the count line,
       which reads as a page fault rather than an answer. -->
  <div id="noData" role="status" aria-live="polite" aria-hidden="true">No Data Saved</div>

  <!-- EXPLORE — every garment in the archive as one spiral -->
  <div id="explore" hidden aria-hidden="true">
    <div id="spiral"></div>
  </div>

  <!-- the search bar is the page's fixed furniture; everything else
       is summoned from it -->
  <div id="bottomBar">
    <form class="search" role="search" onsubmit="return false;">
      <label for="q" class="sr-only" hidden>Search the archive</label>
      <img class="icon" src="/searchicon.svg" alt="" aria-hidden="true" width="16" height="16" />
      <div class="ghost" id="ghost" aria-hidden="true"></div>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search the archive" aria-label="Search the archive" />
      <button type="button" class="clear" id="clearQ" aria-label="Clear search">✕</button>
      <button type="button" class="flagtoggle" id="flagBtn" aria-label="Browse nations" aria-pressed="false">
        <img src="/flags/ukflag.png" alt="" aria-hidden="true">
      </button>
      <button type="button" class="navtoggle" id="navBtn" aria-label="Explore" aria-pressed="false">
        <img src="/navigate.svg" alt="" aria-hidden="true" width="13" height="13">
      </button>
    </form>
    <footer id="foot">British Material Unit (BMU) — Archive</footer>
  </div>

  <div id="dock" aria-hidden="true">
    <div id="dockSearch" class="dock-sq" role="button" tabindex="0" aria-label="Search the archive">
      <img class="ico ico-w" src="/searchicon-white.svg" alt="" aria-hidden="true" width="16" height="16">
      <img class="ico ico-b" src="/searchicon.svg" alt="" aria-hidden="true" width="16" height="16">
      <div class="dghost" id="dghost" aria-hidden="true"></div>
      <input id="dq" type="search" autocomplete="off" spellcheck="false"
             placeholder="" aria-label="Search the archive" tabindex="-1">
      <button type="button" id="dqFlag" class="dq-tool" aria-label="Group by nation" tabindex="-1" aria-pressed="false">
        <img src="/flags/ukflag.png" alt="" aria-hidden="true">
      </button>
      <button type="button" id="dqExplore" class="dq-tool" aria-label="Leave explore" tabindex="-1">
        <img src="/navigate.svg" alt="" aria-hidden="true" width="13" height="13">
      </button>
      <button type="button" id="dockClear" aria-label="Close search" tabindex="-1">✕</button>
    </div>
    <!-- one button holding several tools; scroll or swipe it to change -->
    <button type="button" id="dockExplore" class="dock-sq" aria-label="Explore the archive" aria-pressed="false">
      <span class="face-stack">
        <img class="face is-on" src="/circle-white.svg" alt="" aria-hidden="true" width="16" height="16">
        <img class="face" src="/menu-white.svg" alt="" aria-hidden="true" width="16" height="16">
        <img class="face" src="/close-white.svg" alt="" aria-hidden="true" width="16" height="16">
      </span>
    </button>
    <button type="button" id="dockLibrary" class="dock-sq" aria-pressed="false" aria-label="Gather saved garments">
      <svg class="bm" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path d="M4 2.2 h8 v11.6 l-4 -3.1 -4 3.1 Z"/>
      </svg>
    </button>
  </div>

  <script>
    /* ============================================================
       NATIONS — display order of the dropdowns.
       key   = folder name inside /archive/
       label = heading shown on the page
       open  = expanded on first load
       ============================================================ */
    /* alias = every other way someone might name this nation — the
       country, the native spelling, the abbreviation. Searching any of
       them finds the nation's garments. */
    const NATIONS = [
      { key:"british", label:"British", abbr:"UK", flag:"ukflag.png", open:false,
        alias:["british","britain","great britain","united kingdom","uk","gb","england","english","scotland","wales"] },
      { key:"danish", label:"Danish", abbr:"DK", flag:"denmarkflag.png", open:false,
        alias:["danish","denmark","danmark","dansk","dk"] },
      { key:"italian", label:"Italian", abbr:"IT", flag:"italyflag.png", open:false,
        alias:["italian","italy","italia","italiano","it"] },
      { key:"russian", label:"Russian", abbr:"RU", flag:"russiaflag.png", open:false,
        alias:["russian","russia","rossiya","rossiyskaya","soviet","ussr","ru"] },
      { key:"united-states", label:"United States", abbr:"US", flag:"usaflag.png", open:false,
        alias:["united states","united states of america","usa","us","america","american","stateside"] },
      { key:"iraqi", label:"Iraqi", abbr:"IQ", flag:"iraqflag.png", open:false,
        alias:["iraqi","iraq","al-iraq","mesopotamia"] },
      { key:"unattributed", label:"Unattributed", abbr:"UNA", flag:null, open:false,
        alias:["unattributed","unknown","unidentified"] }
    ];

    /* ============================================================
       ITEMS — { n, name, cat }  plus optional { img, ref, src }
       n    = nation key above; the image is read from /archive/<n>/
       img  = filename override. Without it the filename is generated
              from the name (slugified), e.g.
              "British '95 DPM Shirt" -> "british-95-dpm-shirt.png".
       ref  = archive reference code, printed on the card
       src  = provenance, printed on the card

       TO ADD A NATION: make the folder in /archive/, add a line to
       NATIONS, then add its items below. Nothing else to change.
       ============================================================ */
    const ITEMS = [
      /* ---------------- BRITISH ---------------- */

      /* Jackets / Shirts / Smocks */

      /* Trousers / Coveralls */

      /* Bags / Webbing / Vests */

      /* Pouches / Cases */

      /* Headwear */

      /* Footwear */

      /* Sleep / Shelter / Field */

      /* Hardware / Misc */

      /* ---------------- DANISH ---------------- */
      { n:"danish", name:"Danish Army 1990s M/84 Camouflage HMAK Jacket", cat:"Jackets / Shirts",
        img:"DA1990M84.png", ref:"DA1990M84", src:"Christopher Raeburn" },

      /* ---------------- ITALIAN ---------------- */
      { n:"italian", name:"Italian Army 1990s Camouflage Jacket", cat:"Jackets / Shirts",
        img:"IA1990CJ.png", ref:"IA1990CJ" },
      { n:"italian", name:"Italian Army 2000s ECWCS Vegetato Camouflage Jacket", cat:"Jackets / Shirts",
        img:"IA2000VCJ.png", ref:"IA2000VCJ" },

      /* ---------------- RUSSIAN ---------------- */
      { n:"russian", name:"Russian Army 1990s Unidentified Jacket", cat:"Jackets / Shirts",
        img:"RA1990UGJ.png", ref:"RA1990UGJ" },

      /* ---------------- UNITED STATES ---------------- */
      { n:"united-states", name:"United States Army 1990s Gulf Camouflage Jacket", cat:"Jackets / Shirts",
        img:"USA1990GWC0.png", ref:"USA1990GWC0", src:"East West Trading" },

      /* ---------------- IRAQI ---------------- */
      { n:"iraqi", name:"Iraqi Army 1980s Desert DPM Combat Jacket", cat:"Jackets / Shirts",
        img:"IQA1980DCJ.png", ref:"IQA1980DCJ" },

      /* ---------------- UNATTRIBUTED ---------------- */
      { n:"unattributed", name:"Unidentified Garment", cat:"Unclassified",
        img:"UMG001.png", ref:"UMG001" },
      { n:"unattributed", name:"Unidentified Coverall", cat:"Unclassified",
        img:"SA1990KCCO.png", ref:"SA1990KCCO" },
      { n:"unattributed", name:"Unidentified Aircrew Vest", cat:"Unclassified",
        img:"SRBMUGC.png", ref:"SRBMUGC" }
    ];

    /* ---------- category order within each nation ---------- */
    const CATS = ["Jackets / Shirts","Trousers / Coveralls","Bags / Webbing","Pouches / Cases","Headwear","Footwear","Sleep / Shelter / Field","Hardware / Misc","Unclassified"];

    function slugBase(name){
      return name.toLowerCase()
        .replace(/[’']/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }
    function slug(name){ return slugBase(name) + '.png'; }

    /* every garment owns a folder:
       /archive/<nation>/<garment-type>/<garment>/<file>.png + .txt   */
    function assetDir(nationKey, cat, name){
      return `/archive/${nationKey}/${slugBase(cat)}/${slugBase(name)}`;
    }
    function esc(s){
      return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    /* ---------- render: nation dropdown > category group > grid ---------- */
    const catalogue = document.getElementById('catalogue');
    const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* a little air above a tab when we scroll to it */
    const TOP_GAP = 30;

    function scrollToNation(d){
      const y = d.getBoundingClientRect().top + window.scrollY - TOP_GAP;
      window.scrollTo({ top:Math.max(0, y), behavior:REDUCED ? 'auto' : 'smooth' });
    }

    /* <details> can't animate on its own — drive the body's height by
       hand so tabs slide shut instead of snapping */
    function setNationOpen(d, open){
      if (open === d.open) return;
      const body = d.querySelector('.nbody');

      if (REDUCED || !body){ d.open = open; return; }

      body.style.overflow = 'hidden';
      const finish = () => {
        body.style.transition = '';
        body.style.height = '';
        body.style.overflow = '';
      };

      if (open){
        d.open = true;
        const h = body.scrollHeight;
        body.style.height = '0px';
        requestAnimationFrame(() => {
          body.style.transition = 'height .34s cubic-bezier(.4,0,.2,1)';
          body.style.height = h + 'px';
        });
        setTimeout(finish, 380);
      } else {
        body.style.height = body.scrollHeight + 'px';
        requestAnimationFrame(() => {
          body.style.transition = 'height .3s cubic-bezier(.4,0,.2,1)';
          body.style.height = '0px';
        });
        setTimeout(() => { d.open = false; finish(); }, 320);
      }
    }

    NATIONS.forEach(nation => {
      const mine = ITEMS.filter(p => p.n === nation.key);
      if (!mine.length) return;

      const cats = CATS.filter(c => mine.some(p => p.cat === c));
      const showLabels = cats.length > 1;

      const details = document.createElement('details');
      details.className = 'nation';
      details.dataset.nation = nation.key;
      details.dataset.label  = nation.label;
      details.open = nation.open;
      const flag = nation.flag
        ? `<img class="flag" src="/flags/${esc(nation.flag)}" alt="" aria-hidden="true" loading="lazy">`
        : `<span class="flag none" aria-hidden="true"></span>`;

      details.innerHTML =
        `<summary>${flag}` +
        `<span class="n">${esc(nation.label)}</span>` +
        `<span class="qty">${mine.length}</span>` +
        `<span class="sign" aria-hidden="true"></span></summary>` +
        `<div class="nbody"></div>`;
      const body = details.querySelector('.nbody');

      cats.forEach(section => {
        const group = document.createElement('section');
        group.className = 'group';
        if (showLabels){
          const label = document.createElement('div');
          label.className = 'section-label';
          label.textContent = section;
          group.appendChild(label);
        }

        const grid = document.createElement('div');
        grid.className = 'grid';

        mine.filter(p => p.cat === section).forEach(p => {
          const fileName = p.img || slug(p.name);
          const dir      = assetDir(nation.key, p.cat, p.name);
          const file     = `${dir}/${fileName}`;
          const txt      = `${dir}/${fileName.replace(/\.png$/, '.txt')}`;
          const el = document.createElement('article');
          el.className = 'item';
          const blob = [p.name, nation.label, p.cat, p.ref, p.src].filter(Boolean).join(' ').toLowerCase();
          el.dataset.search = blob;
          el.dataset.words  = blob.split(/[^a-z0-9]+/).filter(Boolean).join('|');
          el.dataset.alias  = (nation.alias || []).join('|');
          el.innerHTML = `
            <div class="slot">
              <img src="${esc(file)}" alt="${esc(p.name)} — ${esc(nation.label)} military surplus" loading="lazy">
              <span class="pending" hidden>${esc(fileName)}</span>
            </div>
            <div class="meta">
              <div class="name-row">
                <div class="name">${esc(p.name)}</div>
                <button type="button" class="btn-save-inline" aria-pressed="false" aria-label="Save to library">
                  <svg class="bm" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                    <path d="M4 2.2 h8 v11.6 l-4 -3.1 -4 3.1 Z"/>
                  </svg>
                </button>
              </div>
              <span class="tag">${esc(p.cat)}</span>
              ${p.ref ? `<span class="ref">${esc(p.ref)}${p.src ? ` — ${esc(p.src)}` : ''}</span>` : ''}
              <div class="req-panel">
                <div class="req-row">
                  <label>Quantity</label>
                  <div class="req-qty">
                    <input type="range" class="req-range" min="1" max="500" step="1" value="100" aria-label="Quantity">
                    <span class="qtyval" aria-hidden="true">100</span>
                  </div>
                </div>
                <input type="email" class="req-email" placeholder="you@example.com" autocomplete="email" aria-label="Your email">
                <button type="button" class="req-send">Send request</button>
                <div class="req-msg" role="status"></div>
              </div>
              <div class="info-panel"></div>
              <div class="actions">
                <button type="button" class="btn-line req-toggle" aria-expanded="false">Request</button>
                <button type="button" class="btn-line info-toggle" aria-expanded="false">Info</button>
              </div>
            </div>`;
          const img = el.querySelector('img');
          const pending = el.querySelector('.pending');
          img.addEventListener('error', () => { img.remove(); pending.hidden = false; });
          el.dataset.id   = `${nation.key}/${slugBase(p.name)}`;
          el.dataset.gname = p.name;
          el.dataset.gref  = p.ref || '';
          el.dataset.gtxt  = txt;
          wireCard(el, p.name, p.ref, txt);
          grid.appendChild(el);
        });

        group.appendChild(grid);
        body.appendChild(group);
      });

      // take over the summary's own toggling so it can slide
      details.querySelector('summary').addEventListener('click', e => {
        e.preventDefault();
        // on a single garment reached from explore, the − is the way back
        if (document.body.classList.contains('single-result') && lastExploreItem){
          returnToExplore();
          return;
        }
        setNationOpen(details, !details.open);
      });

      catalogue.appendChild(details);
    });

    /* ---------- search ---------- */
    const q          = document.getElementById('q');
    const clearQ     = document.getElementById('clearQ');
    const navBtn     = document.getElementById('navBtn');
    const searchForm = document.querySelector('.search');
    const countEl = document.getElementById('count');
    const emptyEl = document.getElementById('empty');
    const savedBtn      = document.getElementById('savedBtn');
    const savedTab      = document.getElementById('savedTab');
    const savedGrid     = document.getElementById('savedGrid');
    const savedTabQty   = document.getElementById('savedTabQty');
    const savedCountEl  = document.getElementById('savedCount');
    const emptyLine  = document.getElementById('emptyLine');
    const flagStrip  = document.getElementById('flagStrip');
    const flagRail   = document.getElementById('flagRail');
    const allItems   = [...catalogue.querySelectorAll('.item')];
    const allGroups  = [...catalogue.querySelectorAll('.group')];
    const allNations = [...catalogue.querySelectorAll('.nation')];

    /* ============================================================
       EMPTY STATE
       "No matching records" types out, drops away like a slot reel,
       and the nation flags roll in behind it. Picking one clears the
       search and opens that nation.
       ============================================================ */
    const NO_HITS = 'No matching records';

    NATIONS.filter(n => n.flag).forEach(n => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'flag-pick';
      b.dataset.nation = n.key;
      b.title = n.label;
      b.setAttribute('aria-label', n.label);
      b.innerHTML = `<img src="/flags/${n.flag}" alt="" aria-hidden="true">` +
                    `<span>${n.abbr || n.label}</span>`;
      b.addEventListener('click', () => {
        q.value = '';
        filter();
        syncGhost();
        const d = allNations.find(x => x.dataset.nation === n.key);
        if (d){
          const others = allNations.filter(x => x !== d && x.open);
          setNationOpen(d, true);
          others.forEach(x => setNationOpen(x, false));
          if (others.length && !REDUCED) setTimeout(() => scrollToNation(d), 340);
          else scrollToNation(d);
        }
      });
      flagRail.appendChild(b);
    });

    /* edit distance, so a near-miss spelling can be pointed at */
    function editDistance(a, b){
      const m = a.length, n = b.length;
      let prev = Array.from({ length:n + 1 }, (_, j) => j);
      for (let i = 1; i <= m; i++){
        const cur = [i];
        for (let j = 1; j <= n; j++){
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1,
                            prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        }
        prev = cur;
      }
      return prev[n];
    }

    function closestNation(term){
      let best = null, score = Infinity;
      NATIONS.filter(n => n.flag).forEach(n => {
        (n.alias || []).forEach(a => {
          const d = editDistance(term, a);
          if (d < score){ score = d; best = n.key; }
        });
      });
      // only a genuine near-miss counts, not any old typo
      return score <= Math.max(2, Math.floor(term.length / 3)) ? best : null;
    }

    let emptyTimers = [];
    let emptyOpen = false;
    let emptyDelay = null;

    function hideEmpty(){
      clearTimeout(emptyDelay);
      emptyDelay = null;
      emptyTimers.forEach(clearTimeout);
      emptyTimers = [];
      emptyOpen = false;
      emptyEl.hidden = true;
      emptyLine.classList.remove('drop');
      emptyLine.textContent = '';
      flagStrip.hidden = true;
      flagStrip.classList.remove('in');
    }

    /* hold back the "no matching records" reel — a mistyped letter
       should give the reader a moment to fix it first */
    const EMPTY_DELAY_MS = 1600;

    function queueEmpty(term){
      if (emptyOpen){ showEmpty(term); return; }   // already up: just re-aim the hint
      if (emptyDelay) return;                      // already counting down
      emptyDelay = setTimeout(() => {
        emptyDelay = null;
        if (q.value.trim().toLowerCase() === term) showEmpty(term);
      }, EMPTY_DELAY_MS);
    }

    function showEmpty(term){
      const hint = closestNation(term);
      [...flagRail.children].forEach(b => {
        b.classList.toggle('suggested', b.dataset.nation === hint);
      });

      if (emptyOpen) return;      // already running — don't restart per keystroke
      emptyOpen = true;
      emptyEl.hidden = false;
      emptyLine.classList.remove('drop');
      flagStrip.hidden = true;
      flagStrip.classList.remove('in');

      if (REDUCED){
        emptyLine.textContent = NO_HITS;
        flagStrip.hidden = false;
        flagStrip.classList.add('in');
        measureRail();
        return;
      }

      emptyLine.textContent = '';
      let n = 0;
      (function typeOut(){
        if (n < NO_HITS.length){
          emptyLine.textContent += NO_HITS.charAt(n++);
          emptyTimers.push(setTimeout(typeOut, 34));
        } else {
          emptyTimers.push(setTimeout(() => {
            emptyLine.classList.add('drop');          // reel turns over
            emptyTimers.push(setTimeout(() => {
              flagStrip.hidden = false;
              void flagStrip.offsetWidth;
              flagStrip.classList.add('in');
              measureRail();
            }, 260));
          }, 900));
        }
      })();
    }

    /* the ends only dissolve once there are more flags than fit */
    function measureRail(){
      flagRail.classList.toggle('overflowing',
        flagRail.scrollWidth > flagRail.clientWidth + 1);
    }
    window.addEventListener('resize', measureRail);

    /* Match on the START of words, never on any old substring — "h"
       should not drag in "British". A multi-word term has to place
       every one of its parts, so "mtp bag" needs both. */
    function itemMatches(el, term){
      const tokens = term.split(/\s+/).filter(Boolean);
      if (!tokens.length) return true;
      const words   = el.dataset.words.split('|');
      const aliases = el.dataset.alias.split('|');
      return tokens.every(t =>
        words.some(w => w.startsWith(t)) ||
        aliases.some(a => a && a.startsWith(t))
      );
    }

    /* ============================================================
       SAVED LIBRARY
       Kept in localStorage so a return visit still has the reader's
       shortlist; falls back to memory when storage is unavailable.
       ============================================================ */
    const SAVED_KEY = 'bmu.archive.saved';
    let savedIds = [];
    let savedOnly = false;

    try {
      savedIds = JSON.parse(localStorage.getItem(SAVED_KEY) || '[]');
      if (!Array.isArray(savedIds)) savedIds = [];
    } catch { savedIds = []; }

    function persistSaved(){
      try { localStorage.setItem(SAVED_KEY, JSON.stringify(savedIds)); } catch {}
    }
    function isSaved(id){ return savedIds.includes(id); }
    function toggleSaved(id){
      const i = savedIds.indexOf(id);
      if (i === -1) savedIds.push(id); else savedIds.splice(i, 1);
      persistSaved();
      paintSaved();
    }

    /* the tabs show either because the flag asked for them or because a
       search is running — a term must always have somewhere to land,
       otherwise typing on the bare page looks broken */
    let nationsOpen = false;

    /* The tab is built from clones of the real cards, re-wired through the
       same path, so a saved garment behaves identically wherever it sits. */
    function buildSavedTab(){
      savedGrid.innerHTML = '';
      savedIds.forEach(id => {
        const src = allItems.find(el => el.dataset.id === id);
        if (!src) return;
        const copy = src.cloneNode(true);
        copy.hidden = false;
        const img = copy.querySelector('img');
        const pending = copy.querySelector('.pending');
        if (img && pending){
          img.addEventListener('error', () => { img.remove(); pending.hidden = false; });
        }
        wireCard(copy, copy.dataset.gname, copy.dataset.gref, copy.dataset.gtxt);
        savedGrid.appendChild(copy);
      });
      savedTabQty.textContent = savedIds.length;
      // its own section: present only while the bookmark is selected
      savedTab.hidden = !savedOnly || savedIds.length === 0;
      if (savedTab.hidden) savedTab.open = false;
    }

    function paintSaved(){
      buildSavedTab();
      document.querySelectorAll('.item').forEach(el => {
        const on = isSaved(el.dataset.id) ? 'true' : 'false';
        el.querySelectorAll('.btn-save, .btn-save-inline')
          .forEach(b => b.setAttribute('aria-pressed', on));
      });
      const n = savedIds.length;
      savedCountEl.textContent = n ? String(n) : '';
      savedBtn.setAttribute('aria-pressed', savedOnly ? 'true' : 'false');
      if (savedOnly && !n) savedOnly = false;
    }

    let soloId = null;      // one garment held open on its own
    // declared here because filter() reads it and filter() runs at init,
    // long before the count typewriter further down is reached
    let countTyping = false;

    function filter(){
      const term = q.value.trim().toLowerCase();
      // swaps the right-hand slot between the star and the ✕
      searchForm.classList.toggle('has-term', !!term);
      document.body.classList.toggle('browsing', nationsOpen || !!term);
      // the tabs this call is about to open must not carry the bar away with
      // them; set here rather than through syncChrome, which reaches for the
      // dock — declared further down and still in its dead zone at init
      if (term) document.body.classList.remove('tab-open');
      if (term) hidePrompt();

      allItems.forEach(el => {
        if (soloId){ el.hidden = el.dataset.id !== soloId; return; }
        const inLibrary = !savedOnly || isSaved(el.dataset.id);
        el.hidden = !inLibrary || (term ? !itemMatches(el, term) : false);
      });

      allGroups.forEach(g => {
        g.hidden = !g.querySelector('.item:not([hidden])');
      });

      let shown = 0;
      allNations.forEach(d => {
        const hits = d.querySelectorAll('.item:not([hidden])').length;
        shown += hits;
        d.hidden = (term || soloId) ? hits === 0 : false;
        d.querySelector('.qty').textContent = term ? hits : d.querySelectorAll('.item').length;
        if (term) d.open = true;
        // a garment opened from explore must land on its record, not on a
        // shut tab — this reset was undoing the tab the click had opened
        else if (soloId) d.open = hits > 0;
        else d.open = NATIONS.find(x => x.key === d.dataset.nation).open;
      });

      // a lone result is presented on its own, without section furniture
      const lone = !!soloId || (!!term && shown === 1);
      document.body.classList.toggle('single-result', lone);

      allNations.forEach(d => {
        const label = d.querySelector('summary .n');
        if (label) label.textContent = d.dataset.label;
      });
      if (lone){
        const only = catalogue.querySelector('.item:not([hidden])');
        const tab  = only && only.closest('.nation');
        if (tab){
          tab.querySelector('summary .n').textContent =
            only.querySelector('.name').textContent;
        }
      }

      const noHits = !!term && shown === 0;
      if (noHits) queueEmpty(term); else hideEmpty();

      if (!countTyping) countEl.textContent = soloId
        ? ''
        : term
        ? `${shown} ${shown === 1 ? 'garment' : 'garments'} matching “${q.value.trim()}”`
        : `${shown} ${shown === 1 ? 'garment' : 'garments'}`;
    }

    /* the ✕ on the main bar puts the whole page back to how it loaded */
    function resetPage(){
      q.value = '';
      const dqEl = document.getElementById('dq');
      if (dqEl) dqEl.value = '';
      filter();                      // restores each tab's default open state
      window.scrollTo({ top:0, behavior:REDUCED ? 'auto' : 'smooth' });
    }

    /* The plate that answers an empty library. Pressing again restarts the
       hold rather than stacking a second timer behind the first. */
    const noData = document.getElementById('noData');
    let noDataTimer = null;
    function flashNoData(){
      if (!noData) return;
      clearTimeout(noDataTimer);
      noData.classList.add('show');
      noData.setAttribute('aria-hidden', 'false');
      document.body.classList.add('no-data');
      noDataTimer = setTimeout(() => {
        noData.classList.remove('show');
        noData.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('no-data');
      }, 1700);
    }

    savedBtn.addEventListener('click', () => {
      if (!savedIds.length && !savedOnly){
        // nothing kept yet — say so rather than showing an empty page
        flashNoData();
        return;
      }
      savedOnly = !savedOnly;
      soloId = null;
      nationsOpen = true;
      document.body.classList.add('browsing');
      document.body.classList.toggle('library', savedOnly);
      paintSaved();
      filter();
      if (savedOnly){ savedTab.open = true; }
      countEl.textContent = savedOnly
        ? `${savedIds.length} ${savedIds.length === 1 ? 'garment' : 'garments'}`
        : `${allItems.length} garments`;
      syncChrome();
    });

    q.addEventListener('input', filter);
    clearQ.addEventListener('click', resetPage);
    q.addEventListener('keydown', e => { if (e.key === 'Escape') resetPage(); });
    filter();

    /* ============================================================
       SEARCH SUGGESTIONS
       Cycles every garment in the archive: types the name out, holds
       with a blinking caret, deletes it again, moves to the next.
       Sits behind the input and yields the moment anything is typed.
       ============================================================ */
    const ghost   = document.getElementById('ghost');
    const NAME_POOL = [...new Set(ITEMS.map(p => p.name))];
    const CAMO_POOL = ['DPM','MTP','Desert DPM','Vegetato','M/84','Woodland','Flecktarn','OG','Gulf Camouflage'];
    const NATION_POOL = NATIONS.filter(n => n.flag).map(n => n.label);
    const TYPE_POOL = [...new Set(ITEMS.map(p => p.cat))];

    /* the running suggestion answers whichever question is being asked */
    let SUGGESTIONS = NAME_POOL;
    function poolForPrompt(i){
      if (i === 2) return NATION_POOL;
      if (i === 3) return CAMO_POOL;
      if (i === 4) return TYPE_POOL;
      return NAME_POOL;
    }

    const gText  = document.createTextNode('');
    const gCaret = document.createElement('span');
    gCaret.className = 'caret';
    ghost.append(gText, gCaret);

    /* the dock's bar carries the same running suggestion, so it prompts
       the same way the main bar does rather than sitting blank */
    const dghost  = document.getElementById('dghost');
    const dgText  = document.createTextNode('');
    const dgCaret = document.createElement('span');
    dgCaret.className = 'caret';
    dghost.append(dgText, dgCaret);

    function mirrorGhost(v){
      dgText.nodeValue = v;
      dghost.hidden = document.getElementById('dq').value !== '';
    }

    /* hold is long enough for the caret to blink several times before
       the suggestion is deleted again */
    const TYPE_MS = 45, DELETE_MS = 25, HOLD_MS = 3800, GAP_MS = 320;
    let sIdx = 0, sPos = 0, sPhase = 'typing', sTimer = null;

    function ghostVisible(){ return q.value === ''; }

    /* The suggestion is a full garment name and the bar is narrow on a
       phone. Measure the run each tick and dim it as it closes on the
       right-hand icons, so it dissolves instead of colliding. */
    const ghostRange = document.createRange();
    function ghostFade(){
      const cs = getComputedStyle(ghost);
      const room = ghost.clientWidth
                 - parseFloat(cs.paddingLeft)
                 - parseFloat(cs.paddingRight);
      if (room <= 0) return;
      ghostRange.selectNodeContents(gText);
      const used = ghostRange.getBoundingClientRect().width / room;
      ghost.style.opacity = used <= 0.78
        ? '1'
        : Math.max(0.1, 1 - (used - 0.78) / 0.3).toFixed(2);
    }

    function suggestTick(){
      if (!ghostVisible()){ sTimer = setTimeout(suggestTick, 400); return; }

      const word = SUGGESTIONS[sIdx];

      if (sPhase === 'typing'){
        if (sPos < word.length){
          sPos++;
          gText.nodeValue = word.slice(0, sPos);
          mirrorGhost(gText.nodeValue);
          ghostFade();
          gCaret.classList.remove('blink');
          sTimer = setTimeout(suggestTick, TYPE_MS);
        } else {
          sPhase = 'holding';
          gCaret.classList.add('blink');       // blink at the end of the suggestion
          dgCaret.classList.add('blink');
          sTimer = setTimeout(suggestTick, HOLD_MS);
        }
      } else if (sPhase === 'holding'){
        sPhase = 'deleting';
        gCaret.classList.remove('blink');
        sTimer = setTimeout(suggestTick, DELETE_MS);
      } else {
        if (sPos > 0){
          sPos--;
          gText.nodeValue = word.slice(0, sPos);
          mirrorGhost(gText.nodeValue);
          ghostFade();
          sTimer = setTimeout(suggestTick, DELETE_MS);
        } else {
          sPhase = 'typing';
          sIdx = (sIdx + 1) % SUGGESTIONS.length;
          sTimer = setTimeout(suggestTick, GAP_MS);
        }
      }
    }

    function startSuggestions(){
      if (REDUCED){
        // no motion: rotate the whole suggestion on a slow timer
        gCaret.remove();
        gText.nodeValue = SUGGESTIONS[0];
        setInterval(() => {
          sIdx = (sIdx + 1) % SUGGESTIONS.length;
          if (ghostVisible()) gText.nodeValue = SUGGESTIONS[sIdx];
        }, 3200);
        return;
      }
      suggestTick();
    }

    /* the suggestion yields as soon as there is real input to read */
    function syncGhost(){ ghost.hidden = q.value !== ''; }
    q.addEventListener('input', syncGhost);
    clearQ.addEventListener('click', () => setTimeout(syncGhost, 0));
    q.addEventListener('keydown', e => { if (e.key === 'Escape') setTimeout(syncGhost, 0); });
    syncGhost();

    /* the real caret takes over while the field is focused */
    q.addEventListener('focus', () => gCaret.style.visibility = 'hidden');
    q.addEventListener('blur',  () => gCaret.style.visibility = '');

    /* ============================================================
       REQUESTS
       Static site, so this composes a mail to BMU rather than posting
       to a server. Quantity is a slider and a number box kept in sync.
       ============================================================ */
    const REQUEST_TO = 'hello@britishmaterialunit.com';

    function wireCard(el, name, ref, txtPath){
      el.querySelectorAll('.btn-save, .btn-save-inline').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          toggleSaved(el.dataset.id);
          const mark = btn.querySelector('.bm');
          if (mark && isSaved(el.dataset.id)){
            mark.classList.remove('pop');
            void mark.offsetWidth;
            mark.classList.add('pop');
          }
        });
      });
      const reqBtn   = el.querySelector('.req-toggle');
      const infoBtn  = el.querySelector('.info-toggle');
      const reqPanel = el.querySelector('.req-panel');
      const infoPane = el.querySelector('.info-panel');
      const range    = el.querySelector('.req-range');
      const val      = el.querySelector('.qtyval');
      const email    = el.querySelector('.req-email');
      const send     = el.querySelector('.req-send');
      const msg      = el.querySelector('.req-msg');

      let infoLoaded = false;

      function setState(state){   // 'idle' | 'request' | 'info'
        reqPanel.classList.toggle('open', state === 'request');
        infoPane.classList.toggle('open', state === 'info');
        // while requesting, Request steps aside and Info is the way out
        reqBtn.hidden = state === 'request';
        reqBtn.setAttribute('aria-expanded', state === 'request' ? 'true' : 'false');
        infoBtn.setAttribute('aria-expanded', state === 'info' ? 'true' : 'false');
        infoBtn.textContent = state === 'info' ? '✕' : 'Info';
        infoBtn.setAttribute('aria-label', state === 'info' ? 'Close info' : 'Info');
        if (state !== 'request') msg.textContent = '';
      }

      async function loadInfo(){
        if (infoLoaded) return;
        infoLoaded = true;
        try {
          const res = await fetch(txtPath);
          if (!res.ok) throw new Error(res.status);
          infoPane.textContent = (await res.text()).trim();
        } catch {
          infoPane.textContent = 'No record filed for this garment yet.';
        }
      }

      reqBtn.addEventListener('click', () => setState('request'));

      infoBtn.addEventListener('click', () => {
        // from the request form this doubles as the way back out
        if (infoPane.classList.contains('open')) { setState('idle'); return; }
        loadInfo();
        setState('info');
      });
