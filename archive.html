    /* ---------- SITE HEADER ----------
       The same header the home page wears, so the archive reads as a room
       in the building rather than a separate site. See-through over the
       white page, near-black on hover, which is why the mark and the two
       tools are each built to read on either ground.

       Three ways out, differing only in how much of the home page the
       reader has to sit through again — see the handlers at the foot of
       the script. */
    #siteHead{
      position:fixed;
      top:0; left:0; right:0;
      z-index:75;
      height:54px;
      display:flex;
      align-items:center;
      background:transparent;
      transition:background-color .35s cubic-bezier(.4,0,.2,1);
    }
    #siteHead:hover,
    #siteHead.head-lit{ background:#262626; }

    /* the HOME page's measure, not the archive's: the mark and the two
       tools have to land on exactly the same pixels on both pages, or
       moving between them slides the furniture about. 92vw/1100px is what
       index.html's header uses — change it in both places or neither. */
    #siteHead .hd-inner{
      width:min(92vw, 1100px);
      height:100%;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .hd-mark{
      display:block;
      line-height:0;
      text-decoration:none;
      transition:opacity .45s cubic-bezier(.4,0,.2,1);
      -webkit-tap-highlight-color:transparent;
    }
    .hd-mark svg{ height:17px; width:auto; display:block; overflow:visible; }
    /* Grey, to sit with the two tools on the right rather than shout over
       them, and stroke only — the filled version was a second state the mark
       did not need. */
    .hd-trace{
      fill:none;
      stroke:#999;
      stroke-width:.5;
      transition:stroke .35s cubic-bezier(.4,0,.2,1), opacity .3s cubic-bezier(.4,0,.2,1);
    }
    /* The corner mark no longer draws itself — see index.html. On this page
       especially: the gate's mark is already drawing in the middle of the
       screen, and a second one doing the same thing in the corner competes
       with it. This one is simply there. */
    .hd-fill{
      fill:var(--ink);
      stroke:none;
      opacity:0;
      transition:opacity .35s cubic-bezier(.4,0,.2,1), fill .35s cubic-bezier(.4,0,.2,1);
    }
    /* Activated, the header goes near-black and the mark fills solid white
       — not a white outline. Both halves switch in ONE frame, before the
       ground has begun to move: transition:none on the way in, the normal
       one on the way back out. A crossfade here is the change you can see. */
    #siteHead:hover .hd-trace,
    #siteHead.head-lit .hd-trace{
      opacity:0;
      transition:none;
    }
    #siteHead:hover .hd-fill,
    #siteHead.head-lit .hd-fill{
      opacity:1;
      fill:#fff;
      transition:none;
    }


    /* The mark is fixed over a page that scrolls underneath it, so the
       moment the reader moves it is sitting on top of their content. It
       stands down as soon as the page leaves the top and comes back when
       they return — or on a hover, which darkens the header behind it and
       gives it a ground of its own to read against. */
    body.scrolled #siteHead .hd-mark{
      opacity:0;
      pointer-events:none;
    }
    body.scrolled #siteHead:hover .hd-mark,
    body.scrolled #siteHead.head-lit .hd-mark{
      opacity:1;
      pointer-events:auto;
    }
    body.scrolled #siteHead:hover .hd-trace,
    body.scrolled #siteHead.head-lit .hd-trace{ opacity:0; transition:none; }
    body.scrolled #siteHead:hover .hd-fill,
    body.scrolled #siteHead.head-lit .hd-fill{ opacity:1; fill:#fff; transition:none; }


    .hd-tools{ display:flex; align-items:center; gap:18px; }
    .hd-ico{
      display:block;
      line-height:0;
      padding:8px;
      margin:-8px;
      border:0;
      background:none;
      cursor:pointer;
      color:#999;
      transition:color .3s cubic-bezier(.4,0,.2,1), transform .3s cubic-bezier(.4,0,.2,1);
      -webkit-tap-highlight-color:transparent;
    }
    .hd-ico svg{ display:block; width:15px; height:15px; }
    /* The way in to a reader's own files. It arrives rather than being
       there: the page opens on the archive, and this is the one mark in the
       header that is about them rather than about it. */
    #hdColl{ opacity:0; animation:collIn .7s cubic-bezier(.4,0,.2,1) .55s forwards; }
    @keyframes collIn{ to{ opacity:1; } }
    @media (prefers-reduced-motion:reduce){
      #hdColl{ opacity:1; animation:none; }
    }
    .hd-ico .ico-fill{ fill:currentColor; }
    .hd-ico .ico-stroke{
      fill:none;
      stroke:currentColor;
      stroke-width:1.6;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    #hdHome svg{ width:13px; height:13px; }
    #siteHead:hover .hd-ico,
    #siteHead.head-lit .hd-ico{ color:#fff; }
    .hd-ico:hover{ color:#fff; transform:scale(1.1); }

    @media (max-width:640px){
      #siteHead{
        height:calc(46px + env(safe-area-inset-top));
        padding-top:env(safe-area-inset-top);
      }
    }
    @media (prefers-reduced-motion:reduce){
    }

    /* ---------- OPERATIONS DEPARTURE ----------
       Straight fade of the whole page, then hand over to index.html. */
    body{ transition:opacity .3s cubic-bezier(.4,0,.2,1); }
    body.leaving{ opacity:0; pointer-events:none; }
    @media (prefers-reduced-motion:reduce){
      body{ transition:none; }
    }
  </style>
</head>
<body>
  <!-- SITE HEADER — the archive's way back to the site. The mark is the
       front door and the star both return to the home page already entered —
       the reader has seen the mark draw once and does not need it again;
       the index drops the reader straight onto its footer, so
       scrolling up is what brings the home page itself back. -->
  <header id="siteHead">
   <div class="hd-inner">
    <a class="hd-mark" id="hdMark" href="/#home" aria-label="British Material Unit — home">
      <svg viewBox="0 9.1 32 13.6" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <path id="hdTrace" class="hd-trace" d="M32,15h-11s8-5.9,8-5.9h-3.5l-3.5,2.5h0c-.1.1-.4.3-.6.4l.6-.4h0l-3.3,2.4v-4.9h-2v4.9h0l-5.2-3.8c-1.4-1-2.9-1.1-2.9-1.1H0v2h8.8l1.6.9H0v2h13.3l1.3.9H0v2h14.6l-1.3.9H0v2h10.4l-1.6.9H0v2h8.7s1.5-.1,2.9-1.1l5.2-3.8h0v4.9h2v-4.9h0l5.2,3.8c1.4,1,2.9,1.1,2.9,1.1h5.1v-2h-4.5c-.7,0-2-.5-2.8-1.1l-3.7-2.7h11v-2h0Z"/>
        <path id="hdFill" class="hd-fill" d="M32,15h-11s8-5.9,8-5.9h-3.5l-3.5,2.5h0c-.1.1-.4.3-.6.4l.6-.4h0l-3.3,2.4v-4.9h-2v4.9h0l-5.2-3.8c-1.4-1-2.9-1.1-2.9-1.1H0v2h8.8l1.6.9H0v2h13.3l1.3.9H0v2h14.6l-1.3.9H0v2h10.4l-1.6.9H0v2h8.7s1.5-.1,2.9-1.1l5.2-3.8h0v4.9h2v-4.9h0l5.2,3.8c1.4,1,2.9,1.1,2.9,1.1h5.1v-2h-4.5c-.7,0-2-.5-2.8-1.1l-3.7-2.7h11v-2h0Z"/>
      </svg>
    </a>

    <nav class="hd-tools" aria-label="Leave the archive">
      <!-- the private shelves: a head and shoulders, drawn in the same line
           as the index beside it -->
      <a class="hd-ico" id="hdColl" href="/collections" aria-label="Files — sign in">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <g class="ico-stroke">
            <circle cx="8" cy="5.4" r="2.6"/>
            <path d="M2.8 13.6 C3.4 10.9 5.5 9.6 8 9.6 C10.5 9.6 12.6 10.9 13.2 13.6"/>
          </g>
        </svg>
      </a>
      <a class="hd-ico" id="hdHome" href="/" aria-label="Back to the site">
        <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <path class="ico-fill" d="M50 0 L59.3 41 L100 50 L59.3 59 L50 100 L40.7 59 L0 50 L40.7 41 Z"/>
        </svg>
      </a>
      <button class="hd-ico" id="hdIndex" type="button" aria-label="Go to the site index">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <g class="ico-stroke">
            <path d="M2.6 4.6 H13.4"/>
            <path d="M2.6 8 H13.4"/>
            <path d="M2.6 11.4 H13.4"/>
          </g>
        </svg>
      </button>
    </nav>
   </div>
  </header>

  <div class="wrap">
    <div id="shell">
      <div class="count-row">
        <div class="count" id="count"></div>
        <button type="button" id="savedBtn" aria-pressed="false" aria-label="Show saved garments">
          <svg class="bm" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 2.2 h8 v11.6 l-4 -3.1 -4 3.1 Z"/></svg>
          <span id="savedCount"></span>
        </button>
      </div>

      <details class="nation" id="savedTab" data-nation="saved" hidden>
        <summary>
          <svg class="bm" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path d="M4 2.2 h8 v11.6 l-4 -3.1 -4 3.1 Z"/>
          </svg>
          <span class="n">Saved</span>
          <span class="qty" id="savedTabQty">0</span>
          <span class="sign" aria-hidden="true"></span>
        </summary>
        <!-- filled by buildSavedTab: a filter bar and the kept garments -->
        <div class="nbody"></div>
      </details>

      <main id="catalogue" aria-label="Military surplus archive"></main>
      <div class="empty" id="empty" hidden>
        <div class="empty-line" id="emptyLine"></div>
        <div class="flag-strip" id="flagStrip" hidden>
          <div class="flag-rail" id="flagRail"></div>
        </div>
      </div>
    </div>
  </div>


  <!-- THE COLLECTION'S DOOR
       Keeping garments is free and needs nobody's name. Opening the shelf
       asks for one — it is the point at which a pile of bookmarks becomes
       a collection worth writing to someone about. Copied from the home
       page's Join: the address types itself out, the field slides from it.
       Shown over a blurred archive so what is behind it is plainly still
       there and still theirs. -->
  <div id="joinGate" hidden aria-hidden="true">
    <div class="jg-panel" role="dialog" aria-modal="true" aria-label="Join to open your file">
      <div class="jg-lede" id="jgLede"></div>
      <div class="jg-slide" id="jgSlide">
        <input id="jgInput" type="email" autocomplete="email" spellcheck="false"
               placeholder="you@example.com" aria-label="Your email address" />
      </div>
      <button type="button" class="jg-send" id="jgSend">Join</button>
      <div class="jg-msg" id="jgMsg" role="status" aria-live="polite"></div>
      <button type="button" class="jg-close" id="jgClose" aria-label="Close">✕</button>
    </div>
  </div>

  <!-- The bookmark with nothing behind it. Says so on a plate of its own
       rather than opening an empty section or changing the count line,
       which reads as a page fault rather than an answer. -->
  <div id="noData" role="status" aria-live="polite" aria-hidden="true">No Data Saved</div>

  <!-- EXPLORE — every garment in the archive as one spiral -->
  <div id="explore" hidden aria-hidden="true">
    <div id="spiral"></div>

    <!-- Seventy-odd photographs do not arrive together, and watching them
         pop in one at a time is the archive assembling itself in front of
         the reader. They are held back as a grey field instead, with the
         mark drawing over them; once the last one has landed the mark fills
         and becomes the way in. -->
    <div id="reveal" hidden>
      <button type="button" id="revealBtn" aria-label="Enter the archive">
        <!-- The compass, not the wordmark. This is the archive's own
             loading mark, and the archive is what the compass means
             everywhere else on the site: it is the glyph in the header that
             brings the reader here, and the face on the middle button once
             they arrive. Drawn and then filled, exactly as the wordmark
             was, at the same 17px the header keeps its marks at. -->
        <svg viewBox="-2 -2 104 104" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <path id="revTrace" class="rev-trace" d="M50 0 L59.3 41 L100 50 L59.3 59 L50 100 L40.7 59 L0 50 L40.7 41 Z"/>
          <path id="revFill" class="rev-fill" d="M50 0 L59.3 41 L100 50 L59.3 59 L50 100 L40.7 59 L0 50 L40.7 41 Z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- the search bar is the page's fixed furniture; everything else
       is summoned from it -->
  <!-- The archive had two search bars: this one, and the dock's. The dock's
       is now the only one — it is what the reader is handed on arrival and
       it travels with them between the field and the list. What is left here
       is the page's footer line, and the four controls the rest of the
       script still speaks to, kept out of sight rather than deleted: `q` is
       where the filter reads its term from, and the two buttons are the same
       actions the dock's own tools now carry. -->
  <!-- What is left of the old main search bar. The dock's bar replaced it
       outright; this single field is where filter() reads its term from, and
       the dock writes to it. Nothing here is ever shown or focused. -->
  <input id="q" type="hidden" value="" />

  <!-- typed out under the bar once the page has settled, not printed -->
  <footer id="foot"></footer>

  <div id="dock" aria-hidden="true">
    <div id="dockSearch" class="dock-sq" role="button" tabindex="0" aria-label="Search the archive">
      <img class="ico ico-w" src="/searchicon-white.svg" alt="" aria-hidden="true" width="16" height="16">
      <img class="ico ico-b" src="/searchicon.svg" alt="" aria-hidden="true" width="16" height="16">
      <div class="dghost" id="dghost" aria-hidden="true"></div>
      <input id="dq" type="search" autocomplete="off" spellcheck="false"
             placeholder="" aria-label="Search the archive" tabindex="-1">
      <!-- the label the bar believes is being typed; pressing it fills it in -->
      <button type="button" id="dqHint" class="dq-hint" tabindex="-1" aria-hidden="true">
        <span class="dh-kind" id="dqHintKind"></span><span class="dh-text" id="dqHintText"></span>
      </button>
      <button type="button" id="dqFlag" class="dq-tool" aria-label="Group by nation" tabindex="-1" aria-pressed="false">

        img:"GA2010FCLSFS.png", ref:"GA2010FCLSFS", mat:"Cotton" },
      { n:"german", name:"German Army 2010s Tropentarn Camouflage Field Shirt", cat:"Shirts",
        img:"GA2010TCFS.png", ref:"GA2010TCFS", mat:"Cotton" },
      { n:"west-german", name:"West German Army 1970s Field Grey Long Sleeve Field Shirt", cat:"Shirts",
        img:"WGA1970FGLSFS.png", ref:"WGA1970FGLSFS", mat:"Wool" },
      { n:"west-german", name:"West German Army 1980s Olive Drab Parka With Thermal Liner", cat:"Parkas",
        img:"WGA1980ODPWTL.png", ref:"WGA1980ODPWTL", mat:"Cotton" },
      { n:"yugoslav", name:"Yugoslav Army 1970s M77 Olive Green Parka", cat:"Parkas",
        img:"YA1970M77OGP.png", ref:"YA1970M77OGP", mat:"Cotton" },
      { n:"united-states", name:"United States Navy 1980s Light Blue Long Sleeve Service Shirt", cat:"Shirts",
        img:"USN1980LBLSSS.png", ref:"USN1980LBLSSS", mat:"Cotton" },
      { n:"soviet", name:"Soviet Army 1970s Cold War Tank Liner", cat:"Liners",
        img:"SA1970CWTL.png", ref:"SA1970CWTL", mat:"Cotton" }
    ];

    /* ---------- category order within each nation ----------
       One noun per shelf. "Jackets / Shirts" was one shelf holding a dress
       jacket, a pyjama shirt, a greatcoat and a thermal liner — a slash is
       two categories nobody separated, not one with a wide name. */
    const CATS = ["Jackets", "Shirts", "Smocks", "Parkas", "Coats", "Greatcoats",
                  "Fleeces", "Pullovers", "Polos", "Liners", "Vests", "Coveralls",
                  "Trousers", "Armour Covers", "Webbing", "Bags", "Pouches",
                  "Headwear", "Footwear", "Hardware", "Unclassified"];

    /* ---------- A GARMENT HAS AN ADDRESS ----------
       Every garment is numbered by its place in the register, 1 upwards,
       and carries the URL /archive/<n>. Opening one puts that address in the
       bar; closing it gives the bar back to /archive. The numbers are
       positions in ITEMS, so they only change if the register is reordered —
       a new garment appended takes the next number and disturbs nobody.

       Each number is also a real file (archive/<n>.html) carrying that
       garment's own name and photograph, so a link pasted anywhere previews
       as the garment rather than as the archive. */
    const GARMENT_NO = new Map();     // id → 1..n
    const NO_GARMENT = new Map();     // 1..n → id

    function numberGarments(){
      ITEMS.forEach((p, i) => {
        const id = `${p.n}/${slugBase(p.name)}`;
        GARMENT_NO.set(id, i + 1);
        NO_GARMENT.set(i + 1, id);
      });
    }

    /* The address bar follows the view rather than the other way round: a
       reader who has opened a garment can copy what is in front of them. */
    function markUrl(id){
      const n = id ? GARMENT_NO.get(id) : 0;
      const want = n ? `/archive/${n}` : '/archive';
      // the tab names what is on it, the way a page would
      const item = n ? ITEMS[n - 1] : null;
      document.title = item ? `${item.name} | BMU Archive` : 'Archive | BMU';
      if (location.pathname === want) return;
      try { history.pushState({ g:n }, '', want); } catch {}
    }

    function slugBase(name){
      return name.toLowerCase()
        .replace(/[’']/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }
    function slug(name){ return slugBase(name) + '.png'; }

    /* every garment owns a folder:
       /archive/<nation>/<garment-type>/<garment>/<file>.png + .txt   */
    numberGarments();

    function assetDir(nationKey, cat, name){
      return `/archive/${nationKey}/${slugBase(cat)}/${slugBase(name)}`;
    }
    function esc(s){
      return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    /* ---------- render: nation dropdown > category group > grid ---------- */
    /* -webkit-user-drag is a WebKit/Blink property and Firefox ignores it,
       so the images are also refused at the event. A garment is opened by
       pressing it; there is no drag on this page that means anything. */
    document.addEventListener('dragstart', e => {
      if (e.target && e.target.tagName === 'IMG') e.preventDefault();
    });

    const catalogue = document.getElementById('catalogue');
    const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* a little air above a tab when we scroll to it */
    const TOP_GAP = 30;

    function scrollToNation(d){
      const y = d.getBoundingClientRect().top + window.scrollY - TOP_GAP;
      window.scrollTo({ top:Math.max(0, y), behavior:REDUCED ? 'auto' : 'smooth' });
    }

    /* <details> can't animate on its own — drive the body's height by
       hand so tabs slide shut instead of snapping */
    function setNationOpen(d, open){
      if (open === d.open) return;
      const body = d.querySelector('.nbody');

      if (REDUCED || !body){ d.open = open; return; }

      body.style.overflow = 'hidden';
      const finish = () => {
        body.style.transition = '';
        body.style.height = '';
        body.style.overflow = '';
      };

      if (open){
        d.open = true;
        const h = body.scrollHeight;
        body.style.height = '0px';
        requestAnimationFrame(() => {
          body.style.transition = 'height .34s cubic-bezier(.4,0,.2,1)';
          body.style.height = h + 'px';
        });
        setTimeout(finish, 380);
      } else {
        body.style.height = body.scrollHeight + 'px';
        requestAnimationFrame(() => {
          body.style.transition = 'height .3s cubic-bezier(.4,0,.2,1)';
          body.style.height = '0px';
        });
        setTimeout(() => { d.open = false; finish(); }, 320);
      }
    }

    /* The fabric each garment is cut from, read off its own record when the
       page was built — the record's opening sentence names it, which the
       title usually does not. Unlisted where the record does not say;
       nothing is inferred. */
    function MATERIAL_OF(p){ return p.mat || 'Unlisted'; }

    NATIONS.forEach(nation => {
      const mine = ITEMS.filter(p => p.n === nation.key);
      if (!mine.length) return;

      const cats = CATS.filter(c => mine.some(p => p.cat === c));
      const showLabels = cats.length > 1;

      const details = document.createElement('details');
      details.className = 'nation';
      details.dataset.nation = nation.key;
      details.dataset.label  = nation.label;
      details.open = nation.open;
      const flag = nation.flag
        ? `<img class="flag" src="/flags/${esc(nation.flag)}" alt="" aria-hidden="true" loading="lazy">`
        : `<span class="flag none" aria-hidden="true"></span>`;

      details.innerHTML =
        `<summary>${flag}` +
        `<span class="n">${esc(nation.label)}</span>` +
        `<span class="qty">${mine.length}</span>` +
        `<span class="sign" aria-hidden="true"></span></summary>` +
        `<div class="nbody"></div>`;
      const body = details.querySelector('.nbody');

      /* How this nation's garments are grouped. It opens on ALL of them in
         one run — the sectioned version stacks a shelf of one on a shelf of
         one on a shelf of one, which is a lot of headings for very little
         archive. The switch offers the three facets the records actually
         carry, and Reset puts them back in one run. */
      body.appendChild(makeFacetBar());

      /* Built as one section holding everything, in the shelf order the
         archive keeps them in. Grouping is something the reader asks for,
         not the state the tab arrives in. */
      cats.forEach(section => {
        const group = document.createElement('section');
        group.className = 'group';
        /* No heading on arrival. The tab opens on every garment in one run
           and the switch above adds the headings when one is asked for —
           a shelf of one stacked on a shelf of one is more headings than
           archive. */

        const grid = document.createElement('div');
        grid.className = 'grid';

        mine.filter(p => p.cat === section).forEach(p => {
          const fileName = p.img || slug(p.name);
          const dir      = assetDir(nation.key, p.cat, p.name);
          const file     = `${dir}/${fileName}`;
          const txt      = `${dir}/${fileName.replace(/\.png$/, '.txt')}`;
          const el = document.createElement('article');
          el.className = 'item';
          const blob = [p.name, nation.label, p.cat, p.ref, p.src].filter(Boolean).join(' ').toLowerCase();
          /* What this garment can be sorted under, read off the record
             rather than guessed at the moment of sorting. Date comes from
             the name, material from the record's first line — the one the
             prose opens with — and type is the shelf it already sits on. */
          el.dataset.type = p.cat;
          el.dataset.date = (p.name.match(/\b(?:1[89]|20)\d0s\b/) || ['Undated'])[0];
          el.dataset.material = MATERIAL_OF(p);
          el.dataset.search = blob;
          el.dataset.words  = blob.split(/[^a-z0-9]+/).filter(Boolean).join('|');
          el.dataset.alias  = (nation.alias || []).join('|');
          el.innerHTML = `
            <div class="slot">
              <img src="${esc(file)}" alt="${esc(p.name)} — ${esc(nation.label)} military surplus" loading="lazy">
              <span class="pending" hidden>${esc(fileName)}</span>
            </div>
            <div class="meta">
              <div class="name-row">
                <div class="name">${esc(p.name)}</div>
                <button type="button" class="btn-save-inline" aria-pressed="false" aria-label="Save to library">
                  <svg class="bm" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                    <path d="M4 2.2 h8 v11.6 l-4 -3.1 -4 3.1 Z"/>
                  </svg>
                </button>
              </div>
              <span class="tag">${esc(p.cat)}</span>
              ${p.ref ? `<span class="ref">${esc(p.ref)}${p.src ? ` — ${esc(p.src)}` : ''}</span>` : ''}
              <div class="req-panel"><div class="req-inner">
                <div class="req-row">
                  <!-- No heading. Ten circles above a running number, inside
                       a panel opened by a button that says Request, can only
                       be a quantity; the label was naming what the control
                       was already saying. -->
                  <!-- Ten steps, thirty upwards. A slider invited 137, which
                       is not a number anyone orders in; the dots say what the
                       shape of an order is before a number is chosen. -->
                  <div class="req-dots" role="group" aria-label="Quantity"></div>
                  <div class="req-qty">
                    <span class="qtyval" aria-live="polite">30</span>
                    <input type="text" class="req-any" inputmode="numeric"
                           placeholder="or enter units" aria-label="Or enter a number of units">
                  </div>
                </div>
                <input type="email" class="req-email" placeholder="you@example.com" autocomplete="email" aria-label="Your email">
                <input type="text" class="req-hp" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
                <button type="button" class="req-send">Send request</button>
                <div class="req-msg" role="status"></div>
              </div></div>
              <div class="info-panel"><div class="info-inner"></div></div>
              <div class="actions">
                <button type="button" class="btn-line req-toggle" aria-expanded="false">Request</button>
                <button type="button" class="btn-line info-toggle" aria-expanded="false">Info</button>
              </div>
            </div>`;
          const img = el.querySelector('img');
          const pending = el.querySelector('.pending');
          img.addEventListener('error', () => { img.remove(); pending.hidden = false; });
          el.dataset.id   = `${nation.key}/${slugBase(p.name)}`;
          el.dataset.gname = p.name;
          el.dataset.gref  = p.ref || '';
          el.dataset.gtxt  = txt;
          wireCard(el, p.name, p.ref, txt);
          grid.appendChild(el);
        });

        group.appendChild(grid);
        body.appendChild(group);
      });

      // take over the summary's own toggling so it can slide
      details.querySelector('summary').addEventListener('click', e => {
        e.preventDefault();
        // on a single garment reached from explore, the − is the way back
        if (document.body.classList.contains('single-result') && lastExploreItem){
          returnToExplore();
          return;
        }
        setNationOpen(details, !details.open);
      });

      /* Built per shelf above, then folded into one run here. Hiding the
         headings was not enough: each shelf kept its own grid, so a shelf of
         two left the rest of that row empty and the next shelf started on a
         fresh line — the garments were still sectioned, just silently. This
         is the same merge the switch performs for All, so the tab's resting
         state and the state All returns it to are one code path and cannot
         drift apart. Four across, every garment in the nation in one run. */
      regroup(details, '');

      catalogue.appendChild(details);
    });

    /* ---------- search ---------- */
    const q          = document.getElementById('q');
    /* The old bar's three controls are gone with it. Their jobs live on the
       dock now — dqFlag for nations, dqExplore for the field, the cross for
       rest — but a dozen places still reported state to them. Rather than
       thread a null check through every one, they answer to a stub that
       swallows what it is told. It is the smallest honest shim: nothing
       reads these back. */
    const RETIRED = { setAttribute(){}, addEventListener(){}, classList:{ toggle(){}, add(){}, remove(){} }, style:{} };
    const clearQ     = RETIRED;
    const navBtn     = RETIRED;
    const flagBtn    = RETIRED;
    const searchForm = RETIRED;
    const countEl = document.getElementById('count');
    const emptyEl = document.getElementById('empty');
    const savedBtn      = document.getElementById('savedBtn');
    const savedTab      = document.getElementById('savedTab');
    const savedTabQty   = document.getElementById('savedTabQty');
    const savedCountEl  = document.getElementById('savedCount');
    const emptyLine  = document.getElementById('emptyLine');
    const flagStrip  = document.getElementById('flagStrip');
    const flagRail   = document.getElementById('flagRail');
    const allItems   = [...catalogue.querySelectorAll('.item')];
    const allGroups  = [...catalogue.querySelectorAll('.group')];
    const allNations = [...catalogue.querySelectorAll('.nation')];

    /* ============================================================
       EMPTY STATE
       "No matching records" types out, drops away like a slot reel,
       and the nation flags roll in behind it. Picking one clears the
       search and opens that nation.
       ============================================================ */
    const NO_HITS = 'No matching records';

    NATIONS.filter(n => n.flag).forEach(n => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'flag-pick';
      b.dataset.nation = n.key;
      b.title = n.label;
      b.setAttribute('aria-label', n.label);
      b.innerHTML = `<img src="/flags/${n.flag}" alt="" aria-hidden="true">` +
                    `<span>${n.abbr || n.label}</span>`;
      b.addEventListener('click', () => {
        q.value = '';
        filter();
        syncGhost();
        const d = allNations.find(x => x.dataset.nation === n.key);
        if (d){
          const others = allNations.filter(x => x !== d && x.open);
          setNationOpen(d, true);
          others.forEach(x => setNationOpen(x, false));
          if (others.length && !REDUCED) setTimeout(() => scrollToNation(d), 340);
          else scrollToNation(d);
        }
      });
      flagRail.appendChild(b);
    });

    /* edit distance, so a near-miss spelling can be pointed at */
    function editDistance(a, b){
      const m = a.length, n = b.length;
      let prev = Array.from({ length:n + 1 }, (_, j) => j);
      for (let i = 1; i <= m; i++){
        const cur = [i];
        for (let j = 1; j <= n; j++){
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1,
                            prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        }
        prev = cur;
      }
      return prev[n];
    }

    function closestNation(term){
      let best = null, score = Infinity;
      NATIONS.filter(n => n.flag).forEach(n => {
        (n.alias || []).forEach(a => {
          const d = editDistance(term, a);
          if (d < score){ score = d; best = n.key; }
        });
      });
      // only a genuine near-miss counts, not any old typo
      return score <= Math.max(2, Math.floor(term.length / 3)) ? best : null;
    }

    let emptyTimers = [];
    let emptyOpen = false;
    let emptyDelay = null;

    function hideEmpty(){
      clearTimeout(emptyDelay);
      emptyDelay = null;
      emptyTimers.forEach(clearTimeout);
      emptyTimers = [];
      emptyOpen = false;
      emptyEl.hidden = true;
      emptyLine.classList.remove('drop');
      emptyLine.textContent = '';
      flagStrip.hidden = true;
      flagStrip.classList.remove('in');
    }

    /* hold back the "no matching records" reel — a mistyped letter
       should give the reader a moment to fix it first */
    const EMPTY_DELAY_MS = 1600;

    function queueEmpty(term){
      if (emptyOpen){ showEmpty(term); return; }   // already up: just re-aim the hint
      if (emptyDelay) return;                      // already counting down
      emptyDelay = setTimeout(() => {
        emptyDelay = null;
        if (q.value.trim().toLowerCase() === term) showEmpty(term);
      }, EMPTY_DELAY_MS);
    }

    function showEmpty(term){
      const hint = closestNation(term);
      [...flagRail.children].forEach(b => {
        b.classList.toggle('suggested', b.dataset.nation === hint);
      });

      if (emptyOpen) return;      // already running — don't restart per keystroke
      emptyOpen = true;
      emptyEl.hidden = false;
      emptyLine.classList.remove('drop');
      flagStrip.hidden = true;
      flagStrip.classList.remove('in');

      if (REDUCED){
        emptyLine.textContent = NO_HITS;
        flagStrip.hidden = false;
        flagStrip.classList.add('in');
        measureRail();
        return;
      }

      bmuWrite(emptyLine, NO_HITS, 34, () => {
        emptyTimers.push(setTimeout(() => {
          emptyLine.classList.add('drop');            // reel turns over
          emptyTimers.push(setTimeout(() => {
            flagStrip.hidden = false;
            void flagStrip.offsetWidth;
            flagStrip.classList.add('in');
            measureRail();
          }, 260));
        }, 900));
      });
    }

    /* the ends only dissolve once there are more flags than fit */
    function measureRail(){
      flagRail.classList.toggle('overflowing',
        flagRail.scrollWidth > flagRail.clientWidth + 1);
    }
    window.addEventListener('resize', measureRail);

    /* Match on the START of words, never on any old substring — "h"
       should not drag in "British". A multi-word term has to place
       every one of its parts, so "mtp bag" needs both. */
    function itemMatches(el, term){
      const tokens = term.split(/\s+/).filter(Boolean);
      if (!tokens.length) return true;
      const words   = el.dataset.words.split('|');
      const aliases = el.dataset.alias.split('|');
      return tokens.every(t =>
        words.some(w => w.startsWith(t)) ||
        aliases.some(a => a && a.startsWith(t))
      );
    }

    /* ============================================================
       SAVED LIBRARY
       Kept in localStorage so a return visit still has the reader's
       shortlist; falls back to memory when storage is unavailable.
       ============================================================ */
    const SAVED_KEY = 'bmu.archive.saved';
    let savedIds = [];
    let savedOnly = false;

    try {
      savedIds = JSON.parse(localStorage.getItem(SAVED_KEY) || '[]');
      if (!Array.isArray(savedIds)) savedIds = [];
    } catch { savedIds = []; }

    /* A collection can outlive the garments in it: the archive is edited,
       and a reader's shelf then holds ids for things that no longer exist.
       Those were counting towards the tally and opening an empty section.
       The list is pruned against what is actually here, once, on arrival. */
    function pruneSaved(){
      const real = new Set(ITEMS.map(p => `${p.n}/${slugBase(p.name)}`));
      const kept = savedIds.filter(id => real.has(id));
      if (kept.length !== savedIds.length){
        savedIds = kept;
        persistSaved();
      }
    }

    function persistSaved(){
      try { localStorage.setItem(SAVED_KEY, JSON.stringify(savedIds)); } catch {}
    }
    function isSaved(id){ return savedIds.includes(id); }

    /* The shelf, written out for an email: the garment's own name and ref,
       in the order they were kept. Reads as a list a person could act on
       rather than a row of internal ids. */
    function savedNames(){
      return savedIds.map(id => {
        const el = allItems.find(x => x.dataset.id === id);
        if (!el) return null;
        const n = el.querySelector('.name');
        const r = el.querySelector('.ref');
        const ref = r ? r.textContent.split('—')[0].trim() : '';
        return n ? (ref ? `${n.textContent} (${ref})` : n.textContent) : null;
      }).filter(Boolean);
    }
    function toggleSaved(id){
      const i = savedIds.indexOf(id);
      if (i === -1) savedIds.push(id); else savedIds.splice(i, 1);
      persistSaved();
      paintSaved();
    }

    /* the tabs show either because the flag asked for them or because a
       search is running — a term must always have somewhere to land,
       otherwise typing on the bare page looks broken */
    let nationsOpen = false;

    /* The tab is built from clones of the real cards, re-wired through the
       same path, so a saved garment behaves identically wherever it sits. */
    function buildSavedTab(){
      /* Rebuilt whole rather than emptied. The shelf now carries a filter
         bar like every other tab, and regroup() rearranges a tab by throwing
         its sections away and making new ones — so a grid held by id would
         be gone the first time anything was grouped. The body is built from
         nothing each time and nothing outside this function holds on to any
         part of it. */
      const body = savedTab.querySelector('.nbody');
      body.innerHTML = '';
      body.appendChild(makeFacetBar());
      const group = document.createElement('section');
      group.className = 'group';
      const savedGrid = document.createElement('div');
      savedGrid.className = 'grid';
      group.appendChild(savedGrid);
      body.appendChild(group);
      savedTab.dataset.facet = '';

      savedIds.forEach(id => {
        const src = allItems.find(el => el.dataset.id === id);
        if (!src) return;
        const copy = src.cloneNode(true);
        copy.hidden = false;
        const img = copy.querySelector('img');
        const pending = copy.querySelector('.pending');
        if (img && pending){
          img.addEventListener('error', () => { img.remove(); pending.hidden = false; });
        }
        wireCard(copy, copy.dataset.gname, copy.dataset.gref, copy.dataset.gtxt);
        savedGrid.appendChild(copy);
      });
      savedTabQty.textContent = savedIds.length;
      // its own section: present only while the bookmark is selected
      savedTab.hidden = !savedOnly || savedIds.length === 0;
      if (savedTab.hidden) savedTab.open = false;
    }

    function paintSaved(){
      buildSavedTab();
      document.querySelectorAll('.item').forEach(el => {
        const on = isSaved(el.dataset.id) ? 'true' : 'false';
        el.querySelectorAll('.btn-save, .btn-save-inline')
          .forEach(b => b.setAttribute('aria-pressed', on));
      });
      const n = savedIds.length;
      savedCountEl.textContent = n ? String(n) : '';
      savedBtn.setAttribute('aria-pressed', savedOnly ? 'true' : 'false');
      if (savedOnly && !n) savedOnly = false;
    }

    let soloId = null;      // one garment held open on its own
    // declared here because filter() reads it and filter() runs at init,
    // long before the count typewriter further down is reached
    let countTyping = false;

    function filter(){
      const term = q.value.trim().toLowerCase();
      // swaps the right-hand slot between the star and the ✕
      searchForm.classList.toggle('has-term', !!term);
      document.body.classList.toggle('browsing', nationsOpen || !!term);
      // the tabs this call is about to open must not carry the bar away with
      // them; set here rather than through syncChrome, which reaches for the
      // dock — declared further down and still in its dead zone at init
      if (term) document.body.classList.remove('tab-open');

      allItems.forEach(el => {
        if (soloId){ el.hidden = el.dataset.id !== soloId; return; }
        const inLibrary = !savedOnly || isSaved(el.dataset.id);
        el.hidden = !inLibrary || (term ? !itemMatches(el, term) : false);
      });

      allGroups.forEach(g => {
        g.hidden = !g.querySelector('.item:not([hidden])');
      });

      let shown = 0;
      allNations.forEach(d => {
        const hits = d.querySelectorAll('.item:not([hidden])').length;
        shown += hits;
        d.hidden = (term || soloId) ? hits === 0 : false;
        d.querySelector('.qty').textContent = term ? hits : d.querySelectorAll('.item').length;
        if (term) d.open = true;
        // a garment opened from explore must land on its record, not on a
        // shut tab — this reset was undoing the tab the click had opened
        else if (soloId) d.open = hits > 0;
        else d.open = NATIONS.find(x => x.key === d.dataset.nation).open;
      });

      // a lone result is presented on its own, without section furniture
      const lone = !!soloId || (!!term && shown === 1);
      document.body.classList.toggle('single-result', lone);

      allNations.forEach(d => {
        const label = d.querySelector('summary .n');
        if (label) label.textContent = d.dataset.label;
      });
      if (lone){
        const only = catalogue.querySelector('.item:not([hidden])');
        const tab  = only && only.closest('.nation');
        if (tab){
          tab.querySelector('summary .n').textContent =
            only.querySelector('.name').textContent;
        }
      }

      const noHits = !!term && shown === 0;
      if (noHits) queueEmpty(term); else hideEmpty();

      if (!countTyping) countEl.textContent = soloId
        ? ''
        : term
        ? `${shown} ${shown === 1 ? 'garment' : 'garments'} matching “${q.value.trim()}”`
        : `${shown} ${shown === 1 ? 'garment' : 'garments'}`;
    }

    /* the ✕ on the main bar puts the whole page back to how it loaded */
    function resetPage(){
      q.value = '';
      const dqEl = document.getElementById('dq');
      if (dqEl) dqEl.value = '';
      filter();                      // restores each tab's default open state
      window.scrollTo({ top:0, behavior:REDUCED ? 'auto' : 'smooth' });
    }

    /* ============================================================
       GROUPING A NATION'S GARMENTS
       The tab opens on every garment in one run. The switch regroups them
       by the facets the records already carry — the shelf they sit on, the
       fabric named in the title, the decade — and Reset puts them back.

       The cards are moved, not rebuilt: every listener already on them
       stays attached, and a garment keeps whatever state it was in.
       ============================================================ */
    /* One bar, wherever a tab needs one. It was written inline inside the
       nation builder, which meant the one tab NOT built there — the shelf —
       had no way of grouping what was on it, and the list lost its filter
       the moment the reader opened their own collection.

       Word, choices, sign — in that order in the markup, because that is the
       order they read in on the page. The sign used to sit between the word
       and the choices and be flown to the right of them by a measured
       transform; with the choices in the middle it is simply pushed along by
       the row opening, and lands one gap past the last of them without
       anything being measured about where it should go. */
    function makeFacetBar(){
      const bar = document.createElement('div');
      bar.className = 'facet-bar';
      bar.innerHTML =
        `<span class="facet-title">Garments</span>` +
        `<span class="facet-opts" hidden>` +
          `<button type="button" class="facet-opt" data-facet="type">Type</button>` +
          `<button type="button" class="facet-opt" data-facet="date">Date</button>` +
          `<button type="button" class="facet-opt facet-reset" data-facet="" hidden>All</button>` +
        `</span>` +
        `<button type="button" class="facet-toggle" aria-expanded="false" aria-label="Group these garments">` +
          `<span class="facet-sign" aria-hidden="true">+</span>` +
        `</button>`;
      return bar;
    }

    function facetOf(el, facet){
      if (facet === 'type')     return el.dataset.type || 'Unclassified';
      // material is not offered as a grouping for now; the data stays on the card
      if (facet === 'material') return el.dataset.material || 'Unlisted';
      if (facet === 'date')     return el.dataset.date || 'Undated';
      return '';
    }

    function regroup(details, facet){
      const body   = details.querySelector('.nbody');
      const bar    = body.querySelector('.facet-bar');
      const title  = bar.querySelector('.facet-title');
      const reset  = bar.querySelector('.facet-reset');
      const cards  = [...body.querySelectorAll('.item')];
      if (!cards.length) return;

      // every existing section goes; the cards themselves are kept
      body.querySelectorAll('.group').forEach(g => g.remove());

      const make = (heading) => {
        const g = document.createElement('section');
        g.className = 'group';
        if (heading){
          const l = document.createElement('div');
          l.className = 'section-label';
          l.textContent = heading;
          g.appendChild(l);
        }
        const grid = document.createElement('div');
        grid.className = 'grid';
        g.appendChild(grid);
        body.appendChild(g);
        return grid;
      };

      if (!facet){
        // all of them, in one run, under no heading at all
        const grid = make(null);
        cards.forEach(c => grid.appendChild(c));
        title.textContent = 'Garments';
        bar.querySelectorAll('.facet-opt').forEach(b => b.setAttribute('aria-pressed', 'false'));
        /* Nothing to go back to: this IS all of them. Offering All here was
           offering a control that could only leave the tab exactly as it
           already was. */
        reset.hidden = true;
        details.dataset.facet = '';
        return;
      }

      const groups = new Map();
      cards.forEach(c => {
        const k = facetOf(c, facet);
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(c);
      });

      /* Dates run oldest first; everything else runs by size, biggest
         shelf at the top — a list of ones under a list of twelve reads as
         an afterthought either way round, but at least this way the
         substance comes first. */
      const keys = [...groups.keys()].sort((a, b) =>
        facet === 'date' ? a.localeCompare(b)
                         : groups.get(b).length - groups.get(a).length || a.localeCompare(b));

      keys.forEach(k => {
        const grid = make(keys.length > 1 ? k : null);
        groups.get(k).forEach(c => grid.appendChild(c));
      });

      // the heading becomes what the reader chose to see them by
      title.textContent = keys.length === 1 ? keys[0] : facet[0].toUpperCase() + facet.slice(1);
      bar.querySelectorAll('.facet-opt').forEach(b =>
        b.setAttribute('aria-pressed', b.dataset.facet === facet ? 'true' : 'false'));
      // the way back out, offered only now that there is something to leave
      reset.hidden = false;
      details.dataset.facet = facet;
    }

    /* One listener for every tab: the bar is the same shape in each. It was
       bound to the catalogue alone, and the shelf is not in the catalogue —
       so the shelf's bar drew and then did nothing when it was pressed. */
    function facetClick(e){
      const toggle = e.target.closest('.facet-toggle');
      const opt    = e.target.closest('.facet-opt');
      if (!toggle && !opt) return;
      e.preventDefault();
      e.stopPropagation();

      const bar     = e.target.closest('.facet-bar');
      const details = e.target.closest('.nation');
      if (!bar || !details) return;

      if (toggle){
        const opening = !bar.classList.contains('on');
        const opts = bar.querySelector('.facet-opts');
        if (opening){
          opts.hidden = false;
          /* How wide the well has to open to. Measured by letting it size
             itself for an instant and reading it back, rather than trusting
             scrollWidth on a box that is currently nought wide — and the
             row's own gap is added on, so the sign ends up one gap past the
             last choice exactly as it sits one gap past the word when the
             row is shut. All inside one task, so none of it is painted. */
          const gap = parseFloat(getComputedStyle(bar).getPropertyValue('--facet-gap')) || 12;
          const prev = opts.style.width;
          opts.style.width = 'auto';
          const w = Math.ceil(opts.getBoundingClientRect().width);
          opts.style.width = prev;
          void opts.offsetWidth;
          bar.style.setProperty('--facet-w', (w + gap) + 'px');
          requestAnimationFrame(() => {
            bar.classList.add('on');
            bar.querySelector('.facet-sign').textContent = '−';
            bar.querySelector('.facet-toggle').setAttribute('aria-expanded', 'true');
          });
        } else {
          bar.classList.remove('on');
          bar.querySelector('.facet-sign').textContent = '+';
          bar.querySelector('.facet-toggle').setAttribute('aria-expanded', 'false');
          setTimeout(() => { opts.hidden = true; }, 420);
        }
        return;
      }

      regroup(details, opt.dataset.facet);
      // choosing closes the row: the sign walks back and the choices go
      bar.classList.remove('on');
      bar.querySelector('.facet-sign').textContent = '+';
      bar.querySelector('.facet-toggle').setAttribute('aria-expanded', 'false');
      setTimeout(() => { bar.querySelector('.facet-opts').hidden = true; }, 420);
    }
    catalogue.addEventListener('click', facetClick);
    savedTab.addEventListener('click', facetClick);

    /* ============================================================
       THE COLLECTION'S DOOR
       Keeping is free. Opening the shelf asks for an address once, and
       sends us the shelf with it — the same two facts a request sends, at
       the other end of the same interest. Once joined it never asks again.
       ============================================================ */
    const JOIN_KEY   = 'bmu.archive.joined';
    const JOIN_LEDE  = 'Join to open your collection.';
    const gateEl     = document.getElementById('joinGate');
    const jgLede     = document.getElementById('jgLede');
    const jgInput    = document.getElementById('jgInput');
    const jgSend     = document.getElementById('jgSend');
    const jgMsg      = document.getElementById('jgMsg');
    const jgClose    = document.getElementById('jgClose');
    let gateAfter    = null;      // what the reader was trying to reach

    function hasJoined(){
      try { return !!localStorage.getItem(JOIN_KEY); } catch { return false; }
    }

    function openJoinGate(then){
      if (hasJoined()){ then(); return; }
      gateAfter = then;
      gateEl.hidden = false;
      gateEl.setAttribute('aria-hidden', 'false');
      jgMsg.textContent = '';
      jgSend.disabled = false;
      requestAnimationFrame(() => gateEl.classList.add('on'));
      // the line writes itself, as it does on the home page
      bmuTypeInto(JOIN_LEDE, jgLede, 26, () => {
        try { jgInput.focus({ preventScroll:true }); } catch(_){}
      });
    }

    function closeJoinGate(){
      gateEl.classList.remove('on');
      gateAfter = null;
      setTimeout(() => {
        gateEl.hidden = true;
        gateEl.setAttribute('aria-hidden', 'true');
        jgLede.textContent = '';
      }, 420);
    }

    /* ---------- THE TYPEWRITER ----------
       Two things were wrong with writing a character at a time on a timer.

       It ran at the device's mercy. A setTimeout of 20ms on a busy phone is
       forty or sixty, so a line that takes two seconds to write on a desk
       took five or six in a hand, and readers gave up half way through. It
       is driven by the clock now: how much of the text should be showing is
       worked out from how long it has actually been, so a line takes the
       same time to write wherever it is read, however slow the frames are.

       And it APPENDED. Two runs writing into one element interleaved their
       characters and produced a word that is in neither text — the random
       letters that appeared when somebody left half way through and came
       back. Every frame writes a PREFIX of the real text instead, so what
       is on screen is always the opening of something true and can never be
       a word nobody wrote. Only the newest run may write to an element; the
       one before it stops on its next frame. */
    let typeSeq = 0;

    function bmuWrite(el, text, msPerChar, done, guard){
      if (!el){ if (done) done(); return; }
      const run = ++typeSeq;
      el.__typeRun = run;
      if (REDUCED || !text){ el.textContent = text || ''; if (done) done(); return; }
      const total = Math.max(60, text.length * msPerChar);
      const t0 = performance.now();
      el.textContent = '';
      (function frame(now){
        if (el.__typeRun !== run) return;        // a newer run owns this element
        if (guard && !guard()) return;
        const p = Math.min(1, (now - t0) / total);
        const n = Math.round(p * text.length);
        if (el.textContent.length !== n) el.textContent = text.slice(0, n);
        if (p < 1) requestAnimationFrame(frame);
        else if (done) done();
      })(performance.now());
    }

    /* The same, run backwards. It erases what is actually in the element, so
       an interrupted line unwrites the part of itself that got written. */
    function bmuErase(el, msPerChar, done, guard){
      if (!el){ if (done) done(); return; }
      const run = ++typeSeq;
      el.__typeRun = run;
      const text = el.textContent;
      if (REDUCED || !text){ el.textContent = ''; if (done) done(); return; }
      const total = Math.max(60, text.length * msPerChar);
      const t0 = performance.now();
      (function frame(now){
        if (el.__typeRun !== run) return;
        if (guard && !guard()) return;
        const p = Math.min(1, (now - t0) / total);
        const n = Math.round((1 - p) * text.length);
        if (el.textContent.length !== n) el.textContent = text.slice(0, n);
        if (p < 1) requestAnimationFrame(frame);
        else if (done) done();
      })(performance.now());
    }

    /* the archive's own small typewriter — the page has no other */
    function bmuTypeInto(text, el, delay, done){
      bmuWrite(el, text, delay, done);
    }

    /* ---------- THE SHELF, KEPT IN STEP ----------
       A collection is not a thing someone submits once. It is added to and
       taken from over a visit, and what we were told about it was whatever
       it happened to hold the first time the gate asked for an address.

       So it is reported again whenever it has changed AND the reader comes
       back to it — opening the shelf in the list, or gathering it on the
       field. Not on every bookmark: a reader deciding between four garments
       would send four emails in a minute, none of them their decision. When
       they go back to look at what they have kept, that is the decision, and
       that is what is sent.

       The last version sent is remembered, so returning to an unchanged
       shelf sends nothing. Only a real change sends a real update. */
    const SHELF_KEY = 'bmu.archive.shelf.sent';

    function shelfSignature(){
      return savedIds.slice().sort().join('|');
    }

    async function reportShelf(){
      if (!hasJoined()) return;                  // no address to report under
      let addr = '';
      try { addr = localStorage.getItem(JOIN_KEY) || ''; } catch(_){}
      if (!addr) return;

      const sig = shelfSignature();
      let sent = null;
      try { sent = localStorage.getItem(SHELF_KEY); } catch(_){}
      /* Nothing has moved since we last said so. The first report is the
         join itself, which records the shelf as it was at that moment. */
      if (sent === sig) return;

      const shelf = savedNames();
      const payload = {
        _subject: `Archive collection updated — ${shelf.length} garment${shelf.length === 1 ? '' : 's'}`,
        _template: 'table',
        _captcha: 'false',
        Email: addr,
        Reason: 'Updated saved collection',
        Collection: shelf.length ? shelf.join('\n') : '(empty)'
      };

      /* Recorded before the post, not after. A slow network would otherwise
         let a second visit to the shelf fire the same update again. */
      try { localStorage.setItem(SHELF_KEY, sig); } catch(_){}

      try {
        const res = await fetch(REQUEST_URL, {
          method: 'POST',
          headers: { 'Content-Type':'application/json', 'Accept':'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(res.status);
      } catch(_){
        // it can be told again next time; nothing the reader does waits on this
        try { localStorage.removeItem(SHELF_KEY); } catch(_){}
      }
    }

    async function submitJoinGate(){
      const addr = jgInput.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(addr)){
        jgMsg.textContent = 'Enter a valid email address.';
        try { jgInput.focus({ preventScroll:true }); } catch(_){}
        return;
      }
      jgSend.disabled = true;
      jgMsg.textContent = 'Sending…';

      const shelf = savedNames();
      const payload = {
        _subject: `Archive collection — ${shelf.length} garment${shelf.length === 1 ? '' : 's'}`,
        _template: 'table',
        _captcha: 'false',
        Email: addr,
        Reason: 'Opened a saved collection',
        Collection: shelf.length ? shelf.join('\n') : '(empty)'
      };

      try {
        const res = await fetch(REQUEST_URL, {
          method: 'POST',
          headers: { 'Content-Type':'application/json', 'Accept':'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(res.status);
      } catch(_){
        /* The address is what the gate is for, and we have it. Failing to
           post it must not stand between the reader and their own shelf. */
      }
      try { localStorage.setItem(JOIN_KEY, addr); } catch(_){}
      // this is the shelf we have just reported — see reportShelf
      try { localStorage.setItem(SHELF_KEY, shelfSignature()); } catch(_){}
      jgMsg.textContent = 'Joined.';
      const then = gateAfter;
      setTimeout(() => { closeJoinGate(); if (then) then(); }, 520);
    }

    jgSend.addEventListener('click', submitJoinGate);
    jgInput.addEventListener('keydown', e => {
      if (e.key === 'Enter'){ e.preventDefault(); submitJoinGate(); }
      if (e.key === 'Escape'){ e.preventDefault(); closeJoinGate(); }
    });
    jgClose.addEventListener('click', closeJoinGate);
    gateEl.addEventListener('click', e => { if (e.target === gateEl) closeJoinGate(); });

    /* The plate that answers an empty library. Pressing again restarts the
       hold rather than stacking a second timer behind the first. */
    const noData = document.getElementById('noData');
    let noDataTimer = null;
    function flashNoData(){
      if (!noData) return;
      clearTimeout(noDataTimer);
      noData.classList.add('show');
      noData.setAttribute('aria-hidden', 'false');
      document.body.classList.add('no-data');
      noDataTimer = setTimeout(() => {
        noData.classList.remove('show');
        noData.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('no-data');
      }, 1700);
    }

    savedBtn.addEventListener('click', () => {
      if (!savedIds.length && !savedOnly){
        // nothing kept yet — say so rather than showing an empty page
        flashNoData();
        return;
      }
      /* Closing the shelf needs nobody's name; opening it does. The gate is
         only raised when there is actually a name to ask for — calling it
         when already joined ran its callback, which pressed this button,
         which called the gate again, for ever. */
      if (!savedOnly && !hasJoined()){
        openJoinGate(() => savedBtn.click());
        return;
      }
      savedOnly = !savedOnly;
      soloId = null;
      nationsOpen = true;
      document.body.classList.add('browsing');
      document.body.classList.toggle('library', savedOnly);
      paintSaved();
      filter();
      if (savedOnly){
        // back at the collection: tell us if it has moved since last time
        reportShelf();
        savedTab.open = true;
        // rises first, then opens — the two beats the reader asked for
        savedTab.classList.remove('rising');
        void savedTab.offsetWidth;
        savedTab.classList.add('rising');
        setTimeout(() => savedTab.classList.remove('rising'), 560);
      }
      countEl.textContent = savedOnly
        ? `${savedIds.length} ${savedIds.length === 1 ? 'garment' : 'garments'}`
        : `${allItems.length} garments`;
      syncChrome();
    });

    q.addEventListener('input', filter);
    q.addEventListener('keydown', e => { if (e.key === 'Escape') resetPage(); });
    filter();

    /* ============================================================
       SEARCH SUGGESTIONS
       Cycles every garment in the archive: types the name out, holds
       with a blinking caret, deletes it again, moves to the next.
       Sits behind the input and yields the moment anything is typed.
       ============================================================ */
    const NAME_POOL = [...new Set(ITEMS.map(p => p.name))];
    const CAMO_POOL = ['DPM','MTP','Desert DPM','Vegetato','M/84','Woodland','Flecktarn','OG','Gulf Camouflage'];
    const NATION_POOL = NATIONS.filter(n => n.flag).map(n => n.label);
    const TYPE_POOL = [...new Set(ITEMS.map(p => p.cat))];

    /* the running suggestion answers whichever question is being asked */
    let SUGGESTIONS = NAME_POOL;
    function poolForPrompt(i){
      if (i === 2) return NATION_POOL;
      if (i === 3) return CAMO_POOL;
      if (i === 4) return TYPE_POOL;
      return NAME_POOL;
    }

    /* One bar, one suggestion. gText was the old bar's copy and everything
       written to it was mirrored across; the mirror is the only one left. */
    const dghost  = document.getElementById('dghost');
    const dgText  = document.createTextNode('');
    const dgCaret = document.createElement('span');
    dgCaret.className = 'caret';
    dghost.append(dgText, dgCaret);

    function mirrorGhost(v){
      dgText.nodeValue = v;
      dghost.hidden = document.getElementById('dq').value !== '';
    }

    /* hold is long enough for the caret to blink several times before
       the suggestion is deleted again */
    const TYPE_MS = 45, DELETE_MS = 25, HOLD_MS = 3800, GAP_MS = 320;
    let sIdx = 0, sPos = 0, sPhase = 'typing', sTimer = null;

    /* The dock's bar is the only one now, so the suggestion runs while THAT
       is empty. Reading the old bar's value here left the suggestion
       cycling behind a field the reader had already typed into. */
    function ghostVisible(){
      return document.getElementById('dq').value === '' && q.value === '';
    }

    /* The suggestion is a full garment name and the bar is narrow on a
       phone. Measure the run each tick and dim it as it closes on the
       right-hand icons, so it dissolves instead of colliding. */
    const ghostRange = document.createRange();
    function ghostFade(){
      // measured against the bar on screen, not the retired one, which has
      // no width at all and made every suggestion read as overflowing
      const host = dghost;
      const cs = getComputedStyle(host);
      const room = host.clientWidth
                 - parseFloat(cs.paddingLeft)
                 - parseFloat(cs.paddingRight);
      if (room <= 0) return;
      ghostRange.selectNodeContents(dgText);
      const used = ghostRange.getBoundingClientRect().width / room;
      dghost.style.opacity = used <= 0.78
        ? '1'
        : Math.max(0.1, 1 - (used - 0.78) / 0.3).toFixed(2);
    }

    function suggestTick(){
      if (!ghostVisible()){ sTimer = setTimeout(suggestTick, 400); return; }

      const word = SUGGESTIONS[sIdx];

      if (sPhase === 'typing'){
        if (sPos < word.length){
          sPos++;
          mirrorGhost(word.slice(0, sPos));
          ghostFade();
          sTimer = setTimeout(suggestTick, TYPE_MS);
        } else {
          sPhase = 'holding';
          dgCaret.classList.add('blink');
          sTimer = setTimeout(suggestTick, HOLD_MS);
        }
      } else if (sPhase === 'holding'){
        sPhase = 'deleting';
        sTimer = setTimeout(suggestTick, DELETE_MS);
      } else {
        if (sPos > 0){
          sPos--;
          mirrorGhost(word.slice(0, sPos));
          ghostFade();
          sTimer = setTimeout(suggestTick, DELETE_MS);
        } else {
          sPhase = 'typing';
          sIdx = (sIdx + 1) % SUGGESTIONS.length;
          sTimer = setTimeout(suggestTick, GAP_MS);
        }
      }
    }

    function startSuggestions(){
      if (REDUCED){
        // no motion: rotate the whole suggestion on a slow timer
        dgCaret.remove();
        mirrorGhost(SUGGESTIONS[0]);
        setInterval(() => {
          sIdx = (sIdx + 1) % SUGGESTIONS.length;
          if (ghostVisible()) mirrorGhost(SUGGESTIONS[sIdx]);
        }, 3200);
        return;
      }
      suggestTick();
    }

    /* the suggestion yields as soon as there is real input to read */
    /* Read off the DOM rather than the `dq` binding: this runs once during
       setup, and the dock's own consts are declared further down the file.
       The old version read `q`, which was declared above it — the swap put
       it in front of a let that had not been reached yet. */
    function syncGhost(){
      const el = document.getElementById('dq');
      dghost.hidden = !!(el && el.value);
    }
    q.addEventListener('input', syncGhost);
    q.addEventListener('keydown', e => { if (e.key === 'Escape') setTimeout(syncGhost, 0); });
    syncGhost();

    /* the real caret takes over while the field is focused */

    /* ============================================================
       REQUESTS
       Static site, so this composes a mail to BMU rather than posting
       to a server. Quantity is a slider and a number box kept in sync.
       ============================================================ */
    /* ============================================================
       ARCHIVE REQUESTS
       A request used to be handed to the reader's own mail client, which
       is no use at all on a machine with no mail client set up — and that
       is most of them. It is posted instead, and the reader is told it
       has gone.

       FormSubmit needs no account and no key: the address below IS the
       endpoint. The very first request sent to a new address bounces back
       a confirmation link that has to be clicked once; after that they
       arrive straight in the inbox.
       ============================================================ */
    const REQUEST_TO  = 'hello@britishmaterialunit.com';
    const REQUEST_URL = 'https://formsubmit.co/ajax/' + REQUEST_TO;

    function wireCard(el, name, ref, txtPath){
      el.querySelectorAll('.btn-save, .btn-save-inline').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          toggleSaved(el.dataset.id);
          const mark = btn.querySelector('.bm');
          if (mark && isSaved(el.dataset.id)){
            mark.classList.remove('pop');
            void mark.offsetWidth;
            mark.classList.add('pop');
          }
        });
      });
      const reqBtn   = el.querySelector('.req-toggle');
      const infoBtn  = el.querySelector('.info-toggle');
      const reqPanel = el.querySelector('.req-panel');
      const infoPane = el.querySelector('.info-panel');
      // the text goes in the inner box: writing to the panel itself would
      // throw away the wrapper the slide collapses against
      const infoBody = el.querySelector('.info-inner');
      const val      = el.querySelector('.qtyval');
      const dots     = el.querySelector('.req-dots');
      const anyQty   = el.querySelector('.req-any');
      const email    = el.querySelector('.req-email');
      const honey    = el.querySelector('.req-hp');
      const send     = el.querySelector('.req-send');
      const msg      = el.querySelector('.req-msg');

      function setState(state){   // 'idle' | 'request' | 'info'
        reqPanel.classList.toggle('open', state === 'request');
        infoPane.classList.toggle('open', state === 'info');
        // while requesting, Request steps aside and Info is the way out
        reqBtn.hidden = state === 'request';
        reqBtn.setAttribute('aria-expanded', state === 'request' ? 'true' : 'false');
        infoBtn.setAttribute('aria-expanded', state === 'info' ? 'true' : 'false');
        infoBtn.textContent = state === 'info' ? '✕' : 'Info';
        infoBtn.setAttribute('aria-label', state === 'info' ? 'Close info' : 'Info');
        if (state !== 'request') msg.textContent = '';
      }

      /* ---------- THE RECORD IS HELD BACK ----------
         Info no longer shows the written record. Every garment answers the
         same way: Sourcing, with its dots counted out twice and a rest
         between — three, three, pause — flashing in light grey.

         The records themselves are untouched on disk, and txtPath still
         points at this garment's. Putting them back is a matter of fetching
         it here again: read the file, cut at the blank line under
         "Archive ref:" for the prose, and stop at the "---" rule, which is
         where the shop's own list begins. */
      const SOURCING = (() => {
        const DOT = 240, HOLD = 520, REST = 1200;
        const frames = [];
        for (let run = 0; run < 2; run++){
          frames.push(['Sourcing',    DOT]);
          frames.push(['Sourcing.',   DOT]);
          frames.push(['Sourcing..',  DOT]);
          // the last of the three is held; after the second three, a rest
          frames.push(['Sourcing...', run === 1 ? REST : HOLD]);
        }
        return frames;
      })();

      let sourceTimer = null;
      function sourcing(on){
        clearTimeout(sourceTimer);
        infoBody.classList.toggle('sourcing', !!on);
        if (!on){ infoBody.textContent = ''; return; }
        let i = 0;
        const tick = () => {
          const [text, wait] = SOURCING[i];
          infoBody.textContent = text;
          i = (i + 1) % SOURCING.length;
          sourceTimer = setTimeout(tick, wait);
        };
        tick();
      }

      reqBtn.addEventListener('click', () => { sourcing(false); setState('request'); });

      infoBtn.addEventListener('click', () => {
        // from the request form this doubles as the way back out
        if (infoPane.classList.contains('open')) { sourcing(false); setState('idle'); return; }
        sourcing(true);
        setState('info');
      });

      /* The run an order is actually placed in. Tens to a hundred, then
         hundreds — the steps get bigger as the numbers do, which is how
         quantities are thought about rather than how a ruler is marked. A
         listed scale rather than a start and a stride, because the stride
         changes partway along it; past the last dot the field takes any
         number at all. */
      const UNITS = [30, 40, 50, 60, 70, 80, 90, 100, 200, 300];
      const BASE  = UNITS[0];
      let qty = BASE;

      UNITS.forEach(n => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'req-dot';
        b.dataset.n = n;
        b.setAttribute('aria-label', `${n} units`);
        dots.appendChild(b);
      });

      function paintDots(n){
        [...dots.children].forEach(b => {
          const v = +b.dataset.n;
          b.classList.toggle('on', v <= n);
          b.classList.toggle('tip', v === n);
          b.setAttribute('aria-pressed', v <= n ? 'true' : 'false');
        });
        val.textContent = n;
      }

      function setQty(n, fromField){
        qty = Math.max(1, Math.round(n) || BASE);
        if (!fromField) anyQty.value = '';
        paintDots(qty);
      }

      dots.addEventListener('click', e => {
        const b = e.target.closest('.req-dot');
        if (b) setQty(+b.dataset.n);
      });
      anyQty.addEventListener('input', () => {
        const n = parseInt(anyQty.value.replace(/[^0-9]/g, ''), 10);
        if (!isNaN(n) && n > 0){ setQty(n, true); }
      });
      setQty(BASE);

      send.addEventListener('click', async () => {
        const addr = email.value.trim();

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(addr)){
          msg.textContent = 'Enter a valid email address.';
          msg.classList.add('err');
          email.focus({ preventScroll:true });
          return;
        }
        if (honey && honey.value) return;     // a bot filled the hidden field

        const subject = `Archive request — ${qty} × ${name}`;

        /* The keys are what the email is laid out by, so they are written
           the way they should read in the inbox rather than as code — and
           in the same words the collection email uses, so the two arrive
           looking like two of the same thing rather than two formats.
           Email, then why, then what: the order they want reading in. */
        const shelf = savedNames();
        const payload = {
          _subject: subject,
          _template: 'table',
          _captcha: 'false',
          Email:    addr,
          Reason:   'Requested a garment',
          Garment:  name,
          Quantity: String(qty)
        };
        if (ref) payload['Archive ref'] = ref;

        /* Whatever is on their shelf goes with it. A request is the one
           moment we know both who they are and what they have been
           gathering, and the two together say far more than the single
           garment they happened to press the button on. */
        payload.Collection = shelf.length ? shelf.join('\n') : '(empty)';

        msg.classList.remove('err');
        msg.textContent = 'Sending…';
        send.disabled = true;

        try {
          const res = await fetch(REQUEST_URL, {
            method: 'POST',
            headers: { 'Content-Type':'application/json', 'Accept':'application/json' },
            body: JSON.stringify(payload)
          });
          const out = await res.json().catch(() => ({}));
          if (!res.ok || out.success === 'false' || out.success === false){
            throw new Error(out.message || 'rejected');
          }
          msg.textContent = `Request sent — ${qty} × ${name}. We will be in touch at ${addr}.`;
          email.value = '';
        } catch (_){
          /* The post is the way requests are sent — there is no second one.
             This used to hand over a mail draft, which told the reader the
             form had failed and made them finish the job by hand; the form
             works, and offering an escape from it reads as not trusting it.

             The button comes back and the line says to go again. */
          msg.classList.add('err');
          msg.textContent = 'Please try again.';
        } finally {
          send.disabled = false;
        }
      });
    }

    /* ============================================================
       DOCK
       Appears only once the reader is inside an open nation tab and
       the real search bar has scrolled away. The arrow climbs out in
       two stages: first to the top of the tab you are in (closing the
       others), then to the top of the page with everything shut.
       ============================================================ */
    const dock        = document.getElementById('dock');
    const dockSearch  = document.getElementById('dockSearch');
    const dockLibrary = document.getElementById('dockLibrary');
    const dockClear   = document.getElementById('dockClear');
    const dq          = document.getElementById('dq');

    let dockForced = false;      // summoned by the explore mark

    function collapseDock(){
      dock.classList.remove('open');
      document.body.classList.remove('dock-open');
      dq.tabIndex = -1;
      dockClear.tabIndex = -1;
      dq.blur();
    }

    function openDock(){
      dock.classList.add('open');
      document.body.classList.add('dock-open');
      setFace(0, true);        // never leave the exit under a searching finger
      dq.tabIndex = 0;
      dockClear.tabIndex = 0;
      dq.value = q.value;
      dq.focus({ preventScroll:true });
    }

    /* The search bar is permanent now, so the dock is no longer tied to
       it scrolling away — it is simply what the explore mark summons. */
    function anyNationOpen(){
      return allNations.some(d => d.open && !d.hidden);
    }

    /* explore's element is declared further down, so its state is tracked
       here rather than read off the DOM — updateDock() runs before it */
    let exploreOn = false;

    /* The three boxes appear whenever there is something to navigate:
       the star was pressed, a nation tab is open, or explore is running.
       Opening a tab therefore hands the reader the dock's own search bar
       in place of the main one. */
    /* Arrived from the home page's Archive button, which walked the bar down
       to the foot of the screen and left it there. It is already in place as
       far as the reader is concerned, so it is put in place here without the
       rise and the fade — playing those again would be the bar arriving twice.
       Read once and cleared: a reload is a plain visit. */
    function updateDock(){
      /* Tabs opened by a term are not the reader reaching for the dock —
         they are the answer to what is still being typed into the main bar.
         Handing over a second search instrument at that moment puts two on
         the screen at once, so the dock waits until the bar is done with. */
      const show = dockForced || exploreOn || (anyNationOpen() && !q.value.trim());
      dock.classList.toggle('show', show);
      dock.setAttribute('aria-hidden', show ? 'false' : 'true');
      // whenever the three boxes are out, the star reads active
      navBtn.setAttribute('aria-pressed', show ? 'true' : 'false');
      if (!show) collapseDock();
    }

    /* Everything that returns the archive to rest goes through here, so
       the star can never end up a step behind the buttons it summoned. */
    function goHome(){
      markUrl(null);                    // the record is being left: /archive
      document.body.classList.remove('solo-from-field');
      document.body.style.removeProperty('--solo-drop');
      document.body.classList.remove('solo-closing', 'solo-shutting');
      document.querySelectorAll('.nation').forEach(n => n.style.removeProperty('--lid-drop'));
      document.body.classList.remove('solo-drawing');
      document.body.classList.remove('dock-list');
      soloTimers.forEach(clearTimeout);
      soloTimers = [];
      clearHolds();
      document.body.classList.remove('solo-build', 'solo-snap', 'solo-drawing');
      soloId = null;
      if (!explore.hidden) endExplore(false);
      /* Rest is not "no bar" any more. The dock IS the bar, so the cross
         puts the reader back in front of it with an empty field and the
         question in the middle of the screen — the state the page used to
         open on, now that there is only one instrument to come back to. */
      dockForced = true;
      navBtn.setAttribute('aria-pressed', 'false');

      nationsOpen = false;
      flagBtn.setAttribute('aria-pressed', 'false');
      dqFlag.setAttribute('aria-pressed', 'false');
      document.body.classList.remove('closing-tabs');
      allNations.forEach(d => { d.open = false; });

      q.value = '';
      dq.value = '';
      filter();
      syncGhost();
      setFaceMode('explore');
      setFace(0, true);
      openDock();
      dq.value = '';
      dghost.hidden = false;
