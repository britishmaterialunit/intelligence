                       shape of an order is before a number is chosen. -->
                  <div class="req-dots" role="group" aria-label="Quantity"></div>
                  <div class="req-qty">
                    <span class="qtyval" aria-live="polite">30</span>
                    <input type="text" class="req-any" inputmode="numeric"
                           placeholder="or enter any amount" aria-label="Or enter any amount">
                  </div>
                </div>
                <input type="email" class="req-email" placeholder="you@example.com" autocomplete="email" aria-label="Your email">
                <input type="text" class="req-hp" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
                <button type="button" class="req-send">Send request</button>
                <div class="req-msg" role="status"></div>
              </div></div>
              <div class="info-panel"><div class="info-inner"></div></div>
              <div class="actions">
                <button type="button" class="btn-line req-toggle" aria-expanded="false">Request</button>
                <button type="button" class="btn-line info-toggle" aria-expanded="false">Info</button>
              </div>
            </div>`;
          const img = el.querySelector('img');
          const pending = el.querySelector('.pending');
          img.addEventListener('error', () => { img.remove(); pending.hidden = false; });
          el.dataset.id   = `${nation.key}/${slugBase(p.name)}`;
          el.dataset.gname = p.name;
          el.dataset.gref  = p.ref || '';
          el.dataset.gtxt  = txt;
          wireCard(el, p.name, p.ref, txt);
          grid.appendChild(el);
        });

        group.appendChild(grid);
        body.appendChild(group);
      });

      // take over the summary's own toggling so it can slide
      details.querySelector('summary').addEventListener('click', e => {
        e.preventDefault();
        // on a single garment reached from explore, the − is the way back
        if (document.body.classList.contains('single-result') && lastExploreItem){
          returnToExplore();
          return;
        }
        setNationOpen(details, !details.open);
      });

      catalogue.appendChild(details);
    });

    /* ---------- search ---------- */
    const q          = document.getElementById('q');
    /* The old bar's three controls are gone with it. Their jobs live on the
       dock now — dqFlag for nations, dqExplore for the field, the cross for
       rest — but a dozen places still reported state to them. Rather than
       thread a null check through every one, they answer to a stub that
       swallows what it is told. It is the smallest honest shim: nothing
       reads these back. */
    const RETIRED = { setAttribute(){}, addEventListener(){}, classList:{ toggle(){}, add(){}, remove(){} }, style:{} };
    const clearQ     = RETIRED;
    const navBtn     = RETIRED;
    const flagBtn    = RETIRED;
    const searchForm = RETIRED;
    const countEl = document.getElementById('count');
    const emptyEl = document.getElementById('empty');
    const savedBtn      = document.getElementById('savedBtn');
    const savedTab      = document.getElementById('savedTab');
    const savedGrid     = document.getElementById('savedGrid');
    const savedTabQty   = document.getElementById('savedTabQty');
    const savedCountEl  = document.getElementById('savedCount');
    const emptyLine  = document.getElementById('emptyLine');
    const flagStrip  = document.getElementById('flagStrip');
    const flagRail   = document.getElementById('flagRail');
    const allItems   = [...catalogue.querySelectorAll('.item')];
    const allGroups  = [...catalogue.querySelectorAll('.group')];
    const allNations = [...catalogue.querySelectorAll('.nation')];

    /* ============================================================
       EMPTY STATE
       "No matching records" types out, drops away like a slot reel,
       and the nation flags roll in behind it. Picking one clears the
       search and opens that nation.
       ============================================================ */
    const NO_HITS = 'No matching records';

    NATIONS.filter(n => n.flag).forEach(n => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'flag-pick';
      b.dataset.nation = n.key;
      b.title = n.label;
      b.setAttribute('aria-label', n.label);
      b.innerHTML = `<img src="/flags/${n.flag}" alt="" aria-hidden="true">` +
                    `<span>${n.abbr || n.label}</span>`;
      b.addEventListener('click', () => {
        q.value = '';
        filter();
        syncGhost();
        const d = allNations.find(x => x.dataset.nation === n.key);
        if (d){
          const others = allNations.filter(x => x !== d && x.open);
          setNationOpen(d, true);
          others.forEach(x => setNationOpen(x, false));
          if (others.length && !REDUCED) setTimeout(() => scrollToNation(d), 340);
          else scrollToNation(d);
        }
      });
      flagRail.appendChild(b);
    });

    /* edit distance, so a near-miss spelling can be pointed at */
    function editDistance(a, b){
      const m = a.length, n = b.length;
      let prev = Array.from({ length:n + 1 }, (_, j) => j);
      for (let i = 1; i <= m; i++){
        const cur = [i];
        for (let j = 1; j <= n; j++){
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1,
                            prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        }
        prev = cur;
      }
      return prev[n];
    }

    function closestNation(term){
      let best = null, score = Infinity;
      NATIONS.filter(n => n.flag).forEach(n => {
        (n.alias || []).forEach(a => {
          const d = editDistance(term, a);
          if (d < score){ score = d; best = n.key; }
        });
      });
      // only a genuine near-miss counts, not any old typo
      return score <= Math.max(2, Math.floor(term.length / 3)) ? best : null;
    }

    let emptyTimers = [];
    let emptyOpen = false;
    let emptyDelay = null;

    function hideEmpty(){
      clearTimeout(emptyDelay);
      emptyDelay = null;
      emptyTimers.forEach(clearTimeout);
      emptyTimers = [];
      emptyOpen = false;
      emptyEl.hidden = true;
      emptyLine.classList.remove('drop');
      emptyLine.textContent = '';
      flagStrip.hidden = true;
      flagStrip.classList.remove('in');
    }

    /* hold back the "no matching records" reel — a mistyped letter
       should give the reader a moment to fix it first */
    const EMPTY_DELAY_MS = 1600;

    function queueEmpty(term){
      if (emptyOpen){ showEmpty(term); return; }   // already up: just re-aim the hint
      if (emptyDelay) return;                      // already counting down
      emptyDelay = setTimeout(() => {
        emptyDelay = null;
        if (q.value.trim().toLowerCase() === term) showEmpty(term);
      }, EMPTY_DELAY_MS);
    }

    function showEmpty(term){
      const hint = closestNation(term);
      [...flagRail.children].forEach(b => {
        b.classList.toggle('suggested', b.dataset.nation === hint);
      });

      if (emptyOpen) return;      // already running — don't restart per keystroke
      emptyOpen = true;
      emptyEl.hidden = false;
      emptyLine.classList.remove('drop');
      flagStrip.hidden = true;
      flagStrip.classList.remove('in');

      if (REDUCED){
        emptyLine.textContent = NO_HITS;
        flagStrip.hidden = false;
        flagStrip.classList.add('in');
        measureRail();
        return;
      }

      emptyLine.textContent = '';
      let n = 0;
      (function typeOut(){
        if (n < NO_HITS.length){
          emptyLine.textContent += NO_HITS.charAt(n++);
          emptyTimers.push(setTimeout(typeOut, 34));
        } else {
          emptyTimers.push(setTimeout(() => {
            emptyLine.classList.add('drop');          // reel turns over
            emptyTimers.push(setTimeout(() => {
              flagStrip.hidden = false;
              void flagStrip.offsetWidth;
              flagStrip.classList.add('in');
              measureRail();
            }, 260));
          }, 900));
        }
      })();
    }

    /* the ends only dissolve once there are more flags than fit */
    function measureRail(){
      flagRail.classList.toggle('overflowing',
        flagRail.scrollWidth > flagRail.clientWidth + 1);
    }
    window.addEventListener('resize', measureRail);

    /* Match on the START of words, never on any old substring — "h"
       should not drag in "British". A multi-word term has to place
       every one of its parts, so "mtp bag" needs both. */
    function itemMatches(el, term){
      const tokens = term.split(/\s+/).filter(Boolean);
      if (!tokens.length) return true;
      const words   = el.dataset.words.split('|');
      const aliases = el.dataset.alias.split('|');
      return tokens.every(t =>
        words.some(w => w.startsWith(t)) ||
        aliases.some(a => a && a.startsWith(t))
      );
    }

    /* ============================================================
       SAVED LIBRARY
       Kept in localStorage so a return visit still has the reader's
       shortlist; falls back to memory when storage is unavailable.
       ============================================================ */
    const SAVED_KEY = 'bmu.archive.saved';
    let savedIds = [];
    let savedOnly = false;

    try {
      savedIds = JSON.parse(localStorage.getItem(SAVED_KEY) || '[]');
      if (!Array.isArray(savedIds)) savedIds = [];
    } catch { savedIds = []; }

    /* A collection can outlive the garments in it: the archive is edited,
       and a reader's shelf then holds ids for things that no longer exist.
       Those were counting towards the tally and opening an empty section.
       The list is pruned against what is actually here, once, on arrival. */
    function pruneSaved(){
      const real = new Set(ITEMS.map(p => `${p.n}/${slugBase(p.name)}`));
      const kept = savedIds.filter(id => real.has(id));
      if (kept.length !== savedIds.length){
        savedIds = kept;
        persistSaved();
      }
    }

    function persistSaved(){
      try { localStorage.setItem(SAVED_KEY, JSON.stringify(savedIds)); } catch {}
    }
    function isSaved(id){ return savedIds.includes(id); }

    /* The shelf, written out for an email: the garment's own name and ref,
       in the order they were kept. Reads as a list a person could act on
       rather than a row of internal ids. */
    function savedNames(){
      return savedIds.map(id => {
        const el = allItems.find(x => x.dataset.id === id);
        if (!el) return null;
        const n = el.querySelector('.name');
        const r = el.querySelector('.ref');
        const ref = r ? r.textContent.split('—')[0].trim() : '';
        return n ? (ref ? `${n.textContent} (${ref})` : n.textContent) : null;
      }).filter(Boolean);
    }
    function toggleSaved(id){
      const i = savedIds.indexOf(id);
      if (i === -1) savedIds.push(id); else savedIds.splice(i, 1);
      persistSaved();
      paintSaved();
    }

    /* the tabs show either because the flag asked for them or because a
       search is running — a term must always have somewhere to land,
       otherwise typing on the bare page looks broken */
    let nationsOpen = false;

    /* The tab is built from clones of the real cards, re-wired through the
       same path, so a saved garment behaves identically wherever it sits. */
    function buildSavedTab(){
      savedGrid.innerHTML = '';
      savedIds.forEach(id => {
        const src = allItems.find(el => el.dataset.id === id);
        if (!src) return;
        const copy = src.cloneNode(true);
        copy.hidden = false;
        const img = copy.querySelector('img');
        const pending = copy.querySelector('.pending');
        if (img && pending){
          img.addEventListener('error', () => { img.remove(); pending.hidden = false; });
        }
        wireCard(copy, copy.dataset.gname, copy.dataset.gref, copy.dataset.gtxt);
        savedGrid.appendChild(copy);
      });
      savedTabQty.textContent = savedIds.length;
      // its own section: present only while the bookmark is selected
      savedTab.hidden = !savedOnly || savedIds.length === 0;
      if (savedTab.hidden) savedTab.open = false;
    }

    function paintSaved(){
      buildSavedTab();
      document.querySelectorAll('.item').forEach(el => {
        const on = isSaved(el.dataset.id) ? 'true' : 'false';
        el.querySelectorAll('.btn-save, .btn-save-inline')
          .forEach(b => b.setAttribute('aria-pressed', on));
      });
      const n = savedIds.length;
      savedCountEl.textContent = n ? String(n) : '';
      savedBtn.setAttribute('aria-pressed', savedOnly ? 'true' : 'false');
      if (savedOnly && !n) savedOnly = false;
    }

    let soloId = null;      // one garment held open on its own
    // declared here because filter() reads it and filter() runs at init,
    // long before the count typewriter further down is reached
    let countTyping = false;

    function filter(){
      const term = q.value.trim().toLowerCase();
      // swaps the right-hand slot between the star and the ✕
      searchForm.classList.toggle('has-term', !!term);
      document.body.classList.toggle('browsing', nationsOpen || !!term);
      // the tabs this call is about to open must not carry the bar away with
      // them; set here rather than through syncChrome, which reaches for the
      // dock — declared further down and still in its dead zone at init
      if (term) document.body.classList.remove('tab-open');
      if (term) hidePrompt();

      allItems.forEach(el => {
        if (soloId){ el.hidden = el.dataset.id !== soloId; return; }
        const inLibrary = !savedOnly || isSaved(el.dataset.id);
        el.hidden = !inLibrary || (term ? !itemMatches(el, term) : false);
      });

      allGroups.forEach(g => {
        g.hidden = !g.querySelector('.item:not([hidden])');
      });

      let shown = 0;
      allNations.forEach(d => {
        const hits = d.querySelectorAll('.item:not([hidden])').length;
        shown += hits;
        d.hidden = (term || soloId) ? hits === 0 : false;
        d.querySelector('.qty').textContent = term ? hits : d.querySelectorAll('.item').length;
        if (term) d.open = true;
        // a garment opened from explore must land on its record, not on a
        // shut tab — this reset was undoing the tab the click had opened
        else if (soloId) d.open = hits > 0;
        else d.open = NATIONS.find(x => x.key === d.dataset.nation).open;
      });

      // a lone result is presented on its own, without section furniture
      const lone = !!soloId || (!!term && shown === 1);
      document.body.classList.toggle('single-result', lone);

      allNations.forEach(d => {
        const label = d.querySelector('summary .n');
        if (label) label.textContent = d.dataset.label;
      });
      if (lone){
        const only = catalogue.querySelector('.item:not([hidden])');
        const tab  = only && only.closest('.nation');
        if (tab){
          tab.querySelector('summary .n').textContent =
            only.querySelector('.name').textContent;
        }
      }

      const noHits = !!term && shown === 0;
      if (noHits) queueEmpty(term); else hideEmpty();

      if (!countTyping) countEl.textContent = soloId
        ? ''
        : term
        ? `${shown} ${shown === 1 ? 'garment' : 'garments'} matching “${q.value.trim()}”`
        : `${shown} ${shown === 1 ? 'garment' : 'garments'}`;
    }

    /* the ✕ on the main bar puts the whole page back to how it loaded */
    function resetPage(){
      q.value = '';
      const dqEl = document.getElementById('dq');
      if (dqEl) dqEl.value = '';
      filter();                      // restores each tab's default open state
      window.scrollTo({ top:0, behavior:REDUCED ? 'auto' : 'smooth' });
    }

    /* ============================================================
       GROUPING A NATION'S GARMENTS
       The tab opens on every garment in one run. The switch regroups them
       by the facets the records already carry — the shelf they sit on, the
       fabric named in the title, the decade — and Reset puts them back.

       The cards are moved, not rebuilt: every listener already on them
       stays attached, and a garment keeps whatever state it was in.
       ============================================================ */
    function facetOf(el, facet){
      if (facet === 'type')     return el.dataset.type || 'Unclassified';
      if (facet === 'material') return el.dataset.material || 'Unlisted';
      if (facet === 'date')     return el.dataset.date || 'Undated';
      return '';
    }

    function regroup(details, facet){
      const body   = details.querySelector('.nbody');
      const bar    = body.querySelector('.facet-bar');
      const title  = bar.querySelector('.facet-title');
      const cards  = [...body.querySelectorAll('.item')];
      if (!cards.length) return;

      // every existing section goes; the cards themselves are kept
      body.querySelectorAll('.group').forEach(g => g.remove());

      const make = (heading) => {
        const g = document.createElement('section');
        g.className = 'group';
        if (heading){
          const l = document.createElement('div');
          l.className = 'section-label';
          l.textContent = heading;
          g.appendChild(l);
        }
        const grid = document.createElement('div');
        grid.className = 'grid';
        g.appendChild(grid);
        body.appendChild(g);
        return grid;
      };

      if (!facet){
        // all of them, in one run, under no heading at all
        const grid = make(null);
        cards.forEach(c => grid.appendChild(c));
        title.textContent = 'Garments';
        bar.querySelectorAll('.facet-opt').forEach(b => b.setAttribute('aria-pressed', 'false'));
        details.dataset.facet = '';
        return;
      }

      const groups = new Map();
      cards.forEach(c => {
        const k = facetOf(c, facet);
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(c);
      });

      /* Dates run oldest first; everything else runs by size, biggest
         shelf at the top — a list of ones under a list of twelve reads as
         an afterthought either way round, but at least this way the
         substance comes first. */
      const keys = [...groups.keys()].sort((a, b) =>
        facet === 'date' ? a.localeCompare(b)
                         : groups.get(b).length - groups.get(a).length || a.localeCompare(b));

      keys.forEach(k => {
        const grid = make(keys.length > 1 ? k : null);
        groups.get(k).forEach(c => grid.appendChild(c));
      });

      // the heading becomes what the reader chose to see them by
      title.textContent = keys.length === 1 ? keys[0] : facet[0].toUpperCase() + facet.slice(1);
      bar.querySelectorAll('.facet-opt').forEach(b =>
        b.setAttribute('aria-pressed', b.dataset.facet === facet ? 'true' : 'false'));
      details.dataset.facet = facet;
    }

    /* One listener for every tab: the bar is the same shape in each. */
    catalogue.addEventListener('click', e => {
      const toggle = e.target.closest('.facet-toggle');
      const opt    = e.target.closest('.facet-opt');
      if (!toggle && !opt) return;
      e.preventDefault();
      e.stopPropagation();

      const bar     = e.target.closest('.facet-bar');
      const details = e.target.closest('.nation');
      if (!bar || !details) return;

      if (toggle){
        const opening = !bar.classList.contains('on');
        const opts = bar.querySelector('.facet-opts');
        if (opening){
          opts.hidden = false;
          // how far the sign has to travel to clear the choices it reveals
          requestAnimationFrame(() => {
            bar.style.setProperty('--facet-shift', Math.round(opts.scrollWidth + 10) + 'px');
            bar.classList.add('on');
            bar.querySelector('.facet-sign').textContent = '−';
            bar.querySelector('.facet-toggle').setAttribute('aria-expanded', 'true');
          });
        } else {
          bar.classList.remove('on');
          bar.querySelector('.facet-sign').textContent = '+';
          bar.querySelector('.facet-toggle').setAttribute('aria-expanded', 'false');
          setTimeout(() => { opts.hidden = true; }, 420);
        }
        return;
      }

      regroup(details, opt.dataset.facet);
      // choosing closes the row: the sign walks back and the choices go
      bar.classList.remove('on');
      bar.querySelector('.facet-sign').textContent = '+';
      bar.querySelector('.facet-toggle').setAttribute('aria-expanded', 'false');
      setTimeout(() => { bar.querySelector('.facet-opts').hidden = true; }, 420);
    });

    /* ============================================================
       THE COLLECTION'S DOOR
       Keeping is free. Opening the shelf asks for an address once, and
       sends us the shelf with it — the same two facts a request sends, at
       the other end of the same interest. Once joined it never asks again.
       ============================================================ */
    const JOIN_KEY   = 'bmu.archive.joined';
    const JOIN_LEDE  = 'Join to open your collection.';
    const gateEl     = document.getElementById('joinGate');
    const jgLede     = document.getElementById('jgLede');
    const jgInput    = document.getElementById('jgInput');
    const jgSend     = document.getElementById('jgSend');
    const jgMsg      = document.getElementById('jgMsg');
    const jgClose    = document.getElementById('jgClose');
    let gateAfter    = null;      // what the reader was trying to reach

    function hasJoined(){
      try { return !!localStorage.getItem(JOIN_KEY); } catch { return false; }
    }

    function openJoinGate(then){
      if (hasJoined()){ then(); return; }
      gateAfter = then;
      gateEl.hidden = false;
      gateEl.setAttribute('aria-hidden', 'false');
      jgMsg.textContent = '';
      jgSend.disabled = false;
      requestAnimationFrame(() => gateEl.classList.add('on'));
      // the line writes itself, as it does on the home page
      bmuTypeInto(JOIN_LEDE, jgLede, 26, () => {
        try { jgInput.focus({ preventScroll:true }); } catch(_){}
      });
    }

    function closeJoinGate(){
      gateEl.classList.remove('on');
      gateAfter = null;
      setTimeout(() => {
        gateEl.hidden = true;
        gateEl.setAttribute('aria-hidden', 'true');
        jgLede.textContent = '';
      }, 420);
    }

    /* the archive's own small typewriter — the page has no other */
    function bmuTypeInto(text, el, delay, done){
      let i = 0;
      el.textContent = '';
      (function tick(){
        if (i < text.length){
          el.textContent += text.charAt(i++);
          setTimeout(tick, delay);
        } else if (done){ done(); }
      })();
    }

    async function submitJoinGate(){
      const addr = jgInput.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(addr)){
        jgMsg.textContent = 'Enter a valid email address.';
        try { jgInput.focus({ preventScroll:true }); } catch(_){}
        return;
      }
      jgSend.disabled = true;
      jgMsg.textContent = 'Sending…';

      const shelf = savedNames();
      const payload = {
        _subject: `Archive collection — ${shelf.length} garment${shelf.length === 1 ? '' : 's'}`,
        _template: 'table',
        _captcha: 'false',
        Email: addr,
        Reason: 'Opened a saved collection',
        Collection: shelf.length ? shelf.join('\n') : '(empty)'
      };

      try {
        const res = await fetch(REQUEST_URL, {
          method: 'POST',
          headers: { 'Content-Type':'application/json', 'Accept':'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(res.status);
      } catch(_){
        /* The address is what the gate is for, and we have it. Failing to
           post it must not stand between the reader and their own shelf. */
      }
      try { localStorage.setItem(JOIN_KEY, addr); } catch(_){}
      jgMsg.textContent = 'Joined.';
      const then = gateAfter;
      setTimeout(() => { closeJoinGate(); if (then) then(); }, 520);
    }

    jgSend.addEventListener('click', submitJoinGate);
    jgInput.addEventListener('keydown', e => {
      if (e.key === 'Enter'){ e.preventDefault(); submitJoinGate(); }
      if (e.key === 'Escape'){ e.preventDefault(); closeJoinGate(); }
    });
    jgClose.addEventListener('click', closeJoinGate);
    gateEl.addEventListener('click', e => { if (e.target === gateEl) closeJoinGate(); });

    /* The plate that answers an empty library. Pressing again restarts the
       hold rather than stacking a second timer behind the first. */
    const noData = document.getElementById('noData');
    let noDataTimer = null;
    function flashNoData(){
      if (!noData) return;
      clearTimeout(noDataTimer);
      noData.classList.add('show');
      noData.setAttribute('aria-hidden', 'false');
      document.body.classList.add('no-data');
      noDataTimer = setTimeout(() => {
        noData.classList.remove('show');
        noData.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('no-data');
      }, 1700);
    }

    savedBtn.addEventListener('click', () => {
      if (!savedIds.length && !savedOnly){
        // nothing kept yet — say so rather than showing an empty page
        flashNoData();
        return;
      }
      /* Closing the shelf needs nobody's name; opening it does. The gate is
         only raised when there is actually a name to ask for — calling it
         when already joined ran its callback, which pressed this button,
         which called the gate again, for ever. */
      if (!savedOnly && !hasJoined()){
        openJoinGate(() => savedBtn.click());
        return;
      }
      savedOnly = !savedOnly;
      soloId = null;
      nationsOpen = true;
      document.body.classList.add('browsing');
      document.body.classList.toggle('library', savedOnly);
      paintSaved();
      filter();
      if (savedOnly){
        savedTab.open = true;
        // rises first, then opens — the two beats the reader asked for
        savedTab.classList.remove('rising');
        void savedTab.offsetWidth;
        savedTab.classList.add('rising');
        setTimeout(() => savedTab.classList.remove('rising'), 560);
      }
      countEl.textContent = savedOnly
        ? `${savedIds.length} ${savedIds.length === 1 ? 'garment' : 'garments'}`
        : `${allItems.length} garments`;
      syncChrome();
    });

    q.addEventListener('input', filter);
    q.addEventListener('keydown', e => { if (e.key === 'Escape') resetPage(); });
    filter();

    /* ============================================================
       SEARCH SUGGESTIONS
       Cycles every garment in the archive: types the name out, holds
       with a blinking caret, deletes it again, moves to the next.
       Sits behind the input and yields the moment anything is typed.
       ============================================================ */
    const NAME_POOL = [...new Set(ITEMS.map(p => p.name))];
    const CAMO_POOL = ['DPM','MTP','Desert DPM','Vegetato','M/84','Woodland','Flecktarn','OG','Gulf Camouflage'];
    const NATION_POOL = NATIONS.filter(n => n.flag).map(n => n.label);
    const TYPE_POOL = [...new Set(ITEMS.map(p => p.cat))];

    /* the running suggestion answers whichever question is being asked */
    let SUGGESTIONS = NAME_POOL;
    function poolForPrompt(i){
      if (i === 2) return NATION_POOL;
      if (i === 3) return CAMO_POOL;
      if (i === 4) return TYPE_POOL;
      return NAME_POOL;
    }

    /* One bar, one suggestion. gText was the old bar's copy and everything
       written to it was mirrored across; the mirror is the only one left. */
    const dghost  = document.getElementById('dghost');
    const dgText  = document.createTextNode('');
    const dgCaret = document.createElement('span');
    dgCaret.className = 'caret';
    dghost.append(dgText, dgCaret);

    function mirrorGhost(v){
      dgText.nodeValue = v;
      dghost.hidden = document.getElementById('dq').value !== '';
    }

    /* hold is long enough for the caret to blink several times before
       the suggestion is deleted again */
    const TYPE_MS = 45, DELETE_MS = 25, HOLD_MS = 3800, GAP_MS = 320;
    let sIdx = 0, sPos = 0, sPhase = 'typing', sTimer = null;

    /* The dock's bar is the only one now, so the suggestion runs while THAT
       is empty. Reading the old bar's value here left the suggestion
       cycling behind a field the reader had already typed into. */
    function ghostVisible(){
      return document.getElementById('dq').value === '' && q.value === '';
    }

    /* The suggestion is a full garment name and the bar is narrow on a
       phone. Measure the run each tick and dim it as it closes on the
       right-hand icons, so it dissolves instead of colliding. */
    const ghostRange = document.createRange();
    function ghostFade(){
      // measured against the bar on screen, not the retired one, which has
      // no width at all and made every suggestion read as overflowing
      const host = dghost;
      const cs = getComputedStyle(host);
      const room = host.clientWidth
                 - parseFloat(cs.paddingLeft)
                 - parseFloat(cs.paddingRight);
      if (room <= 0) return;
      ghostRange.selectNodeContents(dgText);
      const used = ghostRange.getBoundingClientRect().width / room;
      dghost.style.opacity = used <= 0.78
        ? '1'
        : Math.max(0.1, 1 - (used - 0.78) / 0.3).toFixed(2);
    }

    function suggestTick(){
      if (!ghostVisible()){ sTimer = setTimeout(suggestTick, 400); return; }

      const word = SUGGESTIONS[sIdx];

      if (sPhase === 'typing'){
        if (sPos < word.length){
          sPos++;
          mirrorGhost(word.slice(0, sPos));
          ghostFade();
          sTimer = setTimeout(suggestTick, TYPE_MS);
        } else {
          sPhase = 'holding';
          dgCaret.classList.add('blink');
          sTimer = setTimeout(suggestTick, HOLD_MS);
        }
      } else if (sPhase === 'holding'){
        sPhase = 'deleting';
        sTimer = setTimeout(suggestTick, DELETE_MS);
      } else {
        if (sPos > 0){
          sPos--;
          mirrorGhost(word.slice(0, sPos));
          ghostFade();
          sTimer = setTimeout(suggestTick, DELETE_MS);
        } else {
          sPhase = 'typing';
          sIdx = (sIdx + 1) % SUGGESTIONS.length;
          sTimer = setTimeout(suggestTick, GAP_MS);
        }
      }
    }

    function startSuggestions(){
      if (REDUCED){
        // no motion: rotate the whole suggestion on a slow timer
        dgCaret.remove();
        mirrorGhost(SUGGESTIONS[0]);
        setInterval(() => {
          sIdx = (sIdx + 1) % SUGGESTIONS.length;
          if (ghostVisible()) mirrorGhost(SUGGESTIONS[sIdx]);
        }, 3200);
        return;
      }
      suggestTick();
    }

    /* the suggestion yields as soon as there is real input to read */
    /* Read off the DOM rather than the `dq` binding: this runs once during
       setup, and the dock's own consts are declared further down the file.
       The old version read `q`, which was declared above it — the swap put
       it in front of a let that had not been reached yet. */
    function syncGhost(){
      const el = document.getElementById('dq');
      dghost.hidden = !!(el && el.value);
    }
    q.addEventListener('input', syncGhost);
    q.addEventListener('keydown', e => { if (e.key === 'Escape') setTimeout(syncGhost, 0); });
    syncGhost();

    /* the real caret takes over while the field is focused */

    /* ============================================================
       REQUESTS
       Static site, so this composes a mail to BMU rather than posting
       to a server. Quantity is a slider and a number box kept in sync.
       ============================================================ */
    /* ============================================================
       ARCHIVE REQUESTS
       A request used to be handed to the reader's own mail client, which
       is no use at all on a machine with no mail client set up — and that
       is most of them. It is posted instead, and the reader is told it
       has gone.

       FormSubmit needs no account and no key: the address below IS the
       endpoint. The very first request sent to a new address bounces back
       a confirmation link that has to be clicked once; after that they
       arrive straight in the inbox.
       ============================================================ */
    const REQUEST_TO  = 'hello@britishmaterialunit.com';
    const REQUEST_URL = 'https://formsubmit.co/ajax/' + REQUEST_TO;

    function wireCard(el, name, ref, txtPath){
      el.querySelectorAll('.btn-save, .btn-save-inline').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          toggleSaved(el.dataset.id);
          const mark = btn.querySelector('.bm');
          if (mark && isSaved(el.dataset.id)){
            mark.classList.remove('pop');
            void mark.offsetWidth;
            mark.classList.add('pop');
          }
        });
      });
      const reqBtn   = el.querySelector('.req-toggle');
      const infoBtn  = el.querySelector('.info-toggle');
      const reqPanel = el.querySelector('.req-panel');
      const infoPane = el.querySelector('.info-panel');
      // the text goes in the inner box: writing to the panel itself would
      // throw away the wrapper the slide collapses against
      const infoBody = el.querySelector('.info-inner');
      const val      = el.querySelector('.qtyval');
      const dots     = el.querySelector('.req-dots');
      const anyQty   = el.querySelector('.req-any');
      const email    = el.querySelector('.req-email');
      const honey    = el.querySelector('.req-hp');
      const send     = el.querySelector('.req-send');
      const msg      = el.querySelector('.req-msg');

      let infoLoaded = false;

      function setState(state){   // 'idle' | 'request' | 'info'
        reqPanel.classList.toggle('open', state === 'request');
        infoPane.classList.toggle('open', state === 'info');
        // while requesting, Request steps aside and Info is the way out
        reqBtn.hidden = state === 'request';
        reqBtn.setAttribute('aria-expanded', state === 'request' ? 'true' : 'false');
        infoBtn.setAttribute('aria-expanded', state === 'info' ? 'true' : 'false');
        infoBtn.textContent = state === 'info' ? '✕' : 'Info';
        infoBtn.setAttribute('aria-label', state === 'info' ? 'Close info' : 'Info');
        if (state !== 'request') msg.textContent = '';
      }

      async function loadInfo(){
        if (infoLoaded) return;
        infoLoaded = true;
        try {
          const res = await fetch(txtPath);
          if (!res.ok) throw new Error(res.status);
          /* The name, nation, type and ref are already on the card an inch
             away. What the panel is for is everything under them — the
             material, the closures, the measurements, the dating. */
          const raw = (await res.text()).trim();
          const cut = raw.indexOf('\n\n', raw.indexOf('Archive ref:'));
          let body = cut === -1 ? raw : raw.slice(cut + 2).trim();
          /* The record keeps the shop's original list under a rule so the
             prose can always be checked against its source. The panel shows
             the prose; the list is for us, not for the reader. */
          const rule = body.indexOf('\n---\n');
          if (rule !== -1) body = body.slice(0, rule).trim();
          infoBody.textContent = body;
        } catch {
          infoBody.textContent = 'No record filed for this garment yet.';
        }
      }

      reqBtn.addEventListener('click', () => setState('request'));

      infoBtn.addEventListener('click', () => {
        // from the request form this doubles as the way back out
        if (infoPane.classList.contains('open')) { setState('idle'); return; }
        loadInfo();
        setState('info');
      });

      /* Thirty upwards in tens. Ten dots covers the run anyone actually asks
         for; past that the field at the end takes any number at all. */
      const STEP = 10, BASE = 30, DOTS = 10;
      let qty = BASE;

      for (let i = 0; i < DOTS; i++){
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'req-dot';
        b.dataset.n = BASE + i * STEP;
        b.setAttribute('aria-label', `${b.dataset.n}`);
        dots.appendChild(b);
      }

      function paintDots(n){
        [...dots.children].forEach(b => {
          const v = +b.dataset.n;
          b.classList.toggle('on', v <= n);
          b.classList.toggle('tip', v === n);
          b.setAttribute('aria-pressed', v <= n ? 'true' : 'false');
        });
        val.textContent = n;
      }

      function setQty(n, fromField){
        qty = Math.max(1, Math.round(n) || BASE);
        if (!fromField) anyQty.value = '';
        paintDots(qty);
      }

      dots.addEventListener('click', e => {
        const b = e.target.closest('.req-dot');
        if (b) setQty(+b.dataset.n);
      });
      anyQty.addEventListener('input', () => {
        const n = parseInt(anyQty.value.replace(/[^0-9]/g, ''), 10);
        if (!isNaN(n) && n > 0){ setQty(n, true); }
      });
      setQty(BASE);

      send.addEventListener('click', async () => {
        const addr = email.value.trim();

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(addr)){
          msg.textContent = 'Enter a valid email address.';
          msg.classList.add('err');
          email.focus({ preventScroll:true });
          return;
        }
        if (honey && honey.value) return;     // a bot filled the hidden field

        const subject = `Archive request — ${qty} × ${name}`;

        /* The keys are what the email is laid out by, so they are written
           the way they should read in the inbox rather than as code — and
           in the same words the collection email uses, so the two arrive
           looking like two of the same thing rather than two formats.
           Email, then why, then what: the order they want reading in. */
        const shelf = savedNames();
        const payload = {
          _subject: subject,
          _template: 'table',
          _captcha: 'false',
          Email:    addr,
          Reason:   'Requested a garment',
          Garment:  name,
          Quantity: String(qty)
        };
        if (ref) payload['Archive ref'] = ref;

        /* Whatever is on their shelf goes with it. A request is the one
           moment we know both who they are and what they have been
           gathering, and the two together say far more than the single
           garment they happened to press the button on. */
        payload.Collection = shelf.length ? shelf.join('\n') : '(empty)';

        msg.classList.remove('err');
        msg.textContent = 'Sending…';
        send.disabled = true;

        try {
          const res = await fetch(REQUEST_URL, {
            method: 'POST',
            headers: { 'Content-Type':'application/json', 'Accept':'application/json' },
            body: JSON.stringify(payload)
          });
          const out = await res.json().catch(() => ({}));
          if (!res.ok || out.success === 'false' || out.success === false){
            throw new Error(out.message || 'rejected');
          }
          msg.textContent = `Request sent — ${qty} × ${name}. We will be in touch at ${addr}.`;
          email.value = '';
        } catch (_){
          /* The post is the way requests are sent — there is no second one.
             This used to hand over a mail draft, which told the reader the
             form had failed and made them finish the job by hand; the form
             works, and offering an escape from it reads as not trusting it.

             The button comes back and the line says to go again. */
          msg.classList.add('err');
          msg.textContent = 'Please try again.';
        } finally {
          send.disabled = false;
        }
      });
    }

    /* ============================================================
       DOCK
       Appears only once the reader is inside an open nation tab and
       the real search bar has scrolled away. The arrow climbs out in
       two stages: first to the top of the tab you are in (closing the
       others), then to the top of the page with everything shut.
       ============================================================ */
    const dock        = document.getElementById('dock');
    const dockSearch  = document.getElementById('dockSearch');
    const dockLibrary = document.getElementById('dockLibrary');
    const dockClear   = document.getElementById('dockClear');
    const dq          = document.getElementById('dq');

    let dockForced = false;      // summoned by the explore mark

    function collapseDock(){
      dock.classList.remove('open');
      document.body.classList.remove('dock-open');
      dq.tabIndex = -1;
      dockClear.tabIndex = -1;
      dq.blur();
    }

    function openDock(){
      dock.classList.add('open');
      document.body.classList.add('dock-open');
      setFace(0, true);        // never leave the exit under a searching finger
      dq.tabIndex = 0;
      dockClear.tabIndex = 0;
      dq.value = q.value;
      dq.focus({ preventScroll:true });
    }

    /* The search bar is permanent now, so the dock is no longer tied to
       it scrolling away — it is simply what the explore mark summons. */
    function anyNationOpen(){
      return allNations.some(d => d.open && !d.hidden);
    }

    /* explore's element is declared further down, so its state is tracked
       here rather than read off the DOM — updateDock() runs before it */
    let exploreOn = false;

    /* The three boxes appear whenever there is something to navigate:
       the star was pressed, a nation tab is open, or explore is running.
       Opening a tab therefore hands the reader the dock's own search bar
       in place of the main one. */
    function updateDock(){
      /* Tabs opened by a term are not the reader reaching for the dock —
         they are the answer to what is still being typed into the main bar.
         Handing over a second search instrument at that moment puts two on
         the screen at once, so the dock waits until the bar is done with. */
      const show = dockForced || exploreOn || (anyNationOpen() && !q.value.trim());
      dock.classList.toggle('show', show);
      dock.setAttribute('aria-hidden', show ? 'false' : 'true');
      // whenever the three boxes are out, the star reads active
      navBtn.setAttribute('aria-pressed', show ? 'true' : 'false');
      if (!show) collapseDock();
    }

    /* Everything that returns the archive to rest goes through here, so
       the star can never end up a step behind the buttons it summoned. */
    function goHome(){
      document.body.classList.remove('solo-from-field');
      document.body.classList.remove('solo-closing', 'solo-shutting');
      document.querySelectorAll('.nation').forEach(n => n.style.removeProperty('--lid-drop'));
      document.body.classList.remove('solo-drawing');
      document.body.classList.remove('dock-list');
      soloTimers.forEach(clearTimeout);
      soloTimers = [];
      document.body.classList.remove('solo-build', 'solo-snap', 'solo-drawing');
      soloId = null;
      if (!explore.hidden) endExplore(false);
      /* Rest is not "no bar" any more. The dock IS the bar, so the cross
         puts the reader back in front of it with an empty field and the
         question in the middle of the screen — the state the page used to
         open on, now that there is only one instrument to come back to. */
      dockForced = true;
      navBtn.setAttribute('aria-pressed', 'false');

      nationsOpen = false;
      flagBtn.setAttribute('aria-pressed', 'false');
      dqFlag.setAttribute('aria-pressed', 'false');
      document.body.classList.remove('closing-tabs');
      allNations.forEach(d => { d.open = false; });

      q.value = '';
      dq.value = '';
      filter();
      syncGhost();
      setFaceMode('explore');
      setFace(0, true);
      openDock();
      dq.value = '';
      dghost.hidden = false;
      paintHint('');
      updateDock();
      showPrompt();
    }

    /* Pushing further up when already at the top folds the open tab away.
       Only downward reading opens tabs — going up never does, so scrolling
       back never surprises the reader with more to read. */
    let upAcc = 0, upLock = 0;
    window.addEventListener('wheel', e => {
      if (exploreOn || !document.body.classList.contains('browsing')) return;
      if (e.deltaY >= 0){ upAcc = 0; return; }
      if (window.scrollY > 6){ upAcc = 0; return; }

      upAcc += -e.deltaY;
      const now = Date.now();
      if (upAcc > 130 && now - upLock > 700){
        const open = allNations.filter(d => d.open && !d.hidden);
        if (open.length){
          setNationOpen(open[open.length - 1], false);
          upLock = now;
          upAcc = 0;
        }
      }
    }, { passive:true });

    /* an opening or closing tab changes what furniture belongs on screen */
    function syncChrome(){
      /* A term opens every tab that answers it, and an open tab is normally
         what sends the main bar away and hands over to the dock's. Mid-word
         that is exactly wrong: the reader is still typing into the bar it
         would be taking off the screen. While there is a term, the bar
         stays and the results arrange themselves underneath it. */
      const typing = !!q.value.trim();
      document.body.classList.toggle('tab-open', anyNationOpen() && !typing);
      updateDock();
    }
    allNations.forEach(d => d.addEventListener('toggle', syncChrome));

    /* the star is a straight toggle: anything open → home, otherwise
       straight into explore */
    navBtn.addEventListener('click', () => {
      if (exploreOn){ closeExplore(); return; }      // tabs, if any, stay
      if (dockForced){
        dockForced = false;
        collapseDock();
        updateDock();
        return;
      }
      dockForced = true;
      setFace(0, true);
      updateDock();
      openExplore();
    });

    dockSearch.addEventListener('click', () => {
      if (!dock.classList.contains('open')) openDock();
    });
    dockSearch.addEventListener('keydown', e => {
      if (!dock.classList.contains('open') && (e.key === 'Enter' || e.key === ' ')){
        e.preventDefault();
        openDock();
      }
    });

    /* The dock field is forgiving: a term that matches nothing is read
       as a typo still being corrected, so the last good result set is
       held on screen rather than the page emptying under the reader. */
    let lastScrolled = null;

    function countMatches(term){
      if (!term) return allItems.length;
      let n = 0;
      allItems.forEach(el => { if (itemMatches(el, term)) n++; });
      return n;
    }

    /* ============================================================
       SEARCH LABELS
       The archive answers to four things: nation, division, date and
       garment type. Everything else in a garment's name is description.
       The vocabulary is built from the catalogue itself rather than kept
       as a second list to maintain, so a label can never be offered that
       has no garments standing behind it.
       ============================================================ */
    const DIVISION_WORDS = ['army','navy','marines','aircrew','airborne','cadet','raf','commando'];

    const LABELS = (() => {
      const out = [];
      const cap = w => w.replace(/\b[a-z]/g, c => c.toUpperCase());

      NATIONS.forEach(n => {
        const count = ITEMS.filter(i => i.n === n.key).length;
        if (!count) return;
        out.push({ kind:'Nation', label:n.label, fill:n.label, count,
                   keys:[n.label.toLowerCase(), ...(n.alias || [])] });
      });

      DIVISION_WORDS.forEach(w => {
        const re = new RegExp('\\b' + w + '\\b', 'i');
        const count = ITEMS.filter(i => re.test(i.name)).length;
        if (!count) return;
        out.push({ kind:'Division', label:cap(w), fill:cap(w), count, keys:[w] });
      });

      const decades = {};
      ITEMS.forEach(i => (i.name.match(/\b(?:1[89]|20)\d0s\b/g) || [])
        .forEach(d => { decades[d] = (decades[d] || 0) + 1; }));
      Object.keys(decades).sort().forEach(d => {
        out.push({ kind:'Date', label:d, fill:d, count:decades[d], keys:[d, d.slice(0, -1)] });
      });

      CATS.forEach(cat => {
        const count = ITEMS.filter(i => i.cat === cat).length;
        if (!count) return;
        /* "Jackets / Shirts" is searched as two plain words: the slash is
           not something itemMatches can place */
        const words = cat.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
        out.push({ kind:'Garment', label:cat, fill:words.join(' '), count,
                   keys:[cat.toLowerCase(), ...words] });
      });

      return out;
    })();

    /* Words that plainly belong to one of the four kinds but that this
       archive does not hold. Typing one earns a recommendation rather than
       silence — silence is kept for words with no bearing at all, where a
       guess would be worse than nothing. */
    const ABSENT = {
      Nation: ['french','france','german','germany','swedish','sweden','polish','poland',
               'dutch','netherlands','holland','spanish','spain','canadian','canada',
               'australian','australia','norwegian','norway','finnish','finland','czech',
               'belgian','belgium','swiss','switzerland','austrian','austria','chinese',
               'china','japanese','japan','korean','korea','israeli','israel','portuguese',
               'portugal','greek','greece','turkish','turkey','indian','india','nato'],
      Garment: ['umbrella','flipflop','flip-flop','sandal','sandals','tie','suit','dress',
                'skirt','shorts','sock','socks','glove','gloves','scarf','belt','watch',
                'sunglasses','hat','beret','helmet','parka','anorak','coat','boot','boots',
                'shoe','shoes','backpack','rucksack','poncho','smock','tunic','gaiter']
    };

    /* Where an absent word points when the archive holds the answer under
       another name. Checked against what is actually in the catalogue, so a
       mapping onto an empty shelf falls through to the fallback instead of
       recommending a dead end. */
    const ABSENT_TO = {
      hat:'Headwear', beret:'Headwear', helmet:'Headwear',
      boot:'Footwear', boots:'Footwear', shoe:'Footwear', shoes:'Footwear',
      backpack:'Bags / Webbing', rucksack:'Bags / Webbing',
      parka:'Jackets / Shirts', anorak:'Jackets / Shirts', coat:'Jackets / Shirts',
      smock:'Jackets / Shirts', tunic:'Jackets / Shirts', poncho:'Jackets / Shirts',
      gaiter:'Trousers / Coveralls'
    };

    /* Catch-alls, not answers. "Unattributed" is where a garment goes when
       its nation is unknown — recommending it to someone who asked for
       France is not a recommendation, it is a shrug. They stay reachable by
       typing their own name; they are simply never suggested. */
    const BUCKETS = ['Unattributed', 'Unclassified'];

    function biggestOfKind(kind){
      return LABELS.filter(l => l.kind === kind && !BUCKETS.includes(l.label))
                   .sort((a, b) => b.count - a.count)[0] || null;
    }

    /* What the bar believes is being typed. The label itself when the term
       is the start of one, a recommendation when the term is plainly of the
       right sort but absent, and nothing at all otherwise. */
    function suggestLabel(term){
      if (term.length < 2) return null;

      /* Nothing left to offer once the label itself has been typed out.
         Measured against the canonical name only: "ru" and "1990" are
         aliases, and resolving them to "Russian" and "1990s" is exactly the
         confirmation the chip exists to give. */
      if (LABELS.some(l => l.label.toLowerCase() === term || l.fill.toLowerCase() === term)) return null;

      const hit = LABELS.filter(l => l.keys.some(k => k.startsWith(term)))
                        .sort((a, b) => b.count - a.count)[0];
      if (hit) return { kind:hit.kind, text:hit.label, fill:hit.fill, found:true };

      for (const kind of ['Nation', 'Garment']){
        const word = ABSENT[kind].find(w => w.startsWith(term));
        if (!word) continue;
        const named  = ABSENT_TO[word];
        const target = (named && LABELS.find(l => l.label === named)) || biggestOfKind(kind);
        if (target) return { kind:target.kind, text:target.label, fill:target.fill, found:false };
      }
      return null;
    }

    const dqHint     = document.getElementById('dqHint');
    const dqHintKind = document.getElementById('dqHintKind');
    const dqHintText = document.getElementById('dqHintText');
    let   dqHintFill = '';

    function paintHint(term){
      const s = suggestLabel(term);
      dqHintFill = s ? s.fill : '';
      if (!s){
        dqHint.classList.remove('on');
        dqHint.setAttribute('aria-hidden', 'true');
        dockSearch.classList.remove('has-hint');
        return;
      }
      // "Try" rather than the kind when the archive is offering an
      // alternative: the reader should know it is not what they asked for
      dqHintKind.textContent = s.found ? s.kind : 'Try';
      dqHintText.textContent = s.text;
      dqHint.setAttribute('aria-label', (s.found ? 'Search ' : 'Try ') + s.kind + ' ' + s.text);
      dqHint.setAttribute('aria-hidden', 'false');
      dqHint.classList.add('on');
      dockSearch.classList.add('has-hint');
    }

    /* Taking the suggestion IS the choosing. It used to fill the box and
       wait for a return key, which asked the reader to agree twice with
       something they had just pressed — the chip is a destination, so it
       travels. */
    function takeHint(){
      if (!dqHintFill) return false;
      const term = dqHintFill;
      dq.value = term;
      dghost.hidden = true;
      paintHint(term.toLowerCase());
      if (!exploreOn){
        dockForced = true;
        setFaceMode('explore');
        setFace(0, true);
        openExplore();
      }
      clusterSearch(term.toLowerCase(), true);   // gather, do not merely dim
      dq.focus({ preventScroll:true });
      return true;
    }
    dqHint.addEventListener('click', e => { e.stopPropagation(); takeHint(); });

    dq.addEventListener('input', () => {
      dghost.hidden = dq.value !== '';
      const term = dq.value.trim().toLowerCase();
      paintHint(term);

      // in explore the search regroups the field rather than the page
      /* The answer appears where the reader is standing. Typing in the field
         moves the field; typing in the list narrows the list. Dragging them
         between the two — which is what forcing explore open did — takes the
         view away from someone who chose it. */
      if (exploreOn){ clusterSearch(term, false); return; }   // typing

      if (term && countMatches(term) === 0) return;   // hold what's there

      /* Typing on the bare page — the state the cross lands on, with the
         question in the middle and nothing else — brings up the LIST. That
         screen is a question being asked, and a list is the shape of an
         answer to it; opening the field instead would put the reader
         somewhere they would then have to leave to read anything. */
      if (term.length >= 2 && !nationsOpen && !savedOnly && !soloId){
        nationsOpen = true;
        setBrowsing(true);
      }

      q.value = dq.value;
      filter();
      syncGhost();
      updateDock();

      if (!term){ lastScrolled = null; return; }
      /* One letter is not a search: half the archive answers to it, and
         travelling on that is the page moving under someone who has barely
         started. The list narrows as they type either way — it is only the
         journey that waits for a term worth making it for. */
      if (term.length < 2){ lastScrolled = null; return; }

      // matching is word-accurate now, so a real hit can move the page
      // straight away. Only a change of nation scrolls, so typing on
      // through "d ▸ dp ▸ dpm" travels once, not three times.
      const first = allNations.find(d => !d.hidden && d.open);
      if (first && first !== lastScrolled){
        lastScrolled = first;
        scrollToNation(first);
      }
    });

    // enter jumps to the first garment that matched
    dq.addEventListener('keydown', e => {
      if (e.key === 'Escape'){ e.preventDefault(); resetDock(); return; }
      // tab is the keyboard's version of pressing the grey chip
      if (e.key === 'Tab' && dqHintFill){ e.preventDefault(); takeHint(); return; }
      if (e.key !== 'Enter') return;
      e.preventDefault();

      // in explore, enter gathers everything that answers the term and
      // settles on the group — a nation becomes that nation's cluster
      if (exploreOn){
        clusterSearch(dq.value.trim().toLowerCase(), true);   // choosing
        return;
      }

      const first = catalogue.querySelector('.item:not([hidden])');
      if (first) first.scrollIntoView({ behavior:'smooth', block:'center' });
    });

    function resetDock(){
      dq.value = '';
      paintHint('');
      q.value = '';
      filter();
      syncGhost();
      collapseDock();
    }
    dockClear.addEventListener('click', e => { e.stopPropagation(); resetDock(); });



    updateDock();

    /* ============================================================
       NATIONS — the tabs are hidden until the flag asks for them
       ============================================================ */

    /* ---------- the question on the bare page ----------
       Re-typed every time the archive comes back to rest, so returning
       feels like arriving rather than finding a leftover. */
    const promptEl = document.getElementById('prompt');
    const PROMPTS = [
      'What are you looking for?',
      'What have you got in mind?',
      'Which nation are you after?',
      'Looking for a particular camouflage?',
      'Smock, trousers, bergen — what do you need?'
    ];
    let promptIx = Math.floor(Math.random() * PROMPTS.length);
    let promptTimer = null;

    function showPrompt(){
      clearTimeout(promptTimer);
      promptEl.hidden = false;
      // a different line each time the archive comes back to rest
      promptIx = (promptIx + 1) % PROMPTS.length;
      // the suggestions follow the question
      SUGGESTIONS = poolForPrompt(promptIx);
      sIdx = 0; sPos = 0; sPhase = 'typing';
      const line = PROMPTS[promptIx];
      promptEl.textContent = '';
      promptEl.style.opacity = '';
      if (REDUCED){ promptEl.textContent = line; return; }
      let i = 0;
      (function tick(){
        if (i < line.length){
          promptEl.textContent += line.charAt(i++);
          promptTimer = setTimeout(tick, 55);
        }
      })();
    }

    function hidePrompt(){
      clearTimeout(promptTimer);
      promptEl.style.opacity = '0';
    }

    /* the bare page always carries its question */
    function restPrompt(){
      if (!exploreOn && !nationsOpen && !savedOnly && !soloId && !q.value.trim()){
        showPrompt();
      }
    }

    /* the tabs topple in one after another, and fold back out the same
       way rather than simply vanishing */
    function dealTabs(){
      allNations.forEach((d, i) => {
        d.style.animation = 'none';
        void d.offsetWidth;
        d.style.animation = '';
        d.style.animationDelay = (i * 65) + 'ms';
      });
    }

    let countTimer = null;

    function typeCount(){
      clearTimeout(countTimer);
      const text = `${allItems.length} garments`;
      countEl.textContent = '';
      if (REDUCED){ countEl.textContent = text; return; }
      countTyping = true;
      let i = 0;
      (function tick(){
        if (i < text.length){
          countEl.textContent += text.charAt(i++);
          countTimer = setTimeout(tick, 32);
        } else {
          countTyping = false;
        }
      })();
    }

    /* the tally unwrites itself as the tabs fold away, so both halves of
       the header leave the same way they arrived */
    function untypeCount(){
      clearTimeout(countTimer);
      countTyping = true;
      if (REDUCED){ countEl.textContent = ''; return; }
      (function tick(){
        const t = countEl.textContent;
        if (t.length){
          countEl.textContent = t.slice(0, -1);
          countTimer = setTimeout(tick, 22);
        } else {
          countTyping = false;
        }
      })();
    }

    function setBrowsing(on){
      nationsOpen = on;
      if (on){
        collapseDock();              // never two search bars at once
        document.body.classList.remove('closing-tabs');
        document.body.classList.add('browsing');
        dealTabs();
        typeCount();
      } else {
        if (!q.value.trim()){
          // fold away, then drop out of browsing entirely
          untypeCount();
          document.body.classList.add('closing-tabs');
          setTimeout(() => {
            document.body.classList.remove('closing-tabs');
            allNations.forEach(d => { d.open = false; });
            filter();          // recomputes browsing from term + nationsOpen
            restPrompt();
          }, REDUCED ? 0 : 420);
        } else {
          allNations.forEach(d => { d.open = false; });
        }
      }
      flagBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      updateDock();
    }

    flagBtn.addEventListener('click', () => {
      /* One nation cluster per flag was thirty-one groups nobody asked for.
         There are three clusters in this archive and only three: OUR shelf,
         everything camouflaged, and whatever the reader has kept. The flag
         is the first of them. */
      if (!explore.hidden){
        const on = dqFlag.getAttribute('aria-pressed') === 'true';
        dqFlag.setAttribute('aria-pressed', on ? 'false' : 'true');
        flagBtn.setAttribute('aria-pressed', on ? 'false' : 'true');
        dq.value = on ? '' : 'British';
        dghost.hidden = dq.value !== '';
        paintHint(dq.value.trim().toLowerCase());
        clusterSearch(on ? '' : 'british', true);
        return;
      }
      const on = !nationsOpen;
      setBrowsing(on);
      if (on) window.scrollTo({ top:0, behavior:REDUCED ? 'auto' : 'smooth' });
    });

    /* ============================================================
       EXPLORE — every garment laid out on a phyllotaxis spiral.
       Same golden-angle packing a sunflower uses, so the density stays
       even from the middle out instead of bunching into arms.
       ============================================================ */
    const explore    = document.getElementById('explore');
    const spiral     = document.getElementById('spiral');
    const dockExplore = document.getElementById('dockExplore');

    const GOLDEN = Math.PI * (3 - Math.sqrt(5));
    const SPACING = 172;              // ~1.15× the 150px card, so they clear
    let spiralBuilt = false;
    let sc = 1, tx = 0, ty = 0;

    /* wraps a jump in a transition so the field travels rather than cuts */
    function glide(fn, ms){
      spiral.style.transition = `transform ${ms || 850}ms cubic-bezier(.4,0,.2,1)`;
      fn();
      setTimeout(() => { spiral.style.transition = ''; }, (ms || 850) + 60);
    }

    function applyTransform(){
      spiral.style.transform = `translate(${tx}px, ${ty}px) scale(${sc})`;
    }

    /* ============================================================
       THE FIELD ARRIVING
       Seventy-odd photographs, each a megabyte, do not land together. Left
       alone they pop in one at a time and the reader watches the archive
       assemble itself. So the field is held grey and soft until the last
       one is in, with the mark drawing over it; then the mark fills and is
       the way in.

       A garment that fails to load counts as landed. One broken image must
       not leave the whole field behind a gate that never opens.
       ============================================================ */
    const revEl   = document.getElementById('reveal');
    const revBtn  = document.getElementById('revealBtn');
    const revTrace = document.getElementById('revTrace');
    let imgTotal = 0, imgDone = 0, revealed = false, revArmed = false;

    /* `load` fires when the bytes have arrived, not when the picture can be
       drawn — the browser still has to decode a megabyte of PNG, and on a
       slower machine that is where the delay actually is. Waiting on
       decode() instead is the difference between "downloaded" and "will
       paint this frame", and it is why the gate used to open onto a field
       that was still resolving.

       `loading="lazy"` also lets the browser decline to fetch a picture it
       considers off-screen, so every image is told to load eagerly first —
       otherwise the count could never complete. */
    function watchLoad(img){
      if (!img) return;
      imgTotal++;
      img.loading = 'eager';
      const done = () => {
        imgDone++;
        if (imgDone >= imgTotal) armReveal();
      };
      const settle = () => {
        if (typeof img.decode === 'function'){
          img.decode().then(done, done);     // a failed decode still counts
        } else {
          done();
        }
      };
      if (img.complete && img.naturalWidth > 0){ settle(); return; }
      img.addEventListener('load',  settle, { once:true });
      img.addEventListener('error', done,   { once:true });   // broken counts as landed
    }

    function armReveal(){
      if (revArmed || revealed) return;
      revArmed = true;
      revEl.classList.remove('drawing');
      revEl.classList.add('ready');   // the mark fills: that is the invitation
    }

    /* Two keys, one gate. The mark is the one the reader is looking at; the
       circle is the one their hand is already on. Neither opens it before
       the field is in — pressing early does nothing rather than letting the
       reader into a half-drawn archive. */
    function openGate(){
      if (revealed || !revArmed) return;
      revealed = true;
      document.body.classList.remove('gated');
      spiral.classList.remove('sp-waiting');
      // stop taking presses immediately — the field underneath is live from
      // this moment, and the fade out must not stand in front of it
      revEl.classList.remove('ready');
      revEl.style.pointerEvents = 'none';
      revEl.classList.add('going');
      setTimeout(() => { revEl.hidden = true; }, 520);
    }
    function gateShut(){ return !revealed && revEl && !revEl.hidden; }

    // pointerup rather than click: it fires on the element under the pointer
    // and does not care where the press began
    if (revEl) revEl.addEventListener('pointerup', openGate);

    function buildSpiral(){
      if (spiralBuilt) return;
      spiralBuilt = true;

      NATIONS.forEach(nation => {
        ITEMS.filter(p => p.n === nation.key).forEach(p => {
          const fileName = p.img || slug(p.name);
          const file = `${assetDir(nation.key, p.cat, p.name)}/${fileName}`;
          const el = Object.assign(document.createElement('div'), {
            className:'sp-item',
            innerHTML:
              `<div class="sp-slot">` +
                `<img src="${esc(file)}" alt="${esc(p.name)}" loading="lazy">` +
                `<span class="sp-code" hidden></span>` +
              `</div>`
          });
          el.dataset.nation = nation.key;
          el.dataset.name   = p.name;
          el.dataset.id     = `${nation.key}/${slugBase(p.name)}`;
          el.dataset.words  = [p.name, nation.label, p.cat, p.ref]
            .filter(Boolean).join(' ').toLowerCase()
            .split(/[^a-z0-9]+/).filter(Boolean).join('|');
          el.dataset.alias  = (nation.alias || []).join('|');
          spiral.appendChild(el);
          watchLoad(el.querySelector('img'));
        });
      });

      [...spiral.children].forEach((el, i) => {
        el.style.animationDelay = Math.min(i * 12, 700) + 'ms';
        const img = el.querySelector('img');
        const code = el.querySelector('.sp-code');
        img.addEventListener('error', () => { img.remove(); code.hidden = false; });
      });
      layoutSpiral('spiral');
    }

    /* 'spiral'   — one phyllotaxis over the whole archive
       'clusters' — one per nation, biggest in the middle, the rest
                    scattered around it on a jittered ring          */
    let spiralMode = 'spiral';

    function place(el, x, y){
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
    }

    /* Re-laying out is a movement, not a jump: the field draws back, the
       garments glide to their new homes like a cell dividing, then the
       view settles on whatever shape resulted. */
    let morphing = false;

    function morphLayout(mode){
      if (morphing) return;
      morphing = true;

      if (REDUCED){
        layoutSpiral(mode); fitSpiral(); morphing = false; return;
      }

      const els = [...spiral.children];
      els.forEach(el => {
        el.style.transition = 'left .95s cubic-bezier(.45,.05,.2,1), top .95s cubic-bezier(.45,.05,.2,1)';
      });
      spiral.style.transition = 'transform .95s cubic-bezier(.45,.05,.2,1)';

      // pull back first so the split happens inside the frame
      sc = Math.max(0.06, sc * 0.55);
      applyTransform();

      // a forced reflow commits the pull-back as the start of the move —
      // rAF is not guaranteed to run and would leave the field unplaced
      void spiral.offsetWidth;
      layoutSpiral(mode);

      setTimeout(() => {
        if (mode === 'saved'){
          const keep = [...spiral.children].filter(e => isSaved(e.dataset.id));
          if (keep.length) fitTo(keep); else fitSpiral();
        } else fitSpiral();                // settle on the new extent
        setTimeout(() => {
          els.forEach(el => { el.style.transition = ''; });
          spiral.style.transition = '';
          morphing = false;
        }, 1000);
      }, 900);
    }

    function layoutSpiral(mode){
      spiralMode = mode;
      const els = [...spiral.children];

      if (mode === 'spiral'){
        els.forEach((el, i) => {
          const r = SPACING * Math.sqrt(i + 0.5);
          const a = i * GOLDEN;
          place(el, Math.cos(a) * r, Math.sin(a) * r);
        });
        return;
      }

      if (mode === 'saved'){
        const keep = els.filter(e => isSaved(e.dataset.id));
        const rest = els.filter(e => !isSaved(e.dataset.id));
        keep.forEach((el, i) => {
          const r = SPACING * Math.sqrt(i + 0.5);
          const a = i * GOLDEN;
          place(el, Math.cos(a) * r, Math.sin(a) * r);
        });
        // everything unkept goes to its own cluster, well off the frame
        const away = SPACING * (Math.sqrt(els.length) + 16);
        rest.forEach((el, i) => {
          const r = SPACING * Math.sqrt(i + 0.5);
          const a = i * GOLDEN;
          place(el, away + Math.cos(a) * r, Math.sin(a) * r);
        });
        return;
      }

      const groups = NATIONS
        .map(n => ({ key:n.key, els:els.filter(e => e.dataset.nation === n.key) }))
        .filter(g => g.els.length)
        .sort((a, b) => b.els.length - a.els.length);

      const radiusOf = g => SPACING * Math.sqrt(g.els.length) + SPACING * 0.6;
      const big = radiusOf(groups[0]);

      groups.forEach((g, gi) => {
        let cx = 0, cy = 0;
        if (gi > 0){
          // even spread around the centre, then knocked off true so the
          // satellites do not read as a dial
          const step = (Math.PI * 2) / (groups.length - 1);
          const ang  = step * (gi - 1) + (Math.random() - 0.5) * step * 0.55;
          const ring = big + radiusOf(g) + SPACING * (0.7 + Math.random() * 0.8);
          cx = Math.cos(ang) * ring;
          cy = Math.sin(ang) * ring;
        }
        g.els.forEach((el, i) => {
          const r = SPACING * Math.sqrt(i + 0.5);
          const a = i * GOLDEN;
          place(el, cx + Math.cos(a) * r, cy + Math.sin(a) * r);
        });
      });
    }

    /* ---------- searching inside explore ----------
       A term pulls everything that answers it into its own cluster in the
       middle and dims the rest, so "mtp" makes an MTP group, "british" a
       British one, "smock" a smock one. The same matching the catalogue
       uses, so both bars behave alike. */
    function spiralMatch(el, term){
      const tokens = term.split(/\s+/).filter(Boolean);
      if (!tokens.length) return true;
      const words   = (el.dataset.words || '').split('|');
      const aliases = (el.dataset.alias || '').split('|');
      return tokens.every(t =>
        words.some(w => w.startsWith(t)) ||
        aliases.some(a => a && a.startsWith(t))
      );
    }

    function fitTo(els){
      let reach = 1;
      els.forEach(el => {
        reach = Math.max(reach, Math.hypot(
          parseFloat(el.style.left) || 0,
          parseFloat(el.style.top)  || 0
        ));
      });
      const margin = Math.max(70, Math.min(150, window.innerWidth * 0.14));
      const fit = Math.min(window.innerWidth, window.innerHeight - 150) /
                  ((reach + margin) * 2);
      sc = Math.max(0.08, Math.min(maxScale(), fit));
      tx = 0; ty = -40;
      applyTransform();
    }

    let clusterTimer = null;
    /* Typing is not the same act as choosing.

       While the reader is still typing, the field holds its shape and the
       view simply travels to the first garment that answers — one move, to
       one garment. Regathering the whole spiral on every keystroke threw
       everything about under someone who had not finished their word.

       Pressing enter is the choosing. THAT regathers: the matches come into
       a spiral of their own and everything else goes. */
    function clusterSearch(term, gather){
      clearTimeout(clusterTimer);
      const els = [...spiral.children];

      /* The move is 800ms. Clearing the transition at 60ms — which is what
         this used to do, alongside the glide — took the property's
         transition away mid-flight, and a property whose transition is
         removed jumps straight to its final value. That was the cluster
         appearing rather than gathering. The tidy-up now waits for the move
         it is tidying up after. */
      const MOVE_MS = 800;
      const slide = () => els.forEach(el => {
        el.style.transition = `left ${MOVE_MS}ms cubic-bezier(.4,0,.2,1), top ${MOVE_MS}ms cubic-bezier(.4,0,.2,1), opacity .45s ease`;
      });
      const settle = () => setTimeout(
        () => els.forEach(el => { el.style.transition = ''; }), MOVE_MS + 80);

      if (!term){
        els.forEach(el => el.classList.remove('sp-dim', 'sp-gone'));
        slide();
        layoutSpiral(spiralMode);
        clusterTimer = setTimeout(() => {
          glide(() => fitSpiral(), 800);
          settle();
        }, 60);
        return;
      }

      if (term.length < 2) return;          // one letter is not a search yet

      const hit = els.filter(el => spiralMatch(el, term));

      /* Nothing answers this — "banana", or a nation the archive has never
         held. Dimming the whole field to say so is a worse answer than
         leaving it alone; the grey chip in the bar is where a suggestion
         belongs, not out here. */
      if (!hit.length) return;

      if (!gather){
        // still typing: dim the rest where they stand and travel to the first
        els.forEach(el => el.classList.toggle('sp-dim', !hit.includes(el)));
        clusterTimer = setTimeout(() => glide(() => focusItem(hit[0], maxScale() * 0.55), 700), 40);
        return;
      }

      /* Gathering. Every garment is laid back on its own spiral position
         first — placing only the matches on top of a field that never moved
         is what left garments sitting over one another. Then the matches are
         drawn into the middle and the rest are taken off the field
         altogether rather than dimmed, so nothing can overlap the cluster. */
      slide();
      layoutSpiral(spiralMode);
      els.forEach(el => {
        const on = hit.includes(el);
        el.classList.toggle('sp-gone', !on);
        el.classList.remove('sp-dim');
      });
      hit.forEach((el, i) => {
        const r = SPACING * Math.sqrt(i + 0.5);
        const a = i * GOLDEN;
        place(el, Math.cos(a) * r, Math.sin(a) * r);
      });

      clusterTimer = setTimeout(() => {
        glide(() => fitTo(hit), 800);
        settle();
      }, 60);
    }

    /* stop zooming once a single garment fills the view — past that the
       source PNGs are being upscaled and just go soft */
    function maxScale(){
      return Math.min(window.innerWidth, window.innerHeight - 150) / SPACING;
    }

    function focusItem(el, scale){
      const x = parseFloat(el.style.left) || 0;
      const y = parseFloat(el.style.top)  || 0;
      sc = Math.min(scale || maxScale() * 0.72, maxScale());
      tx = -x * sc;
      ty = -y * sc;
      atInitial = false;
      applyTransform();
      offerSave(el);
    }

    /* while one garment holds the view, the arrow's slot offers to keep it */
    let focusedItem = null;

    /* One bookmark button, two jobs: with a garment framed it keeps that
       garment; with the whole field showing it gathers what is kept. */
    function offerSave(el){
      focusedItem = el || null;
      if (!dockLibrary) return;
      dockLibrary.setAttribute('aria-label',
        focusedItem ? 'Save this garment' : 'Gather saved garments');
      dockLibrary.setAttribute('aria-pressed',
        focusedItem
          ? (isSaved(focusedItem.dataset.id) ? 'true' : 'false')
          : (spiralMode === 'saved' ? 'true' : 'false'));
    }

    /* measures the real extent so it frames clusters as well as the spiral */
    function fitSpiral(){
      let reach = 1;
      [...spiral.children].forEach(el => {
        reach = Math.max(reach, Math.hypot(
          parseFloat(el.style.left) || 0,
          parseFloat(el.style.top)  || 0
        ));
      });
      const margin = Math.max(70, Math.min(150, window.innerWidth * 0.14));
      const radius = reach + margin;
      const fit = Math.min(window.innerWidth, window.innerHeight - 150) / (radius * 2);
      sc = Math.max(0.08, Math.min(maxScale(), fit));
      tx = 0; ty = -40;
      applyTransform();
      atInitial = true;
      offerSave(null);
    }

    let exploreClosing = false;
    let lastExploreItem = null;
    let atInitial = false;      // is the field sitting at its opening view?

    function openExplore(){
      // the list's dressing does not belong to the field
      document.body.classList.remove('dock-list');

      /* A reader who was looking at their own shelf should find it again.
         Coming back to the field from the saved list used to drop them into
         all seventy-five, which is not where they were — the collection is a
         place, and leaving a garment in it should not leave the place. */
      const wantSaved = savedOnly && savedIds.length;

      /* The gate is shown once, on the first visit to the field. Coming
