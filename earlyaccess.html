<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Early Access | British Material Unit (BMU)</title>
  <link rel="canonical" href="https://britishmaterialunit.com/" />
  <link rel="icon" href="bmufavicon.svg" type="image/svg+xml" />

  <!-- Early Access is a state of the home page, not a document of its
       own — Join's twin, the same panel and the same field. Opening it
       there puts /earlyaccess in the address bar without a navigation, so
       this page is only ever reached cold: a shared link, a reload, a
       bookmark. Its one job is to hand the reader to the state promised.

       replace(), not href: the reader should not have to press Back twice
       to get out of a redirect they never saw. -->
  <meta name="robots" content="noindex, follow" />
  <script>
    window.location.replace('/#earlyaccess' + window.location.search);
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/#earlyaccess" /></noscript>

  <style>
    body{
      margin:0;
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#ffffff;
      color:#222;
      font-family:Helvetica, Arial, sans-serif;
      font-size:13px;
      letter-spacing:.08em;
    }
    a{ color:#222; }
  </style>
</head>
<body>
  <!-- seen only if the redirect cannot run -->
  <p>Taking you to <a href="/#earlyaccess">early access</a>.</p>
</body>
</html>
